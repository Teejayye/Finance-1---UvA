 h+=`<div class="card"><h3>Study plan until the exam</h3><p class="small muted">${m.notes}</p><table class="ct">${m.plan.map(p=>`<tr><td><b>${p[0]}</b></td><td style="text-align:left">${p[1]}</td></tr>`).join('')}</table></div>`;
 const done=Object.keys(ST.bank).length,wrong=Object.values(ST.bank).filter(s=>s.res==='w'||s.res==='p').length,tot=Object.keys(Q).length;
 h+=`<div class="card"><h3>Progress</h3><div class="prog"><i style="width:${Math.round(100*done/tot)}%"></i></div><p class="small">${done} of ${tot} practice questions answered · ${wrong} to review (wrong or partly). <a href="#prc" >Go to practice</a></p>`;
 h+=`<h3>Best scores per exam</h3><table class="ct"><tr><th>Exam</th><th>Best grade</th><th>Attempts</th></tr>${DATA.E.map(e=>{const s=ST.ex[e.id]||{};return `<tr><td>${esc(e.title)}</td><td>${s.best!=null?s.best.toFixed(1):'–'}</td><td>${s.n||0}</td></tr>`}).join('')}</table></div>`;
 M.innerHTML=h;const tick=()=>{const el=$('#cd');if(!el)return;let d=end-new Date();if(d<0){el.textContent='Exam has started / finished';return;}const hh=Math.floor(d/36e5),mm=Math.floor(d%36e5/6e4),ss=Math.floor(d%6e4/1e3);el.textContent=`${hh} h ${String(mm).padStart(2,'0')} min ${String(ss).padStart(2,'0')} s`;};tick();clearInterval(window.__cd);window.__cd=setInterval(tick,1000);}
function sum(){let h=`<div class="card"><h2>Summary</h2><p class="small muted">Per chapter, built from the lectures, video slides, homework and Canvas. Blue boxes = key points; orange boxes = exam traps. Every theory link opens the shared theory library.</p>${DATA.S.map((w,i)=>`<a href="#sum" data-j="s${i}">${esc(w.title)}</a>`).join(' · ')}</div>`;
 DATA.S.forEach((w,i)=>{h+=`<div class="card" id="s${i}"><h2>${esc(w.title)}</h2>`;w.secs.forEach(s=>{h+=`<h3>${esc(s.h)}${/Not examined|Outside/.test(s.h)?' <span class="pill lab-LEARN">Not examined</span>':''}</h3><div>${s.html}</div>`;if(s.key.length)h+=`<div class="key"><b>Key box</b><ul>${s.key.map(k=>`<li>${k}</li>`).join('')}</ul></div>`;if(s.trap.length)h+=`<div class="trap"><b>Exam traps</b><ul>${s.trap.map(k=>`<li>${k}</li>`).join('')}</ul></div>`;if(s.th.length)h+=theoryBox(s.th,false);});h+='</div>';});
 M.innerHTML=h;M.querySelectorAll('a[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.j).scrollIntoView({behavior:'smooth'});});}
function frm(){let f=frm.f||'all';let h=`<div class="card"><h2>Formulas</h2><p class="small"><span class="pill lab-ON">ON SHEET</span> printed on the official midterm formula sheet · <span class="pill lab-PARTLY">PARTLY</span> on the sheet, but you must know how to apply it here · <span class="pill lab-LEARN">LEARN</span> not on the sheet: memorise.</p><p class="small muted">${DATA.Fnote}</p><div class="toolbar">${['all','ON SHEET','PARTLY','LEARN'].map(k=>`<button data-f="${k}" class="${f===k?'pri':''}">${k==='all'?'All':k}</button>`).join('')}</div></div>`;
 [1,2,3].forEach(w=>{const ws=DATA.F.filter(x=>x.w===w&&(f==='all'||x.lab===f));if(!ws.length)return;h+=`<div class="card"><h2>Week ${w}: ${['','Ch 1–3','Ch 4–6','Ch 7–8'][w]}</h2>`;ws.forEach(x=>{h+=`<div style="border-bottom:1px solid var(--line);padding:8px 0"><div class="row"><span class="pill lab-${x.lab.split(' ')[0]}">${x.lab}</span><b>${esc(x.n)}</b></div><div class="formula">${x.f}</div><div><b>In plain words:</b> ${x.p}</div>${x.tr?`<div class="trap" style="margin:6px 0"><b>Trap:</b> ${x.tr}</div>`:''}<div class="small muted">Source: ${esc(x.src)}</div></div>`;});h+='</div>';});
 M.innerHTML=h;M.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{frm.f=b.dataset.f;frm();});}
function gls(){const chs=[...new Set(DATA.G.map(g=>g.ch))].sort();let h=`<div class="card"><h2>Glossary</h2><div class="toolbar"><input id="gq" placeholder="Search terms…" style="flex:1;min-width:180px"><select id="gc"><option value="">All topics</option>${chs.map(c=>`<option>${c}</option>`).join('')}</select><span class="small muted" id="gn"></span></div><div id="gl"></div></div>`;M.innerHTML=h;
 const draw=()=>{const s=$('#gq').value.toLowerCase(),c=$('#gc').value;const xs=DATA.G.filter(g=>(!c||g.ch===c)&&(!s||(g.t+' '+g.d).toLowerCase().includes(s))).sort((a,b)=>a.t.localeCompare(b.t));$('#gn').textContent=xs.length+' terms';$('#gl').innerHTML=xs.map(g=>`<div class="gl"><b>${esc(g.t)}</b><span>${g.d}</span><span class="pill">${esc(g.ch)}</span></div>`).join('');};$('#gq').oninput=draw;$('#gc').onchange=draw;draw();}
function foc(){const R=["Not examined","Unlikely","Possible","Likely","Very likely"];const xs=[...DATA.FOCUS].sort((a,b)=>b[2]-a[2]);let h=`<div class="card"><h2>Focus topics</h2><p class="small muted">Rating = how likely a question on this topic is in the midterm, based on the evidence listed (past exams, the official Canvas mock, practice quizzes, homework, lectures). This is an estimate, not a promise.</p><table class="ct"><tr><th>Topic</th><th>Chapter</th><th>Rating</th><th style="text-align:left">Evidence</th></tr>${xs.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td><span class="pill r${f[2]}">${R[f[2]]}</span></td><td style="text-align:left" class="small">${f[3]}</td></tr>`).join('')}</table></div>`;M.innerHTML=h;}
function thy(){let h=`<div class="card"><h2>Theory library</h2><p class="small muted">One consistent explanation per concept. The same boxes appear under every answer in the practice bank and the exams.</p></div>`;const by={};Object.entries(TH).forEach(([k,t])=>{(by[t.ch]=by[t.ch]||[]).push(k);});Object.keys(by).forEach(ch=>{h+=`<div class="card"><h3>${esc(ch)}</h3>${theoryBox(by[ch],false)}</div>`;});M.innerHTML=h;}
// ---------- practice ----------
function prc(){const f=prc.f||(prc.f={ch:'',type:'',src:'',st:''});const chs=[...new Set(Object.values(Q).map(q=>q.ch))].sort();
 let h=`<div class="card"><h2>Practice bank</h2><p class="small muted">All ${Object.keys(Q).length} questions from every source. Answer, press <b>Submit answer</b>, and get the full explanation. Progress is saved in this browser.</p><div class="toolbar"><select id="fch"><option value="">All topics</option>${chs.map(c=>`<option${f.ch===c?' selected':''}>${c}</option>`).join('')}</select><select id="fty"><option value="">All types</option>${[['mc','MC'],['multi','Multiple select'],['num','Fill in the number'],['open','Open'],['match','Matching']].map(([k,n])=>`<option value="${k}"${f.type===k?' selected':''}>${n}</option>`).join('')}</select><select id="fsr"><option value="">All sources</option>${Object.entries(DATA.SRC).map(([k,n])=>`<option value="${k}"${f.src===k?' selected':''}>${esc(n)}</option>`).join('')}</select><select id="fst"><option value="">All</option><option value="new"${f.st==='new'?' selected':''}>Not done</option><option value="wrong"${f.st==='wrong'?' selected':''}>Wrong / partly</option><option value="done"${f.st==='done'?' selected':''}>Done</option></select><span class="small muted" id="pn"></span></div></div><div id="plist"></div><div class="row" id="pmore"></div>`;
 M.innerHTML=h;['fch','fty','fsr','fst'].forEach(id=>$('#'+id).onchange=()=>{f.ch=$('#fch').value;f.type=$('#fty').value;f.src=$('#fsr').value;f.st=$('#fst').value;prc.lim=25;drawList();});
 prc.lim=prc.lim||25;drawList();
 function drawList(){const xs=Object.values(Q).filter(q=>(!f.ch||q.ch===f.ch)&&(!f.type||q.type===f.type)&&(!f.src||q.src===f.src)&&(!f.st||(f.st==='new'&&!ST.bank[q.id])||(f.st==='wrong'&&ST.bank[q.id]&&(ST.bank[q.id].res==='w'||ST.bank[q.id].res==='p'))||(f.st==='done'&&ST.bank[q.id])));
  $('#pn').textContent=xs.length+' questions';const shown=xs.slice(0,prc.lim);
  $('#plist').innerHTML=shown.map(q=>{const st=ST.bank[q.id];return qHTML(q,0,st&&st.sub?st:(st?{a:st.a}:{}),{show:!!(st&&st.sub),seed:'bank',button:st&&st.sub?`<button data-retry="${q.id}">Try again</button>`:`<button class="pri" data-sub="${q.id}">Submit answer</button>`});}).join('');
  $('#pmore').innerHTML=xs.length>prc.lim?`<button id="more">Show 25 more</button>`:'';if($('#more'))$('#more').onclick=()=>{prc.lim+=25;drawList();};
  wire($('#plist'));}
 function wire(root){root.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const q=Q[b.dataset.sub];const box=$('#q_'+q.id);const a=collect(q,box);const st={a,sub:true};const g=grade(q,st);st.res=g.res;ST.bank[q.id]=st;save();box.outerHTML=qHTML(q,0,st,{show:true,seed:'bank',button:`<button data-retry="${q.id}">Try again</button>`});wire($('#plist'));});
  root.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const q=Q[b.dataset.retry];delete ST.bank[q.id];save();$('#q_'+q.id).outerHTML=qHTML(q,0,{},{show:false,seed:'bank',button:`<button class="pri" data-sub="${q.id}">Submit answer</button>`});wire($('#plist'));});
  root.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{const q=Q[b.dataset.q];const st=ST.bank[q.id];st.self=b.dataset.self;st.res=st.self;save();$('#q_'+q.id).outerHTML=qHTML(q,0,st,{show:true,seed:'bank',button:`<button data-retry="${q.id}">Try again</button>`});wire($('#plist'));});}
}
// ---------- exams ----------
const SEC={a:"a) Past, mock & official practice exams (exact transcriptions)",b:"b) Tutorial / homework assignments as practice exams",c:"c) Realistic exams (AI)",d:"d) AI practice exam: calculation drill"};
function exm(t){if(t[1])return runExam(t[1]);let h=`<div class="card"><h2>Exams</h2><p class="small">Two modes for every exam: <b>Per question</b> (submit each answer → instant feedback) and <b>Exam simulation</b> (timer, no feedback until you submit, then review). Unfinished attempts are saved and can be resumed. ${ST.set.guess?'<b>Guessing correction is ON.</b>':'Guessing correction is OFF (Settings).'}</p></div><div class="exlist">`;
 Object.entries(SEC).forEach(([k,n])=>{h+=`<h3>${n}</h3>`;DATA.E.filter(e=>e.sec===k).forEach(e=>{const s=ST.ex[e.id]||{};const ip=s.cur&&!s.cur.done;const pts=e.q.reduce((a,id)=>a+maxPts(Q[id]),0);h+=`<div class="card"><div class="row"><div><b>${esc(e.title)}</b><div class="small muted">${e.q.length} questions · ${pts} points · ${e.min} min${e.guess?' · original had guessing correction':''}${s.best!=null?` · best grade <b>${s.best.toFixed(1)}</b>`:''}</div>${e.note?`<div class="small">${e.note}</div>`:''}</div><div class="row">${ip?`<button class="pri" data-go="${e.id}">Resume (${s.cur.mode==='sim'?'simulation':'per question'})</button>`:''}<button data-start="${e.id}" data-mode="pq">Per question</button><button data-start="${e.id}" data-mode="sim">Exam simulation</button></div></div></div>`;});});
 M.innerHTML=h+'</div>';M.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go('exm/'+b.dataset.go));
 M.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{const id=b.dataset.start;const s=ST.ex[id]=ST.ex[id]||{};if(s.cur&&!s.cur.done&&!confirm('Discard the unfinished attempt and start a new one?'))return;s.cur={mode:b.dataset.mode,ans:{},flags:{},start:Date.now(),seed:String(Date.now()),done:false,i:0};save();go('exm/'+id);});}
function examCalc(e,cur){let earned=0,max=0,guess=0,pend=0;e.q.forEach(id=>{const q=Q[id];const st=cur.ans[id]||{};const g=grade(q,st);max+=g.max;if(g.res==='s'&&cur.done&&q.type==='open')pend++;if(cur.mode==='sim'&&!cur.done)return;if(cur.mode==='pq'&&!st.sub)return;earned+=g.score;if(q.type==='mc')guess+=g.max/q.opts.length;});
 const useG=ST.set.guess||false;let gr=10*earned/max;if(useG&&max>guess)gr=10*(earned-guess)/(max-guess);gr=Math.max(0,Math.min(10,gr));return{earned,max,grade:gr,pend,useG};}
function runExam(id){const e=DATA.E.find(x=>x.id===id);const s=ST.ex[id];if(!e||!s||!s.cur){go('exm');return;}const cur=s.cur;
 const pts=e.q.reduce((a,id)=>a+maxPts(Q[id]),0);
 let h=`<div class="toolbar"><button id="back">← All exams</button><b style="flex:1">${esc(e.title)}</b><span class="pill">${cur.mode==='sim'?'Exam simulation':'Per question'}</span></div>`;
 if(e.front)h+=`<details class="card" ${cur.i===0&&!cur.done?'open':''}><summary>Front page / instructions</summary><div class="small">${e.front}</div></details>`;
 h+=`<div class="examwrap"><div id="qarea"></div><aside class="sheet"><div class="timer" id="tm">--:--</div><div class="small muted">${e.min} min · ${pts} pts</div><div class="nums" id="nums"></div><div class="legend"><span><i style="background:var(--acc2);border:1px solid var(--acc)"></i>answered</span><span><i style="background:var(--ok)"></i>correct</span><span><i style="background:var(--mid)"></i>partly</span><span><i style="background:var(--bad)"></i>wrong</span><span><i style="background:var(--sm)"></i>to self-mark</span><span>⚑ flagged</span></div><div class="scorebox" id="sc"></div><div class="row" style="margin-top:8px"><button id="flag">⚑ Flag</button>${cur.done?'':`<button class="pri" id="submitall">${cur.mode==='sim'?'Submit exam':'Finish'}</button>`}</div><div class="row" style="margin-top:6px"><button id="allview">${cur.all?'One at a time':'Show all'}</button></div></aside></div>`;
 M.innerHTML=h;$('#back').onclick=()=>{clearInterval(window.__tm);go('exm');};
 const status=(qid)=>{const q=Q[qid],st=cur.ans[qid];const show=cur.done||(cur.mode==='pq'&&st&&st.sub);if(show&&st){const g=grade(q,st);return g.res;}return answered(q,st)?'ans':'';};
 function drawSheet(){$('#nums').innerHTML=e.q.map((qid,i)=>`<div class="nb ${status(qid)} ${cur.flags[qid]?'fl':''} ${i===cur.i&&!cur.all?'cur':''}" data-i="${i}">${i+1}</div>`).join('');$('#nums').querySelectorAll('.nb').forEach(b=>b.onclick=()=>{cur.i=+b.dataset.i;save();if(cur.all){document.getElementById('q_'+e.q[cur.i]).scrollIntoView({behavior:'smooth'});}else drawQ();drawSheet();});
  const r=examCalc(e,cur);$('#sc').innerHTML=(cur.mode==='pq'||cur.done)?`${cur.done?'Final score':'Score so far'}: <b>${fmt(r.earned)}</b> / ${r.max}<br>Grade: <b>${r.grade.toFixed(1)}</b>${r.useG?' (with guessing correction)':''}${r.pend?`<br><span class="small">${r.pend} open answer(s) still to self-mark</span>`:''}`:`<span class="small">${Object.keys(cur.ans).filter(k=>answered(Q[k],cur.ans[k])).length} / ${e.q.length} answered</span>`;}
 function qBlock(i){const qid=e.q[i],q=Q[qid];const st=cur.ans[qid]||{};const show=cur.done||(cur.mode==='pq'&&st.sub);let btn='';if(!show&&cur.mode==='pq')btn=`<button class="pri" data-sub="${qid}">Submit answer</button>`;const nav=cur.all?'':`<button data-nav="-1"${i===0?' disabled':''}>← Previous</button><button data-nav="1"${i===e.q.length-1?' disabled':''}>Next →</button>`;return qHTML(q,i+1,st,{show,seed:cur.seed,button:btn+nav});}
 function drawQ(){$('#qarea').innerHTML=cur.all?e.q.map((_,i)=>qBlock(i)).join(''):qBlock(cur.i);wireQ();}
 function store(qid){const q=Q[qid];const box=document.getElementById('q_'+qid);if(!box)return;const st=cur.ans[qid]||(cur.ans[qid]={});if(st.sub||cur.done)return;st.a=collect(q,box);save();drawSheet();}
 function wireQ(){const qa=$('#qarea');qa.querySelectorAll('input,textarea,select').forEach(el=>{const h=()=>store(el.dataset.q||el.name.slice(2));el.addEventListener('change',h);el.addEventListener('input',h);});
  qa.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{cur.i=Math.max(0,Math.min(e.q.length-1,cur.i+ +b.dataset.nav));save();drawQ();drawSheet();window.scrollTo(0,0);});
  qa.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const qid=b.dataset.sub;store(qid);cur.ans[qid].sub=true;save();drawQ();drawSheet();});
  qa.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{const qid=b.dataset.q;cur.ans[qid].self=b.dataset.self;save();finalize(false);drawQ();drawSheet();});}
 function finalize(fresh){const r=examCalc(e,cur);if(cur.done){s.best=Math.max(s.best==null?-1:s.best,r.grade);if(fresh)s.n=(s.n||0)+1;save();}}
 $('#flag').onclick=()=>{const qid=e.q[cur.i];cur.flags[qid]=!cur.flags[qid];save();drawSheet();};
 $('#allview').onclick=()=>{cur.all=!cur.all;save();runExam(id);};
 if($('#submitall'))$('#submitall').onclick=()=>{const un=e.q.filter(k=>!answered(Q[k],cur.ans[k])).length;if(un&&!confirm(un+' question(s) unanswered. Submit anyway?'))return;e.q.forEach(k=>{store(k);cur.ans[k]=cur.ans[k]||{};cur.ans[k].sub=true;});cur.done=true;cur.end=Date.now();finalize(true);clearInterval(window.__tm);runExam(id);window.scrollTo(0,0);};
 clearInterval(window.__tm);const tick=()=>{const el=$('#tm');if(!el){clearInterval(window.__tm);return;}const used=((cur.done?cur.end:Date.now())-cur.start)/1000;const left=e.min*60-used;const a=Math.abs(left);el.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+String(Math.floor(a%60)).padStart(2,'0');el.style.color=left<0?'var(--bad)':left<300?'var(--mid)':'';};tick();window.__tm=setInterval(tick,1000);
 drawQ();drawSheet();}
render();
})();
</script>
