 a corporation. It is a separate legal entity (it can sign contracts, own assets and be sued on its own), and its owners have limited liability: in a default creditors can claim the firm’s assets, not the shareholders’ personal assets. The most a shareholder can lose is the investment.","th":["credit","firmtypes"],"case":null,"keep":true,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_5":{"id":"y19_5","ch":"Ch 7","type":"mc","q":"You are considering investing in a start up project at a cost of $200,000. You expect the project to return $600,000 to you in eight years. Given the risk of this project, your cost of capital is 20%.<br>What is the IRR for this project closest to?","opts":["18.95%","18.11%","15.60%","14.72%"],"ans":3,"why":null,"steps":"IRR solves 200,000 = 600,000/(1+IRR)⁸, so IRR = 3^(1/8) − 1 = 14.72%. The cost of capital (20%) is not needed to find the IRR; it only tells you that this project should be rejected (14.72% &lt; 20%, NPV &lt; 0). Dividing the 200% total gain by 8 years gives 25%, which ignores compounding.","th":["apr_ear","irrrule"],"case":null,"keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_6":{"id":"y19_6","ch":"Ch 5","type":"mc","q":"What is the NPV of an initial investment of $600 (t=0) that pays $455 after one year, $599 after three years and $850 after five years?","opts":["944.55","857.96","1206.24","1320.01"],"ans":2,"why":null,"steps":"Discount each cash flow at the rate for its own maturity: −600 + 455/1.02 + 599/1.016³ + 850/1.015⁵ = −600 + 446.08 + 571.14 + 789.02 = $1,206.24. Using a single rate for everything, or forgetting the −$600 investment (that gives a PV of about 1,806), leads to the wrong options.","th":["apr_ear","npvrule","yieldcurve"],"case":"y19c6","keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_7":{"id":"y19_7","ch":"Ch 5","type":"mc","q":"You are considering purchasing a new home for which you need to borrow $525,000. A mortgage company offers you a 30-year fixed rate annuity mortgage with quarterly payments at a 1.5% APR with quarterly compounding. What is your quarterly mortgage payment closest to if you borrow from this mortgage company?","opts":["$7,152","$5,986","$6,840","$5,441"],"ans":3,"why":null,"steps":"Quarterly rate = 1.5%/4 = 0.375%; N = 30 × 4 = 120. Payment = 525,000 × 0.00375/(1 − 1.00375⁻¹²⁰) = $5,441. Using the APR as if it were the quarterly rate, or the wrong number of periods, gives the other values.","th":["annuity","apr_ear","loan","matchperiod"],"case":null,"keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_8":{"id":"y19_8","ch":"Ch 5","type":"mc","q":"Which of the following statements is <b>FALSE<\/b>?","opts":["The yield curve is a potential leading indicator of future economic growth.","The relationship between the investment term and the interest rate is called the term structure of interest rates.","The shape of the yield curve will be influenced by interest rate expectations.","The yield to maturity of risk-free short-term securities is always lower than the yields of risk-free long-term securities."],"ans":3,"why":null,"steps":"‘Always’ is the giveaway: the yield curve can be flat or <b>inverted<\/b>, in which case short-term yields are higher than long-term yields. The other three are true: an inverted curve has historically preceded recessions (leading indicator), the term structure is the relation between term and rate, and expected future rates shape the curve.","th":["yieldcurve"],"case":null,"keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_9":{"id":"y19_9","ch":"Ch 2","type":"mc","q":"What is Luther’s net working capital in 2019?<br><i>(The end of the question is hidden in the screenshot; the options show it asks for the 2019 NWC.)<\/i>","opts":["$12 million","$63.6 million","$39 million","$27 million"],"ans":3,"why":null,"steps":"Net working capital = current assets − current liabilities = 171.0 − 144.0 = $27 million in 2019. $12 million is the 2018 NWC (144.0 − 132.0): read the right column. $63.6 million is 2019 cash (or 2018 equity), and $39 million is 171.0 − 132.0, which mixes the two years.","th":["apr_ear","fcf","firmtypes","statements"],"case":"y19c9","keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"aA_1":{"id":"aA_1","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>1. The shareholders of a corporation cannot lose more than the amount they invested, because creditors have no claim on their personal assets.<br>2. Because of double taxation, corporate profits paid out as dividends are taxed at the corporate level, after which the dividends are exempt from personal income tax.","opts":["Both statements are true","Statement 1 is true, statement 2 is false","Both statements are false","Statement 2 is true, statement 1 is false"],"ans":1,"why":null,"steps":"Statement 1 describes limited liability, which is correct. Statement 2 is false: double taxation means the profit is taxed <b>twice<\/b>, first as corporate profit and then again as dividend income of the shareholder. Saying the dividend is exempt describes single taxation, the opposite of what the term means.","th":["credit","ev"],"case":null,"keep":true,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_2":{"id":"aA_2","ch":"Ch 1","type":"mc","q":"Friedman argues that firms should maximize market value and let shareholders use the dividends for any social goals. According to Hart &amp; Zingales (2017), when does this separation fail?","opts":["When the firm’s profit-making and its social damage are inseparable","When managers know shareholders’ social preferences better than the shareholders do","When shareholders hold well-diversified portfolios and can easily sell their shares","When the market value of the firm does not include its future cash flows"],"ans":0,"why":null,"steps":"Hart &amp; Zingales: Friedman’s separation works only if the harm a firm does can be undone by shareholders afterwards (they ‘make money first and do good later’). If making the money and doing the damage are inseparable (for example selling high-capacity magazines), a shareholder cannot undo it more efficiently than the firm, so the firm should maximize shareholder <b>welfare<\/b>, not market value. Diversification has nothing to do with it; the authors propose that managers follow investors’ preferences via votes, not that they know them better; and market value does include future cash flows.","th":["hz"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_3":{"id":"aA_3","ch":"Ch 2","type":"mc","q":"Velo NV reports total assets of €420m and total liabilities of €300m. The liabilities include €180m of interest-bearing debt; the rest is accounts payable and other non-interest-bearing items. Velo holds €40m of cash. It has 25 million shares outstanding at €9.60. Which statement is TRUE?","opts":["Enterprise value is €380m and the market-to-book ratio is 2.0","Enterprise value is €500m and the market-to-book ratio is 2.0","Enterprise value is €420m and the market-to-book ratio is 0.5","Enterprise value is €380m and the market-to-book ratio is 0.5"],"ans":0,"why":null,"steps":"Market cap = 25m × €9.60 = €240m. Book equity = assets − liabilities = 420 − 300 = €120m, so M/B = 240/120 = 2.0. EV = market cap + <b>debt<\/b> − cash = 240 + 180 − 40 = €380m. €500m uses all liabilities (300) instead of interest-bearing debt: accounts payable are not debt in EV. 0.5 is book/market turned upside down. €420m is the book value of assets, not a market value.","th":["apr_ear","bookmarket","ev","firmtypes"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_4":{"id":"aA_4","ch":"Ch 2","type":"mc","q":"A retailer has annual sales of €73m and annual cost of goods sold of €51.1m. On the balance sheet: accounts receivable €9.0m, inventory €7.0m and accounts payable €4.2m. Use 365 days. What are the firm’s inventory days closest to?","opts":["35 days","50 days","45 days","30 days"],"ans":1,"why":null,"steps":"Inventory days = inventory / average daily <b>COGS<\/b> = 7.0 / (51.1/365) = 7.0 / 0.14 = 50 days. 35 days divides by daily sales instead of daily COGS (7.0/0.2). 45 days is the AR days (9.0/0.2) and 30 days is the AP days (4.2/0.14): both are on the same balance sheet, so check which ratio is asked.","th":["ratios","statements"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_5":{"id":"aA_5","ch":"Ch 2","type":"mc","q":"Consider the following two statements:<br>1. The firm’s EBIT/interest coverage decreased from 2023 to 2024.<br>2. The firm’s net profit margin increased from 2023 to 2024.","opts":["Both statements are true","Both statements are false","Statement 2 is true, statement 1 is false","Statement 1 is true, statement 2 is false"],"ans":3,"why":null,"steps":"EBIT/interest: 360/60 = 6.0 in 2023 and 420/84 = 5.0 in 2024, so coverage fell: statement 1 is true. Net profit margin = net income / sales: 225/2,400 = 9.4% and 252/3,000 = 8.4%, so it fell: statement 2 is false. The trap is that net income itself rose (225 → 252); a margin is a ratio, so sales growing faster than profit lowers it.","th":["fcf","ratios"],"case":"aAc5","keep":true,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_6":{"id":"aA_6","ch":"Ch 3","type":"mc","q":"Is there an arbitrage opportunity, and if so, how do you exploit it?","opts":["Yes: buy C and sell 0.4 A and 1.4 B, earning €1.60 today","Yes: buy C, because it pays €180 for a price of €166, earning €14","Yes: sell C and buy 0.4 A and 1.4 B, earning €1.60 today","No: C’s price equals the present value of its cash flows"],"ans":2,"why":null,"steps":"Replicate C: 0.4 × A pays €40 in year 1 and 1.4 × B pays €140 in year 2. The portfolio costs 0.4 × 96 + 1.4 × 90 = 38.40 + 126.00 = €164.40. C costs €166.00, so C is <b>overpriced<\/b>: sell C, buy the portfolio, and keep €1.60 today with no future cash flows (all cancel). Buying C is the wrong direction. Comparing €180 with €166 ignores the time value of money. ‘No’ is wrong because C’s no-arbitrage price is €164.40.","th":["apr_ear","arbitrage","replicate"],"case":"aAc6","keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_7":{"id":"aA_7","ch":"Ch 3","type":"mc","q":"You inherit 1,000 shares of a listed company. You plan to sell them immediately. The market maker quotes a bid price of €49.80 and an ask price of €50.20. What is the cash value of your inheritance today?","opts":["€50,200","€50,000","€49,600","€49,800"],"ans":3,"why":null,"steps":"When you <b>sell<\/b>, you receive the <b>bid<\/b> price: 1,000 × €49.80 = €49,800. The ask (€50,200) is what you would pay to buy. The mid price (€50,000) is not a price at which you can trade. €49,600 subtracts the full spread (€0.40) from the bid, but the spread is already in the bid price.","th":["bidask"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_8":{"id":"aA_8","ch":"Ch 4","type":"mc","q":"You win a prize that pays €50,000 one year from now. Each following payment grows by 3%, and there are 20 payments in total. The discount rate is 7% per year. What is the present value of the prize closest to?","opts":["€529,701","€713,244","€666,583","€1,250,000"],"ans":2,"why":null,"steps":"Growing annuity: PV = C/(r − g) × [1 − ((1+g)/(1+r))^N] = 50,000/0.04 × [1 − (1.03/1.07)^20] = 1,250,000 × 0.53327 = €666,583. €1,250,000 is the growing <b>perpetuity<\/b> (forgets that payments stop after 20 years). €529,701 is a constant annuity (ignores growth). €713,244 multiplies by 1.07, as if the first payment came today.","th":["apr_ear"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_9":{"id":"aA_9","ch":"Ch 4","type":"mc","q":"An investment pays €10,000 per year for 10 years. The first payment is received at the end of year 5. The discount rate is 6%. What is the present value today closest to?","opts":["€54,999","€58,299","€73,601","€100,000"],"ans":1,"why":null,"steps":"The annuity formula gives the value one period <b>before<\/b> the first payment: at t = 4, PV₄ = 10,000/0.06 × (1 − 1.06⁻¹⁰) = €73,601. Discount 4 years: 73,601/1.06⁴ = €58,299. €54,999 discounts 5 years (the classic mistake: the first payment is at t = 5, so the annuity value sits at t = 4). €73,601 forgets to discount to today. €100,000 ignores the time value of money.","th":["apr_ear"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_10":{"id":"aA_10","ch":"Ch 4","type":"mc","q":"You save €300 at the end of every month in an account that pays 4.8% APR with monthly compounding. How long does it take until you have €50,000?","opts":["About 3.9 years","About 13.9 years","About 22.9 years","About 10.7 years"],"ans":3,"why":null,"steps":"Monthly rate r = 4.8%/12 = 0.4%. FV of an annuity: 50,000 = 300/0.004 × (1.004^N − 1) → 1.004^N = 1 + 50,000 × 0.004/300 = 1.6667 → N = ln(1.6667)/ln(1.004) = 128 months ≈ 10.7 years. 13.9 years ignores interest (50,000/300 = 167 months). 22.9 years uses the PV annuity formula instead of the FV formula. 3.9 years uses 4.8% as a monthly rate.","th":["apr_ear","ev","matchperiod"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_11":{"id":"aA_11","ch":"Ch 5","type":"mc","q":"You want to deposit savings for one year. Which bank offers the highest effective annual rate?","opts":["Bank P: 6.00% APR with semi-annual compounding","Bank Q: 5.95% APR with quarterly compounding","Bank R: 5.90% APR with monthly compounding","Bank S: 6.05% EAR"],"ans":0,"why":null,"steps":"Convert everything to EARs. P: (1 + 0.06/2)² − 1 = 6.090%. Q: (1 + 0.0595/4)⁴ − 1 = 6.084%. R: (1 + 0.059/12)¹² − 1 = 6.062%. S: 6.050% (already an EAR). P is highest. More frequent compounding raises the EAR, but not enough to make up for a lower APR here, and an EAR of 6.05% is lower than it looks once the others are converted.","th":["apr_ear","fv_annuity","matchperiod"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_12":{"id":"aA_12","ch":"Ch 5","type":"mc","q":"You take out a €300,000 annuity mortgage with 30 years of monthly payments at 4.8% APR (monthly compounding). What is the outstanding balance immediately after the 120th payment (after 10 years) closest to?","opts":["€200,000","€242,542","€111,121","€377,759"],"ans":1,"why":null,"steps":"Monthly rate 0.4%, N = 360: payment = 300,000 × 0.004/(1 − 1.004⁻³⁶⁰) = €1,574.00. The balance is the PV of the <b>remaining<\/b> 240 payments: 1,574.00/0.004 × (1 − 1.004⁻²⁴⁰) = €242,542. €200,000 assumes a third of the loan is repaid after a third of the time; early payments are mostly interest, so far less is repaid. €111,121 subtracts 120 payments from the loan without interest. €377,759 adds the remaining payments without discounting.","th":["annuity","apr_ear","loan","matchperiod"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_13":{"id":"aA_13","ch":"Ch 6","type":"mc","q":"An 8-year bond with face value €1,000 pays a 5% coupon semi-annually. Its yield to maturity is 6.2% (APR, semi-annual compounding). What is the bond’s price closest to?","opts":["€925.21","€631.16","€1,000.00","€1,094.94"],"ans":0,"why":null,"steps":"Per half-year: coupon = 2.5% × 1,000 = €25, yield = 3.1%, N = 16. P = 25/0.031 × (1 − 1.031⁻¹⁶) + 1,000/1.031¹⁶ = 311.64 + 613.57 = €925.21. It is a discount bond, as it should be when the yield (6.2%) is above the coupon rate (5%). €631.16 uses 6.2% per half-year. €1,000 would only hold if yield = coupon rate. €1,094.94 discounts the face value over 8 periods instead of 16.","th":["apr_ear","matchperiod","ytm"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_14":{"id":"aA_14","ch":"Ch 6","type":"mc","q":"The yield to maturity of a 10-year zero-coupon bond rises from 4% to 5%. By how much does its price change, approximately?","opts":["−1.0%","−8.3%","−9.1%","−10.0%"],"ans":2,"why":null,"steps":"P = F/(1+y)^10, so the new price / old price = (1.04/1.05)^10 = 0.9087: a change of −9.1%. A long zero is very sensitive because the whole cash flow is discounted over 10 years. −1.0% treats the price like a one-year bond. −10.0% multiplies the 1% change by 10 years (close, but ignores compounding).","th":["apr_ear","ytm"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_15":{"id":"aA_15","ch":"Ch 6","type":"mc","q":"Consider the following two statements:<br>1. For a corporate bond with default risk, the yield to maturity equals the expected return an investor earns.<br>2. If its yield does not change, the price of a premium bond falls towards its face value as the bond approaches maturity.","opts":["Both statements are true","Statement 1 is true, statement 2 is false","Statement 2 is true, statement 1 is false","Both statements are false"],"ans":2,"why":null,"steps":"Statement 1 is false: the YTM is computed from the <b>promised<\/b> cash flows. With default risk the expected cash flows are lower, so the expected return is below the YTM. Statement 2 is true: at maturity every bond is worth its face value, so a premium bond’s price drifts down towards par (and a discount bond’s price drifts up).","th":["apr_ear","credit","ytm"],"case":null,"keep":true,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_16":{"id":"aA_16","ch":"Ch 7","type":"mc","q":"A firm receives €1,000 today and must pay €1,150 in one year. The IRR of this deal is 15%. The cost of capital is 10%. What should the firm do?","opts":["Accept: the IRR of 15% exceeds the cost of capital of 10%","Accept: the NPV is about +€45","Reject: the IRR cannot be calculated for this deal","Reject: the NPV is about −€45"],"ans":3,"why":null,"steps":"NPV = 1,000 − 1,150/1.10 = −€45.45, so reject. This is a ‘delayed investment’ (benefit first, cost later): it is like borrowing at 15% while money costs only 10%. For such cash flows the IRR rule reverses and gives the wrong answer. The IRR exists (15%), it just cannot be used with the usual ‘accept if IRR &gt; r’ rule. +€45 has the sign wrong.","th":["apr_ear","irrrule","npvrule"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_17":{"id":"aA_17","ch":"Ch 7","type":"mc","q":"A project costs €500 today and generates €150, €200, €250 and €100 at the end of years 1 to 4. The firm uses a payback cutoff of 3 years. The cost of capital is 12%. Which statement is TRUE?","opts":["Payback is 2.6 years and the NPV is about +€200: both rules accept","Payback is 2.6 years and the NPV is about +€35: both rules accept","Payback is 3.4 years: the payback rule rejects while NPV accepts","Payback is 2.6 years and the NPV is about −€15: the rules conflict"],"ans":1,"why":null,"steps":"Cumulative cash flows: 150, 350, 600. After 2 years €150 is still missing; year 3 brings €250, so payback = 2 + 150/250 = 2.6 years &lt; 3: accept. NPV = −500 + 150/1.12 + 200/1.12² + 250/1.12³ + 100/1.12⁴ = −500 + 133.93 + 159.44 + 177.95 + 63.55 = +€34.86: accept. +€200 is the undiscounted sum. Remember payback ignores discounting, so the agreement here is a coincidence, not a rule.","th":["apr_ear","npvrule","payback"],"case":null,"keep":true,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_18":{"id":"aA_18","ch":"Ch 7","type":"mc","q":"Projects cannot be split. Which choice maximizes the firm’s value?","opts":["A and D","B and D","B and C","A only"],"ans":2,"why":null,"steps":"Profitability indices (NPV/investment): A 0.60, B 0.59, C 0.58, D 0.50. Ranking by PI takes A first (€700 used), then neither B nor C fits, so D: total NPV 420 + 150 = €570. But B and C together use exactly €1,000 and give 295 + 290 = €585. Because projects are indivisible, the PI ranking does not always find the best combination: check the feasible combinations. B and D (€445) and A only (€420) leave value on the table.","th":["npvrule"],"case":"aAc18","keep":true,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_19":{"id":"aA_19","ch":"Ch 8","type":"mc","q":"A project needs a machine of €600,000 (straight-line depreciation over 5 years, no capital expenditure in year 1). In year 1: revenues €800,000 and operating costs €450,000 (excluding depreciation). The project uses a warehouse the firm owns that could otherwise be rented out for €40,000 per year. Last year the firm paid €25,000 for a market study. The project is financed with a loan that costs €30,000 interest per year. Net working capital rises from €0 to €60,000 in year 1. The tax rate is 25%. What is the project’s free cash flow in year 1?","opts":["€232,500","€180,000","€262,500","€202,500"],"ans":3,"why":null,"steps":"Depreciation = 600,000/5 = 120,000. EBIT = 800,000 − 450,000 − 40,000 (lost rent, an opportunity cost) − 120,000 = 190,000. Unlevered net income = 190,000 × 0.75 = 142,500. FCF = 142,500 + 120,000 − 0 − 60,000 = €202,500. The market study is sunk and the interest is financing, so both are left out. €232,500 forgets the opportunity cost. €180,000 deducts the interest. €262,500 forgets the increase in NWC.","th":["apr_ear","ev","fcf","loan"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aA_20":{"id":"aA_20","ch":"Ch 8","type":"mc","q":"At the end of a project the firm sells equipment for €80,000. At that moment the equipment has a book value of €50,000. The tax rate is 25%. What is the after-tax cash flow from the sale?","opts":["€72,500","€80,000","€60,000","€57,500"],"ans":0,"why":null,"steps":"Only the gain above book value is taxed: capital gain = 80,000 − 50,000 = 30,000, tax = 25% × 30,000 = 7,500. After-tax cash flow = 80,000 − 7,500 = €72,500. €80,000 ignores the tax. €60,000 taxes the whole sale price. €57,500 adds the tax to the book value (50,000 + 7,500), which is not the cash the firm receives.","th":["fcf"],"case":null,"keep":false,"model":null,"src":"aiA","msrc":"ai","pts":1,"srcl":"AI realistic exam A"},"aB_1":{"id":"aB_1","ch":"Ch 1","type":"mc","q":"Which of the following would NOT reduce the agency problem between managers and shareholders?","opts":["Paying the CEO partly in shares that vest over five years","A board that includes several independent directors","A real threat of a hostile takeover if the share price lags","Spreading the shares over many more, smaller shareholders"],"ans":3,"why":null,"steps":"Agency problems come from the separation of ownership and control. Dispersed small shareholders have little incentive to monitor managers (each bears the full cost of monitoring but gets only a tiny share of the benefit), so spreading ownership makes the problem worse. Share-based pay aligns incentives, independent directors monitor, and the takeover threat disciplines managers who destroy value.","th":["agency","apr_ear","ev"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_2":{"id":"aB_2","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>1. Market makers profit from the bid-ask spread by buying at the bid price and selling at the ask price.<br>2. Every time a firm’s shares change hands on the stock exchange, the firm receives new capital.","opts":["Statement 1 is true, statement 2 is false","Both statements are true","Statement 2 is true, statement 1 is false","Both statements are false"],"ans":0,"why":null,"steps":"Statement 1 is true: market makers buy from investors at the (lower) bid and sell at the (higher) ask, and the spread is their compensation for providing liquidity. Statement 2 is false: trading on the stock exchange is a <b>secondary<\/b> market between investors. The firm only receives money when it issues new shares in the primary market (e.g. an IPO).","th":["bidask","ev"],"case":null,"keep":true,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_3":{"id":"aB_3","ch":"Ch 2","type":"mc","q":"Comparable firms trade at an EV/EBITDA multiple of 9. Tulp NV has EBITDA of €80m, debt of €250m, cash of €30m and 40 million shares. Based on the multiple, what is Tulp’s estimated share price?","opts":["€18.00","€12.50","€11.75","€11.00"],"ans":1,"why":null,"steps":"EV = 9 × 80 = €720m. Equity = EV − debt + cash = 720 − 250 + 30 = €500m. Price = 500/40 = €12.50. €18.00 divides the EV by the shares (EV is the value of the whole business, not of equity). €11.75 forgets to add back the cash. €11.00 subtracts the cash instead of adding it.","th":["ev"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_4":{"id":"aB_4","ch":"Ch 2","type":"mc","q":"Brug BV has total debt of €360m and a book value of equity of €240m. It has 20 million shares that trade at €36. Which statement is TRUE?","opts":["Book debt-equity is 0.67 and market debt-equity is 2.0","Book debt-equity is 1.5 and the debt-to-capital ratio is 0.4","Book debt-equity is 1.5 and market debt-equity is 0.5","The debt-to-capital ratio is 1.5 and market debt-equity is 0.5"],"ans":2,"why":null,"steps":"Book D/E = 360/240 = 1.5. Market equity = 20m × €36 = €720m, so market D/E = 360/720 = 0.5. Debt-to-capital (formula sheet) = debt/(equity + debt) = 360/(240 + 360) = 0.6. 0.67 and 2.0 are the ratios turned upside down. 0.4 is equity/capital, and 1.5 is the D/E, not the debt-to-capital ratio.","th":["ev"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_5":{"id":"aB_5","ch":"Ch 2","type":"mc","q":"This year a firm has sales of €1,200 and cost of goods sold of €700 (excluding depreciation). Depreciation is €100 and capital expenditures are €180. During the year accounts receivable rise by €150, inventory rises by €30 and accounts payable rise by €40. The tax rate is 25% and the firm has no debt. What is its free cash flow?","opts":["€80","€0","€220","−€120"],"ans":0,"why":null,"steps":"EBIT = 1,200 − 700 − 100 = 400; unlevered net income = 400 × 0.75 = 300. ΔNWC = +150 (AR) + 30 (inventory) − 40 (AP) = +140. FCF = 300 + 100 − 180 − 140 = €80. €0 adds the increase in payables to NWC instead of subtracting it (an increase in AP is money you have not paid yet). €220 ignores NWC. −€120 subtracts depreciation instead of adding it back.","th":["apr_ear","fcf"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_6":{"id":"aB_6","ch":"Ch 3","type":"mc","q":"A friend offers to pay you €1,000 two years from now if you give her €900 today. You can borrow and lend at 4% per year without risk, and she will certainly pay. What is the NPV of accepting, and what should you do?","opts":["+€61.54: accept","−€24.56: decline","+€100.00: accept","+€24.56: accept"],"ans":3,"why":null,"steps":"NPV = −900 + 1,000/1.04² = −900 + 924.56 = +€24.56 &gt; 0, so accept: her deal beats lending at 4%. +€61.54 discounts only one year. +€100 ignores the time value of money. −€24.56 has the sign wrong.","th":["apr_ear","npvrule"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_7":{"id":"aB_7","ch":"Ch 3","type":"mc","q":"Shares of Delta trade at €40.00 in Amsterdam and at $43.50 in New York. The exchange rate is €1 = $1.10. Ignoring transaction costs, what is the arbitrage strategy per share?","opts":["Buy in New York and sell in Amsterdam, earning $0.50","Buy in Amsterdam and sell in New York, earning $0.50","Buy in New York and sell in Amsterdam, earning $3.50","There is no arbitrage: the prices only differ in currency"],"ans":0,"why":null,"steps":"Convert to one currency: €40.00 × 1.10 = $44.00 in Amsterdam versus $43.50 in New York. Buy where it is cheap (New York, $43.50) and sell where it is expensive (Amsterdam, $44.00): $0.50 per share. $3.50 compares 43.50 with 40.00 without converting euros to dollars. By the law of one price the converted prices should be equal, so there is an arbitrage.","th":["apr_ear","arbitrage","replicate"],"case":null,"keep":true,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_8":{"id":"aB_8","ch":"Ch 4","type":"mc","q":"A share will pay its first dividend of €3.00 at the end of year 3. After that the dividend grows by 2% per year forever. The discount rate is 8%. What is the share’s value today closest to?","opts":["€50.00","€46.30","€39.69","€42.87"],"ans":3,"why":null,"steps":"The growing perpetuity formula gives the value one period before the first payment, here at t = 2: 3.00/(0.08 − 0.02) = €50.00. Discount 2 years: 50.00/1.08² = €42.87. €50.00 forgets to discount. €46.30 discounts one year. €39.69 discounts three years (the most common mistake: the first payment is at t = 3, so the value is at t = 2).","th":["apr_ear","ev"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_9":{"id":"aB_9","ch":"Ch 4","type":"mc","q":"You lease an office for 3 years. The rent is €1,200 per month, paid at the <b>beginning<\/b> of each month. The discount rate is 6% APR with monthly compounding. What is the present value of the rent closest to?","opts":["€39,642","€39,445","€17,545","€43,200"],"ans":0,"why":null,"steps":"Monthly rate 0.5%, 36 payments. Ordinary annuity: 1,200/0.005 × (1 − 1.005⁻³⁶) = €39,445. The payments come at the beginning of each month, so each one is one month earlier: multiply by 1.005 → €39,642. €39,445 treats it as end-of-month rent. €17,545 uses 6% per month. €43,200 is the undiscounted total.","th":["apr_ear","matchperiod"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_10":{"id":"aB_10","ch":"Ch 4","type":"mc","q":"An insurer offers you €1,295 at the end of each year for 10 years in exchange for €10,000 today. What annual return does this offer give you?","opts":["About 12.95%","About 2.95%","About 5.0%","About 29.5%"],"ans":2,"why":null,"steps":"Solve 10,000 = 1,295/r × (1 − (1+r)⁻¹⁰). Try r = 5%: 1,295 × 7.7217 = €9,999.6 ≈ €10,000, so the return is 5.0% (the IRR of the deal). 12.95% is one payment divided by the price (it ignores that the payments stop). 29.5% is the total undiscounted gain (12,950 − 10,000)/10,000, and 2.95% spreads that gain over 10 years without compounding or discounting.","th":["apr_ear"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_11":{"id":"aB_11","ch":"Ch 5","type":"mc","q":"The risk-free yield curve (EAR) is 2.0% for 1 year, 3.0% for 2 years and 4.0% for 3 years. What is the price of a 3-year risk-free bond with face value €1,000 and a 6% annual coupon?","opts":["€1,057.72","€1,084.86","€1,055.50","€1,115.36"],"ans":0,"why":null,"steps":"Discount each cash flow at the rate for its own maturity: 60/1.02 + 60/1.03² + 1,060/1.04³ = 58.82 + 56.56 + 942.34 = €1,057.72. €1,055.50 discounts everything at 4% (the 3-year rate). €1,084.86 uses the ‘average’ 3% for all cash flows. €1,115.36 uses the 1-year rate for all of them.","th":["apr_ear","yieldcurve","ytm"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_12":{"id":"aB_12","ch":"Ch 5","type":"mc","q":"You want €40,000 of today’s purchasing power in 10 years. Your savings earn a nominal 5% per year and inflation is expected to be 2% per year. How much do you need to invest today?","opts":["€24,557","€29,764","€20,334","€29,934"],"ans":3,"why":null,"steps":"In 10 years you need 40,000 × 1.02¹⁰ = €48,760 (nominal). Discount at the nominal rate: 48,760/1.05¹⁰ = €29,934. Equivalently, discount €40,000 at the exact real rate 1.05/1.02 − 1 = 2.94%. €29,764 uses the approximation 5% − 2% = 3%. €24,557 forgets inflation. €20,334 adds inflation to the discount rate (7%).","th":["apr_ear","realrate"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_13":{"id":"aB_13","ch":"Ch 6","type":"mc","q":"A 4-year bond with a 6% annual coupon and face value €1,000 trades at €965. What is its yield to maturity closest to?","opts":["6.00%","6.22%","7.03%","3.63%"],"ans":2,"why":null,"steps":"Solve 965 = 60/(1+y) + 60/(1+y)² + 60/(1+y)³ + 1,060/(1+y)⁴. Try 7%: price = 966.13, slightly too high, so y is a bit above 7%: y ≈ 7.03%. The bond trades below par, so the YTM must be above the 6% coupon rate. 6.22% is the current yield (60/965), which ignores the gain from €965 to €1,000. 3.63% is that gain alone ((1,000 − 965)/965).","th":["apr_ear","ytm"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_14":{"id":"aB_14","ch":"Ch 6","type":"mc","q":"Zero-coupon bond prices per €1,000 face value are €970 (1 year), €935 (2 years) and €898 (3 years). A 3-year bond with a 5% annual coupon and face value €1,000 trades at €1,040. Which statement is TRUE?","opts":["The no-arbitrage price is about €1,038: buy the bond and sell the zeros","The no-arbitrage price is about €1,038: sell the bond and buy the zeros","The no-arbitrage price is about €1,033: sell the bond and buy the zeros","The bond is fairly priced at €1,040: there is no arbitrage"],"ans":1,"why":null,"steps":"Replicate the coupon bond with zeros: 0.05 × 970 + 0.05 × 935 + 1.05 × 898 = 48.50 + 46.75 + 942.90 = €1,038.15. The bond trades at €1,040, above that, so sell the (overpriced) bond and buy the zeros: €1.85 risk-free profit today. Buying the bond is the wrong direction. €1,033 discounts every cash flow with the 3-year zero price (1,150 × 0.898).","th":["apr_ear","arbitrage","replicate","ytm"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_15":{"id":"aB_15","ch":"Ch 6","type":"mc","q":"A 1-year zero-coupon corporate bond with face value €1,000 trades at €920. There is a 5% probability of default, in which case bondholders receive €600. Which statement is TRUE?","opts":["YTM is 8.0% and the expected return is 6.5%","YTM is 8.7% and the expected return is 8.7%","YTM is 6.5% and the expected return is 8.7%","YTM is 8.7% and the expected return is 6.5%"],"ans":3,"why":null,"steps":"YTM uses the promised payment: 1,000/920 − 1 = 8.70%. Expected payoff = 0.95 × 1,000 + 0.05 × 600 = 980, so expected return = 980/920 − 1 = 6.52%. With default risk, the expected return is below the YTM. 8.0% divides the €80 gain by the face value instead of the price. Swapping the two numbers reverses the logic.","th":["apr_ear","credit","ytm"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_16":{"id":"aB_16","ch":"Ch 7","type":"mc","q":"A project has cash flows of −€1,000 today, +€2,300 in year 1 and −€1,320 in year 2. Its IRRs are 10% and 20%. The cost of capital is 15%. What should the firm do?","opts":["Reject: 15% lies between the two IRRs, so the NPV is negative","Accept: the NPV at 15% is about +€1.9","Reject: with two IRRs, the project cannot create value","Accept only if the cost of capital were below 10%"],"ans":1,"why":null,"steps":"With two IRRs, compute the NPV directly: −1,000 + 2,300/1.15 − 1,320/1.15² = −1,000 + 2,000.00 − 998.11 = +€1.89, so accept. For this cash flow pattern (−, +, −) the NPV is positive <b>between<\/b> the IRRs (at 5% it is −€6.8). Whether that is between or outside depends on the pattern, which is exactly why the IRR rule cannot be trusted here: use NPV.","th":["apr_ear","irrrule","npvrule"],"case":null,"keep":true,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_17":{"id":"aB_17","ch":"Ch 7","type":"mc","q":"Two mutually exclusive projects, cost of capital 10%. Project S: invest €1,000 today, receive €1,300 in one year (IRR 30%). Project L: invest €5,000 today, receive €6,000 in one year (IRR 20%). Which project should the firm choose?","opts":["S, because its IRR is higher","S, because its profitability index is higher","L, because its NPV is higher","Both, because both IRRs exceed 10%"],"ans":2,"why":null,"steps":"NPV(S) = −1,000 + 1,300/1.1 = €181.82. NPV(L) = −5,000 + 6,000/1.1 = €454.55. For mutually exclusive projects choose the highest NPV: L. The IRR ignores scale: a high percentage on a small amount can create less value. The incremental project L − S (−4,000 now, +4,700 in a year) has an IRR of 17.5% &gt; 10%, which confirms L. The profitability index only matters with a resource constraint, and ‘both’ is impossible for mutually exclusive projects.","th":["apr_ear","irrrule","mutual","npvrule"],"case":null,"keep":true,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_18":{"id":"aB_18","ch":"Ch 7","type":"mc","q":"A project costs €2,000,000 today. It generates €150,000 at the end of year 1, and this cash flow grows by 2% per year forever. The cost of capital is 8%. Which statement is TRUE?","opts":["The IRR is 7.5%, so reject","The IRR is 9.5%, so accept","The IRR is 5.5%, so reject","The IRR is 9.5%, but reject because the NPV is negative"],"ans":1,"why":null,"steps":"Growing perpetuity: 0 = −2,000,000 + 150,000/(IRR − 0.02), so IRR = 150,000/2,000,000 + 0.02 = 7.5% + 2% = 9.5% &gt; 8%: accept. The NPV agrees: 150,000/0.06 − 2,000,000 = +€500,000. 7.5% forgets the growth; 5.5% subtracts the growth instead of adding it.","th":["apr_ear","ev","irrrule","npvrule"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_19":{"id":"aB_19","ch":"Ch 8","type":"mc","q":"A firm launches a new phone model. It will sell €4.0m per year; variable costs are 55% of sales. Because some customers switch from the firm’s existing model, sales of that model fall by €1.0m per year (also 55% variable costs). Headquarters allocates €0.3m of existing overhead to the new model; total overhead does not change. Extra depreciation is €0.5m per year and the tax rate is 25%. What are the incremental unlevered net earnings per year?","opts":["€975,000","€637,500","€412,500","€750,000"],"ans":1,"why":null,"steps":"Incremental sales = 4.0 − 1.0 (cannibalization) = €3.0m. Incremental EBIT = 3.0 × 45% − 0.5 = 1.35 − 0.5 = €0.85m. Unlevered net income = 0.85 × 0.75 = €637,500. The allocated overhead is not incremental (it is paid anyway). €975,000 ignores the cannibalization. €412,500 also deducts the overhead. €750,000 ignores cannibalization but deducts the overhead.","th":["apr_ear","ev","fcf","incremental"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aB_20":{"id":"aB_20","ch":"Ch 8","type":"mc","q":"A project requires €1,200 today and then produces a constant free cash flow every year forever, starting in year 1. Each unit sold adds €4 of margin and fixed costs are €300 per year. Free cash flow = (units × €4 − €300) × (1 − 25%); there is no depreciation. The cost of capital is 10%. How many units per year are needed for the NPV to be zero?","opts":["75 units","105 units","115 units","40 units"],"ans":2,"why":null,"steps":"NPV = 0 requires a perpetual FCF of 1,200 × 10% = €120. Before tax that is 120/0.75 = €160. Units: 4 × Q − 300 = 160 → Q = 115. 105 units forgets the tax (4Q − 300 = 120). 75 units only covers the fixed costs (accounting break-even before the investment). 40 units ignores the fixed costs.","th":["apr_ear","ev","fcf","npvrule"],"case":null,"keep":false,"model":null,"src":"aiB","msrc":"ai","pts":1,"srcl":"AI realistic exam B"},"aC_1":{"id":"aC_1","ch":"Ch 1","type":"mc","q":"Consider the following two statements about Hart &amp; Zingales (2017):<br>1. The authors favour divestment (selling the shares of ‘dirty’ firms) over engagement as the main tool for socially minded investors.<br>2. ‘Amoral drift’ arises because dispersed shareholders tend to sell to a purely profit-driven bidder, even if most of them prefer the cleaner policy.","opts":["Both statements are true","Statement 1 is true, statement 2 is false","Statement 2 is true, statement 1 is false","Both statements are false"],"ans":2,"why":null,"steps":"Statement 1 is false: the authors prefer <b>invest and engage<\/b> (voting for the policies you want) over divestment, because selling just passes the shares to someone who does not care. Statement 2 is true: each small shareholder thinks their vote will not decide the outcome (collective action problem) and tenders, so takeovers push firms towards ‘dirty’ policies.","th":["bidask","ev","hz"],"case":null,"keep":true,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_2":{"id":"aC_2","ch":"Ch 1","type":"mc","q":"Why do large firms that need to raise money from many investors usually organize as corporations rather than as partnerships?","opts":["Corporations avoid paying tax on their profits, unlike partnerships","Corporate owners have limited liability and can easily sell their shares","In a corporation the owners manage the firm themselves, so there are no conflicts","Partnerships are not allowed to borrow money from banks or issue bonds"],"ans":1,"why":null,"steps":"Limited liability and easily transferable shares make it attractive for many outside investors to provide capital. Corporations do pay tax on profits (that is the first layer of double taxation). Ownership and control are <b>separated<\/b> in a corporation, which is the source of agency problems. Partnerships can borrow from banks.","th":["firmtypes","ytm"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_3":{"id":"aC_3","ch":"Ch 2","type":"mc","q":"Firm Z’s only asset is a contract that pays €550,000 for certain in one year. The risk-free rate is 10%. Z has debt with a book and market value of €200,000, a book value of equity of €150,000 and 30,000 shares outstanding. Which statement is TRUE?","opts":["The share price is €10.00 and the market-to-book ratio is 2.0","The share price is €11.67 and the market-to-book ratio is 2.33","The share price is €10.00 and the market-to-book ratio is 0.5","The share price is €5.00 and the market-to-book ratio is 1.0"],"ans":0,"why":null,"steps":"Market value of the asset = 550,000/1.10 = €500,000. Equity = 500,000 − 200,000 = €300,000, so price = 300,000/30,000 = €10.00 and M/B = 300,000/150,000 = 2.0. €11.67 forgets to discount the cash flow (550,000 − 200,000 = 350,000). 0.5 is book-to-market. €5.00 uses the book value of equity, which is not what the shares trade at.","th":["apr_ear","bookmarket"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_4":{"id":"aC_4","ch":"Ch 2","type":"mc","q":"Lindeboom NV: share price €45, 12 million shares, net income €36m, debt €150m, cash €20m and sales €400m. Which statement is TRUE?","opts":["P/E is 18.6 and EV/Sales is 1.68","P/E is 15.0 and EV/Sales is 1.68","P/E is 15.0 and EV/Sales is 1.35","P/E is 12.0 and EV/Sales is 1.68"],"ans":1,"why":null,"steps":"EPS = 36/12 = €3.00, so P/E = 45/3 = 15.0 (equivalently market cap 540 / net income 36). EV = 540 + 150 − 20 = €670m, so EV/Sales = 670/400 = 1.68. 1.35 uses market cap instead of EV. 18.6 divides the EV by net income, mixing an enterprise value with an equity measure. 12.0 has no basis in the data.","th":["ev","ratios"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_5":{"id":"aC_5","ch":"Ch 2","type":"mc","q":"Consider the following two statements:<br>1. If accounts receivable days rise while sales stay the same, the firm’s free cash flow is lower in that year than it would otherwise be.<br>2. A higher current ratio indicates a better short-term liquidity position.","opts":["Both statements are true","Both statements are false","Statement 2 is true, statement 1 is false","Statement 1 is true, statement 2 is false"],"ans":0,"why":null,"steps":"Statement 1 is true: higher AR days at the same sales means a higher receivables balance, so NWC increases and that increase is subtracted in FCF. Statement 2 is true: current ratio = current assets / current liabilities measures the ability to pay short-term obligations. (A very high ratio can also mean idle cash, but as a liquidity measure, higher means more liquid.)","th":["apr_ear","fcf"],"case":null,"keep":true,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_6":{"id":"aC_6","ch":"Ch 3","type":"mc","q":"An ETF holds 2 shares of A (price €30) and 1 share of B (price €45) and nothing else. One ETF unit trades at €108. Ignoring transaction costs, what is the arbitrage?","opts":["Buy the ETF and sell 2 A and 1 B, earning €3 per unit","Sell the ETF and buy 1 A and 1 B, earning €33 per unit","No arbitrage: an ETF may trade at a premium for its convenience","Sell the ETF and buy 2 A and 1 B, earning €3 per unit"],"ans":3,"why":null,"steps":"The ETF’s holdings are worth 2 × 30 + 45 = €105, but the ETF costs €108. By the law of one price both should be equal. Sell the expensive one (ETF) and buy the cheap one (the shares): +€3 now, and the positions cancel exactly. Buying the ETF is the wrong direction. 1 A and 1 B does not replicate the ETF, so that position is risky. A ‘convenience premium’ is not compatible with no arbitrage.","th":["apr_ear","arbitrage","replicate"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_7":{"id":"aC_7","ch":"Ch 3","type":"mc","q":"A project costs €100 today and pays €60 at the end of year 1 and €60 at the end of year 2. What happens to its NPV when the interest rate rises from 5% to 10%?","opts":["It falls from €11.56 to €4.13","It falls from €20.00 to €9.09","It stays at €20.00, because the cash flows are fixed","It rises, because future cash flows earn more interest"],"ans":0,"why":null,"steps":"At 5%: −100 + 60/1.05 + 60/1.05² = +€11.56. At 10%: −100 + 60/1.10 + 60/1.10² = +€4.13. The benefits come later than the cost, so a higher rate lowers their PV and the NPV falls. €20.00 is the undiscounted sum. €9.09 discounts only one year. The cash flows being fixed in euros does not make their value today fixed.","th":["apr_ear","npvrule"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_8":{"id":"aC_8","ch":"Ch 4","type":"mc","q":"You deposit €2,000 today and €3,000 two years from now. The account pays 5% per year. How much is in the account five years from now?","opts":["€6,381.41","€6,025.44","€5,860.06","€6,250.00"],"ans":1,"why":null,"steps":"Move each deposit to year 5: 2,000 × 1.05⁵ + 3,000 × 1.05³ = 2,552.56 + 3,472.88 = €6,025.44. The €3,000 only grows for 3 years. €6,381.41 lets both deposits grow for 5 years. €5,860.06 grows the second deposit for 2 years (counts the deposit date instead of the remaining time). €6,250 uses simple interest.","th":["apr_ear","fv_annuity"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_9":{"id":"aC_9","ch":"Ch 4","type":"mc","q":"You save 10% of your salary at the end of each year. Your salary is €40,000 in the first year and grows by 3% per year. You save for 35 years and earn 6% per year. How much will you have right after the last deposit?","opts":["€649,630","€445,739","€84,520","€140,000"],"ans":0,"why":null,"steps":"First deposit €4,000, growing 3%. PV of the growing annuity = 4,000/(0.06 − 0.03) × [1 − (1.03/1.06)³⁵] = €84,520. Move to year 35: 84,520 × 1.06³⁵ = €649,630. €445,739 ignores the salary growth. €84,520 is the value today, not at retirement. €140,000 is just 35 × €4,000.","th":["apr_ear","fv_annuity"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_10":{"id":"aC_10","ch":"Ch 4","type":"mc","q":"You can choose between three payouts. The discount rate is 6% per year. (1) €100,000 today. (2) €6,500 per year forever, first payment in one year. (3) €12,000 per year for 12 years, first payment in one year. Which payout is worth the most today?","opts":["Payout 1","Payout 3","All three are worth about the same","Payout 2"],"ans":3,"why":null,"steps":"PV(2) = 6,500/0.06 = €108,333. PV(3) = 12,000/0.06 × (1 − 1.06⁻¹²) = €100,606. PV(1) = €100,000. Payout 2 is worth the most. Payout 3 has the largest undiscounted total (€144,000) but that ignores discounting, and the perpetuity’s small payments add up because they never stop.","th":["apr_ear","ev"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_11":{"id":"aC_11","ch":"Ch 5","type":"mc","q":"A bank quotes an <b>EAR<\/b> of 7% on a €15,000 car loan, repaid in 36 equal monthly payments at the end of each month. What is the monthly payment closest to?","opts":["€463.16","€416.67","€510.31","€461.68"],"ans":3,"why":null,"steps":"First convert the EAR to a monthly rate: 1.07^(1/12) − 1 = 0.5654%. Payment = 15,000 × 0.005654/(1 − 1.005654⁻³⁶) = €461.68. €463.16 divides 7% by 12, which treats the EAR as an APR (that would give an EAR of 7.23%). €416.67 ignores interest (15,000/36). €510.31 compounds the loan for 3 years and divides by 36.","th":["apr_ear","loan","matchperiod"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_12":{"id":"aC_12","ch":"Ch 5","type":"mc","q":"Which of the following statements is FALSE?","opts":["An inverted yield curve means that long-term interest rates are below short-term interest rates","Expectations that interest rates will fall in the future tend to make the yield curve slope downward","With an upward-sloping yield curve, every cash flow of a 10-year project is discounted at the 10-year rate","A risk-free cash flow received in year 3 should be discounted at the 3-year rate from the yield curve"],"ans":2,"why":null,"steps":"Each cash flow should be discounted at the rate that matches <b>its own<\/b> maturity. Using the 10-year rate for every cash flow of a 10-year project is only right if the curve is flat; with an upward-sloping curve it would undervalue the early cash flows. The other statements are true: inverted means short above long, expected rate cuts pull long rates down, and a year-3 cash flow uses the 3-year rate.","th":["apr_ear","ev","fcf","yieldcurve"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_13":{"id":"aC_13","ch":"Ch 6","type":"mc","q":"You buy a 10-year bond with an 8% annual coupon and face value €1,000 at a yield of 6%. One year later, right after the first coupon, you sell it. Its yield is still 6%. What is your return over the year closest to?","opts":["8.0%","7.0%","6.0%","5.0%"],"ans":2,"why":null,"steps":"Price now: 80 × annuity(6%, 10) + 1,000/1.06¹⁰ = €1,147.20. Price in one year (9 years left): €1,136.03. Return = (80 + 1,136.03 − 1,147.20)/1,147.20 = 6.0%. If the yield does not change, your return equals the YTM. 8.0% is the coupon rate and ignores the price drop of a premium bond towards par. 7.0% is the current yield (80/1,147.20 = 6.97%), which also ignores that drop.","th":["apr_ear","ytm"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_14":{"id":"aC_14","ch":"Ch 6","type":"mc","q":"A 5-year bond with face value €1,000 and a 4% coupon paid semi-annually trades at €955. What is its yield to maturity (APR with semi-annual compounding) closest to?","opts":["4.00%","4.19%","2.51%","5.03%"],"ans":3,"why":null,"steps":"Solve 955 = 20/y × (1 − (1+y)⁻¹⁰) + 1,000/(1+y)¹⁰ for the semi-annual yield y: y ≈ 2.51%, so the APR is 2 × 2.51% = 5.03%. The bond trades below par, so the yield must exceed the 4% coupon rate. 2.51% is the per-period yield before annualizing. 4.19% is the current yield (40/955).","th":["apr_ear","matchperiod","ytm"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_15":{"id":"aC_15","ch":"Ch 6","type":"mc","q":"A 4-year zero-coupon corporate bond has face value €1,000. The 4-year Treasury yield is 3.0% and the bond’s credit spread is 2.5%. What is the bond’s price closest to?","opts":["€807.22","€888.49","€819.67","€905.95"],"ans":0,"why":null,"steps":"The corporate yield = Treasury yield + spread = 3.0% + 2.5% = 5.5%. Price = 1,000/1.055⁴ = €807.22. €888.49 ignores the spread (Treasury only). €905.95 discounts at the spread alone. €819.67 uses simple interest (1,000/(1 + 4 × 5.5%)).","th":["apr_ear","credit","ytm"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_16":{"id":"aC_16","ch":"Ch 7","type":"mc","q":"Two mutually exclusive projects each cost €100 today. Project X pays €60 in year 1 and €60 in year 2 (IRR 13.1%). Project Y pays €20 in year 1 and €105 in year 2 (IRR 13.0%). For which costs of capital should the firm choose Y?","opts":["Never, because X has the higher IRR","For costs of capital below 12.5%","For costs of capital above 12.5%","For costs of capital below 13.0%"],"ans":1,"why":null,"steps":"The NPV profiles cross where the NPVs are equal. The difference Y − X is (0, −40, +45): 40/(1+r) = 45/(1+r)² → 1 + r = 45/40 → r = 12.5%. Below 12.5% Y has the higher NPV (at 0%: Y 25, X 20), because its cash flows come later and benefit more from a low rate. Above 12.5% X wins. Choosing by IRR (X) is wrong for mutually exclusive projects; 13.0% is Y’s own IRR, not the crossover rate.","th":["apr_ear","ev","irrrule","mutual"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_17":{"id":"aC_17","ch":"Ch 7","type":"mc","q":"According to Graham (2022), which statement about how firms make investment decisions is TRUE?","opts":["Firms typically set their hurdle rates equal to their cost of capital and adjust them often","Payback has almost disappeared in practice because of its well-known shortcomings","Large firms mostly use NPV and IRR, while payback remains popular, especially at small firms","Most firms accept every project whose expected return exceeds their stated hurdle rate"],"ans":2,"why":null,"steps":"Graham’s CFO surveys: NPV and IRR are the most popular methods at large firms, but payback is still widely used, and at small firms it is more prevalent than NPV or IRR. Hurdle rates are set well above the cost of capital (a buffer of about 6% on average) and are very sticky. Only about 20% of firms say they accept all projects that beat the hurdle rate.","th":["apr_ear","ev","graham","irrrule"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_18":{"id":"aC_18","ch":"Ch 7","type":"mc","q":"Which projects should it undertake?","opts":["K and L","L, M and N","K and M","K and N"],"ans":1,"why":null,"steps":"With a non-money constraint, the profitability index is NPV per unit of the <b>scarce resource<\/b>: L 0.30, N 0.22, K 0.20, M 0.20 per m². Take L (300 m²) and N (300 m²), then K (600 m²) no longer fits but M (400 m²) does: 1,000 m², NPV 90 + 66 + 80 = 236. K and L (210) picks the largest NPV first; K and M (200) and K and N (186) use space less efficiently.","th":["npvrule"],"case":"aCc18","keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_19":{"id":"aC_19","ch":"Ch 8","type":"mc","q":"A 3-year project requires a machine of €240,000 today, depreciated straight-line to zero over 3 years. At the end of year 3 the machine is sold for €30,000. Revenues are €300,000 and costs €150,000 per year (excluding depreciation). The project needs €20,000 of net working capital today, which is fully recovered at the end of year 3. The tax rate is 25% and the cost of capital is 10%. What is the project’s NPV closest to (in €000)?","opts":["106.4","107.1","101.4","86.4"],"ans":2,"why":null,"steps":"Depreciation = 80. EBIT = 300 − 150 − 80 = 70, UNI = 52.5. FCF years 1–2 = 52.5 + 80 = 132.5. Year 3 also includes the after-tax sale (30 × 0.75 = 22.5, book value is 0) and the NWC recovery (+20): 175. Year 0: −240 − 20 = −260. NPV = −260 + 132.5/1.1 + 132.5/1.1² + 175/1.1³ = 101.4. 106.4 ignores NWC entirely (its timing still costs value). 107.1 forgets the tax on the sale. 86.4 invests in NWC but never recovers it.","th":["apr_ear","ev","fcf","npvrule"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"aC_20":{"id":"aC_20","ch":"Ch 8","type":"mc","q":"A firm evaluates a new product line. Which of the following should NOT be included in the project’s incremental free cash flows?","opts":["Rent the firm forgoes on a building it owns and would use for the project","Lost sales of an existing product that customers will replace with the new one","The increase in inventory needed to support the new product line","A €50,000 consulting study on the product, paid last year"],"ans":3,"why":null,"steps":"The consulting study is a <b>sunk cost<\/b>: it has been paid whatever the firm decides now, so it is not incremental. Forgone rent is an opportunity cost, lost sales of existing products (cannibalization) are an incremental loss, and extra inventory is an increase in NWC: all three must be included.","th":["apr_ear","ev","fcf"],"case":null,"keep":false,"model":null,"src":"aiC","msrc":"ai","pts":1,"srcl":"AI realistic exam C"},"k1":{"id":"k1","ch":"Ch 1","type":"mc","q":"Which of the following firm types suffer most from managerial agency problems?","opts":["Sole Proprietorships","Partnerships","Limited Liability Companies","Corporations"],"ans":3,"why":["Owner = manager.","Partners manage.","Shares not widely held.","Correct: widely held listed shares, ownership separated from control."],"steps":"Agency problems need separation of ownership and control; strongest with widely held shares.","th":["agency"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k2":{"id":"k2","ch":"Ch 2","type":"mc","q":"Analysts often classify firms with high market-to-book ratios as:","opts":["Growth stocks","Value stocks","Investment stocks","None of these"],"ans":0,"why":["Correct.","Low MTB.","Not a term used.","A is right."],"steps":"High MTB: market expects a lot of future growth beyond book value.","th":["bookmarket"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k3":{"id":"k3","ch":"Ch 2","type":"mc","q":"A restaurant chain has gone public and has raised $120 million by issuing shares at $20 per share. This year they are expected to have a net income of $45 million. What is the EPS of this firm?","opts":["$0.44","$7.5","$9","Not enough information to solve this question"],"ans":1,"why":["Inverts the ratio.","Correct.","No valid route.","The share count follows from the issue."],"steps":"Shares = 120m/20 = 6m; EPS = 45/6 = <b>$7.50<\/b>.","th":["ratios"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k4":{"id":"k4","ch":"Ch 2","type":"mc","q":"All of the following are interest-bearing debt except","opts":["Notes payable","Accounts payable","Long term-debt (duration: > 1 year)","Current portion of long-term debt"],"ans":1,"why":["Written promise with interest.","Correct: trade credit, no interest.","Interest-bearing.","Interest-bearing."],"steps":"Accounts payable = unpaid supplier bills, no interest → excluded from EV debt.","th":["ev"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k5":{"id":"k5","ch":"Ch 3","type":"mc","q":"An office building is considered to be more liquid investment than a share of a publicly traded company.","opts":["True","False"],"ans":1,"why":null,"steps":"The other way around: listed shares sell faster at a fair price.","th":["bidask"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k6":{"id":"k6","ch":"Ch 3","type":"mc","q":"Market makers provide liquidity by buying stock at the bid price and selling stock at the ask price.","opts":["True","False"],"ans":0,"why":null,"steps":"They earn the spread.","th":["bidask"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k7":{"id":"k7","ch":"Ch 3","type":"mc","q":"Selling a security that you do not own but borrow from another individual is called:","opts":["The law of one price","Arbitrage","Short sale","Long sale"],"ans":2,"why":["A pricing principle.","A strategy, not this transaction.","Correct.","Buying and holding."],"steps":"Definition of a short sale.","th":["arbitrage"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k8":{"id":"k8","ch":"Ch 3","type":"mc","q":"A true arbitrage opportunity means you can earn a positive return with:","opts":["zero initial investment and zero risk.","positive initial investment and zero risk.","zero initial investment and some risk.","positive initial investment and low risk."],"ans":0,"why":["Correct.","Needs investment: that is just a risk-free investment.","Risky.","Risky and costly."],"steps":"Arbitrage: no risk, no net investment.","th":["arbitrage"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k9":{"id":"k9","ch":"Ch 3","type":"mc","q":"What is the no arbitrage price today of $100 received in 1 year if the discount rate is 3%?","opts":["More information is needed.","94.26","97.09","103"],"ans":2,"why":["Rate and cash flow suffice.","Wrong rate.","Correct: 100/1.03.","That is FV."],"steps":"PV = 100/1.03 = 97.09.","th":["valuation"],"case":null,"keep":false,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k10":{"id":"k10","ch":"Ch 4","type":"mc","q":"21 years ago an amount X was put into an account with 8% per year. Current value is $5033,83. What is X?","opts":["$600","$800","$1000","$1200"],"ans":2,"why":["Too low.","Too low.","Correct: 5,033.83/1.08²¹.","Too high."],"steps":"X = 5,033.83/1.08<sup>21<\/sup> = <b>$1,000<\/b>.","th":["timetravel"],"case":null,"keep":false,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k11":{"id":"k11","ch":"Ch 4","type":"mc","q":"A constant annuity is defined as a series of fixed cash flows at fixed intervals, lasting for a fixed number of periods.","opts":["True","False"],"ans":0,"why":null,"steps":"Definition.","th":["annuity"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k12":{"id":"k12","ch":"Ch 4","type":"mc","q":"An increase in the growth rate of a perpetuity increases the present value of a perpetuity.","opts":["True","False"],"ans":0,"why":null,"steps":"PV = C/(r − g): higher g → smaller denominator → higher PV.","th":["perpetuity"],"case":null,"keep":true,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k13":{"id":"k13","ch":"Ch 4","type":"mc","q":"Suppose you want to buy an Aston Martin DB9 in 5 years. The price will be €275,000. You deposit a fixed amount each year, including the year you buy the car, first deposit at the end of this year; annual interest rate 4% (APR). How much is the yearly deposit?","opts":["€50,772","€55,000","€56,250","€61,772"],"ans":0,"why":["Correct.","275,000/5: ignores interest.","No valid route.","PV-annuity (loan) formula on 275,000."],"steps":"C = 275,000 × 0.04/(1.04⁵ − 1) = <b>€50,772<\/b> (or PV 226,029 = C × annuity(4%, 5)).","th":["fv_annuity"],"case":null,"keep":false,"model":null,"src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k14":{"id":"k14","ch":"Ch 5","type":"mc","q":"A car loan requires monthly payments, and has an EAR of 6,43%. What is the APR for this loan?","opts":["6%","6.25%","6.50%","6.62%"],"ans":1,"why":["(1.005)¹² − 1 = 6.17%.","Correct: (1 + 0.0625/12)¹² − 1 = 6.43%.","Gives 6.70%.","Higher than the EAR: impossible."],"steps":"Solve 1.0643 = (1 + APR/12)<sup>12<\/sup> → APR = 12 × (1.0643<sup>1/12<\/sup> − 1) = <b>6.25%<\/b>.","th":["apr_ear"],"case":null,"keep":false,"model":null,"note":"The source lists no answer letter; answer computed from the data.","src":"kah","msrc":"student","pts":1,"srcl":"Kahoot practice questions (Studocu upload, student source)"},"k15":{"id":"k15","ch":"Ch 5","type":"mc","q":"Assume the interest rate equals 10% per year. What is the effective total return over a period of three years closest to?","opts":["$30","$30.10","30%","33.1%"],"ans":3,"why":["A return is a %, not $.","Not a %.","Ignores c
