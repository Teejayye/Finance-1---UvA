{ch:"Ch 4",t:"mc",q:"A risk-free project with an NPV of 0 requires an investment of €1.450 today and will generate a one time cash flow of €1.600 in two years.<br>What is the risk-free annual interest rate closest to?",o:["10%","5%","8%","4%"],a:1,e:"NPV = 0 means 1,450 = 1,600/(1+r)², so (1+r)² = 1,600/1,450 = 1.1034 and r = √1.1034 − 1 = 5.0%. 10% is the total 2-year return (1,600/1,450 − 1 = 10.3%) without converting it to an annual rate. Halving that without compounding also lands near 5%, but the correct method is the square root."},
{ch:"Ch 7",t:"mc",q:"Consider a project with the following cash flows in $:<div class='scroll'><table><tr><th>Year</th><th>Cash flow</th></tr><tr><td>0</td><td>−17.870</td></tr><tr><td>1</td><td>6.040</td></tr><tr><td>2</td><td>7.025</td></tr><tr><td>3</td><td>4.095</td></tr><tr><td>4</td><td>3.470</td></tr><tr><td>5</td><td>2.749</td></tr></table></div>The appropriate discount rate for this project is 10%. Management applies the payback period rule when deciding if this project is attractive and sets a payback cutoff of 3 years. Should the project be accepted?<br><i>(Only the first two options are visible in the screenshot.)</i>",o:["No, because it has a payback period of more than 3 years.","No, because it has a negative NPV."],a:0,e:"Cumulative cash flows: −17,870 + 6,040 + 7,025 + 4,095 = −710 after 3 years, so the investment is not yet recovered: payback = 3 + 710/3,470 = 3.2 years &gt; 3, so the payback rule rejects. The question asks what management decides <b>under the payback rule</b>. The second option is wrong: at 10% the NPV is +$580, so NPV would actually accept. This is exactly the weakness of payback: it ignores the cash flows after the cutoff."},
{ch:"Ch 8",t:"mc",q:"Below is the financial information related to a new project. Determine which information is relevant and use that information to calculate the project’s unlevered net income.<ul><li>Sales revenues equal $20 million</li><li>Cost of goods sold is equal to 55% of sales</li><li>Selling, general, and administrative expenses is equal to 17% of sales</li><li>Depreciation expense is $215,000</li><li>Interest expense is $100,000</li><li>$15 million of cash was raised from issuing new shares of company stock</li><li>The marginal corporate profit tax rate is 30%.</li></ul>What is unlevered net income for this project closest to?<br><i>(The fourth option is hidden in the screenshot; it is filled in with the calculated answer.)</i>",o:["$4,200,300","$3,699,500","$3,927,300","$3,769,500"],a:3,e:"EBIT = 20,000,000 × (1 − 0.55 − 0.17) − 215,000 = 5,600,000 − 215,000 = 5,385,000. Unlevered net income = 5,385,000 × (1 − 0.30) = $3,769,500. Interest is left out (unlevered: financing is judged separately) and the share issue is a financing flow, not income. $3,699,500 deducts the interest ((5,385,000 − 100,000) × 0.7)."},
{ch:"Ch 5",t:"mc",q:"The interest rate of a loan is quoted as 12% APR with quarterly compounding. A project with the same risk as the loan has monthly cash flows. What is the correct discount rate per month for the project closest to?",o:["1%","0.74%","3%","12.6%"],a:0,e:"Quarterly rate = 12%/4 = 3%. One quarter is three months, so the monthly rate solves (1 + r)³ = 1.03: r = 1.03^(1/3) − 1 = 0.99% ≈ 1%. 3% is the quarterly rate. 12.6% is the EAR (1.03⁴ − 1 = 12.55%), which is an annual rate. Match the rate to the period of the cash flows."},
{ch:"Ch 1",t:"mc",q:"Jan repairs bikes. He started a bike shop as a sole proprietorship 10 years ago. This year, his brother Cees joined his business and they formed a partnership. They planned to expand into nearby towns but unfortunately, things did not go well for the partnership. According to the bank, the partnership now owes €10.000.<br>Who is or are personally liable for this debt?",o:["Both Jan and Cees, because they are partners.","Jan, because he founded the business.","Cees, because he is the latest owner.","Neither Jan nor Cees, because they are protected by limited liability."],a:0,e:"In a (general) partnership all partners are personally liable for the firm’s debts, regardless of who founded the business or who joined last. Limited liability belongs to corporations (and limited partners), not to a general partnership."},
{ch:"Ch 1",t:"mc",q:"Consider the following two statements:<br>1. Maximizing shareholder value is the same as maximizing shareholder welfare.<br>2. Maximizing shareholder value is not the same as maximizing profit.",o:["Statement 1 is true, statement 2 is false","Statement 2 is true, statement 1 is false","Both statements are false","Both statements are true"],a:1,e:"Statement 1 is false: Hart &amp; Zingales argue that shareholders also care about non-financial (social) goals, so shareholder <b>welfare</b> is broader than shareholder <b>value</b> (the market value of the shares). Statement 2 is true: value is the present value of all future cash flows, taking timing and risk into account, while profit is an accounting figure for one period."},
{ch:"Ch 8",t:"mc",q:"Namco Corp. has provided the following estimated financial information for a proposed new investment.<div class=\"scroll\"><table><tr><td>Sales revenue</td><td>€ 6.000.000</td></tr><tr><td>Cost of goods sold</td><td>€ 2.750.000</td></tr><tr><td>Selling, general, and administrative expenses</td><td>€ 272.000</td></tr><tr><td>Depreciation expense</td><td>€ 60.000</td></tr><tr><td>Bank loan</td><td>€ 1.000.000</td></tr><tr><td>Interest expense</td><td>€ 120.000</td></tr><tr><td>Average corporate tax rate</td><td>17%</td></tr><tr><td>Marginal corporate tax rate</td><td>21%</td></tr></table></div>What is this investment’s unlevered net income closest to?<br><i>(Only the correct option was visible in the screenshot; the three other options are rebuilt from typical mistakes.)</i>",o:["€2.305.220","€2.421.940","€2.210.420","€2.352.620"],a:0,e:"Unlevered net income = (Revenues − Costs − Depreciation) × (1 − marginal tax rate). EBIT = 6,000,000 − 2,750,000 − 272,000 − 60,000 = 2,918,000. × (1 − 0.21) = €2,305,220. Interest and the bank loan are ignored (unlevered: financing is judged separately). €2,421,940 uses the average rate (2,918,000 × 0.83): the marginal rate applies to extra income. €2,210,420 deducts interest ((2,918,000 − 120,000) × 0.79). €2,352,620 forgets to deduct depreciation."},
{ch:"Ch 7",t:"mc",q:"A firm facing a capital constraint is considering the project with cash flows as indicated in the table below (amounts in $).<div class=\"scroll\"><table><tr><th>Year</th><th>Cash flow</th></tr><tr><td>0</td><td>−10.000</td></tr><tr><td>1</td><td>6.700</td></tr><tr><td>2</td><td>7.250</td></tr><tr><td>3</td><td>8.000</td></tr><tr><td>4</td><td>7.375</td></tr></table></div>The appropriate discount rate for this project is 10%. What is the profitability index for this project closest to?<br><i>(A fourth option is cut off in the screenshot.)</i>",o:["0,313","2,313","1,313"],a:2,e:"Profitability index = NPV / resources consumed (here the $10,000 investment, the constrained resource). PV of the inflows at 10% = 6,700/1.1 + 7,250/1.1² + 8,000/1.1³ + 7,375/1.1⁴ = 6,091 + 5,992 + 6,011 + 5,037 = 23,130. NPV = 23,130 − 10,000 = 13,130, so PI = 13,130/10,000 = 1.313. 2.313 is PV of inflows / investment: that forgets to subtract the investment from the numerator."},
{ch:"Ch 6",t:"mc",q:"Consider the following 20-year bond with annual coupon payments.<div class=\"scroll\"><table><tr><th></th><th>Face Value</th><th>Coupon Rate</th><th>Yield to Maturity</th></tr><tr><td>A</td><td>$100</td><td>10%</td><td>5%</td></tr></table></div>What is the current price of bond A closest to?",o:["$100","$125","$80","$160"],a:3,e:"Price = coupons (annuity) + face value discounted at the YTM. Coupon = 10% × 100 = $10. PV of coupons = 10 × [1 − 1.05⁻²⁰]/0.05 = 124.62. PV of face value = 100/1.05²⁰ = 37.69. Price = 162.31, closest to $160. Because the coupon rate (10%) is above the yield (5%), the price must exceed par: that rules out $100 (par, only if yield = coupon) and $80. $125 is just the PV of the coupons without the face value."},
{ch:"Ch 8",t:"mc",q:"Coffee &amp; Co. has provided the following estimates for a new project under consideration. The project will require an initial investment in project assets of €450.000. The assets will be depreciated to a book value of zero over the three-year life of the project using the straight-line method. The project will produce revenues in the first year of €650.000, in the second year of €725.000, and in the third and final year of €725.000. Cost of goods sold is equal to 30% of sales. The applicable corporate tax rate is 25%. An investment in net working capital of €30.000 will be required at the end of the first year of the project and will increase by 20% for the second year. Net working capital will then remain stable and will be fully recovered (i.e. go down to €0) in the final year of the project.<br>What is the free cash flow for the second year of the project closest to?",o:["€412.125","€382.125","€348.750","−€101.250"],a:0,e:"Year 2: revenues 725,000; COGS 30% = 217,500; depreciation = 450,000/3 = 150,000. EBIT = 725,000 − 217,500 − 150,000 = 357,500. Unlevered net income = 357,500 × 0.75 = 268,125. NWC is 30,000 after year 1 and grows 20% to 36,000, so ΔNWC in year 2 is only +6,000. FCF = UNI + depreciation − CapEx − ΔNWC = 268,125 + 150,000 − 0 − 6,000 = €412,125. €382,125 subtracts the whole NWC level (36,000) instead of the change. The investment of 450,000 is spent at t = 0, not in year 2."},
{ch:"Ch 3",t:"mc",q:"The following information regarding four risk-free securities is available (all numbers in $):<div class=\"scroll\"><table><tr><th>Security</th><th>Price</th><th>Cash flow time 1</th><th>Cash flow time 2</th><th>Cash flow time 3</th></tr><tr><td>A</td><td>90</td><td>100</td><td>0</td><td>0</td></tr><tr><td>B</td><td>160</td><td>0</td><td>200</td><td>0</td></tr><tr><td>C</td><td>70</td><td>0</td><td>0</td><td>100</td></tr><tr><td>D</td><td>510</td><td>200</td><td>300</td><td>100</td></tr></table></div>Do these securities and prices indicate an arbitrage opportunity?",o:["No as all prices should reflect the present value of their cash flows.","No as the price of security D is equal to its no-arbitrage price.","Yes as the no-arbitrage price of security D is $400 which is lower than $510","Yes as the no-arbitrage price of security D is $490 which is higher than $510"],a:3,e:"Replicate D (200, 300, 100) with A, B and C: 2 × A gives 200 at time 1 and costs 180; 1.5 × B gives 300 at time 2 and costs 240; 1 × C gives 100 at time 3 and costs 70. The portfolio costs 180 + 240 + 70 = $490 and pays exactly the same as D. By the law of one price D should cost $490 but trades at $510, so D is overpriced: sell D, buy the portfolio, and lock in a risk-free $20 today. (The printed wording ‘$490 which is higher than $510’ is a typo in the exam, but this is the option the key marks correct.) The $400 in option C is a miscalculation, and A and B are wrong because the prices do differ from the replicating cost."},
{ch:"Ch 5",t:"mc",q:"A car dealer offers you a car loan with a 4.5% APR with monthly compounding for 5 years. The price of the car today is $25,000. You will pay a fixed amount $X at the end of each month for this car loan. What is X closest to?",o:["$475","$465","$435","$400"],a:1,e:"A loan with fixed monthly payments is an annuity: PV = X × [1 − (1+r)⁻ⁿ]/r. Monthly rate r = 4.5%/12 = 0.375%, n = 5 × 12 = 60. So X = 25,000 × 0.00375 / (1 − 1.00375⁻⁶⁰) = $466.08, closest to $465. $400 is roughly 25,000/60 = 417 (principal only, no interest). Using the APR for the whole year or the wrong number of periods gives the other values."},
{ch:"Ch 7",t:"mc",q:"A project requires an initial investment of €450.000. The project will produce yearly free cash flows lasting forever where the first cash flow is €55.000 and which occurs at the end of the first year. After this the yearly cash flow will decline at 1% per year. The applicable discount rate is 6%. Should this project be accepted according to the IRR-rule?",o:["Yes as the IRR is around 11% which is larger than the cost of capital.","There is no optimal decision as both IRR and the cost of capital are positive.","No as the IRR is around 8% which is smaller than the cost of capital.","Yes as the IRR is around 13% which is larger than the cost of capital."],a:0,e:"A growing perpetuity gives 0 = −450,000 + 55,000/(IRR − g), so IRR = 55,000/450,000 + g = 12.2% + (−1%) = 11.2%. The cash flow <b>declines</b>, so g is negative. 11% &gt; 6%, so accept. The 13% option comes from adding g instead of subtracting it (a sign slip). Positive rates on both sides say nothing about the decision; the rule is IRR &gt; cost of capital. 8% would need a decline of about 4% a year."},
{ch:"Ch 7",t:"mc",q:"Management is evaluating two mutually exclusive projects: project Zeus en project Apollo. For both projects a required rate of return of 12% applies. Project Zeus has an estimated NPV of €150.000 and an IRR of 23%, while Project Apollo has an estimated NPV of €200.000 and an IRR of 19%. Which of the following statements is TRUE:",o:["Management should choose the project with the highest IRR when evaluating mutually exclusive projects which in this case is project Zeus.","Management should calculate and apply the payback period rule in order to reach a final decision with confidence.","Management cannot choose either project with confidence, given the conflicting indications of the NPV and IRR decision rules.","Management should choose the project with the highest NPV when evaluating mutually exclusive projects which in this case is Apollo."],a:3,e:"For mutually exclusive projects choose the highest NPV: Apollo (€200,000) beats Zeus (€150,000). NPV measures the value created in euros; IRR is a percentage that ignores scale and timing, so a higher IRR (Zeus 23%) can go with a lower value creation. Both IRRs exceed 12%, so both projects are worth doing on their own, but only one can be chosen. The ‘conflict’ is not a real problem because NPV is the reliable rule. Payback ignores discounting and later cash flows, so it would not add confidence."},
{ch:"Ch 8",t:"mc",q:"Which of the following statements is FALSE?",o:["Opportunity costs reflects the value a resource could have provided in its best alternative use.","Sunk costs are unrecoverable costs for which the firm is already liable.","Opportunity costs are costs that have been or will be paid, regardless of whether or not an investment is undertaken.","Overhead costs are costs associated with activities that are not directly attributable to a single business activity."],a:2,e:"The third statement is false: costs that have been or will be paid regardless of whether the investment is undertaken are SUNK costs, not opportunity costs. An opportunity cost is the value a resource could have produced in its best alternative use (e.g. rent forgone on an office the project uses), and it is incremental. The other three statements are correct definitions: sunk costs are unrecoverable and already owed, and overhead is not tied to one single activity (it only counts if the project changes it)."}]},
{id:"m2019",title:"Midterm 2019",kind:"past",note:"From the screenshots of the 2019 paper: 9 complete questions in the original wording and order. One more question could not be included because its text is cut off (only its options €10, not enough information, €20 and €0 are visible).",q:[
{ch:"Ch 7",t:"mc",q:"Which of the following statements is <b>FALSE</b>?",o:["The internal rate of return (IRR) investment rule is based upon the notion that if the return on other alternatives with equivalent risk and maturity is greater than the return on the investment opportunity, you should undertake the investment opportunity.","It is possible that an IRR does not exist for an investment opportunity.","It is possible that there is no discount rate that will set the NPV equal to zero.","If the payback period is less than a pre-specified length of time, you accept the project."],a:0,e:"The first statement turns the IRR rule upside down. The rule says: take the investment if its IRR is <b>higher</b> than the return on alternatives with equivalent risk and maturity (the cost of capital). If the alternatives return more, you should <b>not</b> undertake it. The other three are true: an IRR may not exist (e.g. all cash flows positive), which is the same as saying no discount rate sets the NPV to zero, and the payback rule accepts when payback is shorter than the cutoff."},
{ch:"Ch 8",t:"mc",q:"Renewable Industries is considering a new capital budgeting project that will last for three years. The firm plans on using a cost of capital of 12% to evaluate this project. The project requires an initial investment of $90,000. Based on extensive research, it has estimated the following incremental earnings for this project (in $):<div class='scroll'><table><tr><th>Year</th><th>0</th><th>1</th><th>2</th><th>3</th></tr><tr><td>Sales (Revenues)</td><td></td><td>100,000</td><td>100,000</td><td>100,000</td></tr><tr><td>− Cost of Goods Sold (50% of Sales)</td><td></td><td>50,000</td><td>50,000</td><td>50,000</td></tr><tr><td>− Depreciation</td><td></td><td>30,000</td><td>30,000</td><td>30,000</td></tr><tr><td>= EBIT</td><td></td><td>20,000</td><td>20,000</td><td>20,000</td></tr><tr><td>− Taxes (35%)</td><td></td><td>7,000</td><td>7,000</td><td>7,000</td></tr><tr><td>= unlevered net income</td><td></td><td>13,000</td><td>13,000</td><td>13,000</td></tr></table></div>The level of Net Working Capital (NWC) one year from now (at t=1) is $5,000, at t=2 the level of NWC is $10,000 and at t=3, the NWC is $0.<br>What is the NPV of the Renewable Industries’ project closest to?",o:["−$8,448","$14,870","$7,793","$11,946"],a:3,e:"FCF = UNI + depreciation − CapEx − ΔNWC. Use the <b>changes</b> in NWC: +5,000 at t=1, +5,000 at t=2 and −10,000 at t=3 (recovered). FCF: t0 = −90,000; t1 = 13,000 + 30,000 − 5,000 = 38,000; t2 = 43,000 − 5,000 = 38,000; t3 = 43,000 + 10,000 = 53,000. NPV = −90,000 + 38,000/1.12 + 38,000/1.12² + 53,000/1.12³ = −90,000 + 33,929 + 30,293 + 37,724 = $11,946. Typical mistakes: subtracting the NWC <b>levels</b> instead of the changes, or forgetting that NWC is recovered at the end. (The third option is printed as ‘$7,7937’ in the original.)"},
{ch:"Ch 6",t:"mc",q:"JK Inc. has a bond outstanding with a face value of $1,000 that reaches maturity in 10 years. The bond certificate indicates that the coupon rate for this bond is 3% and that the coupon payments are to be made quarterly. Suppose the yield of the JK Inc. bond is 2%. What can be stated about the price of the bond?",o:["There is not enough information to say anything about the price of the bond.","The bond trades at par.","The bond trades at a premium.","The bond trades at a discount."],a:2,e:"Compare the coupon rate with the yield: the coupon rate (3%) is above the yield (2%), so the bond pays more than the market requires and its price is above face value: a premium. No calculation is needed; the quarterly payments do not change this (both rates are quoted the same way). At par the coupon rate would equal the yield; at a discount the coupon rate would be below it."},
{ch:"Ch 1",t:"mc",q:"Consider the following two statements:<br>1) A corporation is a legal entity, separate from its owners.<br>2) If you own shares of a corporation, you are not personally liable for the firm’s debt in case of a default.",o:["Both statements are correct.","Only statement 2 is correct.","Only statement 1 is correct.","Neither statement is correct."],a:0,e:"Both are core features of a corporation. It is a separate legal entity (it can sign contracts, own assets and be sued on its own), and its owners have limited liability: in a default creditors can claim the firm’s assets, not the shareholders’ personal assets. The most a shareholder can lose is the investment."},
{ch:"Ch 7",t:"mc",q:"You are considering investing in a start up project at a cost of $200,000. You expect the project to return $600,000 to you in eight years. Given the risk of this project, your cost of capital is 20%.<br>What is the IRR for this project closest to?",o:["18.95%","18.11%","15.60%","14.72%"],a:3,e:"IRR solves 200,000 = 600,000/(1+IRR)⁸, so IRR = 3^(1/8) − 1 = 14.72%. The cost of capital (20%) is not needed to find the IRR; it only tells you that this project should be rejected (14.72% &lt; 20%, NPV &lt; 0). Dividing the 200% total gain by 8 years gives 25%, which ignores compounding."},
{ch:"Ch 5",t:"mc",q:"Suppose the term structure of interest rates is shown below:<div class='scroll'><table><tr><th>Term</th><th>1 year</th><th>2 years</th><th>3 years</th><th>5 years</th><th>10 years</th><th>20 years</th></tr><tr><td>Rate (EAR%)</td><td>2.00%</td><td>1.80%</td><td>1.60%</td><td>1.50%</td><td>1.25%</td><td>1.15%</td></tr></table></div>What is the NPV of an initial investment of $600 (t=0) that pays $455 after one year, $599 after three years and $850 after five years?",o:["944.55","857.96","1206.24","1320.01"],a:2,e:"Discount each cash flow at the rate for its own maturity: −600 + 455/1.02 + 599/1.016³ + 850/1.015⁵ = −600 + 446.08 + 571.14 + 789.02 = $1,206.24. Using a single rate for everything, or forgetting the −$600 investment (that gives a PV of about 1,806), leads to the wrong options."},
{ch:"Ch 5",t:"mc",q:"You are considering purchasing a new home for which you need to borrow $525,000. A mortgage company offers you a 30-year fixed rate annuity mortgage with quarterly payments at a 1.5% APR with quarterly compounding. What is your quarterly mortgage payment closest to if you borrow from this mortgage company?",o:["$7,152","$5,986","$6,840","$5,441"],a:3,e:"Quarterly rate = 1.5%/4 = 0.375%; N = 30 × 4 = 120. Payment = 525,000 × 0.00375/(1 − 1.00375⁻¹²⁰) = $5,441. Using the APR as if it were the quarterly rate, or the wrong number of periods, gives the other values."},
{ch:"Ch 5",t:"mc",q:"Which of the following statements is <b>FALSE</b>?",o:["The yield curve is a potential leading indicator of future economic growth.","The relationship between the investment term and the interest rate is called the term structure of interest rates.","The shape of the yield curve will be influenced by interest rate expectations.","The yield to maturity of risk-free short-term securities is always lower than the yields of risk-free long-term securities."],a:3,e:"‘Always’ is the giveaway: the yield curve can be flat or <b>inverted</b>, in which case short-term yields are higher than long-term yields. The other three are true: an inverted curve has historically preceded recessions (leading indicator), the term structure is the relation between term and rate, and expected future rates shape the curve."},
{ch:"Ch 2",t:"mc",q:"The company ‘Luther’ just released its financial statement for the year 2019 in book values. Consider the following balance sheet:<div class='scroll'><table><tr><th colspan='3'>Luther Corporation, Consolidated Balance Sheet, December 31, 2019 and 2018 (in $ millions)</th><th></th><th></th><th></th></tr><tr><th>Assets</th><th>2019</th><th>2018</th><th>Liabilities and Stockholders’ Equity</th><th>2019</th><th>2018</th></tr><tr><td><i>Current Assets</i></td><td></td><td></td><td><i>Current Liabilities</i></td><td></td><td></td></tr><tr><td>Cash</td><td>63.6</td><td>58.5</td><td>Accounts payable</td><td>87.6</td><td>73.5</td></tr><tr><td>Accounts receivable</td><td>55.5</td><td>39.6</td><td>Notes payable/short-term debt</td><td>10.5</td><td>9.6</td></tr><tr><td>Inventories</td><td>45.9</td><td>42.9</td><td>Current maturities of long-term debt</td><td>39.9</td><td>36.9</td></tr><tr><td>Other current assets</td><td>6.0</td><td>3.0</td><td>Other current liabilities</td><td>6.0</td><td>12.0</td></tr><tr><td><b>Total current assets</b></td><td><b>171.0</b></td><td><b>144.0</b></td><td><b>Total current liabilities</b></td><td><b>144.0</b></td><td><b>132.0</b></td></tr><tr><td><i>Long-Term Assets</i></td><td></td><td></td><td><i>Long-Term Liabilities</i></td><td></td><td></td></tr><tr><td>Land</td><td>66.6</td><td>62.1</td><td>Long-term debt</td><td>239.7</td><td>168.9</td></tr><tr><td>Buildings</td><td>109.5</td><td>91.5</td><td>Capital lease obligations</td><td>—</td><td>—</td></tr><tr><td>Equipment</td><td>119.1</td><td>99.6</td><td>Total Debt</td><td>239.7</td><td>168.9</td></tr><tr><td>Less accumulated depreciation</td><td>(56.1)</td><td>(52.5)</td><td>Deferred taxes</td><td>22.8</td><td>22.2</td></tr><tr><td>Net property, plant, and equipment</td><td>239.1</td><td>200.7</td><td>Other long-term liabilities</td><td>—</td><td>—</td></tr><tr><td>Goodwill</td><td>60.0</td><td>—</td><td>Total long-term liabilities</td><td>262.5</td><td>191.1</td></tr><tr><td>Other long-term assets</td><td>63.0</td><td>42.0</td><td>Total liabilities</td><td>406.5</td><td>323.1</td></tr><tr><td>Total long-term assets</td><td>362.1</td><td>242.7</td><td>Stockholders’ Equity</td><td>126.6</td><td>63.6</td></tr><tr><td><b>Total Assets</b></td><td><b>533.1</b></td><td><b>386.7</b></td><td></td><td></td><td></td></tr></table></div>What is Luther’s net working capital in 2019?<br><i>(The end of the question is hidden in the screenshot; the options show it asks for the 2019 NWC.)</i>",o:["$12 million","$63.6 million","$39 million","$27 million"],a:3,e:"Net working capital = current assets − current liabilities = 171.0 − 144.0 = $27 million in 2019. $12 million is the 2018 NWC (144.0 − 132.0): read the right column. $63.6 million is 2019 cash (or 2018 equity), and $39 million is 171.0 − 132.0, which mixes the two years."}]},
{id:"m2018",title:"Midterm 2018",kind:"past",note:"The complete 2018 paper (version code 2): 18 multiple choice questions in the original order and wording, with the official answer key. In the real exam this paper had a correction for guessing.",q:[
{ch:"Ch 3",t:"mc",q:"Consider the following two statements:<br>i. An arbitrage opportunity [is a situation in which it is possible to make a profit without taking any risk or making any investment].<br>ii. In investment decisions it does not matter in terms of which project is preferred if we compare projects according to their future value at t=5 or at their present value.<br><i>(The words in brackets are hidden in the screenshot and filled in from the book’s definition on p. 108, which the answer key refers to.)</i>",o:["Only i is correct","Only ii is correct","Both are correct","Both are false"],a:2,e:"Both are true (answer key: BDM p. 108 and pp. 97–102). (i) is the book’s definition of an arbitrage opportunity. (ii) Comparing at t = 5 or at t = 0 gives the same ranking, because every value is multiplied by the same factor (1 + r)⁵: the rules of time travel let you compare at any single point in time."},
{ch:"Ch 3",t:"mc",q:"Your mother wants to buy a new car which is $150,000. The dealer offered her a deal, she can pay 50,000 today, 50,000 next year and in two years also 50,000. Suppose the current risk-free interest rate is 5% per year.<br>The amount of money that your mother will save on the promotion deal, expressed in a money amount today, is closest to:",o:["$7,029.48","$142,970.52","$145,238.10","$4,761.91"],a:0,e:"PV of the deal = 50,000 + 50,000/1.05 + 50,000/1.05² = $142,970.52. Paying $150,000 today instead, she saves 150,000 − 142,970.52 = $7,029.48. $142,970.52 is the PV of the deal itself, not the saving. $4,761.91 only discounts the last payment."},
{ch:"Ch 4",t:"mc",q:"Suppose you want to buy a house in 7 years. You know that the price will be equal to $300,000. You plan on opening a savings account into which you deposit a fixed amount of dollars each year, including the year you buy the house. How much is the yearly deposit into the bank if the first deposit is at the end of this year and the annual interest rate is 5% (APR)?",o:["$42,857.14","$38,645.95","$17,359.12","$36,845.95"],a:3,e:"Future value of an annuity with 7 deposits: 300,000 = C × ((1.05)⁷ − 1)/0.05, so C = 0.05 × 300,000/(1.05⁷ − 1) = $36,845.95. $42,857.14 is 300,000/7 (no interest). $17,359.12 would be the payment if $300,000 were a loan today (PV annuity formula instead of FV)."},
{ch:"Ch 5",t:"mc",q:"Your company can choose 3 different investments. One with an APR of 5.75% on basis of annual compounding (Investment A), one with an APR of 6% daily compounding with 360 days (Investment B) and one with an APR of 6.125% on basis of quarterly compounding (Investment C). What are the Effective annual interest rates of these investments?",o:["Investment A: 5.75%, investment B: 6% and investment C: 6.125%","Investment A: 5.75%, investment B: 6.125% and investment C: 6.267%","Investment A: 5.75%, investment B: 6.125% and investment C: 6.183%","Investment A: 5.75%, investment B: 6.183% and investment C: 6.267%"],a:3,e:"EAR = (1 + APR/k)^k − 1. A: k = 1, so 5.75%. B: (1 + 0.06/360)³⁶⁰ − 1 = 6.183%. C: (1 + 0.06125/4)⁴ − 1 = 6.267%. The first option simply repeats the APRs, which is only right for annual compounding."},
{ch:"Ch 1",t:"mc",q:"Consider the following two statements:<br>i. In case of a bankruptcy, shareholders give up their ownership and control to the debt holders.<br>ii. Shares of public corporations are more liquid than shares of private corporations.",o:["Only i is correct","Only ii is correct","Both are correct","Both are false"],a:2,e:"Both are true. (i) In bankruptcy the debt holders take over the firm and the shareholders lose their ownership and control (BDM p. 45). (ii) Shares of public corporations trade on a stock market, so they are easy to sell; private shares do not, and an investment that is harder to sell is less liquid (BDM p. 46)."},
{ch:"Ch 3",t:"mc",q:"An exchange traded fund (ETF) is a security that represents a portfolio of individual stocks. Consider an ETF for which each share represents a portfolio of two shares of Apple Inc. (APPL), one share of Google (GOOG), and ten shares of Microsoft (MSFT). Suppose the current stock prices of each individual stock are as shown below:<div class='scroll'><table><tr><th>Stock</th><th>Price</th></tr><tr><td>APPL</td><td>$200.23</td></tr><tr><td>GOOG</td><td>$570.51</td></tr><tr><td>MSFT</td><td>$29.61</td></tr></table></div>If the ETF is currently trading for $1200. Consider the following two statements:<br><i>Statement 1:</i> On the basis of one ETF one can achieve an arbitrage profit of more than $100.<br><i>Statement 2:</i> One can exploit the arbitrage opportunity profitably by taking a short position in the ETF and a long position in the underlying securities.",o:["Statement 1 and 2 are both correct","Statement 1 is correct but statement 2 incorrect","Statement 2 is correct but statement 1 is incorrect","Both statements are incorrect"],a:3,e:"Value of the underlying shares = 2 × 200.23 + 570.51 + 10 × 29.61 = $1,267.07. The ETF costs $1,200, so it is <b>underpriced</b>: buy the ETF and short the shares, for a profit of $67.07. Statement 1 is wrong ($67.07, not more than $100) and statement 2 is wrong (it describes the opposite, losing trade)."},
{ch:"Ch 2",t:"mc",q:"<p><i>Questions 7–9 use the following consolidated balance sheet and additional information on the car producing company Tesla (TSLA).</i></p><div class='scroll'><table><tr><th>USD in million</th><th>2016-12</th><th>2017-12</th></tr><tr><td>Cash</td><td>3,393</td><td>3,368</td></tr><tr><td>Receivables</td><td>499</td><td>515</td></tr><tr><td>Inventories</td><td>2,067</td><td>2,264</td></tr><tr><td>Prepaid expenses</td><td>194</td><td>268</td></tr><tr><td>Other current assets</td><td>106</td><td>155</td></tr><tr><td><b>Total current assets</b></td><td><b>6,260</b></td><td><b>6,571</b></td></tr><tr><td>Non-current assets</td><td>16,404</td><td>22,085</td></tr><tr><td><b>Total assets</b></td><td><b>22,664</b></td><td><b>28,655</b></td></tr><tr><td>Liabilities</td><td>17,126</td><td>23,421</td></tr><tr><td>Stockholders’ equity</td><td>4,753</td><td>4,237</td></tr><tr><td><b>Total liabilities and equity</b></td><td><b>21,879</b></td><td><b>27,658</b></td></tr></table></div>In 2016-12 TSLA had 155 MLN shares outstanding at a price of 213.69. In 2017-12 TSLA had 168 MLN shares outstanding at a price of $311.35.<br><br><b>Question 7.</b> What was the change in Tesla’s Enterprise value closest to?",o:["$24.597 bln","$25.455 bln","$25.505 bln","$34.302 bln"],a:2,e:"EV = market cap + debt − cash. The answer key uses the liabilities line as debt (the balance sheet gives no separate debt figure). EV 2016 = 155 × 213.69 + 17,126 − 3,393 = 46,854.95; EV 2017 = 168 × 311.35 + 23,421 − 3,368 = 72,359.80. Change = 25,504.85 million ≈ $25.505 bln. Forgetting to subtract cash, or using only the change in market cap, gives the other values."},
{ch:"Ch 2",t:"mc",q:"<p><i>Questions 7–9 use the following consolidated balance sheet and additional information on the car producing company Tesla (TSLA).</i></p><div class='scroll'><table><tr><th>USD in million</th><th>2016-12</th><th>2017-12</th></tr><tr><td>Cash</td><td>3,393</td><td>3,368</td></tr><tr><td>Receivables</td><td>499</td><td>515</td></tr><tr><td>Inventories</td><td>2,067</td><td>2,264</td></tr><tr><td>Prepaid expenses</td><td>194</td><td>268</td></tr><tr><td>Other current assets</td><td>106</td><td>155</td></tr><tr><td><b>Total current assets</b></td><td><b>6,260</b></td><td><b>6,571</b></td></tr><tr><td>Non-current assets</td><td>16,404</td><td>22,085</td></tr><tr><td><b>Total assets</b></td><td><b>22,664</b></td><td><b>28,655</b></td></tr><tr><td>Liabilities</td><td>17,126</td><td>23,421</td></tr><tr><td>Stockholders’ equity</td><td>4,753</td><td>4,237</td></tr><tr><td><b>Total liabilities and equity</b></td><td><b>21,879</b></td><td><b>27,658</b></td></tr></table></div>In 2016-12 TSLA had 155 MLN shares outstanding at a price of 213.69. In 2017-12 TSLA had 168 MLN shares outstanding at a price of $311.35.<br><br><b>Question 8.</b> What was the change in Tesla’s market-to-book (MTB) ratio closest to?",o:["5.29","5.37","5.83","16.97"],a:1,e:"MTB = market value of equity / book value of equity. 2016: 155 × 213.69/4,753 = 6.97. 2017: 168 × 311.35/4,237 = 12.34. Change = 12.34 − 6.97 = 5.37. Watch out: both the share count and the share price change between the years, so compute each year’s market value of equity separately."},
{ch:"Ch 2",t:"mc",q:"<p><i>Questions 7–9 use the following consolidated balance sheet and additional information on the car producing company Tesla (TSLA).</i></p><div class='scroll'><table><tr><th>USD in million</th><th>2016-12</th><th>2017-12</th></tr><tr><td>Cash</td><td>3,393</td><td>3,368</td></tr><tr><td>Receivables</td><td>499</td><td>515</td></tr><tr><td>Inventories</td><td>2,067</td><td>2,264</td></tr><tr><td>Prepaid expenses</td><td>194</td><td>268</td></tr><tr><td>Other current assets</td><td>106</td><td>155</td></tr><tr><td><b>Total current assets</b></td><td><b>6,260</b></td><td><b>6,571</b></td></tr><tr><td>Non-current assets</td><td>16,404</td><td>22,085</td></tr><tr><td><b>Total assets</b></td><td><b>22,664</b></td><td><b>28,655</b></td></tr><tr><td>Liabilities</td><td>17,126</td><td>23,421</td></tr><tr><td>Stockholders’ equity</td><td>4,753</td><td>4,237</td></tr><tr><td><b>Total liabilities and equity</b></td><td><b>21,879</b></td><td><b>27,658</b></td></tr></table></div>In 2016-12 TSLA had 155 MLN shares outstanding at a price of 213.69. In 2017-12 TSLA had 168 MLN shares outstanding at a price of $311.35.<br><br><b>Question 9.</b> What can you conclude?<br>i. Since Tesla’s MTB-ratio has increased, investors think management will be able to generate more profits in the future.<br>ii. Ford’s MTB-ratio is 1.3, with respect to car producer Ford’s MTB-ratio Tesla can be characterized as a growth stock.<br><i>(The answer key for this question is not shown in the screenshot; the answer below follows the book.)</i>",o:["Only i is correct","Only ii is correct","Both are correct","Both are false"],a:2,e:"Both are consistent with the book. (i) The market value reflects expected future cash flows, while book value looks backward, so a rising MTB means investors expect more future profit relative to the assets in place. (ii) A firm with a high MTB (Tesla 12.3) compared to its industry (Ford 1.3) is called a growth stock; a low MTB means a value stock."},
{ch:"Ch 6",t:"mc",q:"A zero-coupon bond with a face value of $1100 currently trades for $900 and matures in exactly 3 years and 8 months. Then its Yield to Maturity is closest to:",o:["7.0%","5.6%","6.3%","6.9%"],a:1,e:"YTM = (Face/Price)^(1/n) − 1 with n = 3 + 8/12 = 3.6667 years: (1,100/900)^(1/3.6667) − 1 = 5.625%. Using n = 3 years gives 6.9%, and using 3.8 or 3 + 0.08 for ‘3 years and 8 months’ also gives a wrong answer: months must be converted to a fraction of a year."},
{ch:"Ch 7",t:"mc",q:"Ricky calculates the IRR for a project and finds that it is larger than the cost of capital. What can he conclude about the project?",o:["The NPV is positive","The NPV is negative","The NPV is upward sloping in the cost of capital","Not enough information to conclude any of the above"],a:3,e:"Without the cash flow pattern you cannot conclude anything. For a normal project (cost first, benefits later) IRR &gt; r means NPV &gt; 0, but if positive cash flows come before negative ones (a delayed investment) the NPV is negative when IRR &gt; r, and with multiple sign changes there can be several IRRs. So ‘NPV is positive’ is not guaranteed, and ‘upward sloping’ is also not generally true."},
{ch:"Ch 7",t:"mc",q:"Which of the following statements is FALSE?",o:["If there is a limited supply of a resource available, you should rank projects by the profitability index, selecting the project with the lowest profitability index first and working your way down the list until the resource is consumed.","Practitioners often use the profitability index to identify the optimal combination of projects when there is a limited supply of resources.","If there is a limited supply of resources available, so that you cannot undertake all possible opportunities, then simply picking the highest NPV opportunity might not lead to the best decision.","The profitability index is calculated as the NPV divided by the resources consumed by the project."],a:0,e:"You should start with the <b>highest</b> profitability index (most value per unit of the scarce resource) and work down, not the lowest. The other three statements are true."},
{ch:"Ch 6",t:"mc",q:"For the next question assume zero-coupon yields on default-free securities are as summarized in the following table:<div class='scroll'><table><tr><th>Maturity (years)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Zero-coupon YTM</td><td>4.00%</td><td>4.30%</td><td>4.50%</td><td>4.70%</td><td>4.80%</td></tr></table></div>Consider a five-year, default-free security with annual coupon payments and a face value of $1200 that is issued at par. The coupon rate of this bond is closest to:",o:["4.771%","5.771%","4.321%","4.676%"],a:0,e:"At par the price equals the face value: 1,200 = CPN × (1/1.04 + 1/1.043² + 1/1.045³ + 1/1.047⁴ + 1/1.048⁵) + 1,200/1.048⁵ = CPN × 4.380 + 949.24, so CPN = 57.25 and the coupon rate = 57.25/1,200 = 4.771%. It is slightly below the 5-year yield (4.80%) because the curve is upward sloping and the earlier coupons are discounted at lower rates."},
{ch:"Ch 7",t:"mc",q:"Which of the following statements is FALSE?",o:["The IRR investment rule states you should turn down any investment opportunity where the IRR is less than the opportunity cost of capital.","The IRR investment rule states that you should take any investment opportunity where the IRR exceeds the opportunity cost of capital.","Since the IRR rule is based upon the rate at which the NPV equals zero, like the NPV decision rule, the IRR decision rule will always identify the correct investment decisions.","There are situations in which multiple IRRs exist."],a:2,e:"The IRR rule does <b>not</b> always give the right decision: it fails for delayed investments, multiple IRRs, a non-existent IRR and when choosing between mutually exclusive projects. The other statements are true descriptions of the rule and its limits."},
{ch:"Ch 7",t:"mc",q:"The expected cash flows of project Y – except the cash flow for year 2 – are presented in Table 1. The investment outlay (at t = 0) for project Y is € 100 and will be linearly depreciated in 2 years to zero. The discount rate is 10% per year. The internal rate of return of the project is 38% per year. Ignore taxes.<div class='scroll'><table><tr><th>CF<sub>t</sub></th><th>Project Y</th></tr><tr><td>CF<sub>0</sub></td><td>−100.00</td></tr><tr><td>CF<sub>1</sub></td><td>80.00</td></tr><tr><td>CF<sub>2</sub></td><td>?</td></tr></table></div>The expected cash flow at t = 2 is closest to",o:["€ 33","€ 55","€ 80","€ 88"],a:2,e:"At the IRR the NPV is zero: −100 + 80/1.38 + X/1.38² = 0, so X = (100 − 57.97) × 1.38² = €80.04. The depreciation and the 10% discount rate are not needed: the IRR alone pins down the missing cash flow."},
{ch:"Ch 6",t:"mc",q:"Which of the following statements is <b>FALSE</b>:",o:["In the presence of credit risk, the yield to maturity equals the expected rate of return of a bond.","The yield to maturity of a bond can be different to the coupon interest rate of that bond.","A bond with a higher duration is more sensitive to interest rate changes.","A bond trades at par if the price of the bond is equal to the face value of the bond."],a:0,e:"With credit risk the YTM is based on the <b>promised</b> cash flows, so it is higher than the expected return (expected cash flows are lower). The other statements are true: YTM and coupon rate differ whenever the bond is not at par, longer-duration bonds react more to rate changes, and price = face value is the definition of par."},
{ch:"Ch 8",t:"mc",q:"Bubba Ho-Tep Company reported net income of $300 million for the most recent fiscal year. The firm had depreciation expenses of $125 million and capital expenditures of $150 million during that year. Although the firm had no interest expense, the firm did have an increase in net working capital of $20 million. What is Bubba Ho-Tep’s free cash flow in the most recent fiscal year closest to?",o:["$170 million","$255 million","$150 million","$5 million"],a:1,e:"With no interest expense, net income equals unlevered net income. FCF = NI + depreciation − capital expenditures − ΔNWC = 300 + 125 − 150 − 20 = $255 million. $150 million forgets to add back depreciation and to subtract ΔNWC (300 − 150). $170 million forgets the depreciation and adds the NWC increase instead of subtracting it (300 − 150 + 20)."},
{ch:"Ch 8",t:"mc",q:"You expect CCM Corporation to generate the following free cash flows over the next five years:<div class='scroll'><table><tr><th>Year</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>FCF ($ millions)</td><td>25</td><td>28</td><td>32</td><td>37</td><td>40</td></tr></table></div>Following year five, you estimate that CCM’s free cash flows will grow at 5% per year forever. When the appropriate discount rate is 13%, the present value of these cash flows is closest to:",o:["$396 million","$290 million","$382 million","$350 million"],a:0,e:"The year-5 cash flow of 40 starts a growing perpetuity, worth 40/(0.13 − 0.05) = 500 at t = 4. V₀ = 25/1.13 + 28/1.13² + 32/1.13³ + 37/1.13⁴ + 500/1.13⁴ = $395.58 million. (Equivalently: discount years 1–5 and add 40 × 1.05/0.08 at t = 5.) Discounting the terminal value one year too many, or forgetting the growth, gives the lower options."}]},
{id:"mockA",title:"Mock midterm A",kind:"mock",q:[
{ch:"Ch 1",t:"mc",q:"Consider the following two statements:<br>1. The shareholders of a corporation cannot lose more than the amount they invested, because creditors have no claim on their personal assets.<br>2. Because of double taxation, corporate profits paid out as dividends are taxed at the corporate level, after which the dividends are exempt from personal income tax.",o:["Both statements are true","Statement 1 is true, statement 2 is false","Both statements are false","Statement 2 is true, statement 1 is false"],a:1,e:"Statement 1 describes limited liability, which is correct. Statement 2 is false: double taxation means the profit is taxed <b>twice</b>, first as corporate profit and then again as dividend income of the shareholder. Saying the dividend is exempt describes single taxation, the opposite of what the term means."},
{ch:"Ch 1",t:"mc",q:"Friedman argues that firms should maximize market value and let shareholders use the dividends for any social goals. According to Hart &amp; Zingales (2017), when does this separation fail?",o:["When the firm’s profit-making and its social damage are inseparable","When managers know shareholders’ social preferences better than the shareholders do","When shareholders hold well-diversified portfolios and can easily sell their shares","When the market value of the firm does not include its future cash flows"],a:0,e:"Hart &amp; Zingales: Friedman’s separation works only if the harm a firm does can be undone by shareholders afterwards (they ‘make money first and do good later’). If making the money and doing the damage are inseparable (for example selling high-capacity magazines), a shareholder cannot undo it more efficiently than the firm, so the firm should maximize shareholder <b>welfare</b>, not market value. Diversification has nothing to do with it; the authors propose that managers follow investors’ preferences via votes, not that they know them better; and market value does include future cash flows."},
{ch:"Ch 2",t:"mc",q:"Velo NV reports total assets of €420m and total liabilities of €300m. The liabilities include €180m of interest-bearing debt; the rest is accounts payable and other non-interest-bearing items. Velo holds €40m of cash. It has 25 million shares outstanding at €9.60. Which statement is TRUE?",o:["Enterprise value is €380m and the market-to-book ratio is 2.0","Enterprise value is €500m and the market-to-book ratio is 2.0","Enterprise value is €420m and the market-to-book ratio is 0.5","Enterprise value is €380m and the market-to-book ratio is 0.5"],a:0,e:"Market cap = 25m × €9.60 = €240m. Book equity = assets − liabilities = 420 − 300 = €120m, so M/B = 240/120 = 2.0. EV = market cap + <b>debt</b> − cash = 240 + 180 − 40 = €380m. €500m uses all liabilities (300) instead of interest-bearing debt: accounts payable are not debt in EV. 0.5 is book/market turned upside down. €420m is the book value of assets, not a market value."},
{ch:"Ch 2",t:"mc",q:"A retailer has annual sales of €73m and annual cost of goods sold of €51.1m. On the balance sheet: accounts receivable €9.0m, inventory €7.0m and accounts payable €4.2m. Use 365 days. What are the firm’s inventory days closest to?",o:["35 days","50 days","45 days","30 days"],a:1,e:"Inventory days = inventory / average daily <b>COGS</b> = 7.0 / (51.1/365) = 7.0 / 0.14 = 50 days. 35 days divides by daily sales instead of daily COGS (7.0/0.2). 45 days is the AR days (9.0/0.2) and 30 days is the AP days (4.2/0.14): both are on the same balance sheet, so check which ratio is asked."},
{ch:"Ch 2",t:"mc",q:"Consider the following income statements of Kade BV (in € thousands).<div class='scroll'><table><tr><th></th><th>2023</th><th>2024</th></tr><tr><td>Sales</td><td>2,400</td><td>3,000</td></tr><tr><td>Cost of goods sold</td><td>(1,500)</td><td>(1,950)</td></tr><tr><td>SG&amp;A</td><td>(420)</td><td>(480)</td></tr><tr><td>Depreciation</td><td>(120)</td><td>(150)</td></tr><tr><td>EBIT</td><td>360</td><td>420</td></tr><tr><td>Interest expense</td><td>(60)</td><td>(84)</td></tr><tr><td>Taxes (25%)</td><td>(75)</td><td>(84)</td></tr><tr><td>Net income</td><td>225</td><td>252</td></tr></table></div>Consider the following two statements:<br>1. The firm’s EBIT/interest coverage decreased from 2023 to 2024.<br>2. The firm’s net profit margin increased from 2023 to 2024.",o:["Both statements are true","Both statements are false","Statement 2 is true, statement 1 is false","Statement 1 is true, statement 2 is false"],a:3,e:"EBIT/interest: 360/60 = 6.0 in 2023 and 420/84 = 5.0 in 2024, so coverage fell: statement 1 is true. Net profit margin = net income / sales: 225/2,400 = 9.4% and 252/3,000 = 8.4%, so it fell: statement 2 is false. The trap is that net income itself rose (225 → 252); a margin is a ratio, so sales growing faster than profit lowers it."},
{ch:"Ch 3",t:"mc",q:"Three risk-free securities trade in the market:<div class='scroll'><table><tr><th>Security</th><th>Price today</th><th>Cash flow year 1</th><th>Cash flow year 2</th></tr><tr><td>A</td><td>€96.00</td><td>€100</td><td>€0</td></tr><tr><td>B</td><td>€90.00</td><td>€0</td><td>€100</td></tr><tr><td>C</td><td>€166.00</td><td>€40</td><td>€140</td></tr></table></div>Is there an arbitrage opportunity, and if so, how do you exploit it?",o:["Yes: buy C and sell 0.4 A and 1.4 B, earning €1.60 today","Yes: buy C, because it pays €180 for a price of €166, earning €14","Yes: sell C and buy 0.4 A and 1.4 B, earning €1.60 today","No: C’s price equals the present value of its cash flows"],a:2,e:"Replicate C: 0.4 × A pays €40 in year 1 and 1.4 × B pays €140 in year 2. The portfolio costs 0.4 × 96 + 1.4 × 90 = 38.40 + 126.00 = €164.40. C costs €166.00, so C is <b>overpriced</b>: sell C, buy the portfolio, and keep €1.60 today with no future cash flows (all cancel). Buying C is the wrong direction. Comparing €180 with €166 ignores the time value of money. ‘No’ is wrong because C’s no-arbitrage price is €164.40."},
{ch:"Ch 3",t:"mc",q:"You inherit 1,000 shares of a listed company. You plan to sell them immediately. The market maker quotes a bid price of €49.80 and an ask price of €50.20. What is the cash value of your inheritance today?",o:["€50,200","€50,000","€49,600","€49,800"],a:3,e:"When you <b>sell</b>, you receive the <b>bid</b> price: 1,000 × €49.80 = €49,800. The ask (€50,200) is what you would pay to buy. The mid price (€50,000) is not a price at which you can trade. €49,600 subtracts the full spread (€0.40) from the bid, but the spread is already in the bid price."},
{ch:"Ch 4",t:"mc",q:"You win a prize that pays €50,000 one year from now. Each following payment grows by 3%, and there are 20 payments in total. The discount rate is 7% per year. What is the present value of the prize closest to?",o:["€529,701","€713,244","€666,583","€1,250,000"],a:2,e:"Growing annuity: PV = C/(r − g) × [1 − ((1+g)/(1+r))^N] = 50,000/0.04 × [1 − (1.03/1.07)^20] = 1,250,000 × 0.53327 = €666,583. €1,250,000 is the growing <b>perpetuity</b> (forgets that payments stop after 20 years). €529,701 is a constant annuity (ignores growth). €713,244 multiplies by 1.07, as if the first payment came today."},
{ch:"Ch 4",t:"mc",q:"An investment pays €10,000 per year for 10 years. The first payment is received at the end of year 5. The discount rate is 6%. What is the present value today closest to?",o:["€54,999","€58,299","€73,601","€100,000"],a:1,e:"The annuity formula gives the value one period <b>before</b> the first payment: at t = 4, PV₄ = 10,000/0.06 × (1 − 1.06⁻¹⁰) = €73,601. Discount 4 years: 73,601/1.06⁴ = €58,299. €54,999 discounts 5 years (the classic mistake: the first payment is at t = 5, so the annuity value sits at t = 4). €73,601 forgets to discount to today. €100,000 ignores the time value of money."},
{ch:"Ch 4",t:"mc",q:"You save €300 at the end of every month in an account that pays 4.8% APR with monthly compounding. How long does it take until you have €50,000?",o:["About 3.9 years","About 13.9 years","About 22.9 years","About 10.7 years"],a:3,e:"Monthly rate r = 4.8%/12 = 0.4%. FV of an annuity: 50,000 = 300/0.004 × (1.004^N − 1) → 1.004^N = 1 + 50,000 × 0.004/300 = 1.6667 → N = ln(1.6667)/ln(1.004) = 128 months ≈ 10.7 years. 13.9 years ignores interest (50,000/300 = 167 months). 22.9 years uses the PV annuity formula instead of the FV formula. 3.9 years uses 4.8% as a monthly rate."},
{ch:"Ch 5",t:"mc",q:"You want to deposit savings for one year. Which bank offers the highest effective annual rate?",o:["Bank P: 6.00% APR with semi-annual compounding","Bank Q: 5.95% APR with quarterly compounding","Bank R: 5.90% APR with monthly compounding","Bank S: 6.05% EAR"],a:0,e:"Convert everything to EARs. P: (1 + 0.06/2)² − 1 = 6.090%. Q: (1 + 0.0595/4)⁴ − 1 = 6.084%. R: (1 + 0.059/12)¹² − 1 = 6.062%. S: 6.050% (already an EAR). P is highest. More frequent compounding raises the EAR, but not enough to make up for a lower APR here, and an EAR of 6.05% is lower than it looks once the others are converted."},
{ch:"Ch 5",t:"mc",q:"You take out a €300,000 annuity mortgage with 30 years of monthly payments at 4.8% APR (monthly compounding). What is the outstanding balance immediately after the 120th payment (after 10 years) closest to?",o:["€200,000","€242,542","€111,121","€377,759"],a:1,e:"Monthly rate 0.4%, N = 360: payment = 300,000 × 0.004/(1 − 1.004⁻³⁶⁰) = €1,574.00. The balance is the PV of the <b>remaining</b> 240 payments: 1,574.00/0.004 × (1 − 1.004⁻²⁴⁰) = €242,542. €200,000 assumes a third of the loan is repaid after a third of the time; early payments are mostly interest, so far less is repaid. €111,121 subtracts 120 payments from the loan without interest. €377,759 adds the remaining payments without discounting."},
{ch:"Ch 6",t:"mc",q:"An 8-year bond with face value €1,000 pays a 5% coupon semi-annually. Its yield to maturity is 6.2% (APR, semi-annual compounding). What is the bond’s price closest to?",o:["€925.21","€631.16","€1,000.00","€1,094.94"],a:0,e:"Per half-year: coupon = 2.5% × 1,000 = €25, yield = 3.1%, N = 16. P = 25/0.031 × (1 − 1.031⁻¹⁶) + 1,000/1.031¹⁶ = 311.64 + 613.57 = €925.21. It is a discount bond, as it should be when the yield (6.2%) is above the coupon rate (5%). €631.16 uses 6.2% per half-year. €1,000 would only hold if yield = coupon rate. €1,094.94 discounts the face value over 8 periods instead of 16."},
{ch:"Ch 6",t:"mc",q:"The yield to maturity of a 10-year zero-coupon bond rises from 4% to 5%. By how much does its price change, approximately?",o:["−1.0%","−8.3%","−9.1%","−10.0%"],a:2,e:"P = F/(1+y)^10, so the new price / old price = (1.04/1.05)^10 = 0.9087: a change of −9.1%. A long zero is very sensitive because the whole cash flow is discounted over 10 years. −1.0% treats the price like a one-year bond. −10.0% multiplies the 1% change by 10 years (close, but ignores compounding)."},
{ch:"Ch 6",t:"mc",q:"Consider the following two statements:<br>1. For a corporate bond with default risk, the yield to maturity equals the expected return an investor earns.<br>2. If its yield does not change, the price of a premium bond falls towards its face value as the bond approaches maturity.",o:["Both statements are true","Statement 1 is true, statement 2 is false","Statement 2 is true, statement 1 is false","Both statements are false"],a:2,e:"Statement 1 is false: the YTM is computed from the <b>promised</b> cash flows. With default risk the expected cash flows are lower, so the expected return is below the YTM. Statement 2 is true: at maturity every bond is worth its face value, so a premium bond’s price drifts down towards par (and a discount bond’s price drifts up)."},
{ch:"Ch 7",t:"mc",q:"A firm receives €1,000 today and must pay €1,150 in one year. The IRR of this deal is 15%. The cost of capital is 10%. What should the firm do?",o:["Accept: the IRR of 15% exceeds the cost of capital of 10%","Accept: the NPV is about +€45","Reject: the IRR cannot be calculated for this deal","Reject: the NPV is about −€45"],a:3,e:"NPV = 1,000 − 1,150/1.10 = −€45.45, so reject. This is a ‘delayed investment’ (benefit first, cost later): it is like borrowing at 15% while money costs only 10%. For such cash flows the IRR rule reverses and gives the wrong answer. The IRR exists (15%), it just cannot be used with the usual ‘accept if IRR &gt; r’ rule. +€45 has the sign wrong."},
{ch:"Ch 7",t:"mc",q:"A project costs €500 today and generates €150, €200, €250 and €100 at the end of years 1 to 4. The firm uses a payback cutoff of 3 years. The cost of capital is 12%. Which statement is TRUE?",o:["Payback is 2.6 years and the NPV is about +€200: both rules accept","Payback is 2.6 years and the NPV is about +€35: both rules accept","Payback is 3.4 years: the payback rule rejects while NPV accepts","Payback is 2.6 years and the NPV is about −€15: the rules conflict"],a:1,e:"Cumulative cash flows: 150, 350, 600. After 2 years €150 is still missing; year 3 brings €250, so payback = 2 + 150/250 = 2.6 years &lt; 3: accept. NPV = −500 + 150/1.12 + 200/1.12² + 250/1.12³ + 100/1.12⁴ = −500 + 133.93 + 159.44 + 177.95 + 63.55 = +€34.86: accept. +€200 is the undiscounted sum. Remember payback ignores discounting, so the agreement here is a coincidence, not a rule."},
{ch:"Ch 7",t:"mc",q:"A firm has a capital budget of €1,000 and can choose from four independent projects (amounts in €):<div class='scroll'><table><tr><th>Project</th><th>Investment</th><th>NPV</th></tr><tr><td>A</td><td>700</td><td>420</td></tr><tr><td>B</td><td>500</td><td>295</td></tr><tr><td>C</td><td>500</td><td>290</td></tr><tr><td>D</td><td>300</td><td>150</td></tr></table></div>Projects cannot be split. Which choice maximizes the firm’s value?",o:["A and D","B and D","B and C","A only"],a:2,e:"Profitability indices (NPV/investment): A 0.60, B 0.59, C 0.58, D 0.50. Ranking by PI takes A first (€700 used), then neither B nor C fits, so D: total NPV 420 + 150 = €570. But B and C together use exactly €1,000 and give 295 + 290 = €585. Because projects are indivisible, the PI ranking does not always find the best combination: check the feasible combinations. B and D (€445) and A only (€420) leave value on the table."},
{ch:"Ch 8",t:"mc",q:"A project needs a machine of €600,000 (straight-line depreciation over 5 years, no capital expenditure in year 1). In year 1: revenues €800,000 and operating costs €450,000 (excluding depreciation). The project uses a warehouse the firm owns that could otherwise be rented out for €40,000 per year. Last year the firm paid €25,000 for a market study. The project is financed with a loan that costs €30,000 interest per year. Net working capital rises from €0 to €60,000 in year 1. The tax rate is 25%. What is the project’s free cash flow in year 1?",o:["€232,500","€180,000","€262,500","€202,500"],a:3,e:"Depreciation = 600,000/5 = 120,000. EBIT = 800,000 − 450,000 − 40,000 (lost rent, an opportunity cost) − 120,000 = 190,000. Unlevered net income = 190,000 × 0.75 = 142,500. FCF = 142,500 + 120,000 − 0 − 60,000 = €202,500. The market study is sunk and the interest is financing, so both are left out. €232,500 forgets the opportunity cost. €180,000 deducts the interest. €262,500 forgets the increase in NWC."},
{ch:"Ch 8",t:"mc",q:"At the end of a project the firm sells equipment for €80,000. At that moment the equipment has a book value of €50,000. The tax rate is 25%. What is the after-tax cash flow from the sale?",o:["€72,500","€80,000","€60,000","€57,500"],a:0,e:"Only the gain above book value is taxed: capital gain = 80,000 − 50,000 = 30,000, tax = 25% × 30,000 = 7,500. After-tax cash flow = 80,000 − 7,500 = €72,500. €80,000 ignores the tax. €60,000 taxes the whole sale price. €57,500 adds the tax to the book value (50,000 + 7,500), which is not the cash the firm receives."}]},
{id:"mockB",title:"Mock midterm B",kind:"mock",q:[
{ch:"Ch 1",t:"mc",q:"Which of the following would NOT reduce the agency problem between managers and shareholders?",o:["Paying the CEO partly in shares that vest over five years","A board that includes several independent directors","A real threat of a hostile takeover if the share price lags","Spreading the shares over many more, smaller shareholders"],a:3,e:"Agency problems come from the separation of ownership and control. Dispersed small shareholders have little incentive to monitor managers (each bears the full cost of monitoring but gets only a tiny share of the benefit), so spreading ownership makes the problem worse. Share-based pay aligns incentives, independent directors monitor, and the takeover threat disciplines managers who destroy value."},
{ch:"Ch 1",t:"mc",q:"Consider the following two statements:<br>1. Market makers profit from the bid-ask spread by buying at the bid price and selling at the ask price.<br>2. Every time a firm’s shares change hands on the stock exchange, the firm receives new capital.",o:["Statement 1 is true, statement 2 is false","Both statements are true","Statement 2 is true, statement 1 is false","Both statements are false"],a:0,e:"Statement 1 is true: market makers buy from investors at the (lower) bid and sell at the (higher) ask, and the spread is their compensation for providing liquidity. Statement 2 is false: trading on the stock exchange is a <b>secondary</b> market between investors. The firm only receives money when it issues new shares in the primary market (e.g. an IPO)."},
{ch:"Ch 2",t:"mc",q:"Comparable firms trade at an EV/EBITDA multiple of 9. Tulp NV has EBITDA of €80m, debt of €250m, cash of €30m and 40 million shares. Based on the multiple, what is Tulp’s estimated share price?",o:["€18.00","€12.50","€11.75","€11.00"],a:1,e:"EV = 9 × 80 = €720m. Equity = EV − debt + cash = 720 − 250 + 30 = €500m. Price = 500/40 = €12.50. €18.00 divides the EV by the shares (EV is the value of the whole business, not of equity). €11.75 forgets to add back the cash. €11.00 subtracts the cash instead of adding it."},
{ch:"Ch 2",t:"mc",q:"Brug BV has total debt of €360m and a book value of equity of €240m. It has 20 million shares that trade at €36. Which statement is TRUE?",o:["Book debt-equity is 0.67 and market debt-equity is 2.0","Book debt-equity is 1.5 and the debt-to-capital ratio is 0.4","Book debt-equity is 1.5 and market debt-equity is 0.5","The debt-to-capital ratio is 1.5 and market debt-equity is 0.5"],a:2,e:"Book D/E = 360/240 = 1.5. Market equity = 20m × €36 = €720m, so market D/E = 360/720 = 0.5. Debt-to-capital (formula sheet) = debt/(equity + debt) = 360/(240 + 360) = 0.6. 0.67 and 2.0 are the ratios turned upside down. 0.4 is equity/capital, and 1.5 is the D/E, not the debt-to-capital ratio."},
{ch:"Ch 2",t:"mc",q:"This year a firm has sales of €1,200 and cost of goods sold of €700 (excluding depreciation). Depreciation is €100 and capital expenditures are €180. During the year accounts receivable rise by €150, inventory rises by €30 and accounts payable rise by €40. The tax rate is 25% and the firm has no debt. What is its free cash flow?",o:["€80","€0","€220","−€120"],a:0,e:"EBIT = 1,200 − 700 − 100 = 400; unlevered net income = 400 × 0.75 = 300. ΔNWC = +150 (AR) + 30 (inventory) − 40 (AP) = +140. FCF = 300 + 100 − 180 − 140 = €80. €0 adds the increase in payables to NWC instead of subtracting it (an increase in AP is money you have not paid yet). €220 ignores NWC. −€120 subtracts depreciation instead of adding it back."},
{ch:"Ch 3",t:"mc",q:"A friend offers to pay you €1,000 two years from now if you give her €900 today. You can borrow and lend at 4% per year without risk, and she will certainly pay. What is the NPV of accepting, and what should you do?",o:["+€61.54: accept","−€24.56: decline","+€100.00: accept","+€24.56: accept"],a:3,e:"NPV = −900 + 1,000/1.04² = −900 + 924.56 = +€24.56 &gt; 0, so accept: her deal beats lending at 4%. +€61.54 discounts only one year. +€100 ignores the time value of money. −€24.56 has the sign wrong."},
{ch:"Ch 3",t:"mc",q:"Shares of Delta trade at €40.00 in Amsterdam and at $43.50 in New York. The exchange rate is €1 = $1.10. Ignoring transaction costs, what is the arbitrage strategy per share?",o:["Buy in New York and sell in Amsterdam, earning $0.50","Buy in Amsterdam and sell in New York, earning $0.50","Buy in New York and sell in Amsterdam, earning $3.50","There is no arbitrage: the prices only differ in currency"],a:0,e:"Convert to one currency: €40.00 × 1.10 = $44.00 in Amsterdam versus $43.50 in New York. Buy where it is cheap (New York, $43.50) and sell where it is expensive (Amsterdam, $44.00): $0.50 per share. $3.50 compares 43.50 with 40.00 without converting euros to dollars. By the law of one price the converted prices should be equal, so there is an arbitrage."},
{ch:"Ch 4",t:"mc",q:"A share will pay its first dividend of €3.00 at the end of year 3. After that the dividend grows by 2% per year forever. The discount rate is 8%. What is the share’s value today closest to?",o:["€50.00","€46.30","€39.69","€42.87"],a:3,e:"The growing perpetuity formula gives the value one period before the first payment, here at t = 2: 3.00/(0.08 − 0.02) = €50.00. Discount 2 years: 50.00/1.08² = €42.87. €50.00 forgets to discount. €46.30 discounts one year. €39.69 discounts three years (the most common mistake: the first payment is at t = 3, so the value is at t = 2)."},
{ch:"Ch 4",t:"mc",q:"You lease an office for 3 years. The rent is €1,200 per month, paid at the <b>beginning</b> of each month. The discount rate is 6% APR with monthly compounding. What is the present value of the rent closest to?",o:["€39,642","€39,445","€17,545","€43,200"],a:0,e:"Monthly rate 0.5%, 36 payments. Ordinary annuity: 1,200/0.005 × (1 − 1.005⁻³⁶) = €39,445. The payments come at the beginning of each month, so each one is one month earlier: multiply by 1.005 → €39,642. €39,445 treats it as end-of-month rent. €17,545 uses 6% per month. €43,200 is the undiscounted total."},
{ch:"Ch 4",t:"mc",q:"An insurer offers you €1,295 at the end of each year for 10 years in exchange for €10,000 today. What annual return does this offer give you?",o:["About 12.95%","About 2.95%","About 5.0%","About 29.5%"],a:2,e:"Solve 10,000 = 1,295/r × (1 − (1+r)⁻¹⁰). Try r = 5%: 1,295 × 7.7217 = €9,999.6 ≈ €10,000, so the return is 5.0% (the IRR of the deal). 12.95% is one payment divided by the price (it ignores that the payments stop). 29.5% is the total undiscounted gain (12,950 − 10,000)/10,000, and 2.95% spreads that gain over 10 years without compounding or discounting."},
{ch:"Ch 5",t:"mc",q:"The risk-free yield curve (EAR) is 2.0% for 1 year, 3.0% for 2 years and 4.0% for 3 years. What is the price of a 3-year risk-free bond with face value €1,000 and a 6% annual coupon?",o:["€1,057.72","€1,084.86","€1,055.50","€1,115.36"],a:0,e:"Discount each cash flow at the rate for its own maturity: 60/1.02 + 60/1.03² + 1,060/1.04³ = 58.82 + 56.56 + 942.34 = €1,057.72. €1,055.50 discounts everything at 4% (the 3-year rate). €1,084.86 uses the ‘average’ 3% for all cash flows. €1,115.36 uses the 1-year rate for all of them."},
{ch:"Ch 5",t:"mc",q:"You want €40,000 of today’s purchasing power in 10 years. Your savings earn a nominal 5% per year and inflation is expected to be 2% per year. How much do you need to invest today?",o:["€24,557","€29,764","€20,334","€29,934"],a:3,e:"In 10 years you need 40,000 × 1.02¹⁰ = €48,760 (nominal). Discount at the nominal rate: 48,760/1.05¹⁰ = €29,934. Equivalently, discount €40,000 at the exact real rate 1.05/1.02 − 1 = 2.94%. €29,764 uses the approximation 5% − 2% = 3%. €24,557 forgets inflation. €20,334 adds inflation to the discount rate (7%)."},
{ch:"Ch 6",t:"mc",q:"A 4-year bond with a 6% annual coupon and face value €1,000 trades at €965. What is its yield to maturity closest to?",o:["6.00%","6.22%","7.03%","3.63%"],a:2,e:"Solve 965 = 60/(1+y) + 60/(1+y)² + 60/(1+y)³ + 1,060/(1+y)⁴. Try 7%: price = 966.13, slightly too high, so y is a bit above 7%: y ≈ 7.03%. The bond trades below par, so the YTM must be above the 6% coupon rate. 6.22% is the current yield (60/965), which ignores the gain from €965 to €1,000. 3.63% is that gain alone ((1,000 − 965)/965)."},
{ch:"Ch 6",t:"mc",q:"Zero-coupon bond prices per €1,000 face value are €970 (1 year), €935 (2 years) and €898 (3 years). A 3-year bond with a 5% annual coupon and face value €1,000 trades at €1,040. Which statement is TRUE?",o:["The no-arbitrage price is about €1,038: buy the bond and sell the zeros","The no-arbitrage price is about €1,038: sell the bond and buy the zeros","The no-arbitrage price is about €1,033: sell the bond and buy the zeros","The bond is fairly priced at €1,040: there is no arbitrage"],a:1,e:"Replicate the coupon bond with zeros: 0.05 × 970 + 0.05 × 935 + 1.05 × 898 = 48.50 + 46.75 + 942.90 = €1,038.15. The bond trades at €1,040, above that, so sell the (overpriced) bond and buy the zeros: €1.85 risk-free profit today. Buying the bond is the wrong direction. €1,033 discounts every cash flow with the 3-year zero price (1,150 × 0.898)."},
{ch:"Ch 6",t:"mc",q:"A 1-year zero-coupon corporate bond with face value €1,000 trades at €920. There is a 5% probability of default, in which case bondholders receive €600. Which statement is TRUE?",o:["YTM is 8.0% and the expected return is 6.5%","YTM is 8.7% and the expected return is 8.7%","YTM is 6.5% and the expected return is 8.7%","YTM is 8.7% and the expected return is 6.5%"],a:3,e:"YTM uses the promised payment: 1,000/920 − 1 = 8.70%. Expected payoff = 0.95 × 1,000 + 0.05 × 600 = 980, so expected return = 980/920 − 1 = 6.52%. With default risk, the expected return is below the YTM. 8.0% divides the €80 gain by the face value instead of the price. Swapping the two numbers reverses the logic."},
{ch:"Ch 7",t:"mc",q:"A project has cash flows of −€1,000 today, +€2,300 in year 1 and −€1,320 in year 2. Its IRRs are 10% and 20%. The cost of capital is 15%. What should the firm do?",o:["Reject: 15% lies between the two IRRs, so the NPV is negative","Accept: the NPV at 15% is about +€1.9","Reject: with two IRRs, the project cannot create value","Accept only if the cost of capital were below 10%"],a:1,e:"With two IRRs, compute the NPV directly: −1,000 + 2,300/1.15 − 1,320/1.15² = −1,000 + 2,000.00 − 998.11 = +€1.89, so accept. For this cash flow pattern (−, +, −) the NPV is positive <b>between</b> the IRRs (at 5% it is −€6.8). Whether that is between or outside depends on the pattern, which is exactly why the IRR rule cannot be trusted here: use NPV."},
{ch:"Ch 7",t:"mc",q:"Two mutually exclusive projects, cost of capital 10%. Project S: invest €1,000 today, receive €1,300 in one year (IRR 30%). Project L: invest €5,000 today, receive €6,000 in one year (IRR 20%). Which project should the firm choose?",o:["S, because its IRR is higher","S, because its profitability index is higher","L, because its NPV is higher","Both, because both IRRs exceed 10%"],a:2,e:"NPV(S) = −1,000 + 1,300/1.1 = €181.82. NPV(L) = −5,000 + 6,000/1.1 = €454.55. For mutually exclusive projects choose the highest NPV: L. The IRR ignores scale: a high percentage on a small amount can create less value. The incremental project L − S (−4,000 now, +4,700 in a year) has an IRR of 17.5% &gt; 10%, which confirms L. The profitability index only matters with a resource constraint, and ‘both’ is impossible for mutually exclusive projects."},
{ch:"Ch 7",t:"mc",q:"A project costs €2,000,000 today. It generates €150,000 at the end of year 1, and this cash flow grows by 2% per year forever. The cost of capital is 8%. Which statement is TRUE?",o:["The IRR is 7.5%, so reject","The IRR is 9.5%, so accept","The IRR is 5.5%, so reject","The IRR is 9.5%, but reject because the NPV is negative"],a:1,e:"Growing perpetuity: 0 = −2,000,000 + 150,000/(IRR − 0.02), so IRR = 150,000/2,000,000 + 0.02 = 7.5% + 2% = 9.5% &gt; 8%: accept. The NPV agrees: 150,000/0.06 − 2,000,000 = +€500,000. 7.5% forgets the growth; 5.5% subtracts the growth instead of adding it."},
{ch:"Ch 8",t:"mc",q:"A firm launches a new phone model. It will sell €4.0m per year; variable costs are 55% of sales. Because some customers switch from the firm’s existing model, sales of that model fall by €1.0m per year (also 55% variable costs). Headquarters allocates €0.3m of existing overhead to the new model; total overhead does not change. Extra depreciation is €0.5m per year and the tax rate is 25%. What are the incremental unlevered net earnings per year?",o:["€975,000","€637,500","€412,500","€750,000"],a:1,e:"Incremental sales = 4.0 − 1.0 (cannibalization) = €3.0m. Incremental EBIT = 3.0 × 45% − 0.5 = 1.35 − 0.5 = €0.85m. Unlevered net income = 0.85 × 0.75 = €637,500. The allocated overhead is not incremental (it is paid anyway). €975,000 ignores the cannibalization. €412,500 also deducts the overhead. €750,000 ignores cannibalization but deducts the overhead."},
{ch:"Ch 8",t:"mc",q:"A project requires €1,200 today and then produces a constant free cash flow every year forever, starting in year 1. Each unit sold adds €4 of margin and fixed costs are €300 per year. Free cash flow = (units × €4 − €300) × (1 − 25%); there is no depreciation. The cost of capital is 10%. How many units per year are needed for the NPV to be zero?",o:["75 units","105 units","115 units","40 units"],a:2,e:"NPV = 0 requires a perpetual FCF of 1,200 × 10% = €120. Before tax that is 120/0.75 = €160. Units: 4 × Q − 300 = 160 → Q = 115. 105 units forgets the tax (4Q − 300 = 120). 75 units only covers the fixed costs (accounting break-even before the investment). 40 units ignores the fixed costs."}]},
{id:"mockC",title:"Mock midterm C",kind:"mock",q:[
{ch:"Ch 1",t:"mc",q:"Consider the following two statements about Hart &amp; Zingales (2017):<br>1. The authors favour divestment (selling the shares of ‘dirty’ firms) over engagement as the main tool for socially minded investors.<br>2. ‘Amoral drift’ arises because dispersed shareholders tend to sell to a purely profit-driven bidder, even if most of them prefer the cleaner policy.",o:["Both statements are true","Statement 1 is true, statement 2 is false","Statement 2 is true, statement 1 is false","Both statements are false"],a:2,e:"Statement 1 is false: the authors prefer <b>invest and engage</b> (voting for the policies you want) over divestment, because selling just passes the shares to someone who does not care. Statement 2 is true: each small shareholder thinks their vote will not decide the outcome (collective action problem) and tenders, so takeovers push firms towards ‘dirty’ policies."},
{ch:"Ch 1",t:"mc",q:"Why do large firms that need to raise money from many investors usually organize as corporations rather than as partnerships?",o:["Corporations avoid paying tax on their profits, unlike partnerships","Corporate owners have limited liability and can easily sell their shares","In a corporation the owners manage the firm themselves, so there are no conflicts","Partnerships are not allowed to borrow money from banks or issue bonds"],a:1,e:"Limited liability and easily transferable shares make it attractive for many outside investors to provide capital. Corporations do pay tax on profits (that is the first layer of double taxation). Ownership and control are <b>separated</b> in a corporation, which is the source of agency problems. Partnerships can borrow from banks."},
{ch:"Ch 2",t:"mc",q:"Firm Z’s only asset is a contract that pays €550,000 for certain in one year. The risk-free rate is 10%. Z has debt with a book and market value of €200,000, a book value of equity of €150,000 and 30,000 shares outstanding. Which statement is TRUE?",o:["The share price is €10.00 and the market-to-book ratio is 2.0","The share price is €11.67 and the market-to-book ratio is 2.33","The share price is €10.00 and the market-to-book ratio is 0.5","The share price is €5.00 and the market-to-book ratio is 1.0"],a:0,e:"Market value of the asset = 550,000/1.10 = €500,000. Equity = 500,000 − 200,000 = €300,000, so price = 300,000/30,000 = €10.00 and M/B = 300,000/150,000 = 2.0. €11.67 forgets to discount the cash flow (550,000 − 200,000 = 350,000). 0.5 is book-to-market. €5.00 uses the book value of equity, which is not what the shares trade at."},
{ch:"Ch 2",t:"mc",q:"Lindeboom NV: share price €45, 12 million shares, net income €36m, debt €150m, cash €20m and sales €400m. Which statement is TRUE?",o:["P/E is 18.6 and EV/Sales is 1.68","P/E is 15.0 and EV/Sales is 1.68","P/E is 15.0 and EV/Sales is 1.35","P/E is 12.0 and EV/Sales is 1.68"],a:1,e:"EPS = 36/12 = €3.00, so P/E = 45/3 = 15.0 (equivalently market cap 540 / net income 36). EV = 540 + 150 − 20 = €670m, so EV/Sales = 670/400 = 1.68. 1.35 uses market cap instead of EV. 18.6 divides the EV by net income, mixing an enterprise value with an equity measure. 12.0 has no basis in the data."},
{ch:"Ch 2",t:"mc",q:"Consider the following two statements:<br>1. If accounts receivable days rise while sales stay the same, the firm’s free cash flow is lower in that year than it would otherwise be.<br>2. A higher current ratio indicates a better short-term liquidity position.",o:["Both statements are true","Both statements are false","Statement 2 is true, statement 1 is false","Statement 1 is true, statement 2 is false"],a:0,e:"Statement 1 is true: higher AR days at the same sales means a higher receivables balance, so NWC increases and that increase is subtracted in FCF. Statement 2 is true: current ratio = current assets / current liabilities measures the ability to pay short-term obligations. (A very high ratio can also mean idle cash, but as a liquidity measure, higher means more liquid.)"},
{ch:"Ch 3",t:"mc",q:"An ETF holds 2 shares of A (price €30) and 1 share of B (price €45) and nothing else. One ETF unit trades at €108. Ignoring transaction costs, what is the arbitrage?",o:["Buy the ETF and sell 2 A and 1 B, earning €3 per unit","Sell the ETF and buy 1 A and 1 B, earning €33 per unit","No arbitrage: an ETF may trade at a premium for its convenience","Sell the ETF and buy 2 A and 1 B, earning €3 per unit"],a:3,e:"The ETF’s holdings are worth 2 × 30 + 45 = €105, but the ETF costs €108. By the law of one price both should be equal. Sell the expensive one (ETF) and buy the cheap one (the shares): +€3 now, and the positions cancel exactly. Buying the ETF is the wrong direction. 1 A and 1 B does not replicate the ETF, so that position is risky. A ‘convenience premium’ is not compatible with no arbitrage."},
{ch:"Ch 3",t:"mc",q:"A project costs €100 today and pays €60 at the end of year 1 and €60 at the end of year 2. What happens to its NPV when the interest rate rises from 5% to 10%?",o:["It falls from €11.56 to €4.13","It falls from €20.00 to €9.09","It stays at €20.00, because the cash flows are fixed","It rises, because future cash flows earn more interest"],a:0,e:"At 5%: −100 + 60/1.05 + 60/1.05² = +€11.56. At 10%: −100 + 60/1.10 + 60/1.10² = +€4.13. The benefits come later than the cost, so a higher rate lowers their PV and the NPV falls. €20.00 is the undiscounted sum. €9.09 discounts only one year. The cash flows being fixed in euros does not make their value today fixed."},
{ch:"Ch 4",t:"mc",q:"You deposit €2,000 today and €3,000 two years from now. The account pays 5% per year. How much is in the account five years from now?",o:["€6,381.41","€6,025.44","€5,860.06","€6,250.00"],a:1,e:"Move each deposit to year 5: 2,000 × 1.05⁵ + 3,000 × 1.05³ = 2,552.56 + 3,472.88 = €6,025.44. The €3,000 only grows for 3 years. €6,381.41 lets both deposits grow for 5 years. €5,860.06 grows the second deposit for 2 years (counts the deposit date instead of the remaining time). €6,250 uses simple interest."},
{ch:"Ch 4",t:"mc",q:"You save 10% of your salary at the end of each year. Your salary is €40,000 in the first year and grows by 3% per year. You save for 35 years and earn 6% per year. How much will you have right after the last deposit?",o:["€649,630","€445,739","€84,520","€140,000"],a:0,e:"First deposit €4,000, growing 3%. PV of the growing annuity = 4,000/(0.06 − 0.03) × [1 − (1.03/1.06)³⁵] = €84,520. Move to year 35: 84,520 × 1.06³⁵ = €649,630. €445,739 ignores the salary growth. €84,520 is the value today, not at retirement. €140,000 is just 35 × €4,000."},
