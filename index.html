<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance 1 · Midterm Study Portal</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2129;--mut:#5d6470;--line:#e2e0d8;--acc:#1f5f8b;--acc2:#e8f1f8;--ok:#1e8a4c;--okb:#e6f5ec;--bad:#c0392b;--badb:#fbeaea;--mid:#d98a00;--midb:#fdf3e1;--key:#eef5fb;--trap:#fff1e8;--trapb:#e07a2f;--sm:#6b4fbf;--smb:#efeafb;--shadow:0 1px 3px rgba(0,0,0,.06)}
html[data-theme=dark]{--bg:#14171c;--card:#1d2128;--ink:#e6e8ec;--mut:#9aa3af;--line:#2e343e;--acc:#6cb0e6;--acc2:#1f2d3b;--ok:#4cc483;--okb:#173326;--bad:#ef6f62;--badb:#3a1e1c;--mid:#f0b13d;--midb:#3a2e14;--key:#1b2a38;--trap:#3a2618;--trapb:#f0954f;--sm:#a891f0;--smb:#2a2340;--shadow:none}
*{box-sizing:border-box}a{color:var(--acc)}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px}.top h1{font-size:16px;margin:0;flex:1}.top button{font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:10px 12px;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:16px;margin:14px 0 8px}h4{margin:10px 0 6px;font-size:14px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
textarea{width:100%;min-height:90px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.kv b{color:var(--mut);font-weight:600}
.count{font-size:28px;font-weight:700;color:var(--acc)}
.warn{background:var(--midb);border:1px solid var(--mid);border-radius:10px;padding:12px 14px}
.key{background:var(--key);border-left:4px solid var(--acc);border-radius:6px;padding:8px 12px;margin:10px 0}
.trap{background:var(--trap);border-left:4px solid var(--trapb);border-radius:6px;padding:8px 12px;margin:10px 0}
.key ul,.trap ul{margin:4px 0 0;padding-left:18px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--mut);margin-right:4px;vertical-align:middle}
.lab-ON{background:var(--okb);color:var(--ok);border-color:var(--ok)}.lab-PARTLY{background:var(--midb);color:var(--mid);border-color:var(--mid)}.lab-LEARN{background:var(--badb);color:var(--bad);border-color:var(--bad)}
.r0{background:var(--line)}.r1{background:#cfd8dc;color:#333}.r2{background:#fff3c4;color:#7a5b00}.r3{background:#ffd8a8;color:#8a4500}.r4{background:#ffb3a7;color:#7a1408}
.case table,.qtext table,.fb table{border-collapse:collapse;margin:8px 0;font-size:13.5px}.case table td,.case table th,.qtext table td,.qtext table th,.fb table td,.fb table th{border:1px solid var(--line);padding:4px 8px}.case table th,.qtext table th{background:var(--card)}.scroll{overflow-x:auto}
table.ct{border-collapse:collapse;margin:8px 0;font-size:13.5px;background:var(--card)}table.ct td,table.ct th{border:1px solid var(--line);padding:4px 8px;text-align:right}table.ct td:first-child,table.ct th:first-child{text-align:left}table.ct th{background:var(--acc2)}table.ct caption{font-weight:700;padding:4px}
details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
details.case{background:var(--acc2)}details.theory{background:var(--smb)}
.q{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px;background:var(--card)}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:6px}.qtext{margin:6px 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc2)}.opt.good{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt .l{font-weight:700;min-width:18px}
.blank{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.blank label{min-width:170px}.blank input{width:150px}
.fb{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.res{font-weight:700;padding:6px 10px;border-radius:7px;display:inline-block;margin-bottom:6px}.res.c{background:var(--okb);color:var(--ok)}.res.p{background:var(--midb);color:var(--mid)}.res.w{background:var(--badb);color:var(--bad)}.res.s{background:var(--smb);color:var(--sm)}
.why{font-size:14px;margin:6px 0}.why div{margin:3px 0}
.src{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--mid);padding-left:8px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.examwrap{display:grid;grid-template-columns:1fr 230px;gap:14px;align-items:start}
.sheet{position:sticky;top:110px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sheet .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.nb{padding:5px 0;text-align:center;border-radius:6px;border:1px solid var(--line);font-size:13px;cursor:pointer;position:relative;background:var(--card)}
.nb.ans{background:var(--acc2);border-color:var(--acc)}.nb.c{background:var(--ok);color:#fff;border-color:var(--ok)}.nb.p{background:var(--mid);color:#fff;border-color:var(--mid)}.nb.w{background:var(--bad);color:#fff;border-color:var(--bad)}.nb.s{background:var(--sm);color:#fff;border-color:var(--sm)}
.nb.cur{outline:2px solid var(--ink)}.nb.fl::after{content:'⚑';position:absolute;top:-7px;right:-3px;font-size:11px;color:var(--bad)}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.legend{font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px}.legend span{display:inline-flex;align-items:center;gap:3px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.scorebox{font-size:14px}
.exlist .card{margin-bottom:10px}.exlist .row{justify-content:space-between}
.muted{color:var(--mut)}.small{font-size:13px}
.formula{font-size:16px;margin:4px 0}
figure.svg{margin:10px 0}figure.svg svg{width:100%;max-width:420px;height:auto}figure.svg figcaption{font-size:12.5px;color:var(--mut)}
svg .ax{stroke:var(--mut);stroke-width:1.2}svg .c1{fill:none;stroke:var(--acc);stroke-width:2.5}svg .c2{fill:none;stroke:var(--trapb);stroke-width:2.5}svg .dash{stroke:var(--mut);stroke-dasharray:4 4}svg .pt{fill:var(--bad)}svg .lbl{font-size:11px;fill:var(--ink)}
.gl{display:grid;grid-template-columns:220px 1fr 70px;gap:4px 14px;padding:6px 0;border-bottom:1px solid var(--line)}
.prog{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.hide{display:none!important}
@media (max-width:820px){.examwrap{grid-template-columns:1fr}.sheet{position:sticky;top:92px;z-index:10;order:-1}.sheet .nums{grid-template-columns:repeat(10,1fr)}.kv{grid-template-columns:1fr}.gl{grid-template-columns:1fr}.blank label{min-width:0;width:100%}.legend{display:none}.timer{font-size:18px}}
@media print{header,.toolbar,.sheet{display:none}}
</style>

<script>
const DATA={"meta":{"course":"Finance 1 for Business","uni":"University of Amsterdam","year":"2026-27","exam":{"date":"2026-11-20T09:00:00+01:00","end":"11:00","where":"[Location unknown: check your UvA timetable]","fmt":"Multiple choice and fill-in-the-number (Lecture 1a: 'MC includes multiple-choice and fill in the number type of questions')","dur":"2 hours","weight":"20% of the course grade (final exam 80%; pass: course ≥ 5.5 and final ≥ 5.0)","aids":"Midterm formula sheet (provided), UvA calculator, ENG–NL concept list","grading":"Unknown for 2026 → assumption: grade = 10 × points ÷ max points, no guessing correction (switch in Settings). The 2018 paper used 18 MC with a correction for guessing.","scope":"Ch 1 The Corporation (+ Hart &amp; Zingales 2017), Ch 2 Financial Statement Analysis, Ch 3 Financial Decision Making, Ch 4 Time Value of Money, Ch 5 Interest Rates, Ch 6 Bonds, Ch 7 Investment Decision Rules (+ Graham 2022), Ch 8 Capital Budgeting (Lecture 3b, official).","notscope":"Ch 9 onwards (stocks, risk &amp; return, CAPM, capital structure, working capital management) = final exam only. Crossed-out ratios on the ratio overview. 'Check Canvas for which pages are not included': that page was not uploaded."},"missing":["Lecture 1b slides (Ch 2–3 part 2) — not uploaded; Ch 2–3 summary relies on Lecture 1a, video slides, homework and Canvas.","Canvas 'learning objectives / excluded pages' per week — not uploaded; finer exclusions within chapters are unknown.","Exact grading of the 2026 midterm (number of questions, guessing correction) — assumed (see grading).","Exam location — unknown.","Official answers for HW PREPARE / IN CLASS parts — computed from the data or AI model answers (labelled).","Pearson Assignment 3 Q3–Q8 — not captured; Mydeco statements (Pearson A1 Q5/Q7) not available.","2024 past exam: one question (profit margins) too cut off to include; De Fietsfabriek options not visible.","'Midterm 2019' file shows a 2024-25 exam bundle; year cannot be verified."],"plan":[["Tonight 21:30–21:50","Focus tab: read every 'Very likely' topic and its trap boxes."],["21:50–22:50","Exams → Midterm 2024 in exam-simulation mode (timer on). Review every wrong answer and open its 'Theory behind it'."],["22:50–23:20","Exams → Formula drill in per-question mode, or Practice filtered to 'wrong'."],["23:20","Sleep. A rested brain scores more than one extra hour of practice."],["Fri 07:00–07:45","Canvas Mock Midterm (official) in per-question mode, or AI exam A."],["07:45–08:15","Formulas tab: the LEARN formulas (not on the sheet) + timing rule + APR/EAR rules."],["08:15","Leave: UvA calculator, ID/UvA card. The formula sheet is provided at the exam."],["09:00–11:00","Midterm. Do the quick concept questions first; flag long calculations and come back."]],"notes":"No lectures or tutorials are left before the midterm (Lecture 3b: 'Good luck on the midterm!')."},"th":{"firmtypes":{"t":"Types of firms and limited liability","ch":"Ch 1","what":"Sole proprietorship (one owner, unlimited personal liability), partnership (all general partners personally liable for <b>all<\/b> the firm's debts), limited partnership (limited partners only lose their investment), LLC/BV and corporation/NV: a separate legal entity, owners have <b>limited liability<\/b>. Corporation shares can trade on an exchange (public) and are then more liquid than shares of private firms.","why":"Limited liability lets many small investors fund a large firm without risking their personal wealth. That makes it easy to raise capital and to sell ownership stakes, which is why big firms are corporations.","link":"Limited liability + separate ownership and control → agency problems (managers ≠ owners). Corporate profits are taxed twice (double taxation).","trap":"In a partnership <b>every<\/b> partner is liable, even the one who just joined (2024 Jan & Cees question). In bankruptcy the firm's assets are not always liquidated: the firm can be reorganised (Canvas Ch 1 Q4: answer False). Shareholders are residual claimants: last in line.","src":"Lectures 1a–3b, Berk & DeMarzo"},"doubletax":{"t":"Double taxation","ch":"Ch 1","what":"Corporate profit is taxed first at the corporate rate τc; what is paid out as dividend is taxed again at the personal rate τi. Effective tax rate = 1 − (1 − τc)(1 − τi).","why":"The corporation is a separate legal entity, so it pays its own tax; the dividend is income for the shareholder, so it is taxed again.","link":"Explains why the effective rate is higher than either rate on its own. S-corporations (US) avoid this.","trap":"Don't add the rates (18% + 12% = 30% is wrong); multiply what is left: 1 − 0.82 × 0.88 = 27.8%.","src":"Lectures 1a–3b, Berk & DeMarzo"},"goal":{"t":"Goal of the firm: shareholder value","ch":"Ch 1","what":"According to the book the objective is to <b>maximise shareholder value<\/b> (the market value of the shares), not profit. Shareholder value includes the timing and risk of all future cash flows.","why":"Profit ignores timing and risk and can be manipulated by accounting choices; market value is forward-looking and what owners can actually sell for. Shareholders are residual claimants, so in theory maximising their value also requires paying everyone else.","link":"Hart &amp; Zingales argue shareholder <b>welfare<\/b> ≠ market value when shareholders are prosocial and externalities exist. Agency problems can stop managers from pursuing the goal.","trap":"'Maximise profit' is the classic wrong answer. Maximising shareholder value is <b>not<\/b> automatically maximising contribution to society (externalities), and minimising layoffs does not automatically maximise equity value.","src":"Lectures 1a–3b, Berk & DeMarzo"},"agency":{"t":"Agency problem and governance","ch":"Ch 1","what":"Managers (agents) may act in their own interest instead of the shareholders' (principals'). Remedies: board of directors (independent members), pay linked to performance (shares, options), threat of firing, hostile takeovers, competition, regulation.","why":"Ownership is separated from control in a corporation; dispersed shareholders have little incentive to monitor (free-rider problem).","link":"Takeover threat links to the share price: a low price invites a takeover. Agency problems are most severe in corporations with widely held shares.","trap":"Spreading shares over many small holders makes monitoring <b>worse<\/b>, not better.","src":"Lectures 1a–3b, Berk & DeMarzo"},"hz":{"t":"Hart & Zingales (2017): welfare vs market value","ch":"Ch 1 · article","what":"Friedman: managers should maximise profit within the rules; people can give to charity themselves (separability). Hart &amp; Zingales: when money-making and social damage are <b>inseparable<\/b> (e.g. pollution, selling high-capacity magazines) and government does not fix it, companies should maximise shareholder <b>welfare<\/b> (including prosocial preferences), not market value. <b>Amoral drift<\/b>: dispersed shareholders tender to a profit-only bidder even if most prefer the clean policy (collective action), so firms drift towards 'dirty'. Remedy: let shareholders vote on policy; prefer <b>engagement<\/b> over divestment.","why":"Shareholders are people with ethical preferences; if the firm can do good more cheaply than individuals can, it should follow their preferences.","link":"Connects to the goal of the firm and externalities (Lecture 1a slides 'Issues with maximizing shareholder value due to externalities').","trap":"The authors do <b>not<\/b> favour divestment; amoral drift is a <b>one-way<\/b> asymmetry (no profit motive to buy a dirty firm and clean it).","src":"Hart & Zingales (2017) reading; Lecture 1a"},"bidask":{"t":"Bid, ask and liquidity","ch":"Ch 1","what":"You buy at the <b>ask<\/b> (higher) and sell at the <b>bid<\/b> (lower). The bid-ask spread is a transaction cost for investors and the market maker's revenue. Liquid assets can be sold quickly at a fair price; listed shares are more liquid than an office building.","why":"The market maker takes the other side of every trade and must be compensated for providing liquidity.","link":"Transaction costs mean the law of one price holds only approximately (within the spread).","trap":"Reversing bid and ask (Pearson A1 Q3). Buy = ask price, sell = bid price.","src":"Lectures 1a–3b, Berk & DeMarzo"},"statements":{"t":"Balance sheet and income statement","ch":"Ch 2","what":"Balance sheet: Assets = Liabilities + Equity (book values, historical cost). Income statement: Sales − COGS = gross profit; − SG&amp;A, R&amp;D, depreciation = operating income (EBIT); − interest = pretax income; − taxes = net income. EPS = net income ÷ shares.","why":"Book values follow accounting rules and look backwards; they are inputs for ratios, not the market value of the firm.","link":"EBIT feeds unlevered net income in capital budgeting (Ch 8). Book equity feeds market-to-book and ROE.","trap":"Accounts payable is <b>not<\/b> interest-bearing debt (Kahoot). If book equity is 'missing', back it out: equity = total assets − total liabilities.","src":"Lectures 1a–3b, Berk & DeMarzo"},"bookmarket":{"t":"Book value vs market value; market-to-book","ch":"Ch 2","what":"Market value of equity (market cap) = share price × shares outstanding. Market-to-book = market value of equity ÷ book value of equity. High MTB → 'growth stocks'; low MTB → 'value stocks'. MTB &lt; 1: assets' market value is below historical cost.","why":"Market value is forward-looking (future cash flows, risk); book value is historical cost minus depreciation. The pen example: bought for $1 (book), sells for $2 next year at 5% → market value 2/1.05.","link":"Market value is what the NPV analysis adds to: a positive-NPV project raises the share price immediately.","trap":"Use market values for market cap, EV and MTB. Change in MTB = MTB(new) − MTB(old), not the ratio of changes.","src":"Lecture 1a; video 'Market values vs Book values'"},"ev":{"t":"Enterprise value","ch":"Ch 2","what":"EV = market value of equity + interest-bearing debt − cash (net debt = debt − cash). It values the operating business, free of capital structure.","why":"An acquirer who buys the shares also takes over the debt but gets the cash, so the price of the business itself is equity + debt − cash.","link":"EV/Sales and EV/EBITDA compare firms with different leverage (better than market cap/sales when leverage differs). In Ch 8, the PV of free cash flows = EV; share price = (EV + cash − debt) ÷ shares.","trap":"Only <b>interest-bearing<\/b> debt (not accounts payable or 'total liabilities'). Subtract cash. Use market value of equity, not book.","src":"Lectures 1a–3b, Berk & DeMarzo"},"ratios":{"t":"Financial ratios","ch":"Ch 2","what":"On the formula sheet: current ratio, EBIT/interest, debt-to-capital, ROE, AR/AP/inventory days. Learn by heart (not crossed out on the ratio overview): net profit margin, debt-equity (book and market), debt-to-EV, MTB, P/E, EV/Sales, EV/EBITDA.","why":"Ratios make firms of different size comparable: liquidity (can it pay short-term?), coverage/leverage (how risky is the debt?), working capital (how fast is cash tied up?), valuation (what do investors pay?).","link":"Working capital days explain changes in NWC (Ch 8). P/E and MTB link to market value.","trap":"Days ratios divide by <b>average daily<\/b> sales/COGS (annual ÷ 365). AR uses sales; inventory and AP use COGS.","src":"Formula sheet; ratio overview screenshot (Table 2.4, crossed-out ratios not examined)"},"profitcash":{"t":"Profit vs cash flow","ch":"Ch 2/8","what":"Profit follows accounting (revenues − costs); cash flow follows money (inflows − outflows). Differences: credit sales/purchases (change in NWC), depreciation (cost, not cash), CapEx (cash, not cost), inventory bought but not yet sold.","why":"Valuation discounts <b>cash<\/b>, because only cash can be reinvested or paid out; profit timing is an accounting convention.","link":"Leads directly to the FCF formula in Ch 8.","trap":"Depreciation is not a cash flow, but it <b>does<\/b> save tax (tax shield τ × depreciation).","src":"Video 'Profit versus cash flow'"},"valuation":{"t":"Valuation principle and NPV","ch":"Ch 3","what":"The value of an asset is the market value of its benefits minus its costs, measured at the same moment. NPV = PV(benefits) − PV(costs). Accept if NPV &gt; 0; choose the highest-NPV alternative.","why":"With competitive markets you can convert any cash amount at the market rate, so NPV is the increase in value (cash today) from taking the decision.","link":"Basis for Ch 4 (time value), Ch 7 (decision rules) and Ch 8 (capital budgeting).","trap":"Comparing amounts at different dates without discounting. Use the market interest rate (opportunity cost), not the project's IRR.","src":"Lectures 1a–3b, Berk & DeMarzo"},"arbitrage":{"t":"Arbitrage and the law of one price","ch":"Ch 3","what":"Arbitrage: buying and selling equivalent goods to profit from a price difference, with <b>no risk and no net investment<\/b>. In a normal market there is no arbitrage, so the <b>law of one price<\/b> holds: equivalent assets (same cash flows, same risk) have the same price. No-arbitrage price of a security = PV of its cash flows. Value additivity: Price(A+B) = Price(A) + Price(B).","why":"If prices differed, traders would buy the cheap one and sell the expensive one until the gap closes.","link":"Bond pricing (Ch 6): a coupon bond = a package of zero-coupon bonds. Separation principle: trading securities at fair prices has NPV 0. An arbitrage opportunity has a positive NPV.","trap":"Selling a borrowed security = <b>short sale<\/b> (not long sale). If the market price is above the no-arbitrage price: <b>sell<\/b> (short) it and buy the replicating portfolio; if below: buy it and sell the replicating portfolio.","src":"Lectures 1a–3b, Berk & DeMarzo"},"replicate":{"t":"Replicating cash flows (no-arbitrage pricing)","ch":"Ch 3/6","what":"Find how many units of the basic securities reproduce the target's cash flow at every date (and every state of the economy). Price = sum of units × prices.","why":"Two portfolios with identical cash flows must have the same price, otherwise there is arbitrage.","link":"Used for ETFs (2018 Q6), states of the economy (Canvas Ch 3 Q4: C = 1A + 5B = $3,200), and bonds from zeros (Lecture 2b bond arbitrage: 0.1/0.1/1.1 units).","trap":"Match each date (or state) separately; scale units by cash flow ratio, not by price.","src":"Lecture 2b bond arbitrage video; HW1 Q4"},"riskaverse":{"t":"Risk and the time value of money","ch":"Ch 3/4","what":"A euro today is worth more than a euro later because of impatience, inflation and risk. Risk-averse investors discount risky cash flows at a higher rate (risk premium). The risk-free rate compensates only for time.","why":"Investors must be paid extra to bear risk, so riskier cash flows are worth less today.","link":"Discount rate = opportunity cost of capital of equal risk (Ch 5). Expected return of a risky bond &lt; its YTM (Ch 6).","trap":"With a given discount rate, PV is computed the same way for everyone: an investor is indifferent between two cash flows with the same PV (Canvas Ch 3 Q1).","src":"Lectures 1a–3b, Berk & DeMarzo"},"timetravel":{"t":"Three rules of time travel","ch":"Ch 4","what":"(1) Only compare or combine values at the same point in time. (2) Move forward: FV = C × (1+r)<sup>n<\/sup> (compounding). (3) Move backward: PV = C ÷ (1+r)<sup>n<\/sup> (discounting).","why":"Money can be invested at r, so C today grows to C(1+r)<sup>n<\/sup>; reversing gives the PV.","link":"Every formula in Ch 4–8 is a shortcut for adding many discounted cash flows.","trap":"Count periods carefully: a cash flow at the end of year 3 is discounted 3 times, not 2 or 4.","src":"Lectures 1a–3b, Berk & DeMarzo"},"perpetuity":{"t":"Perpetuity and growing perpetuity","ch":"Ch 4","what":"Constant C forever, first payment at t = 1: PV = C/r. Growing at g: PV = C<sub>1<\/sub>/(r − g), valid only if r &gt; g. g can be negative (declining).","why":"The PV of an infinite stream is finite because far-away cash flows are discounted to almost nothing. Higher g raises PV.","link":"Annuity = difference of two perpetuities. Growing perpetuity gives the IRR shortcut IRR = C<sub>1<\/sub>/I + g, and the terminal value in Ch 8.","trap":"C<sub>1<\/sub> is the <b>first<\/b> cash flow (time 1). If the first cash flow is at t = 0, value = C<sub>0<\/sub> + C<sub>0<\/sub>(1+g)/(r − g). If it starts at t = n+1, the formula gives the value at t = n: discount n periods. r − g with negative g: 0.08 − (−0.03) = 0.11. g need not be positive, but r must exceed g.","src":"Lectures 1a–3b, Berk & DeMarzo"},"annuity":{"t":"Annuity and growing annuity","ch":"Ch 4","what":"N equal payments, first at t = 1: PV = C/r × (1 − 1/(1+r)<sup>N<\/sup>). Growing: PV = C/(r − g) × (1 − ((1+g)/(1+r))<sup>N<\/sup>). FV of annuity = PV × (1+r)<sup>N<\/sup>.","why":"An annuity is a perpetuity that starts now minus one that starts after N periods.","link":"Loans (solve for C), savings plans (FV), bond coupons, project cash flows.","trap":"N = number of <b>payments<\/b>. The formula gives the value one period before the first payment.","src":"Lectures 1a–3b, Berk & DeMarzo"},"timing":{"t":"Early and late (delayed) cash flow streams","ch":"Ch 4","what":"Formulas assume the first cash flow at t = 1. First at t = 0 (annuity due): multiply by (1+r). First at t = k: the formula gives the value at t = k − 1; divide by (1+r)<sup>k−1<\/sup>.","why":"Every payment arrives one period earlier (or later), so every PV is multiplied (divided) by (1+r).","link":"Delayed projects (plant takes 3 years to build → first CF at t = 4), royalties starting at t = 3 (HW3), Amazon FCF perpetuity starting at t = 5.","trap":"Most common exam trap: discounting by k instead of k − 1 periods. 'Takes 2 years to build, end-of-year cash flows' → first CF at t = 3.","src":"Lectures 1a–3b, Berk & DeMarzo"},"fv_annuity":{"t":"Future value of an annuity / savings plans","ch":"Ch 4","what":"FV at the time of the last payment = PV annuity × (1+r)<sup>N<\/sup>. To reach a target FV with equal end-of-year deposits: C = FV ÷ [((1+r)<sup>N<\/sup> − 1)/r].","why":"Each deposit earns interest until the end date; it is easier to find the PV then compound.","link":"Value n years after the last payment: compound n more periods (n = N + extra years).","trap":"'Including the year you buy the house' + first deposit at end of this year → N = number of years (7), not 6 or 8.","src":"Lectures 1a–3b, Berk & DeMarzo"},"loan":{"t":"Amortising loans and loan tables","ch":"Ch 4/5","what":"Payment C solves Loan = C/r × (1 − 1/(1+r)<sup>N<\/sup>). Each period: interest = r × opening balance; repayment = C − interest; closing balance = opening − repayment.","why":"A fair loan has a balance equal to the PV of the remaining payments.","link":"APR with monthly compounding → monthly rate = APR/12 (Ch 5).","trap":"Interest paid falls over time, repayment rises; the payment is constant.","src":"Lectures 1a–3b, Berk & DeMarzo"},"irr":{"t":"Internal rate of return (IRR)","ch":"Ch 4/7","what":"The discount rate that makes NPV = 0. Single cash flow: IRR = (FV/PV)<sup>1/n<\/sup> − 1. Perpetuity: C/I. Growing perpetuity: C<sub>1<\/sub>/I + g. Otherwise trial and error.","why":"IRR is the average return the project earns on its own money; compare with the cost of capital.","link":"Bond YTM is the IRR of a bond. IRR − cost of capital = maximum estimation error that leaves the decision unchanged.","trap":"IRR says nothing about scale or value (200→300 gives the same 14.47% as 200m→300m).","src":"Lectures 1a–3b, Berk & DeMarzo"},"apr_ear":{"t":"APR vs EAR and converting rates","ch":"Ch 5","what":"EAR = the actual annual return including compounding. APR = simple (non-compounded) interest per year: rate per period × k. Rate per period = APR/k. 1 + EAR = (1 + APR/k)<sup>k<\/sup>. Convert an effective rate between periods with exponents: r<sub>month<\/sub> = (1 + EAR)<sup>1/12<\/sup> − 1; r<sub>quarter<\/sub> = (1 + r<sub>month<\/sub>)<sup>3<\/sup> − 1.","why":"APR is a quoting convention and cannot be used directly to discount; only effective rates can.","link":"Always match the rate to the cash flow period (monthly payments → monthly effective rate).","trap":"Never divide an <b>EAR<\/b> by 12. Never use APR directly. Higher compounding frequency → higher EAR for the same APR. An APR is not 'interest without compounding effect' in the EAR sense: the EAR <b>includes<\/b> compounding (2024 Q1).","src":"Lectures 1a–3b, Berk & DeMarzo"},"matchperiod":{"t":"Match the rate to the cash flow period","ch":"Ch 5","what":"Recipe: (1) identify the cash flow type; (2) convert the rate to the cash flow period; (3) count the periods; (4) apply PV/FV. Change the rate, never the cash flows.","why":"Discounting must use the return available over exactly one payment interval.","link":"Semi-annual bonds (y/2, 2N periods), monthly loans, quarterly projects.","trap":"Quarterly cash flows with a monthly-compounded APR: r<sub>q<\/sub> = (1 + APR/12)<sup>3<\/sup> − 1, not APR/4.","src":"Lectures 1a–3b, Berk & DeMarzo"},"realrate":{"t":"Nominal vs real rates; inflation","ch":"Ch 5","what":"1 + r<sub>real<\/sub> = (1 + r<sub>nominal<\/sub>)/(1 + inflation); approximately r<sub>nominal<\/sub> − inflation. Discount nominal cash flows at nominal rates and real at real.","why":"Inflation erodes purchasing power; the real rate is the growth in what you can buy.","link":"Term structure and the yield curve use nominal rates.","trap":"Exact: 1.0182/1.0028 − 1 = 1.536%, not 1.54% (Canvas Ch 5 Q2).","src":"Lectures 1a–3b, Berk & DeMarzo"},"yieldcurve":{"t":"Term structure / yield curve","ch":"Ch 5/6","what":"The interest rate depends on the investment horizon. The yield curve plots risk-free (zero-coupon) yields against maturity. Usually upward sloping; inverted when short rates exceed long rates (signals expected rate cuts / recession: a leading indicator). Discount a cash flow at time n with the n-year rate: PV = C/(1+r<sub>n<\/sub>)<sup>n<\/sup>.","why":"Expectations of future short rates (and risk) determine longer rates.","link":"Bond pricing with a yield curve (coupon bond = portfolio of zeros).","trap":"Short rates are <b>not always<\/b> lower than long rates (inverted curve). The yield curve is about maturity, not risk levels.","src":"Lectures 1a–3b, Berk & DeMarzo"},"oppcost":{"t":"Opportunity cost of capital","ch":"Ch 5","what":"The best expected return available in the market on an investment of comparable risk and term. It is the discount rate for NPV.","why":"Investing in the project means giving up that alternative return.","link":"Paying off a 7.94% loan earns 7.94% risk-free → that is the cost of capital for a risk-free project while debt is outstanding (Pearson A2 Q7).","trap":"Not 'the highest return in the market' (risk must match). For a risk-free project it is the risk-free rate (Treasury yield of the same term), not higher.","src":"Lectures 1a–3b, Berk & DeMarzo"},"bondbasics":{"t":"Bond terminology and cash flows","ch":"Ch 6","what":"Face value (par, principal) repaid at maturity; coupon = coupon rate × face value ÷ coupons per year; coupon rate is fixed in the contract and only sets the cash flows. Zero-coupon bond: no coupons, trades below face. A bond is debt, a fixed-income security; the issuer is legally obligated to pay; holders face default risk and interest-rate risk.","why":"The coupon rate is a contract term; the yield is a market rate that changes daily.","link":"Bond price = PV of coupons (annuity) + PV of face value.","trap":"Semi-annual: coupon per period = (coupon rate/2) × FV; yield per period = YTM/2; periods = 2 × years.","src":"Lectures 1a–3b, Berk & DeMarzo"},"ytm":{"t":"Bond price, YTM and premium/discount/par","ch":"Ch 6","what":"P = CPN × (1/y)(1 − 1/(1+y)<sup>N<\/sup>) + FV/(1+y)<sup>N<\/sup>. YTM is the single discount rate (IRR) that equates PV of promised payments to the price. Coupon rate &gt; YTM ⇔ price &gt; face (<b>premium<\/b>); = ⇔ par; &lt; ⇔ <b>discount<\/b>. Zero: YTM = (FV/P)<sup>1/n<\/sup> − 1.","why":"If the coupon pays more than the market requires, investors bid the price above face until the yield equals the market rate.","link":"With a yield curve: the YTM is a weighted average of the zero yields; compare it with the coupon rate. Prices move towards face value as maturity approaches (pull to par).","trap":"A premium bond is not 'better' (NPV of buying at fair price = 0). Zero-coupon bonds always trade at a discount. Price is the PV of coupons <b>and<\/b> face value.","src":"Lectures 1a–3b, Berk & DeMarzo"},"ratechange":{"t":"Interest-rate risk and duration","ch":"Ch 6","what":"When yields rise, bond prices fall. Longer maturity (higher duration) bonds and zero-coupon bonds react more.","why":"The far-away cash flows are discounted more times, so a rate change compounds over more periods.","link":"Holders of long bonds face more interest rate risk.","trap":"A 30-year zero falls <b>more<\/b> than a 2-year zero when rates rise.","src":"Lectures 1a–3b, Berk & DeMarzo"},"credit":{"t":"Credit risk, yield vs expected return, ratings","ch":"Ch 6","what":"Default-risky bonds promise cash flows that may not be paid. YTM is computed on promised cash flows, so YTM &gt; expected return. Credit spread = corporate yield − Treasury yield; higher for lower ratings (BBB and above investment grade; below = junk). Without credit risk, YTM = expected return.","why":"Investors price in expected default losses and require a risk premium.","link":"Opportunity cost of capital for bonds; MC 'which statement is false' favourites.","trap":"'The YTM is the return investors expect' is <b>false<\/b> when there is default risk. B-rated bonds have <b>higher<\/b> yields than A-rated.","src":"Lectures 1a–3b, Berk & DeMarzo"},"bondarb":{"t":"Bond arbitrage with zero-coupon bonds","ch":"Ch 6","what":"Method 1: replicate the coupon bond with zeros (units = cash flow ÷ 1000 per date) and compare prices. Method 2: compute each zero's yield and discount the coupon bond's cash flows with them. Both give the same no-arbitrage price.","why":"A coupon bond is a portfolio of zeros; by the law of one price it must cost the same.","link":"Lecture 2b example: 10% 3-year bond worth 0.1 × 972.14 + 0.1 × 939.62 + 1.1 × 906.24 = 1,188.04 but trades at 1,183.95 → buy the bond, sell the zeros.","trap":"Cheap bond → buy it, sell the replicating zeros (and vice versa).","src":"Lecture 2b; video 'Bond arbitrage'"},"npvrule":{"t":"NPV rule","ch":"Ch 7","what":"Accept a project if NPV &gt; 0; among mutually exclusive projects choose the highest NPV. NPV = −I<sub>0<\/sub> + Σ CF<sub>t<\/sub>/(1+r)<sup>t<\/sup>. The NPV profile plots NPV against r; it crosses zero at the IRR.","why":"NPV is the value created today; it is consistent with maximising shareholder value.","link":"Needs the cost of capital (opportunity cost of capital of equal risk). Basis for comparing with IRR, payback, PI.","trap":"Use the opportunity cost of capital, not the IRR, as the discount rate.","src":"Lectures 1a–3b, Berk & DeMarzo"},"irrrule":{"t":"IRR rule and when it fails","ch":"Ch 7","what":"Accept if IRR &gt; cost of capital. Works for a stand-alone project when all negative cash flows <b>precede<\/b> the positive ones. Fails with (1) delayed investment (benefits first, costs later → NPV increases in r, rule reversed), (2) multiple IRRs (sign changes more than once), (3) no IRR, and for mutually exclusive projects of different scale, timing or risk.","why":"IRR is a return, not a value; it ignores scale and can be ambiguous with non-standard cash flows.","link":"Book deal examples (Lecture 3a: +1,000,000 then −500,000 × 3; Book deal plus with IRRs 7.164% and 33.673%; Armstrong HW3).","trap":"'IRR &gt; cost of capital ⇒ NPV &gt; 0' is <b>not always<\/b> true → answer 'not enough information' (2018 Q11, mock Q14). For mutually exclusive projects pick the highest NPV, not IRR.","src":"Lectures 1a–3b, Berk & DeMarzo"},"payback":{"t":"Payback period (and accounting rate of return)","ch":"Ch 7","what":"Payback = time until cumulative (undiscounted) cash flows recover the initial investment. Accept if payback ≤ cutoff. Accounting rate of return = average accounting profit ÷ investment.","why":"Simple and intuitive; useful for liquidity-constrained firms. Graham (2022): still widely used.","link":"Ignores time value, risk, cost of capital, and cash flows after the cutoff.","trap":"A project can pass payback but have negative NPV (mock Q17) and vice versa. Cumulative cash flows: add until ≥ investment.","src":"Lecture 3a/3b; video 'NPV, IRR, payback and ARR'; Graham (2022)"},"pi":{"t":"Profitability index and resource constraints","ch":"Ch 7","what":"PI = NPV ÷ resource consumed (often the initial investment). With a single constrained resource, rank projects by <b>highest<\/b> PI and take them until the resource is used up. When PI fails (indivisible projects, multiple constraints) check all combinations for the highest total NPV.","why":"You want the most NPV per unit of the scarce resource.","link":"Extends the NPV rule; not a replacement for it.","trap":"PI = NPV/I, <b>not<\/b> PV/I (that gives 1 + PI: 2024 Q11). Rank from highest, not lowest (2018 Q12).","src":"Lectures 1a–3b, Berk & DeMarzo"},"mutual":{"t":"Mutually exclusive projects","ch":"Ch 7","what":"Only one can be taken: choose the highest NPV. Highest IRR can mislead when projects differ in scale (500% on €1 vs 20% on €1m), timing, or risk.","why":"Shareholders care about value added in euros, not percentage returns.","link":"Incremental IRR is another (more complex) method; NPV is simplest.","trap":"Zeus (IRR 23%, NPV 150k) vs Apollo (lower IRR, higher NPV): choose Apollo.","src":"Lectures 1a–3b, Berk & DeMarzo"},"graham":{"t":"Graham (2022): corporate finance in practice","ch":"Ch 7 · article","what":"Survey evidence: NPV and IRR are the most used capital budgeting tools, but payback remains popular (especially in smaller firms); firms use hurdle rates above their cost of capital and are slow to update them.","why":"Practitioners value simplicity and liquidity; theory and practice differ.","link":"Payback and IRR drawbacks vs NPV (Lecture 3b).","trap":"Popularity ≠ correctness: NPV is still the theoretically correct rule.","src":"Graham (2022) reading; Lecture 3b; video 'NPV, IRR, payback and ARR'"},"incremental":{"t":"Incremental earnings: what to include","ch":"Ch 8","what":"Include everything that changes because of the project: revenues, costs, depreciation, <b>opportunity costs<\/b> (lost rent, value of an owned resource in its best alternative use), externalities (cannibalisation), salvage and terminal values, extra overhead caused by the project. Exclude <b>sunk costs<\/b> (already paid or committed regardless: past R&amp;D, completed feasibility study), unchanged fixed overhead, and <b>interest<\/b> (financing decision, separation principle).","why":"Only differences between 'with' and 'without' the project change firm value.","link":"Unlevered net income = (Revenue − Costs − Depreciation)(1 − τ).","trap":"'Opportunity costs are paid regardless of the decision' is the definition of <b>sunk<\/b> costs (2024 Q18, false). Use the marginal tax rate, not the average. Maintenance of an already-owned warehouse is still a cost if it continues either way → not incremental only if unchanged.","src":"Lectures 1a–3b, Berk & DeMarzo"},"uni":{"t":"Unlevered net income","ch":"Ch 8","what":"UNI = EBIT × (1 − τ) = (Revenue − COGS − SG&amp;A − Depreciation) × (1 − τ). No interest expense.","why":"Projects are judged as if all-equity financed; financing is evaluated separately.","link":"First step of FCF.","trap":"Don't subtract interest on a bank loan; don't include the loan itself. Depreciation is subtracted here (for tax) and added back in FCF.","src":"Lectures 1a–3b, Berk & DeMarzo"},"fcf":{"t":"Free cash flow","ch":"Ch 8","what":"FCF = UNI + Depreciation − CapEx − ΔNWC. NWC = current assets − current liabilities (often receivables + inventory − payables). An increase in NWC is a cash outflow; recovering NWC at the end is an inflow.","why":"Converts accounting earnings into the cash actually available to all investors.","link":"PV of FCF = enterprise value (two-stage valuation with a terminal growing perpetuity).","trap":"Use the <b>change<\/b> in NWC, not the level. CapEx is not subtracted in UNI. Depreciation tax shield = τ × depreciation.","src":"Formula sheet; Lecture 3b; HW3"},"breakeven":{"t":"Break-even, sensitivity and scenario analysis","ch":"Ch 8","what":"Break-even: value of an input that makes NPV = 0 (for the discount rate, that is the IRR). Sensitivity: change one input at a time. Scenario: change several inputs together.","why":"Shows how robust the NPV is to estimation errors and which assumptions matter most.","link":"Break-even tax rate: set UNI-based NPV = 0 (Canvas Ch 8 Q5: 36%).","trap":"Break-even is about NPV = 0, not accounting profit = 0.","src":"Video 'NPV break-even'; Lecture 3b"},"terminal":{"t":"Two-stage valuation and terminal value","ch":"Ch 8","what":"Value = PV of explicit forecasts + PV of terminal value, where TV<sub>N<\/sub> = FCF<sub>N+1<\/sub>/(r − g) is a value at time N and must be discounted N periods. Share price = (EV + cash − debt)/shares.","why":"Explicit years capture specific forecasts; afterwards steady growth is assumed.","link":"Growing perpetuity timing rule (Ch 4).","trap":"If the perpetuity starts with the year-5 cash flow (40/(r − g)), its value is at t = 4: discount 4 periods (Amazon/CCM question).","src":"Lectures 1a–3b, Berk & DeMarzo"}},"F":[{"w":1,"n":"Effective tax rate (double taxation)","f":"τ<sub>eff<\/sub> = 1 − (1 − τ<sub>c<\/sub>)(1 − τ<sub>i<\/sub>)","lab":"LEARN","p":"Take what is left after the company tax, then what is left after the dividend tax; one minus that is the total share lost to tax.","tr":"Do not add the two rates.","src":"Textbook Ch 1; Canvas practice quiz Ch 1"},{"w":1,"n":"Market capitalisation","f":"Market cap = share price × shares outstanding","lab":"LEARN","p":"The market value of all the shares together.","tr":"Use the share price, never the book value per share.","src":"Lectures / formula sheet"},{"w":1,"n":"Enterprise value","f":"EV = market value of equity + interest-bearing debt − cash","lab":"LEARN","p":"What the business itself is worth: the shares plus the loans you take over, minus the cash you get.","tr":"Only debt that pays interest (not accounts payable). Subtract cash.","src":"Lecture 1a; Ch 2"},{"w":1,"n":"Market-to-book ratio","f":"MTB = market value of equity ÷ book value of equity","lab":"LEARN","p":"How many times the accounting value of the owners' stake the market pays.","tr":"Book value of equity may need to be backed out: total assets − total liabilities.","src":"Ch 2; ratio overview"},{"w":1,"n":"Price-earnings ratio","f":"P/E = share price ÷ EPS = market cap ÷ net income","lab":"LEARN","p":"How many euros investors pay for one euro of yearly profit.","tr":"EPS = net income ÷ shares.","src":"Ch 2; ratio overview"},{"w":1,"n":"EPS","f":"EPS = net income ÷ shares outstanding","lab":"LEARN","p":"Profit per share.","tr":"Shares from capital raised: shares = amount raised ÷ issue price.","src":"Kahoot Ch 2"},{"w":1,"n":"Net profit margin","f":"Net income ÷ sales","lab":"LEARN","p":"Share of every euro of sales that is left as profit.","tr":"Operating/gross margins are crossed out (not examined).","src":"Ratio overview"},{"w":1,"n":"Debt-equity ratio (book / market)","f":"Total debt ÷ book (or market) value of equity","lab":"LEARN","p":"Loans per euro of owners' money.","tr":"Book version uses book equity, market version market cap.","src":"Ratio overview"},{"w":1,"n":"Debt-to-enterprise value","f":"Net debt ÷ EV, net debt = debt − cash","lab":"LEARN","p":"Share of the business financed by net loans.","tr":"Can be negative if cash > debt.","src":"Ratio overview"},{"w":1,"n":"EV/Sales and EV/EBITDA","f":"EV ÷ sales; EV ÷ EBITDA","lab":"LEARN","p":"Price of the whole business per euro of sales (or operating cash profit).","tr":"Use EV, not market cap, when leverage differs (Pearson A1 Q8).","src":"Ratio overview"},{"w":1,"n":"Current ratio","f":"Current assets ÷ current liabilities","lab":"ON SHEET","p":"Can short-term assets pay short-term bills?","tr":"","src":"Formula sheet"},{"w":1,"n":"EBIT/interest coverage","f":"EBIT ÷ interest expense","lab":"ON SHEET","p":"How many times operating profit covers the interest bill.","tr":"Mydeco question uses EBITDA/interest: not on the sheet, same idea with EBITDA.","src":"Formula sheet"},{"w":1,"n":"Debt-to-capital","f":"Total debt ÷ (total equity + total debt)","lab":"ON SHEET","p":"Share of all financing that is debt.","tr":"","src":"Formula sheet"},{"w":1,"n":"Return on equity","f":"Net income ÷ book value of equity","lab":"ON SHEET","p":"Profit per euro of the owners' accounting money.","tr":"Book, not market, equity.","src":"Formula sheet"},{"w":1,"n":"Working capital days","f":"Inventory days = inventory ÷ (COGS/365); AR days = AR ÷ (sales/365); AP days = AP ÷ (COGS/365)","lab":"ON SHEET","p":"How many days of cost (or sales) are tied up in stock, unpaid customer bills, or unpaid supplier bills.","tr":"Receivables use <b>sales<\/b>, inventory and payables use <b>COGS<\/b>.","src":"Formula sheet"},{"w":1,"n":"Present value of one cash flow","f":"PV = C ÷ (1 + r)<sup>n<\/sup>","lab":"PARTLY","p":"Money later is worth less today: divide by one plus the rate, once per year of waiting.","tr":"On the sheet as a sum; you must pick n.","src":"Formula sheet PV(CF)"},{"w":1,"n":"NPV","f":"NPV = −I<sub>0<\/sub> + Σ C<sub>t<\/sub> ÷ (1 + r)<sup>t<\/sup> = PV(benefits) − PV(costs)","lab":"PARTLY","p":"Value of what you get, minus the value of what you pay, both in today's money.","tr":"Sheet gives the sum of PVs; include the initial cost with a minus sign.","src":"Formula sheet PV(CF); Lecture 1a"},{"w":1,"n":"No-arbitrage price","f":"Price = PV of the cash flows = Σ units × price of replicating securities","lab":"LEARN","p":"Something that pays exactly the same as a package must cost the same as the package.","tr":"Match cash flows date by date (or state by state).","src":"Lecture 2b; Ch 3"},{"w":2,"n":"Future value","f":"FV<sub>n<\/sub> = PV × (1 + r)<sup>n<\/sup>","lab":"ON SHEET","p":"Money today grows by one plus the rate, every year.","tr":"","src":"Formula sheet"},{"w":2,"n":"PV of a cash flow stream","f":"PV = Σ C<sub>n<\/sub> ÷ (1 + r)<sup>n<\/sup>","lab":"ON SHEET","p":"Discount each payment separately and add them up.","tr":"","src":"Formula sheet"},{"w":2,"n":"Perpetuity / growing perpetuity","f":"PV = C ÷ (r − g) (g = 0 for a constant perpetuity)","lab":"PARTLY","p":"A payment that lasts forever is worth the first payment divided by the rate minus the growth.","tr":"C is the payment at t = 1; value is at t = 0; needs r > g. Shift for early/late starts.","src":"Formula sheet"},{"w":2,"n":"Annuity","f":"PV = C × (1/r) × (1 − 1/(1 + r)<sup>N<\/sup>)","lab":"PARTLY","p":"N equal payments, the first one a year from now.","tr":"N = number of payments; adjust timing; rate must match payment period.","src":"Formula sheet"},{"w":2,"n":"Growing annuity","f":"PV = C × 1/(r − g) × (1 − ((1 + g)/(1 + r))<sup>N<\/sup>)","lab":"PARTLY","p":"N payments that grow by g each period, the first a period from now.","tr":"Declining: g negative, so r − g = r + |g|.","src":"Formula sheet"},{"w":2,"n":"FV of an annuity","f":"FV<sub>N<\/sub> = PV<sub>annuity<\/sub> × (1 + r)<sup>N<\/sup> = C × ((1 + r)<sup>N<\/sup> − 1)/r","lab":"PARTLY","p":"What all deposits are worth on the day of the last deposit.","tr":"Value n later: × (1 + r)<sup>n<\/sup> more (Canvas uses N = 10, n = 15).","src":"Formula sheet (FV + annuity); Lecture 2b"},{"w":2,"n":"Annuity due / delayed start","f":"Starts at t = 0: × (1 + r). Starts at t = k: ÷ (1 + r)<sup>k−1<\/sup>","lab":"LEARN","p":"If every payment comes one period sooner, everything is worth (1 + r) more; if later, divide.","tr":"Delay of k periods from t = 1 is k − 1 extra discounting steps.","src":"Lecture 2a/2b"},{"w":2,"n":"Loan payment","f":"C = Loan × r ÷ (1 − (1 + r)<sup>−N<\/sup>)","lab":"PARTLY","p":"Equal payment that pays off a loan with interest.","tr":"Use the rate per payment period.","src":"Annuity formula rearranged"},{"w":2,"n":"IRR of one cash flow","f":"IRR = (FV ÷ PV)<sup>1/n<\/sup> − 1","lab":"LEARN","p":"The yearly growth rate that turns what you pay into what you get.","tr":"n can be a fraction (3 years 8 months = 3.667).","src":"Lecture 2a"},{"w":2,"n":"EAR from APR","f":"1 + EAR = (1 + APR/k)<sup>k<\/sup>","lab":"ON SHEET","p":"Yearly return when interest is added k times a year.","tr":"k = 2 semi-annual, 4 quarterly, 12 monthly, 52 weekly, 365 (or 360) daily.","src":"Formula sheet"},{"w":2,"n":"Rate per period from APR","f":"r<sub>period<\/sub> = APR ÷ k","lab":"LEARN","p":"APR is just the period rate times the number of periods.","tr":"Only for APR, never for EAR.","src":"Lecture 2b"},{"w":2,"n":"Converting effective rates","f":"r<sub>short<\/sub> = (1 + r<sub>long<\/sub>)<sup>1/m<\/sup> − 1; r<sub>long<\/sub> = (1 + r<sub>short<\/sub>)<sup>m<\/sup> − 1","lab":"LEARN","p":"Switch between monthly, quarterly and yearly effective rates with powers, not by dividing.","tr":"Quarter = 3 months: (1 + r<sub>m<\/sub>)<sup>3<\/sup> − 1.","src":"Lecture 2b; Canvas mastery"},{"w":2,"n":"Real interest rate","f":"1 + r<sub>real<\/sub> = (1 + r)/(1 + i)","lab":"LEARN","p":"Growth of what your money can buy.","tr":"Approximation r − i is not exact enough for 3-decimal answers.","src":"Ch 5"},{"w":2,"n":"Multi-year rate from one-year rates","f":"(1 + r<sub>n<\/sub>)<sup>n<\/sup> = (1 + r<sub>1<\/sub>)(1 + r<sub>2<\/sub>)…(1 + r<sub>n<\/sub>)","lab":"LEARN","p":"Several yearly rates combine by multiplying growth factors.","tr":"Annualised: take the n-th root.","src":"HW2 Q2"},{"w":2,"n":"After-tax rate","f":"r<sub>after tax<\/sub> = r × (1 − τ)","lab":"LEARN","p":"Tax takes part of the interest.","tr":"","src":"Ch 5"},{"w":2,"n":"Coupon payment","f":"CPN = coupon rate × face value ÷ coupons per year","lab":"LEARN","p":"The fixed interest payment of a bond.","tr":"Coupon rate never discounts anything.","src":"Ch 6"},{"w":2,"n":"Zero-coupon bond price / YTM","f":"P = FV ÷ (1 + YTM)<sup>n<\/sup>; YTM = (FV/P)<sup>1/n<\/sup> − 1","lab":"LEARN","p":"A zero is one cash flow: discount it, or find its growth rate.","tr":"Not on the sheet as such (sheet has the coupon bond version).","src":"Ch 6"},{"w":2,"n":"Coupon bond price (yield curve)","f":"P = CPN/(1 + YTM<sub>1<\/sub>) + CPN/(1 + YTM<sub>2<\/sub>)<sup>2<\/sup> + … + (CPN + FV)/(1 + YTM<sub>n<\/sub>)<sup>n<\/sup>","lab":"ON SHEET","p":"Discount each coupon and the final repayment with the rate for its own maturity.","tr":"With one YTM: use the annuity + face value version.","src":"Formula sheet"},{"w":2,"n":"Coupon bond price (single YTM)","f":"P = CPN × (1/y)(1 − 1/(1 + y)<sup>N<\/sup>) + FV/(1 + y)<sup>N<\/sup>","lab":"PARTLY","p":"Coupons are an annuity; add the discounted face value.","tr":"Semi-annual: y/2, 2N periods, CPN/2.","src":"Formula sheet (annuity + PV)"},{"w":2,"n":"Premium / par / discount","f":"Coupon rate > YTM ⇔ P > FV; = ⇔ P = FV; < ⇔ P < FV","lab":"LEARN","p":"Pays more than the market wants → priced above face.","tr":"","src":"Ch 6"},{"w":2,"n":"Credit spread","f":"Spread = corporate yield − Treasury yield","lab":"LEARN","p":"Extra yield for default risk.","tr":"","src":"Ch 6"},{"w":3,"n":"IRR rule","f":"Accept if IRR > cost of capital (only if negative cash flows come first)","lab":"LEARN","p":"Take it if the project's own return beats what you could earn elsewhere at the same risk.","tr":"Fails for delayed investments, multiple IRRs, mutually exclusive projects.","src":"Lecture 3a"},{"w":3,"n":"IRR shortcuts","f":"Perpetuity: IRR = C/I; growing perpetuity: IRR = C<sub>1<\/sub>/I + g","lab":"LEARN","p":"For a project that pays forever, its return is payment over cost (plus growth).","tr":"","src":"Lecture 3a"},{"w":3,"n":"Maximum error in cost of capital","f":"IRR − cost of capital","lab":"LEARN","p":"How far the discount rate estimate can be off before the decision changes.","tr":"","src":"Lecture 3a; Pearson A3 Q1"},{"w":3,"n":"Payback period","f":"Years until cumulative cash flows ≥ initial investment","lab":"LEARN","p":"How long until you have your money back (no discounting).","tr":"Ignores everything after the cutoff.","src":"Lecture 3b"},{"w":3,"n":"Profitability index","f":"PI = NPV ÷ resource consumed (e.g. initial investment)","lab":"LEARN","p":"Value created per euro of the scarce resource.","tr":"Not PV/I.","src":"Lecture 3b; Ch 7"},{"w":3,"n":"Unlevered net income","f":"UNI = (Revenue − Costs − Depreciation) × (1 − τ) = EBIT × (1 − τ)","lab":"PARTLY","p":"Profit of the project as if it had no loans, after tax.","tr":"On the sheet only inside the FCF formula; no interest.","src":"Formula sheet (FCF); Lecture 3b"},{"w":3,"n":"Free cash flow","f":"FCF = UNI + Depreciation − CapEx − ΔNWC","lab":"ON SHEET","p":"Profit after tax, add back the non-cash cost, minus money spent on machines and on extra working capital.","tr":"Use the change in NWC.","src":"Formula sheet"},{"w":3,"n":"Net working capital","f":"NWC = current assets − current liabilities (≈ receivables + inventory − payables)","lab":"LEARN","p":"Money tied up in daily operations.","tr":"Increase = outflow; recovery at the end = inflow.","src":"Lecture 3b"},{"w":3,"n":"Depreciation (straight line) and tax shield","f":"Dep = (cost − salvage) ÷ life; tax shield = τ × Dep","lab":"LEARN","p":"Spread the machine's cost evenly; that cost lowers tax.","tr":"","src":"Ch 8"},{"w":3,"n":"Terminal value","f":"TV<sub>N<\/sub> = FCF<sub>N+1<\/sub> ÷ (r − g), discount N periods","lab":"LEARN","p":"Value of all cash flows after the forecast years, measured at the last forecast year.","tr":"If you use FCF<sub>N<\/sub>/(r − g), the value is at N − 1.","src":"Ch 8"},{"w":3,"n":"Share price from FCF","f":"P = (PV(FCF) + cash − debt) ÷ shares","lab":"LEARN","p":"Business value plus cash minus loans, per share.","tr":"","src":"Ch 8; Canvas Ch 8 Q2"},{"w":3,"n":"Break-even input","f":"Input value where NPV = 0","lab":"LEARN","p":"How bad an assumption may get before the project loses value.","tr":"Break-even discount rate = IRR.","src":"Video 'NPV break-even'"}],"Fnote":"All formulas on the 2026-09 midterm formula sheet are midterm material. The final exam uses a different (final) formula sheet.","S":[{"title":"Corporation, statements, arbitrage","ch":"Ch 1, 2, 3 + Hart & Zingales (2017)","secs":[{"h":"Ch 1 · The corporation","html":"<p>A <b>sole proprietorship<\/b> (eenmanszaak) has one owner who is also manager and is personally liable. In a <b>partnership<\/b> (VOF, maatschap, CV) all partners are personally liable. An <b>LLC<\/b> (BV) and a <b>corporation<\/b> (NV) are legal entities: shareholders are <b>not<\/b> liable for the firm’s debts, and ownership is separated from control. NV shares trade on an exchange, BV shares do not. Corporate profit is taxed twice: corporate tax, then income tax on dividends.<\/p>\n<p><b>Objective:<\/b> maximize <b>shareholder value<\/b> (the value of the shares), not profit. Shareholders are the residual claimants (last in line), so in theory they care about everyone else too. This assumes no agency problems and that externalities are priced or regulated.<\/p>\n<p><b>Agency problem:<\/b> managers (agents) can pursue their own utility instead of shareholders’ (principals’), e.g. Tyco’s CEO Kozlowski. Remedies: board oversight, pay tied to performance, product-market competition, and takeovers after the share price falls.<\/p>\n<p><b>Trading:<\/b> you buy at the <b>ask<\/b>, sell at the <b>bid<\/b>; the <b>bid-ask spread<\/b> is the market maker’s profit.<\/p>","key":["Objective = maximise <b>shareholder value<\/b> (market value of shares), not profit.","Limited liability: shareholders lose at most what they invested; partners in a partnership are liable for <b>all<\/b> debts.","Double taxation: effective rate = 1 − (1 − τ<sub>c<\/sub>)(1 − τ<sub>i<\/sub>). Canvas: 18% and 12% → <b>27.8%<\/b>.","Buy at the ask, sell at the bid; the spread is a transaction cost."],"trap":["In bankruptcy a firm is not necessarily liquidated (it can be reorganised).","Maximising shareholder value ≠ maximising contribution to society (externalities).","Corporations suffer most from managerial agency problems (widely held shares)."],"th":["firmtypes","doubletax","goal","agency","bidask"]},{"h":"Ch 2 · Statements, market vs book value","html":"<p><b>Balance sheet:<\/b> Assets = Liabilities + Equity. <b>Income statement:<\/b> Sales − COGS = gross profit; − general costs − depreciation = operating income = <b>EBIT<\/b>; − interest = pretax income (EBT); − taxes = <b>net income<\/b>.<\/p>\n<p><b>Book value<\/b> is backward-looking (historical cost, accounting rules). <b>Market value<\/b> is forward-looking (expected cash flows, risk, sentiment). Market cap = share price × shares. Market-to-book = market value of equity ÷ book value of equity. Example: Firm Z, factory cost $100, pays $150 in 1 year at 8%: assets are worth 150/1.08 = $139, so equity = 139 − 40 = $99, share price $9.90, M/B = 99/60 = 1.65. A project with NPV $5 raises equity to $104 and the price to $10.40.<\/p>\n<p><b>Enterprise value<\/b> = market cap + debt − cash = value of the operating assets. Net debt = debt − cash.<\/p>\n<div class=\"scroll\"><table><tr><th>Ratio group<\/th><th>On midterm formula sheet<\/th><th>Learn by heart (not given)<\/th><\/tr>\n<tr><td>Liquidity, coverage, leverage<\/td><td>Current ratio, EBIT/interest, debt-to-capital<\/td><td>Debt-equity (book, market), debt-to-EV, net profit margin<\/td><\/tr>\n<tr><td>Working capital<\/td><td>AR days, AP days, inventory days<\/td><td>–<\/td><\/tr>\n<tr><td>Returns, valuation<\/td><td>ROE<\/td><td>M/B, P/E, EV/Sales, EV/EBITDA<\/td><\/tr><\/table><\/div>\n<p>Per your screenshot, the crossed-out ratios (margins except net, quick, cash, equity multipliers, EV/EBIT, asset turnover, ROA, ROIC, EBITDA coverage) are excluded.<\/p>","key":["Market cap = price × shares. MTB = market cap ÷ book equity. EV = market cap + interest-bearing debt − cash.","HW1 Coca-Cola: market cap 2017 = 41.74 × 4.345 = <b>$181.36 bn<\/b>; 2018 = 46.07 × 4.261 = <b>$196.30 bn<\/b>; change = <b>$14.94 bn<\/b>.","Mock midterm Eiffel: EV = 10.5 × 39.90 + 132 − 20 = <b>$530.95 bn<\/b>.","Ratios on the sheet: current, EBIT/interest, debt-to-capital, ROE, AR/AP/inventory days. Learn: MTB, P/E, EV/Sales, EV/EBITDA, D/E, net margin, debt-to-EV."],"trap":["Accounts payable is not interest-bearing debt.","Book equity 'missing'? Equity = total assets − total liabilities.","Change in MTB = MTB<sub>new<\/sub> − MTB<sub>old<\/sub> (Chaindrinkers: 3.97 − 3.00 = 0.97).","<b>Not examined<\/b> (crossed out on the ratio overview): gross, operating and EBIT margin, quick and cash ratio, equity multipliers, EV/EBIT, asset turnover, ROA, ROIC, EBITDA/interest."],"th":["statements","bookmarket","ev","ratios"]},{"h":"Profit versus cash flow","html":"<p>Profit follows accounting rules; cash flow follows money. Revenues are not always inflows and costs not always outflows. <b>Cash flow = profit − increase in NWC<\/b>, where NWC = current assets − current liabilities (here accounts receivable − accounts payable). Example: sales 100 (80 received), COGS 70 (60 paid): profit 30, cash flow 20, increase in NWC 10.<\/p>\n<ul><li>Taxes are based on profit: 30% of EBIT 30 = 9, so cash flow = 21 − 10 = 11.<\/li><li><b>Capex<\/b> is a cash outflow but not a cost. <b>Depreciation<\/b> is a cost but not a cash outflow. It creates a <b>depreciation tax shield<\/b> (tax rate × depreciation).<\/li><li>Inventory purchases are cash outflows that are not in profit.<\/li><\/ul>\n<p><b>FCF = unlevered net income + depreciation − capex − increase in NWC.<\/b> Example: 15.4 + 8 − 24 − 10 = −10.6. Free cash flow excludes financing flows (separation principle); unlevered net income ignores interest.<\/p>","key":["Cash flow = profit − increase in NWC (credit sales/purchases).","Depreciation: a cost, not a cash flow (but saves tax). CapEx: a cash flow, not a cost."],"trap":["Inventory bought but not sold reduces cash but not profit."],"th":["profitcash","fcf"]},{"h":"Ch 3 · Valuation, arbitrage, law of one price","html":"<p>Use <b>market prices<\/b> to get cash values, but only in <b>competitive markets<\/b> (same price to buy and sell, ignoring transaction costs). A euro today beats a euro next year because you can invest it. Compare only at the <b>same moment<\/b>: <b>PV<\/b> = CF/(1+r) (discounting), <b>FV<\/b> = CF×(1+r) (compounding). Value a stream by adding the PVs.<\/p>\n<p><b>NPV<\/b> = PV(benefits) − PV(costs). Take the highest-NPV alternative; accept NPV &gt; 0. Invest 8 to get 9 at 10%: NPV = −8 + 9/1.10 = 0.18 &gt; 0, so accept.<\/p>\n<p><b>Arbitrage:<\/b> profit without risk or net investment (rare). <b>No-arbitrage price<\/b> = PV of all cash flows. A <b>normal market<\/b> has no arbitrage. Then the <b>law of one price<\/b> holds (equivalent assets trade at one price), which gives <b>value additivity<\/b>: Price(A+B) = Price(A) + Price(B), and firm value V = D + E. It also gives the <b>separation principle<\/b>: buying or selling securities has NPV 0, so investment decisions can be separated from financing decisions.<\/p>\n<p><b>Bond arbitrage method:<\/b> match the coupon bond’s cash flows with zero-coupon bonds and compare prices. Zeros at 972.14, 939.62 and 906.24: the 10% coupon bond is worth 0.1×972.14 + 0.1×939.62 + 1.1×906.24 ≈ $1188, but trades at $1183.95. Buy the cheap bond, sell the replicating zeros.<\/p>","key":["Arbitrage = profit with <b>no risk and no investment<\/b>. No-arbitrage price = PV of the cash flows.","HW1 Q4: S3 (€60 in 1 yr + €60 in 2 yrs) no-arbitrage price <b>€95<\/b>.","Canvas Ch 3 Q4: C = 1·A + 5·B → 200 + 5 × 600 = <b>$3,200<\/b>.","Promotion deal (2018 Q2 / mock Q6): PV = 50,000 + 50,000/1.05 + 50,000/1.05² = 142,970.52 → save <b>$7,029.48<\/b>."],"trap":["Price above no-arbitrage value → <b>sell<\/b> (short) it and buy the replicating portfolio.","Short sale = selling a borrowed security. A long sale is not the term.","An office building is <b>less<\/b> liquid than a listed share."],"th":["valuation","arbitrage","replicate","riskaverse"]},{"h":"Article · Hart & Zingales (2017)","html":"<p>Friedman argued managers should make as much money as possible within the rules. Hart and Zingales say <b>shareholder welfare ≠ market value<\/b>: shareholders are prosocial and care about more than money. Friedman’s <b>separability<\/b> assumption (let companies make money and let people give to charity) fails when profit and damage are inseparable, e.g. oil digging, or Walmart selling high-capacity magazines. Politics also does not fix everything.<\/p>\n<p><b>Amoral drift:<\/b> hostile bidders only care about money, and dispersed shareholders tender anyway (collective action problem), so takeovers push firms from clean to dirty. There is no mirror-image drift, because nobody gains by buying a dirty firm to clean it. <b>Voting<\/b> by shareholders avoids this asymmetry. Authors’ proposal: managers and asset managers follow investors’ preferences, via votes or polls. Fiduciary duty is not just maximizing value (the Shkreli example). Prefer <b>invest and engage<\/b> over divestment.<\/p>","key":["Shareholder welfare ≠ market value when profit and social damage are inseparable.","Amoral drift: one-way pressure towards 'dirty' policies in takeovers.","Prefer invest-and-engage (voting) over divestment."],"trap":["Authors do not favour divestment.","Friedman's separability assumption is what they reject."],"th":["hz"]}]},{"title":"Time value, interest rates, bonds","ch":"Ch 4, 5, 6","secs":[{"h":"Ch 4 · Time value of money","html":"<p>$1 now is worth more than $1 later because of <b>impatience<\/b> (people prefer consumption now), <b>inflation<\/b> (money loses value) and <b>risk<\/b> (future cash flows are uncertain and people are risk averse).<\/p>\n<p><b>Three rules of time travel:<\/b> (1) only values at the <b>same point in time<\/b> can be compared or combined; (2) to move a cash flow forward, <b>compound<\/b> it: FV = C × (1+r)^n; (3) to move it backward, <b>discount<\/b> it: PV = C / (1+r)^n. Example at r = 5%: 1,000 today = 1,050 in a year. Both ways give the same answer, there is no preference. A stream is valued by adding the PV of each cash flow, and <b>NPV<\/b> &gt; 0 means invest.<\/p>","key":["Three rules of time travel: same date only; FV = C(1+r)<sup>n<\/sup>; PV = C/(1+r)<sup>n<\/sup>.","Kahoot: X × 1.08<sup>21<\/sup> = 5,033.83 → X = <b>$1,000<\/b>."],"trap":["Count periods from the timeline, not from the story."],"th":["timetravel","riskaverse"]},{"h":"Ch 4 · Perpetuities, annuities, loans, IRR","html":"<p><b>Perpetuity<\/b> (constant C forever): PV = C/r. <b>Growing perpetuity<\/b>: PV = C/(r − g), only valid if <b>g &lt; r<\/b>. <b>Annuity<\/b> (constant C for N periods): PV = C/r × (1 − 1/(1+r)^N). <b>Growing annuity<\/b>: PV = C/(r − g) × (1 − ((1+g)/(1+r))^N). <b>FV of an annuity<\/b> = PV × (1+r)^N. Example: $2m growing 4% for 10 years at 11%: PV = 2/0.07 × (1 − (1.04/1.11)^10) ≈ $13.68m.<\/p>\n<p><b>Early and late annuities:<\/b> the formula assumes the first payment at time 1. If it starts at time 0 (early), multiply by (1+r), because every payment arrives one period sooner. If it starts at time 2 (late), divide by (1+r). The same adjustment works for perpetuities: with C = 10 and r = 2%, first payment at time 1 gives 500, at time 0 gives 510, first payment at time 2 gives 500/1.02 ≈ 490.20.<\/p>\n<p><b>Loan payment<\/b> (solve for C): C = P × r / (1 − (1+r)^−N). A $100,000 loan at 8% over 10 years costs $14,903 per year. <b>IRR<\/b> is the rate that makes NPV = 0: turning 1,000 into 2,000 in 6 years gives (2)^(1/6) − 1 = 12.25%.<\/p><figure class='svg'><svg viewBox='0 0 380 120' role='img' aria-label='Annuity timing'>\n<line x1='20' y1='60' x2='370' y2='60' class='ax'/>\n<line x1='30' y1='54' x2='30' y2='66' class='ax'/><text x='26' y='82' class='lbl'>0<\/text><line x1='75' y1='54' x2='75' y2='66' class='ax'/><text x='71' y='82' class='lbl'>1<\/text><line x1='120' y1='54' x2='120' y2='66' class='ax'/><text x='116' y='82' class='lbl'>2<\/text><line x1='165' y1='54' x2='165' y2='66' class='ax'/><text x='161' y='82' class='lbl'>3<\/text><line x1='210' y1='54' x2='210' y2='66' class='ax'/><text x='206' y='82' class='lbl'>4<\/text><line x1='255' y1='54' x2='255' y2='66' class='ax'/><text x='251' y='82' class='lbl'>5<\/text><line x1='300' y1='54' x2='300' y2='66' class='ax'/><text x='296' y='82' class='lbl'>6<\/text><line x1='345' y1='54' x2='345' y2='66' class='ax'/><text x='341' y='82' class='lbl'>7<\/text>\n<text x='112' y='45' class='lbl'>C<\/text><text x='157' y='45' class='lbl'>C<\/text><text x='202' y='45' class='lbl'>C<\/text><text x='247' y='45' class='lbl'>C<\/text>\n<path d='M120,28 C100,10 85,10 75,28' class='c1'/><text x='60' y='20' class='lbl'>annuity formula gives value here (t = 2)<\/text>\n<text x='20' y='110' class='lbl'>First payment at t = 3 → PV<tspan baseline-shift='sub' font-size='8'>0<\/tspan> = formula ÷ (1+r)²<\/text>\n<\/svg><figcaption>Timing rule: the annuity/perpetuity formula always gives the value one period before the first payment.<\/figcaption><\/figure>","key":["HW2 Q1 smoking: C = 200 × €8.06 = €1,612 at 2%, 50 years → <b>€50,654<\/b>; forever → 1,612/0.02 = <b>€80,600<\/b>.","Canvas: 10 × $30 at 4% → 243.37; first at t = 3 → 243.37/1.04² = <b>224.97<\/b>; first at t = 0 → × 1.04 = <b>253.06<\/b>.","Savings: €200,000 house in 7 yrs at 3% → C = 200,000 × 0.03/(1.03<sup>7<\/sup> − 1) = <b>€26,101<\/b>.","Growing perpetuity first CF today: 5,000 + 5,000 × 1.01/0.03 = <b>€173,333<\/b>."],"trap":["Formula value is one period before the first payment.","r must exceed g; g may be negative.","N counts payments."],"th":["perpetuity","annuity","timing","fv_annuity","loan","irr"]},{"h":"Ch 5 · APR, EAR and matching the period","html":"<p><b>Key rule:<\/b> change the interest rate to match the cash flow period, never the cash flows to match the rate. <b>APR<\/b> is simple interest per year without compounding: 1% per month is 12% APR with monthly compounding. <b>EAR<\/b> includes compounding: EAR = (1 + APR/k)^k − 1, so 1% per month = 1.01^12 − 1 = 12.68%. APR is a red flag: it cannot be used directly for PV or FV.<\/p>\n<p><b>Converting:<\/b> APR to period rate: divide by k (9% APR, quarterly → 2.25%). EAR to period rate: (1+EAR)^(1/k) − 1 (9% EAR → 1.09^(1/4) − 1 = 2.18% per quarter, 0.72% per month).<\/p>\n<p><b>Four steps for a time-value question:<\/b> (1) which cash flow form (annuity, perpetuity…); (2) which rate matches the cash flow period; (3) how many periods; (4) PV or FV. Example: $5 per month for 18 years at 6% APR: monthly rate 0.5%, N = 216, PV = 659.49, FV = 659.49 × 1.005^216 = 1,936.77. An <b>annuity (amortizing) loan<\/b> has equal payments, each part interest and part repayment, and the loan is fully repaid at time N. A <b>fair loan<\/b> has a balance equal to the PV of its payments: that PV is what you can borrow.<\/p>","key":["1 + EAR = (1 + APR/k)<sup>k<\/sup>. APR/k is the rate per period. Effective ↔ effective: use powers.","Canvas: APR 8.2% monthly → 0.6833% per month, EAR 8.52%. 2% per month → 26.82% per year, 6.12% per quarter.","2024 Q7: 12% APR quarterly → 3% per quarter → (1.03)<sup>1/3<\/sup> − 1 = <b>0.99% ≈ 1%<\/b> per month."],"trap":["Never divide an EAR by 12.","APR cannot be used directly to discount.","Same APR, more frequent compounding → higher EAR."],"th":["apr_ear","matchperiod","loan"]},{"h":"Ch 5 · What determines interest rates","html":"<p><b>Nominal rates<\/b> are the quoted ones and discount nominal cash flows. <b>Real rate:<\/b> (1 + r) = (1 + rr)(1 + i), so rr ≈ r − i. Use nominal with nominal, or real with real. 6% nominal with 2% inflation gives 3.92% real.<\/p>\n<p><b>Term structure / yield curve:<\/b> the interest rate depends on maturity, and the yield curve plots EAR against term. It is usually upward sloping (normal); it is <b>inverted<\/b> when short rates are above long rates, which signals that investors expect lower future rates. Tutorial: one-year rates 2%, 1%, 0%, 0% give EARs of 2%, 1.499%, 0.997% and 0.75%. Match the term: discount a year-3 cash flow at the 3-year rate (10/1.00997^3 = $9.71, same as 10/(1.02 × 1.01 × 1.00)).<\/p>\n<p><b>Taxes:<\/b> use the after-tax rate, r × (1 − τ). <b>Risk:<\/b> riskier cash flows get a higher discount rate; use expected cash flows. The <b>opportunity cost of capital<\/b> is the best expected return available on an investment of comparable risk and term, and it is the discount rate you should use.<\/p><figure class='svg'><svg viewBox='0 0 360 170' role='img' aria-label='Yield curves'>\n<line x1='40' y1='140' x2='345' y2='140' class='ax'/><line x1='40' y1='15' x2='40' y2='140' class='ax'/>\n<path d='M45,120 C120,70 220,55 340,48' class='c1'/><text x='250' y='42' class='lbl'>normal (upward)<\/text>\n<path d='M45,40 C120,80 220,100 340,105' class='c2'/><text x='250' y='122' class='lbl'>inverted (HW2: 2%, 1.5%, 1.0%, 0.75%)<\/text>\n<text x='300' y='158' class='lbl'>maturity<\/text><text x='2' y='12' class='lbl'>yield<\/text>\n<\/svg><figcaption>Yield curve = zero-coupon (EAR) yields by maturity. Inverted when short rates exceed long rates.<\/figcaption><\/figure>","key":["Real rate: 1.0182/1.0028 − 1 = <b>1.536%<\/b>.","Discount a year-n cash flow with the n-year rate.","Opportunity cost of capital = expected return on alternatives with equal risk and term."],"trap":["Short rates are not always below long rates (inverted curve).","For a risk-free project the cost of capital is not above the Treasury yield."],"th":["realrate","yieldcurve","oppcost"]},{"h":"Ch 6 · Bonds, prices and yields","html":"<p>A <b>bond<\/b> is a tradeable debt contract. The issuer receives money now and promises coupons plus the <b>face value<\/b> at maturity; the holder carries the default risk. The coupon payment is CPN = coupon rate × face value / k. The <b>coupon rate only sets the cash flows<\/b>, it is never the discount rate. Equity, in contrast, promises no fixed cash flows. <i>Advantages of bonds:<\/i> easy external capital, cheaper than bank loans for large amounts, no voting rights, tax shield. <i>Disadvantages:<\/i> emission costs, fixed interest can trigger bankruptcy, default risk for the holder.<\/p>\n<p><b>Prices:<\/b> zero-coupon P = FV/(1+YTM)^n. Coupon bond P = CPN × annuity factor(y, N) + FV/(1+y)^N. <b>YTM<\/b> is the IRR of the promised cash flows, quoted as an APR (5% per 6 months = 10%). Price &lt; face = <b>discount<\/b> bond, = face = <b>par<\/b>, &gt; face = <b>premium<\/b>. Example: 6% coupon, semi-annual, 10 years, YTM 7.5% APR: 3.75% per period, 20 periods, P = 895.78. A zero priced at 96,618.36 for 100,000 in one year has YTM = 100,000/96,618.36 − 1 = 3.5%.<\/p>\n<p><b>Rates and prices move opposite:<\/b> when yields rise, prices fall, and the effect is bigger for longer maturities (<b>interest rate risk<\/b>). Tutorial: the 5-year, 6% semi-annual bond at 3% YTM costs 1,138.33; at 3.5% it costs 1,113.77; at 1,200 the YTM is 0.90% per half-year (1.80% APR). A bond bought at its fair price has NPV = 0, otherwise investors would push the price until it does.<\/p><figure class='svg'><svg viewBox='0 0 360 170' role='img' aria-label='Price and yield'>\n<line x1='40' y1='140' x2='345' y2='140' class='ax'/><line x1='40' y1='15' x2='40' y2='140' class='ax'/>\n<path d='M45,25 C110,80 200,110 340,125' class='c1'/><line x1='40' y1='88' x2='345' y2='88' class='dash'/>\n<text x='260' y='82' class='lbl'>face value (par)<\/text><circle cx='140' cy='88' r='4' class='pt'/><text x='100' y='108' class='lbl'>YTM = coupon rate<\/text>\n<text x='55' y='40' class='lbl'>premium<\/text><text x='250' y='118' class='lbl'>discount<\/text>\n<text x='300' y='158' class='lbl'>YTM<\/text><text x='2' y='12' class='lbl'>price<\/text>\n<\/svg><figcaption>Bond price falls as the yield rises (convex). Above par when YTM &lt; coupon rate.<\/figcaption><\/figure>","key":["Price ↔ yield move opposite. Coupon > YTM ⇒ premium.","HW2 Q3: 6% semi-annual, 5 yrs, YTM 3% APR → 1.5% per half-year, 10 periods → <b>$1,138.33<\/b> (premium).","Canvas: zero $1,000, 3 yrs, $810 → YTM = (1000/810)<sup>1/3<\/sup> − 1 = <b>7.28%<\/b>."],"trap":["Zero-coupon bonds always trade at a discount.","A premium bond is not a 'better buy'.","Semi-annual: halve coupon and yield, double periods."],"th":["bondbasics","ytm","ratechange"]},{"h":"Ch 6 · Bond arbitrage and credit risk","html":"<p><b>Replicate a coupon bond<\/b> with zero-coupon bonds and compare prices (law of one price). Method 1, matching cash flows: a 10% annual, 3-year bond equals 0.1 of the 1-year zero, 0.1 of the 2-year zero and 1.1 of the 3-year zero: 0.1 × 972.14 + 0.1 × 939.62 + 1.1 × 906.24 = 1,188.04. If it trades below that, buy the bond and sell the zeros; if above, do the opposite. Method 2, yields: find each zero’s YTM and discount the coupon bond’s cash flows with them (book example: 100/1.035 + 100/1.04² + 1,100/1.045³ ≈ 1,153).<\/p>\n<p><b>Credit risk:<\/b> a bond’s promised yield (YTM, based on promised cash flows) is higher than its <b>expected return<\/b> (based on expected cash flows) when default is possible. The <b>yield spread<\/b> (credit or default spread) = corporate yield − Treasury yield: 3% − 2% = 1%. Ratings run from AAA to D; below BBB (Baa) is <b>speculative grade (junk)<\/b>. Quoted prices are <b>clean<\/b>; dirty (invoice) price = clean + accrued interest.<\/p>","key":["Coupon bond = portfolio of zeros. Lecture 2b: worth 1,188.04, trades 1,183.95 → buy bond, sell zeros.","With default risk: YTM (promised) > expected return. Spread = corporate − Treasury yield."],"trap":["'YTM is the expected return' is false with credit risk.","B-rated yield is higher than A-rated."],"th":["bondarb","credit"]}]},{"title":"Investment rules, capital budgeting","ch":"Ch 7, 8 + Graham & Harvey (2022)","secs":[{"h":"Ch 7 · NPV and the IRR rule","html":"<p><b>NPV<\/b> = −I₀ + PV(CF). Accept if NPV &gt; 0: what you receive is worth more than what you invest, and firm value rises by the NPV today. Invest $100 for $120 in a year at 10%: NPV = −100 + 120/1.10 = $9.09. Perpetuity project (invest 250, 35 per year forever, r = 10%): NPV = −250 + 35/0.10 = 100.<\/p>\n<p><b>IRR<\/b> = the discount rate that makes NPV = 0 (like a bond’s YTM). Accept if IRR &gt; opportunity cost of capital. Invest 100, get 120: IRR = 20%. Perpetuity: IRR = C/I (35/250 = 14%). Growing perpetuity: IRR = C₁/I + g (25/400 + 1% = 7.25%). IRR − cost of capital is the maximum error in your cost-of-capital estimate that leaves the decision unchanged (14% − 10% = 4 points).<\/p><figure class='svg'><svg viewBox='0 0 360 200' role='img' aria-label='NPV profile'>\n<line x1='40' y1='120' x2='345' y2='120' class='ax'/><line x1='40' y1='15' x2='40' y2='190' class='ax'/>\n<path d='M40,30 C110,70 170,105 215,120 S300,150 340,160' class='c1'/>\n<circle cx='215' cy='120' r='4' class='pt'/><text x='205' y='112' class='lbl'>IRR<\/text>\n<text x='300' y='135' class='lbl'>r<\/text><text x='5' y='20' class='lbl'>NPV<\/text>\n<text x='60' y='60' class='lbl'>NPV&gt;0: accept<\/text><text x='230' y='175' class='lbl'>NPV&lt;0: reject<\/text>\n<\/svg><figcaption>Standard project (cost first): NPV falls as r rises and crosses zero at the IRR. For a delayed investment (cash in first) the curve slopes up and the IRR rule reverses.<\/figcaption><\/figure>","key":["Pearson A3 Q1: $96.8m plant, $29.8m forever, 8.3% → NPV = 29.8/0.083 − 96.8 = <b>$262.2m<\/b>; IRR = 29.8/96.8 = <b>30.79%<\
