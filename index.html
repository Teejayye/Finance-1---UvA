co: did its EBITDA/interest coverage ratio ever fall below 2?","opts":["Mydeco's coverage ratio fell below 2 in 2023, where it was 1.93.","Mydeco's coverage ratio fell below 2 in 2021, where it was 1.97.","Mydeco's coverage ratio fell below 2 in 2020, where it was 1.99.","Mydeco's coverage ratio fell below 2 in 2022, where it was 1.95."],"ans":2,"why":null,"steps":"Official answer: 2020 (1.99).","th":["ratios"],"case":"mydeco2","keep":true,"model":null,"src":"pe1","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_7c":{"id":"pe1_7c","ch":"Ch 2","type":"mc","q":"Mydeco: overall, did its ability to meet interest payments improve or decline over 2019–2023?","opts":["Overall Mydeco's ability to meet its interest payments improved over this period, although it experienced a slight dip in 2021.","Overall Mydeco's ability to meet its interest payments improved over this period, although it experienced a slight dip in 2020.","Overall Mydeco's ability to meet its interest payments improved over this period, although it experienced a slight dip in 2022.","Overall Mydeco's ability to meet its interest payments improved over this period, although it experienced a slight dip in 2023."],"ans":1,"why":null,"steps":"Coverage 2.44 (2019) → 1.99 (2020) → … → 2.79 (2023): improved, dip in 2020.","th":["ratios"],"case":"mydeco2","keep":true,"model":null,"src":"pe1","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_8":{"id":"pe1_8","ch":"Ch 2","type":"num","q":"a. Compare the market capitalization-to-revenue ratio (price-to-sales) for United and Southwest. b. Compare the enterprise value-to-revenue ratio for United and Southwest. (Two decimals.)","blanks":[{"l":"a. UAL","a":0.59,"tol":0.005,"u":""},{"l":"a. LUV","a":1.61,"tol":0.005,"u":""},{"l":"b. UAL","a":1.44,"tol":0.005,"u":""},{"l":"b. LUV","a":1.41,"tol":0.005,"u":""}],"steps":"a. 14.6/24.6 = 0.59; 26.1/16.2 = 1.61. b. EV UAL = 14.6 + 39.4 − 18.5 = 35.5 → 1.44; EV LUV = 26.1 + 12.2 − 15.5 = 22.8 → 1.41.","th":["ev","ratios"],"case":"airlines","model":null,"pts":4,"src":"pe1","msrc":"official","srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_8c":{"id":"pe1_8c","ch":"Ch 2","type":"mc","q":"Which of these comparisons is more meaningful?","opts":["The enterprise value-to-revenue ratio, because market capitalization measures only the value of the firm's equity and the firms have very different leverage.","The market capitalization-to-revenue ratio, because it does not depend on the firms' debt.","Both are equally meaningful, because both divide by revenue.","Neither, because airlines have negative cash flows."],"ans":0,"why":["Correct (official drop-down answer).","Ignoring debt is exactly the problem when leverage differs.","Revenue belongs to all investors, so the numerator must be EV.","Irrelevant."],"steps":"Official text: the market cap to revenue ratio cannot be meaningfully compared when firms have different leverage, as market cap measures only equity; the EV to revenue ratio is more useful.","th":["ev"],"case":"airlines","keep":false,"model":null,"note":"Original is a fill-in-the-drop-downs question; rewritten here as MC with the official wording as answer A.","src":"pe1","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_9":{"id":"pe1_9","ch":"Ch 3","type":"num","q":"You run a construction firm. You have just won a contract to build a government office building. It will take one year to construct it, requiring an investment of $9.53 million today and $4.46 million in one year. The government will pay you $20.69 million upon the building's completion. Suppose the cash flows and their times of payment are certain, and the risk-free interest rate is 12%. a. What is the NPV of this opportunity? b. How can your firm turn this NPV into cash today? (amounts in $ millions)","blanks":[{"l":"a. NPV","a":4.96,"tol":0.01,"u":""},{"l":"b. Borrow today","a":18.47,"tol":0.01,"u":""},{"l":"b. Save in bank for year-1 cost","a":3.98,"tol":0.01,"u":""}],"steps":"a. NPV = −9.53 + (20.69 − 4.46)/1.12 = 4.96. b. Borrow 20.69/1.12 = 18.47 today (repay with the government payment), use 9.53 for today's cost, put 4.46/1.12 = 3.98 in the bank for next year's cost: 18.47 − 9.53 − 3.98 = 4.96 cash today.","th":["valuation"],"case":null,"model":null,"pts":3,"src":"pe1","msrc":"official","srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_10":{"id":"pe1_10","ch":"Ch 3","type":"num","q":"Consider two securities that pay risk-free cash flows over the next two years. a. What is the no-arbitrage price of a security that pays $500 in one year and $500 in two years? b. … that pays $500 in one year and $2,500 in two years?","blanks":[{"l":"a. Price ($)","a":920,"tol":1,"u":""},{"l":"b. Price ($)","a":2680,"tol":1,"u":""}],"steps":"a. = B1 + B2 = 920. b. = B1 + 5 × B2 = 480 + 2,200 = 2,680.","th":["replicate"],"case":"b1b2","model":null,"pts":2,"note":"[The cash-flow columns of the data table were partly hidden; B1 pays 500 at t = 1, B2 pays 500 at t = 2, consistent with the official answers.]","src":"pe1","msrc":"official","srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_10c":{"id":"pe1_10c","ch":"Ch 3","type":"mc","q":"Suppose a security with cash flows of $250 in one year and $500 in two years is trading for a price of $650. What arbitrage opportunity is available?","opts":["Buy two shares of the security and sell one share each of B1 and B2.","Sell two shares of the security and buy one share each of B1 and B2.","Buy two shares of the security and sell one share of B1 and two shares of B2.","Sell two shares of the security and buy one share of B1 and two shares of B2."],"ans":2,"why":["Cash flows don't match (2 × 500 ≠ 500 in year 2).","Wrong direction and wrong match.","Correct.","Wrong direction: the security is cheap."],"steps":"Fair price = 0.5 × 480 + 4 known."],"steps":"1,013.45 &gt; 1,000.","th":["ytm"],"case":"yc12b","keep":true,"model":null,"src":"pe2","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 2 – Week 2 (Ch 4, 5, 6) PRACTICE"},"pe2_10a":{"id":"pe2_10a","ch":"Ch 6","type":"mc","q":"Consider a 5-year, default-free bond with annual coupons of 6% and a face value of $1,000. a. Without doing any calculations, determine whether this bond is trading at a premium or at a discount.","opts":["At a premium, because its yield to maturity is a weighted average of the yields of the zero-coupon bonds.","At a discount, because its yield to maturity is a weighted average of the yields of the zero-coupon bonds.","At par, because the coupon equals the average yield.","Cannot be determined without calculating."],"ans":0,"why":["Correct: YTM ≤ 5% < 6% coupon.","Coupon is above the yields.","Coupon 6% is above every yield.","The comparison is enough."],"steps":"All zero yields ≤ 5% &lt; 6% coupon → YTM &lt; coupon → premium.","th":["ytm","yieldcurve"],"case":"yc5b","keep":true,"model":null,"src":"pe2","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 2 – Week 2 (Ch 4, 5, 6) PRACTICE"},"pe2_10b":{"id":"pe2_10b","ch":"Ch 6","type":"num","q":"Same bond. b. What is the yield to maturity on this bond? c. If the yield to maturity on this bond increased to 6.40%, what would the new price be?","blanks":[{"l":"b. YTM (%)","a":4.96,"tol":0.01,"u":""},{"l":"c. New price ($)","a":983.33,"tol":0.05,"u":""}],"steps":"Price = 60/1.04 + 60/1.044² + 60/1.046³ + 60/1.049⁴ + 1,060/1.05⁵ = 1,045.26 → solve YTM = 4.96%. At 6.4%: 60/0.064 × (1 − 1.064<sup>−5<\/sup>) + 1000/1.064⁵ = <b>983.33<\/b>.","th":["ytm"],"case":"yc5b","model":null,"pts":2,"src":"pe2","msrc":"official","srcl":"Pearson MyLab · Assignment 2 – Week 2 (Ch 4, 5, 6) PRACTICE"},"pe3_1":{"id":"pe3_1","ch":"Ch 7","type":"num","q":"You are considering opening a new plant. The plant will cost $96.8 million upfront. After that, it is expected to produce profits of $29.8 million at the end of every year. The cash flows are expected to last forever. Calculate the NPV of this investment opportunity if your cost of capital is 8.3%. Calculate the IRR and use it to determine the maximum deviation allowable in the cost of capital estimate to leave the decision unchanged.","blanks":[{"l":"NPV ($ m)","a":262.2,"tol":0.05,"u":""},{"l":"IRR (%)","a":30.79,"tol":0.01,"u":""},{"l":"Max deviation (%)","a":22.49,"tol":0.01,"u":""}],"steps":"NPV = 29.8/0.083 − 96.8 = 262.2 → invest. IRR = 29.8/96.8 = 30.79%. Max deviation = 30.79 − 8.3 = 22.49%.","th":["irr","npvrule"],"case":null,"model":null,"pts":3,"src":"pe3","msrc":"official","srcl":"Pearson MyLab · Assignment 3 – Week 3 (Ch 7, 8) PRACTICE (partial)"},"pe3_1b":{"id":"pe3_1b","ch":"Ch 7","type":"mc","q":"Plant (NPV $262.2m): should you make the investment?","opts":["No, because the NPV is less than zero.","No, because the NPV is not greater than the initial costs.","Yes, because the project will generate cash flows forever.","Yes, because the NPV is positive."],"ans":3,"why":["NPV is positive.","Not the rule.","Not the reason.","Correct."],"steps":"NPV &gt; 0.","th":["npvrule"],"case":null,"keep":true,"model":null,"src":"pe3","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 3 – Week 3 (Ch 7, 8) PRACTICE (partial)"},"pe3_2":{"id":"pe3_2","ch":"Ch 7","type":"num","q":"Innovation Company is thinking about marketing a new software product. Upfront costs to market and develop the product are $5,100,000. The product is expected to generate profits of $1,400,000 per year for 10 years. The company will have to provide product support expected to cost $95,000 per year in perpetuity. Assume all income and expenses occur at the end of each year. What is the NPV if the cost of capital is 5.62%, 1.17% and 21.76%?","blanks":[{"l":"NPV at 5.62% ($)","a":3701808,"tol":1000,"u":""},{"l":"NPV at 1.17% ($)","a":-79948,"tol":1000,"u":""},{"l":"NPV at 21.76% ($)","a":-1060,"tol":5,"u":""}],"steps":"NPV(r) = −5,100,000 + 1,400,000 × annuity(r, 10) − 95,000/r. 5.62%: +3,701,808 (accept). 1.17%: −79,948 (reject). 21.76%: −1,060 (reject, official).","th":["irrrule","perpetuity","annuity"],"case":null,"model":null,"pts":3,"msrc":"computed","note":"Only the 21.76% value was visible in the captured review; the other two are computed (unofficial).","src":"pe3","srcl":"Pearson MyLab · Assignment 3 – Week 3 (Ch 7, 8) PRACTICE (partial)"},"pe3_2b":{"id":"pe3_2b","ch":"Ch 7","type":"mc","q":"How many IRRs does this investment opportunity have? (Hint: consider the two alternative discount rates used.)","opts":["1.18%","21.75%","11.47%","Both (A) and (B)"],"ans":3,"why":["One of two.","One of two.","Not an IRR.","Correct: NPV changes sign twice."],"steps":"Cash flows: −, + (10 years), − forever → two sign changes; NPV = 0 at about 1.18% and 21.75%.","th":["irrrule"],"case":null,"keep":true,"model":null,"src":"pe3","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 3 – Week 3 (Ch 7, 8) PRACTICE (partial)"},"pe3_2c":{"id":"pe3_2c","ch":"Ch 7","type":"open","q":"Can the IRR rule be used to evaluate this investment? Explain.","model":"No. The project has two IRRs (≈1.18% and ≈21.75%), because the cash flows change sign twice (cost, then profits, then perpetual support costs). With multiple IRRs the IRR rule gives no unique decision; use NPV: accept only if NPV at the actual cost of capital (5.62%) is positive (it is).","steps":"Count sign changes → multiple IRRs → IRR rule unreliable → NPV.","rubric":null,"th":["irrrule"],"case":null,"pts":1,"msrc":"ai","note":"Part c was not captured from Pearson; model answer is AI-written (unofficial).","src":"pe3","srcl":"Pearson MyLab · Assignment 3 – Week 3 (Ch 7, 8) PRACTICE (partial)"},"hw1_1a":{"id":"hw1_1a","ch":"Ch 1","type":"open","q":"Consider the following questions about what the corporation is trying to achieve.<br>a. What is the objective of the firm (according to the book)? [PREPARE] Hint: this is not maximizing profit.","model":"Maximise <b>shareholder value<\/b>: take decisions that increase the market value of the firm's shares (equity).","steps":"Book (Ch 1) + Lecture 1a.","rubric":"1 pt: 'maximise shareholder value / market value of shares' (0 pts for 'maximise profit').","th":["goal"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_1b":{"id":"hw1_1b","ch":"Ch 1","type":"open","q":"b. Name two advantages and two disadvantages of using this objective. [PREPARE]","model":"Advantages: (1) clear, measurable target (the share price); (2) aligns decisions with the owners (residual claimants), who only gain after all other claims are paid, and accounts for timing and risk of cash flows. Disadvantages: (1) ignores externalities that are not priced or regulated (pollution, future generations); (2) agency problems/short-termism: managers may pursue their own goals or the share price only.","steps":"","rubric":"0.5 pt per valid advantage (max 1), 0.5 pt per valid disadvantage (max 1).","th":["goal","agency"],"case":null,"pts":2,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_1c":{"id":"hw1_1c","ch":"Ch 1","type":"open","q":"c. What mechanisms exist that push managers to act in the interests of shareholders? Describe at least 2 mechanisms. [IN CLASS]","model":"Board of directors monitoring/firing the CEO; compensation linked to performance (shares, options); threat of a hostile takeover when the share price falls; competition in product markets; shareholder activism/voting; regulation.","steps":"","rubric":"0.5 pt per mechanism with a one-line explanation (max 1).","th":["agency"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2a":{"id":"hw1_2a","ch":"Ch 2","type":"num","q":"a. Show that the change in KO’s market capitalization was $14.94 billion. [SOLVE YOURSELF] Enter market cap 2017, 2018 and the change ($ bn).","blanks":[{"l":"2017","a":181.36,"tol":0.01,"u":""},{"l":"2018","a":196.3,"tol":0.01,"u":""},{"l":"Change","a":14.94,"tol":0.01,"u":""}],"steps":"41.74 × 4.345 = 181.36; 46.07 × 4.261 = 196.30; change 14.94.","th":["bookmarket"],"case":"ko","model":null,"pts":1,"msrc":"official","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2b":{"id":"hw1_2b","ch":"Ch 2","type":"num","q":"b. Show that KO’s market-to-book ratio went from 7.85 in 2017 to 11.48 in 2018. [PREPARE]","blanks":[{"l":"MTB 2017","a":7.85,"tol":0.01,"u":""},{"l":"MTB 2018","a":11.48,"tol":0.01,"u":""}],"steps":"181.36/23.1 = 7.85; 196.30/17.1 = 11.48. Higher MTB: market values the equity more relative to book (book equity fell while market cap rose).","th":["bookmarket"],"case":"ko","model":null,"pts":1,"src":"hw1","msrc":"computed","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2d":{"id":"hw1_2d","ch":"Ch 2","type":"num","q":"d. Show that the change in KO’s enterprise value from 2017 to 2018 was $24.1 billion. [PREPARE] Enter EV 2017, EV 2018 ($ bn).","blanks":[{"l":"EV 2017","a":236.96,"tol":0.02,"u":""},{"l":"EV 2018","a":261.1,"tol":0.02,"u":""}],"steps":"EV = market cap + debt − cash. 2017: 181.36 + 64.2 − 8.6 = 236.96. 2018: 196.30 + 70.8 − 6.0 = 261.10. Change = 24.14 ≈ 24.1. EV is the market value of the underlying business (operating assets), independent of how it is financed.","th":["ev"],"case":"ko","model":null,"pts":1,"src":"hw1","msrc":"computed","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2c":{"id":"hw1_2c","ch":"Ch 2","type":"open","q":"c. Look up the most recent market-to-book ratio (Price/Book) of KO. Did it increase or decrease compared to 2017 or 2018? How can this change be interpreted? [PREPARE]","model":"[Requires looking up the current value online.] Interpretation: a higher MTB means investors expect more future value creation relative to the book (historical cost) value; a lower MTB the opposite. Buybacks and write-downs that lower book equity also raise MTB.","steps":"","rubric":null,"th":["bookmarket"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2e":{"id":"hw1_2e","ch":"Ch 2","type":"open","q":"e. Name a ratio that can be used to analyze the liquidity position of a firm. [IN CLASS]","model":"Current ratio = current assets ÷ current liabilities (on the formula sheet). (Quick and cash ratio also measure liquidity but are not examined.)","steps":"","rubric":null,"th":["ratios"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2f":{"id":"hw1_2f","ch":"Ch 2","type":"open","q":"f. If the EBITDA to interest expense ratio of a firm is 1.3, what does this tell us about the performance of this firm? [IN CLASS]","model":"Operating cash earnings cover interest only 1.3 times: a thin buffer. A small drop in EBITDA makes it unable to pay interest → high risk of financial distress; lenders would see the firm as highly levered/risky.","steps":"","rubric":null,"th":["ratios"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_2g":{"id":"hw1_2g","ch":"Ch 2","type":"open","q":"g. What gives a more accurate assessment of a firm’s net worth: the market value or book value of equity? Explain why. [IN CLASS]","model":"Market value: it is forward-looking (expected future cash flows and their risk), while book value is historical cost minus depreciation and misses intangibles and growth options. Caveat: market prices can be influenced by sentiment.","steps":"","rubric":null,"th":["bookmarket"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_3a":{"id":"hw1_3a","ch":"Ch 3","type":"num","q":"a. Show that the NPV of project A is €47.06 [SOLVE YOURSELF] and of B €2.94 [PREPARE]. What are the NPVs of projects C and D? [PREPARE]","blanks":[{"l":"NPV A","a":47.06,"tol":0.01,"u":""},{"l":"NPV B","a":2.94,"tol":0.01,"u":""},{"l":"NPV C","a":0,"tol":0.01,"u":""},{"l":"NPV D","a":-0.98,"tol":0.01,"u":""}],"steps":"A: −100 + 150/1.02 = 47.06. B: 150 − 150/1.02 = 2.94. C: 100 − 102/1.02 = 0.00. D: −50 + 50/1.02 = −0.98.","th":["valuation"],"case":"hw1p","model":null,"pts":2,"src":"hw1","msrc":"computed","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_3b":{"id":"hw1_3b","ch":"Ch 3","type":"mc","q":"b. If the projects are mutually exclusive, which project should the firm accept? [PREPARE]","opts":["Project A","Project B","Projects A and B","Project C"],"ans":0,"why":["Highest NPV (47.06).","Lower NPV.","Only one allowed.","NPV 0."],"steps":"Highest NPV.","th":["mutual"],"case":"hw1p","keep":true,"model":null,"src":"hw1","msrc":"computed","pts":1,"srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_3c":{"id":"hw1_3c","ch":"Ch 3","type":"mc","q":"c. If the firm can choose as many projects as desired, which should it choose? [PREPARE]","opts":["A and B (C is indifferent)","Only A","All four","A, B and D"],"ans":0,"why":["Correct: all NPV > 0; C adds nothing.","B also adds value.","D destroys value.","D has NPV < 0."],"steps":"Accept every NPV &gt; 0.","th":["npvrule"],"case":"hw1p","keep":true,"model":null,"src":"hw1","msrc":"computed","pts":1,"srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_3d":{"id":"hw1_3d","ch":"Ch 3","type":"open","q":"d. Show that the NPV of project A would decrease if the interest rate increases. What would happen to the NPVs of the other projects? [IN CLASS]","model":"A: its €150 inflow is discounted more → NPV falls (e.g. at 3%: 45.63). D falls too (inflow later). B and C rise: they receive cash today and pay later, so a higher rate makes the future payment cheaper (B at 3%: 4.37; C: 0.97).","steps":"","rubric":null,"th":["valuation"],"case":"hw1p","pts":1,"msrc":"computed","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_3e":{"id":"hw1_3e","ch":"Ch 3","type":"open","q":"e. Show that the NPV of project B would increase if we postpone the payment in one year to a payment in two years. What happens to the other projects if their year-one cash flow is postponed? [IN CLASS]","model":"B: 150 − 150/1.02² = 5.83 (&gt; 2.94). C: 100 − 102/1.02² = 1.96 (rises). A: −100 + 150/1.02² = 44.18 (falls). D: −50 + 50/1.02² = −1.94 (falls). Postponing a payment raises NPV; postponing a receipt lowers it.","steps":"","rubric":null,"th":["valuation"],"case":"hw1p","pts":1,"msrc":"computed","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_4a":{"id":"hw1_4a","ch":"Ch 3","type":"num","q":"a. Show that the no-arbitrage price of a risk-free security (S3) that pays €60 in one year and €60 in two years is €95. [PREPARE] Challenge: also find the yields per year (Method 2).","blanks":[{"l":"Price S3","a":95,"tol":0.01,"u":""},{"l":"1-yr yield (%)","a":20,"tol":0.01,"u":""},{"l":"2-yr yield (%)","a":15.47,"tol":0.01,"u":""}],"steps":"Method 1: S3 = S1 + S2 = 50 + 45 = 95. Method 2: r1 = 60/50 − 1 = 20%; r2 = (60/45)<sup>1/2<\/sup> − 1 = 15.47%; 60/1.2 + 60/1.1547² = 50 + 45 = 95.","th":["replicate"],"case":"hw1s","model":null,"pts":1,"src":"hw1","msrc":"computed","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_4b":{"id":"hw1_4b","ch":"Ch 3","type":"num","q":"b. Suppose a risk-free security (S4) with cash flows of €120 in one year and €180 in two years is trading at €245. What is the no-arbitrage price of S4, and what is the arbitrage profit per unit today? [IN CLASS]","blanks":[{"l":"No-arbitrage price","a":235,"tol":0.01,"u":""},{"l":"Profit today","a":10,"tol":0.01,"u":""}],"steps":"S4 = 2 × S1 + 3 × S2 = 100 + 135 = 235. S4 trades at 245 → overpriced: short-sell S4 (+245), buy 2 S1 + 3 S2 (−235): +€10 today, future cash flows cancel.","th":["replicate","arbitrage"],"case":"hw1s","model":null,"pts":1,"src":"hw1","msrc":"computed","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw1_4c":{"id":"hw1_4c","ch":"Ch 3","type":"open","q":"c. What does the no-arbitrage condition imply for financial markets? [IN CLASS]","model":"Law of one price: equivalent assets trade at the same price, so a security's price equals the PV of its cash flows. Implies value additivity and the separation principle (trading securities at market prices has NPV 0). Prices adjust quickly when arbitrage appears.","steps":"","rubric":null,"th":["arbitrage"],"case":null,"pts":1,"msrc":"ai","src":"hw1","srcl":"Homework 1 · Chapters 1, 2, 3 (tutorial assignment)"},"hw2_1a":{"id":"hw2_1a","ch":"Ch 4","type":"num","q":"How much do you save (in today's money) when you quit smoking if: a. You are 20 now and die at 70 (hint: €50,654). b. You are 20 now and live forever. c. You are 25 now and live forever. [PREPARE]","blanks":[{"l":"a. (€)","a":50654.85,"tol":1,"u":""},{"l":"b. (€)","a":80600,"tol":1,"u":""},{"l":"c. (€)","a":80600,"tol":1,"u":""}],"steps":"C = 200 × 8.06 = €1,612. a. Annuity, N = 50: 1,612/0.02 × (1 − 1.02<sup>−50<\/sup>) = 50,654.85. b. Perpetuity: 1,612/0.02 = 80,600. c. Same perpetuity (your age does not matter): 80,600.","th":["annuity","perpetuity"],"case":"smoke","model":null,"pts":1,"src":"hw2","msrc":"computed","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_1d":{"id":"hw2_1d","ch":"Ch 4","type":"open","q":"d. Explain in words how present values of cash flows can be used to calculate market prices. [IN CLASS]","model":"In a competitive market without arbitrage, a security's price equals the PV of the cash flows it generates, discounted at the market rate for that risk and timing (law of one price). E.g. a zero-coupon bond: P = FV/(1 + YTM)<sup>n<\/sup>.","steps":"","rubric":null,"th":["arbitrage","valuation"],"case":"smoke","pts":1,"msrc":"ai","src":"hw2","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_1e":{"id":"hw2_1e","ch":"Ch 4","type":"num","q":"e. Assume you just turned 20, stop smoking today and invest the money you would otherwise spend in the stock market earning 8% per year (ignore the 2%). How much will you accumulate when you turn 30? [PREPARE]","blanks":[{"l":"FV at 30 (€)","a":23352.34,"tol":1,"u":""}],"steps":"FV annuity: 1,612/0.08 × (1 − 1.08<sup>−10<\/sup>) × 1.08<sup>10<\/sup> = 1,612 × 14.4866 = <b>€23,352.34<\/b>. (Hint in HW: use FV of an annuity.)","th":["fv_annuity"],"case":"smoke","model":null,"pts":1,"src":"hw2","msrc":"computed","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_2a":{"id":"hw2_2a","ch":"Ch 5","type":"num","q":"a. Show that the current two-year (annualized) rate is 1.499%. b. What are the 3-year and 4-year yields? (percent, three decimals) [PREPARE]","blanks":[{"l":"2-yr (%)","a":1.499,"tol":0.001,"u":""},{"l":"3-yr (%)","a":0.997,"tol":0.001,"u":""},{"l":"4-yr (%)","a":0.747,"tol":0.002,"u":""}],"steps":"(1 + r<sub>2<\/sub>)² = 1.02 × 1.01 → r<sub>2<\/sub> = 1.499%. (1 + r<sub>3<\/sub>)³ = 1.02 × 1.01 × 1 → 0.997%. (1 + r<sub>4<\/sub>)⁴ = 1.0302 → 0.747%. The yield curve slopes <b>down<\/b> (inverted): 2%, 1.499%, 0.997%, 0.747%.","th":["yieldcurve"],"case":"rates","model":null,"pts":1,"note":"The prev. tutorial notes round the 4-year rate to 0.75%.","src":"hw2","msrc":"computed","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_2c":{"id":"hw2_2c","ch":"Ch 5","type":"mc","q":"c. Which interest rate should you use to discount a cash flow that occurs in year 3? [IN CLASS]","opts":["The 3-year rate from the term structure (0.997%)","The one-year rate for year 3 (0%)","The current one-year rate (2%)","The average of the one-year rates (1%)"],"ans":0,"why":["Correct: match the term.","Only the rate during year 3.","Only valid for 1-year cash flows.","Ignores compounding."],"steps":"Use the yield for the cash flow's own maturity.","th":["yieldcurve"],"case":"rates","keep":true,"model":null,"src":"hw2","msrc":"computed","pts":1,"srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_2d":{"id":"hw2_2d","ch":"Ch 5","type":"num","q":"d. Show that the PV of $10 received at the end of year 3 discounted at the 3-year rate equals the PV using each yearly rate. [IN CLASS]","blanks":[{"l":"PV ($)","a":9.71,"tol":0.01,"u":""}],"steps":"10/1.00997³ = 10/(1.02 × 1.01 × 1.00) = <b>$9.71<\/b>.","th":["yieldcurve"],"case":"rates","model":null,"pts":1,"src":"hw2","msrc":"computed","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3a":{"id":"hw2_3a","ch":"Ch 6","type":"num","q":"a. What are the cash flows of this bond? Enter the coupon per payment, number of coupons, and the final repayment of face value. [SOLVE YOURSELF]","blanks":[{"l":"Coupon ($)","a":30,"tol":0,"u":""},{"l":"Number of coupons","a":10,"tol":0,"u":""},{"l":"Face value at the end ($)","a":1000,"tol":0,"u":""}],"steps":"Official: 6%/2 = 3% → 10 payments of $30 every 6 months, plus $1,000 after 5 years (period 10).","th":["bondbasics"],"case":"hwbond","model":null,"pts":1,"msrc":"official","src":"hw2","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3b":{"id":"hw2_3b","ch":"Ch 6","type":"num","q":"b. Show that today’s price is $1,138.33. Is it a discount, par or premium bond? (Enter the price.)","blanks":[{"l":"Price ($)","a":1138.33,"tol":0.02,"u":""}],"steps":"y = 1.5% per half-year, N = 10: 30/0.015 × (1 − 1.015<sup>−10<\/sup>) + 1000/1.015<sup>10<\/sup> = 1,138.33 &gt; 1,000 → <b>premium<\/b>.","th":["ytm","matchperiod"],"case":"hwbond","model":null,"pts":1,"src":"hw2","msrc":"computed","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3c":{"id":"hw2_3c","ch":"Ch 6","type":"num","q":"c. Now suppose the bond trades at $1200 today. Write down the equation to find the YTM. What is the YTM (APR, semi-annual)? [PREPARE]","blanks":[{"l":"Semi-annual yield (%)","a":0.9,"tol":0.01,"u":""},{"l":"YTM as APR (%)","a":1.8,"tol":0.02,"u":""}],"steps":"1,200 = 30/y × (1 − (1 + y)<sup>−10<\/sup>) + 1,000/(1 + y)<sup>10<\/sup> → y ≈ 0.900% per half-year → APR ≈ 1.80% (EAR 1.81%).","th":["ytm"],"case":"hwbond","model":null,"pts":1,"src":"hw2","msrc":"computed","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3d":{"id":"hw2_3d","ch":"Ch 6","type":"mc","q":"d. Suppose the YTM increases. What happens to the bond price today? [PREPARE]","opts":["It falls","It rises","It stays the same","It depends on the coupon"],"ans":0,"why":["Correct: e.g. at 3.5% APR the price is $1,113.77.","Higher discount rate → lower PV.","Cash flows are fixed but their PV changes.","Direction is always down."],"steps":"Same cash flows, higher discount rate → lower price.","th":["ratechange"],"case":"hwbond","keep":true,"model":null,"src":"hw2","msrc":"computed","pts":1,"srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3e":{"id":"hw2_3e","ch":"Ch 6","type":"open","q":"e. Define interest rate risk for a bond. For which bonds is it highest? [IN CLASS]","model":"The risk that changes in market interest rates change the bond's price (rates up → price down). Highest for long-maturity (high-duration) bonds, especially zero-coupon/low-coupon bonds.","steps":"","rubric":null,"th":["ratechange"],"case":null,"pts":1,"msrc":"ai","src":"hw2","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3f":{"id":"hw2_3f","ch":"Ch 6","type":"open","q":"f. Does buying a bond at a price equal to the PV of its cash flows have a positive NPV? Explain. [IN CLASS]","model":"No: NPV = PV − price = 0. In a competitive market you pay exactly what the cash flows are worth; a positive NPV would make everyone buy and push the price up.","steps":"","rubric":null,"th":["valuation","ytm"],"case":null,"pts":1,"msrc":"ai","src":"hw2","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw2_3g":{"id":"hw2_3g","ch":"Ch 6","type":"open","q":"g. If there is default risk, is the expected return of a corporate bond lower, equal to or higher than its YTM? Explain. [IN CLASS]","model":"Lower: the YTM is computed from the promised cash flows; with default risk the expected cash flows are lower, so the expected return is below the YTM.","steps":"","rubric":null,"th":["credit"],"case":null,"pts":1,"msrc":"ai","src":"hw2","srcl":"Homework 2 · Chapters 4, 5, 6 (tutorial assignment)"},"hw3_1a":{"id":"hw3_1a","ch":"Ch 7","type":"num","q":"a. Show that the NPV of agreeing to write the book (ignoring royalties) is $−0.41 million. [SOLVE YOURSELF] b. What is the NPV with the royalty payments? [PREPARE] ($ millions)","blanks":[{"l":"a. NPV","a":-0.41,"tol":0.005,"u":""},{"l":"b. NPV","a":0.688,"tol":0.002,"u":""}],"steps":"a. 10 − 6/1.1 − 6/1.1² = −0.413 → reject (official). b. First royalty at t = 3: perpetuity with g = −50% valued at t = 2: 0.8/(0.10 + 0.50) = 1.333; ÷ 1.1² = 1.102. NPV = −0.413 + 1.102 = <b>0.688<\/b> → accept (official hint).","th":["timing","perpetuity","irrrule"],"case":"lance","model":null,"pts":1,"src":"hw3","msrc":"computed","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_1c":{"id":"hw3_1c","ch":"Ch 7","type":"num","q":"c. Determine if the book deal with royalties has an IRR between 2% and 5%. Find the IRR (percent, two decimals). [IN CLASS]","blanks":[{"l":"IRR (%)","a":3.52,"tol":0.05,"u":""}],"steps":"0 = 10 − 6/(1+r) − 6/(1+r)² + [0.8/(r + 0.5)]/(1+r)². Trial and error: NPV(3%) = −0.058, NPV(4%) = +0.053 → IRR ≈ <b>3.52%<\/b>.","th":["irr"],"case":"lance","model":null,"pts":1,"src":"hw3","msrc":"computed","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_1d":{"id":"hw3_1d","ch":"Ch 7","type":"open","q":"d. Does using this IRR in the IRR decision rule correctly indicate if the book deal with royalties is attractive? [IN CLASS]","model":"No. The cash flows start positive (+10 now) and then turn negative: NPV <b>increases<\/b> with the discount rate (−0.40 at 0%, +0.69 at 10%). The IRR rule (accept if IRR &gt; r) would say reject (3.52% &lt; 10%), while NPV at 10% is positive → accept. Use NPV.","steps":"","rubric":null,"th":["irrrule"],"case":"lance","pts":1,"msrc":"computed","src":"hw3","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_2a":{"id":"hw3_2a","ch":"Ch 7","type":"num","q":"a. Show that project Y is more attractive if the cost of capital is 5%. [SOLVE YOURSELF] b. Compute both NPVs at 7%. [PREPARE]","blanks":[{"l":"NPV X at 5%","a":1.02,"tol":0.01,"u":""},{"l":"NPV Y at 5%","a":1.75,"tol":0.01,"u":""},{"l":"NPV X at 7%","a":-0.43,"tol":0.01,"u":""},{"l":"NPV Y at 7%","a":0.57,"tol":0.01,"u":""}],"steps":"5%: X = −50 + 25/1.05 + 30/1.05² = 1.02; Y = −30 + 35/1.05² = 1.75 → Y (official). 7%: X = −0.43; Y = 0.57 → undertake <b>Y<\/b>.","th":["mutual","npvrule"],"case":"xy","model":null,"pts":1,"src":"hw3","msrc":"computed","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_2c":{"id":"hw3_2c","ch":"Ch 7","type":"num","q":"c. What is the NPV of project X when the discount rate is 6.39%? d. Compute the IRR of project Y. (percent)","blanks":[{"l":"NPV X at 6.39%","a":0.0,"tol":0.01,"u":""},{"l":"IRR Y (%)","a":8.01,"tol":0.01,"u":""}],"steps":"NPV X(6.39%) ≈ 0.00 → 6.39% is X's <b>IRR<\/b>. IRR Y = (35/30)<sup>1/2<\/sup> − 1 = 8.01% &gt; 7% → accept Y by IRR.","th":["irr"],"case":"xy","model":null,"pts":1,"src":"hw3","msrc":"computed","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_2f":{"id":"hw3_2f","ch":"Ch 7","type":"mc","q":"f. Projects are no longer mutually exclusive, but you have only $100 to spend today. Cost of capital 5%. Which project(s) should be undertaken? (NPV Z = 1.70; PI Z = 0.034.)","opts":["Y and Z","X and Z","X and Y","X, Y and Z"],"ans":0,"why":["Correct: total NPV 3.45, highest feasible.","Total NPV 2.72.","Total NPV 2.77.","Costs $130 > $100."],"steps":"Feasible pairs: X+Y (80): 2.77; X+Z (100): 2.72; Y+Z (80): 3.45. PI: Y 0.058, Z 0.034, X 0.020 → Y, Z, then X does not fit → same answer.","th":["pi"],"case":"xy","keep":false,"model":null,"src":"hw3","msrc":"computed","pts":1,"srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_2g":{"id":"hw3_2g","ch":"Ch 7","type":"open","q":"g. Does using the Profitability Index always lead to the combination of projects with the highest total NPV? [IN CLASS] h. Would the firm accept Z by the payback rule (≤ 1 year)? i. Rank the three by payback (whole years); does it help maximise value?","model":"g. No: with indivisible projects or several constraints the PI ranking can leave budget unused; check combinations. h. No: Z recovers 40 of 50 in year 1 → payback ≈ 1.67 years &gt; 1. i. X ≈ 1.83, Y ≈ 1.86, Z ≈ 1.67 years → all round to 2 years: the ranking does not distinguish them and ignores time value and size, so it does not help maximise value.","steps":"","rubric":null,"th":["pi","payback"],"case":"xy","pts":2,"msrc":"computed","src":"hw3","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_3a":{"id":"hw3_3a","ch":"Ch 8","type":"num","q":"a. Show that year-1 unlevered net income is €311.655 and FCF €531.155 [SOLVE YOURSELF]. b. Calculate UNI and FCF for years 2–4 [PREPARE] (hint: UNI year 4 = €655.305).","blanks":[{"l":"FCF year 2","a":729155,"tol":1,"u":""},{"l":"FCF year 3","a":729155,"tol":1,"u":""},{"l":"FCF year 4","a":1270805,"tol":1,"u":""}],"steps":"Dep = 1,670,000/4 = 417,500. NWC = 148 + 128 − 78 = 198,000 (invested at t = 1). UNI yrs 1–3 = (1,850,000 − 1,038,000 − 417,500) × 0.79 = 311,655. Year 4 UNI incl. gain on sale (book value 0): (812,000 − 417,500 + 435,000) × 0.79 = 655,305. FCF1 = 311,655 + 417,500 − 198,000 = 531,155; FCF2–3 = 729,155; FCF4 = 655,305 + 417,500 + 198,000 = 1,270,805.","th":["uni","fcf"],"case":"veg","model":null,"pts":2,"src":"hw3","msrc":"computed","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_3c":{"id":"hw3_3c","ch":"Ch 8","type":"num","q":"c. Show that the project’s NPV is €479.078 [PREPARE]. d. Find the IRR (percent). [IN CLASS]","blanks":[{"l":"NPV (€)","a":479078,"tol":2,"u":""},{"l":"IRR (%)","a":28.34,"tol":0.05,"u":""}],"steps":"NPV = −1,670,000 + 531,155/1.164 + 729,155/1.164² + 729,155/1.164³ + 1,270,805/1.164⁴ = <b>479,078<\/b> → proceed. NPV &gt; 0 with standard cash flows → IRR &gt; 16.4% (≈ 28.3%).","th":["npvrule","irr"],"case":"veg","model":null,"pts":1,"src":"hw3","msrc":"computed","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_3e":{"id":"hw3_3e","ch":"Ch 8","type":"open","q":"e. Assume the firm also completed a technical evaluation costing $1 million. Would this change the NPV for the decision to expand? [IN CLASS]","model":"No. It has already been paid whatever the decision → sunk cost → not incremental → NPV stays €479,078.","steps":"","rubric":null,"th":["incremental"],"case":"veg","pts":1,"msrc":"computed","src":"hw3","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"hw3_4":{"id":"hw3_4","ch":"Ch 8","type":"open","q":"Which of the following costs should be considered in a capital budgeting decision? Explain why or why not and give an example: a. Sunk costs b. Opportunity costs c. Interest expenses d. Fixed overhead costs","model":"a. No (official): not incremental; e.g. a technical inspection already done. b. Yes: value of a resource in its best alternative use, e.g. rent forgone on an owned building. c. No: financing is evaluated separately (separation principle); use unlevered cash flows, e.g. interest on a bank loan for the project. d. Only if they change because of the project; allocated overhead that does not change (e.g. head-office costs) is excluded.","steps":"","rubric":"0.5 pt per cost: correct include/exclude + reason + example.","th":["incremental"],"case":null,"pts":2,"msrc":"computed","src":"hw3","srcl":"Homework 3 · Chapters 7 and 8 (tutorial assignment)"},"y18_1":{"id":"y18_1","ch":"Ch 3","type":"mc","q":"Consider the following two statements:<br>i. An arbitrage opportunity [is a situation in which it is possible to make a profit without taking any risk or making any investment].<br>ii. In investment decisions it does not matter in terms of which project is preferred if we compare projects according to their future value at t=5 or at their present value.<br><i>(The words in brackets are hidden in the screenshot and filled in from the book’s definition on p. 108, which the answer key refers to.)<\/i>","opts":["Only i is correct","Only ii is correct","Both are correct","Both are false"],"ans":2,"why":null,"steps":"Both are true (answer key: BDM p. 108 and pp. 97–102). (i) is the book’s definition of an arbitrage opportunity. (ii) Comparing at t = 5 or at t = 0 gives the same ranking, because every value is multiplied by the same factor (1 + r)⁵: the rules of time travel let you compare at any single point in time.","th":["arbitrage","replicate"],"case":null,"keep":true,"model":null,"note":"Words in [square brackets] are hidden by an overlay in the screenshot and filled in from the book's definition (BDM p. 108) that the answer key cites.","src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_2":{"id":"y18_2","ch":"Ch 3","type":"mc","q":"Your mother wants to buy a new car which is $150,000. The dealer offered her a deal, she can pay 50,000 today, 50,000 next year and in two years also 50,000. Suppose the current risk-free interest rate is 5% per year.<br>The amount of money that your mother will save on the promotion deal, expressed in a money amount today, is closest to:","opts":["$7,029.48","$142,970.52","$145,238.10","$4,761.91"],"ans":0,"why":null,"steps":"PV of the deal = 50,000 + 50,000/1.05 + 50,000/1.05² = $142,970.52. Paying $150,000 today instead, she saves 150,000 − 142,970.52 = $7,029.48. $142,970.52 is the PV of the deal itself, not the saving. $4,761.91 only discounts the last payment.","th":["apr_ear"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_3":{"id":"y18_3","ch":"Ch 4","type":"mc","q":"Suppose you want to buy a house in 7 years. You know that the price will be equal to $300,000. You plan on opening a savings account into which you deposit a fixed amount of dollars each year, including the year you buy the house. How much is the yearly deposit into the bank if the first deposit is at the end of this year and the annual interest rate is 5% (APR)?","opts":["$42,857.14","$38,645.95","$17,359.12","$36,845.95"],"ans":3,"why":null,"steps":"Future value of an annuity with 7 deposits: 300,000 = C × ((1.05)⁷ − 1)/0.05, so C = 0.05 × 300,000/(1.05⁷ − 1) = $36,845.95. $42,857.14 is 300,000/7 (no interest). $17,359.12 would be the payment if $300,000 were a loan today (PV annuity formula instead of FV).","th":["apr_ear","fv_annuity"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_4":{"id":"y18_4","ch":"Ch 5","type":"mc","q":"Your company can choose 3 different investments. One with an APR of 5.75% on basis of annual compounding (Investment A), one with an APR of 6% daily compounding with 360 days (Investment B) and one with an APR of 6.125% on basis of quarterly compounding (Investment C). What are the Effective annual interest rates of these investments?","opts":["Investment A: 5.75%, investment B: 6% and investment C: 6.125%","Investment A: 5.75%, investment B: 6.125% and investment C: 6.267%","Investment A: 5.75%, investment B: 6.125% and investment C: 6.183%","Investment A: 5.75%, investment B: 6.183% and investment C: 6.267%"],"ans":3,"why":null,"steps":"EAR = (1 + APR/k)^k − 1. A: k = 1, so 5.75%. B: (1 + 0.06/360)³⁶⁰ − 1 = 6.183%. C: (1 + 0.06125/4)⁴ − 1 = 6.267%. The first option simply repeats the APRs, which is only right for annual compounding.","th":["apr_ear","matchperiod"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_5":{"id":"y18_5","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>i. In case of a bankruptcy, shareholders give up their ownership and control to the debt holders.<br>ii. Shares of public corporations are more liquid than shares of private corporations.","opts":["Only i is correct","Only ii is correct","Both are correct","Both are false"],"ans":2,"why":null,"steps":"Both are true. (i) In bankruptcy the debt holders take over the firm and the shareholders lose their ownership and control (BDM p. 45). (ii) Shares of public corporations trade on a stock market, so they are easy to sell; private shares do not, and an investment that is harder to sell is less liquid (BDM p. 46).","th":["goal"],"case":null,"keep":true,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_6":{"id":"y18_6","ch":"Ch 3","type":"mc","q":"If the ETF is currently trading for $1200. Consider the following two statements:<br><i>Statement 1:<\/i> On the basis of one ETF one can achieve an arbitrage profit of more than $100.<br><i>Statement 2:<\/i> One can exploit the arbitrage opportunity profitably by taking a short position in the ETF and a long position in the underlying securities.","opts":["Statement 1 and 2 are both correct","Statement 1 is correct but statement 2 incorrect","Statement 2 is correct but statement 1 is incorrect","Both statements are incorrect"],"ans":3,"why":null,"steps":"Value of the underlying shares = 2 × 200.23 + 570.51 + 10 × 29.61 = $1,267.07. The ETF costs $1,200, so it is <b>underpriced<\/b>: buy the ETF and short the shares, for a profit of $67.07. Statement 1 is wrong ($67.07, not more than $100) and statement 2 is wrong (it describes the opposite, losing trade).","th":["arbitrage","ev","replicate"],"case":"y18c6","keep":true,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_7":{"id":"y18_7","ch":"Ch 2","type":"mc","q":"In 2016-12 TSLA had 155 MLN shares outstanding at a price of 213.69. In 2017-12 TSLA had 168 MLN shares outstanding at a price of $311.35.<br><br><b>Question 7.<\/b> What was the change in Tesla’s Enterprise value closest to?","opts":["$24.597 bln","$25.455 bln","$25.505 bln","$34.302 bln"],"ans":2,"why":null,"steps":"EV = market cap + debt − cash. The answer key uses the liabilities line as debt (the balance sheet gives no separate debt figure). EV 2016 = 155 × 213.69 + 17,126 − 3,393 = 46,854.95; EV 2017 = 168 × 311.35 + 23,421 − 3,368 = 72,359.80. Change = 25,504.85 million ≈ $25.505 bln. Forgetting to subtract cash, or using only the change in market cap, gives the other values.","th":["ev","firmtypes","statements"],"case":"y18c7","keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_8":{"id":"y18_8","ch":"Ch 2","type":"mc","q":"In 2016-12 TSLA had 155 MLN shares outstanding at a price of 213.69. In 2017-12 TSLA had 168 MLN shares outstanding at a price of $311.35.<br><br><b>Question 8.<\/b> What was the change in Tesla’s market-to-book (MTB) ratio closest to?","opts":["5.29","5.37","5.83","16.97"],"ans":1,"why":null,"steps":"MTB = market value of equity / book value of equity. 2016: 155 × 213.69/4,753 = 6.97. 2017: 168 × 311.35/4,237 = 12.34. Change = 12.34 − 6.97 = 5.37. Watch out: both the share count and the share price change between the years, so compute each year’s market value of equity separately.","th":["bookmarket","firmtypes","statements"],"case":"y18c7","keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_9":{"id":"y18_9","ch":"Ch 2","type":"mc","q":"In 2016-12 TSLA had 155 MLN shares outstanding at a price of 213.69. In 2017-12 TSLA had 168 MLN shares outstanding at a price of $311.35.<br><br><b>Question 9.<\/b> What can you conclude?<br>i. Since Tesla’s MTB-ratio has increased, investors think management will be able to generate more profits in the future.<br>ii. Ford’s MTB-ratio is 1.3, with respect to car producer Ford’s MTB-ratio Tesla can be characterized as a growth stock.<br><i>(The answer key for this question is not shown in the screenshot; the answer below follows the book.)<\/i>","opts":["Only i is correct","Only ii is correct","Both are correct","Both are false"],"ans":2,"why":null,"steps":"Both are consistent with the book. (i) The market value reflects expected future cash flows, while book value looks backward, so a rising MTB means investors expect more future profit relative to the assets in place. (ii) A firm with a high MTB (Tesla 12.3) compared to its industry (Ford 1.3) is called a growth stock; a low MTB means a value stock.","th":["bookmarket","firmtypes","statements"],"case":"y18c7","keep":true,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_10":{"id":"y18_10","ch":"Ch 6","type":"mc","q":"A zero-coupon bond with a face value of $1100 currently trades for $900 and matures in exactly 3 years and 8 months. Then its Yield to Maturity is closest to:","opts":["7.0%","5.6%","6.3%","6.9%"],"ans":1,"why":null,"steps":"YTM = (Face/Price)^(1/n) − 1 with n = 3 + 8/12 = 3.6667 years: (1,100/900)^(1/3.6667) − 1 = 5.625%. Using n = 3 years gives 6.9%, and using 3.8 or 3 + 0.08 for ‘3 years and 8 months’ also gives a wrong answer: months must be converted to a fraction of a year.","th":["apr_ear","ytm"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_11":{"id":"y18_11","ch":"Ch 7","type":"mc","q":"Ricky calculates the IRR for a project and finds that it is larger than the cost of capital. What can he conclude about the project?","opts":["The NPV is positive","The NPV is negative","The NPV is upward sloping in the cost of capital","Not enough information to conclude any of the above"],"ans":3,"why":null,"steps":"Without the cash flow pattern you cannot conclude anything. For a normal project (cost first, benefits later) IRR &gt; r means NPV &gt; 0, but if positive cash flows come before negative ones (a delayed investment) the NPV is negative when IRR &gt; r, and with multiple sign changes there can be several IRRs. So ‘NPV is positive’ is not guaranteed, and ‘upward sloping’ is also not generally true.","th":["irrrule","npvrule"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_12":{"id":"y18_12","ch":"Ch 7","type":"mc","q":"Which of the following statements is FALSE?","opts":["If there is a limited supply of a resource available, you should rank projects by the profitability index, selecting the project with the lowest profitability index first and working your way down the list until the resource is consumed.","Practitioners often use the profitability index to identify the optimal combination of projects when there is a limited supply of resources.","If there is a limited supply of resources available, so that you cannot undertake all possible opportunities, then simply picking the highest NPV opportunity might not lead to the best decision.","The profitability index is calculated as the NPV divided by the resources consumed by the project."],"ans":0,"why":null,"steps":"You should start with the <b>highest<\/b> profitability index (most value per unit of the scarce resource) and work down, not the lowest. The other three statements are true.","th":["npvrule","pi"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_13":{"id":"y18_13","ch":"Ch 6","type":"mc","q":"Consider a five-year, default-free security with annual coupon payments and a face value of $1200 that is issued at par. The coupon rate of this bond is closest to:","opts":["4.771%","5.771%","4.321%","4.676%"],"ans":0,"why":null,"steps":"At par the price equals the face value: 1,200 = CPN × (1/1.04 + 1/1.043² + 1/1.045³ + 1/1.047⁴ + 1/1.048⁵) + 1,200/1.048⁵ = CPN × 4.380 + 949.24, so CPN = 57.25 and the coupon rate = 57.25/1,200 = 4.771%. It is slightly below the 5-year yield (4.80%) because the curve is upward sloping and the earlier coupons are discounted at lower rates.","th":["apr_ear","credit","ytm"],"case":"y18c13","keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_14":{"id":"y18_14","ch":"Ch 7","type":"mc","q":"Which of the following statements is FALSE?","opts":["The IRR investment rule states you should turn down any investment opportunity where the IRR is less than the opportunity cost of capital.","The IRR investment rule states that you should take any investment opportunity where the IRR exceeds the opportunity cost of capital.","Since the IRR rule is based upon the rate at which the NPV equals zero, like the NPV decision rule, the IRR decision rule will always identify the correct investment decisions.","There are situations in which multiple IRRs exist."],"ans":2,"why":null,"steps":"The IRR rule does <b>not<\/b> always give the right decision: it fails for delayed investments, multiple IRRs, a non-existent IRR and when choosing between mutually exclusive projects. The other statements are true descriptions of the rule and its limits.","th":["incremental","irrrule","npvrule","oppcost"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_15":{"id":"y18_15","ch":"Ch 7","type":"mc","q":"The expected cash flow at t = 2 is closest to","opts":["€ 33","€ 55","€ 80","€ 88"],"ans":2,"why":null,"steps":"At the IRR the NPV is zero: −100 + 80/1.38 + X/1.38² = 0, so X = (100 − 57.97) × 1.38² = €80.04. The depreciation and the 10% discount rate are not needed: the IRR alone pins down the missing cash flow.","th":["apr_ear","fcf","irrrule"],"case":"y18c15","keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_16":{"id":"y18_16","ch":"Ch 6","type":"mc","q":"Which of the following statements is <b>FALSE<\/b>:","opts":["In the presence of credit risk, the yield to maturity equals the expected rate of return of a bond.","The yield to maturity of a bond can be different to the coupon interest rate of that bond.","A bond with a higher duration is more sensitive to interest rate changes.","A bond trades at par if the price of the bond is equal to the face value of the bond."],"ans":0,"why":null,"steps":"With credit risk the YTM is based on the <b>promised<\/b> cash flows, so it is higher than the expected return (expected cash flows are lower). The other statements are true: YTM and coupon rate differ whenever the bond is not at par, longer-duration bonds react more to rate changes, and price = face value is the definition of par.","th":["credit","ratechange","ytm"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_17":{"id":"y18_17","ch":"Ch 8","type":"mc","q":"Bubba Ho-Tep Company reported net income of $300 million for the most recent fiscal year. The firm had depreciation expenses of $125 million and capital expenditures of $150 million during that year. Although the firm had no interest expense, the firm did have an increase in net working capital of $20 million. What is Bubba Ho-Tep’s free cash flow in the most recent fiscal year closest to?","opts":["$170 million","$255 million","$150 million","$5 million"],"ans":1,"why":null,"steps":"With no interest expense, net income equals unlevered net income. FCF = NI + depreciation − capital expenditures − ΔNWC = 300 + 125 − 150 − 20 = $255 million. $150 million forgets to add back depreciation and to subtract ΔNWC (300 − 150). $170 million forgets the depreciation and adds the NWC increase instead of subtracting it (300 − 150 + 20).","th":["apr_ear","fcf"],"case":null,"keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y18_18":{"id":"y18_18","ch":"Ch 8","type":"mc","q":"Following year five, you estimate that CCM’s free cash flows will grow at 5% per year forever. When the appropriate discount rate is 13%, the present value of these cash flows is closest to:","opts":["$396 million","$290 million","$382 million","$350 million"],"ans":0,"why":null,"steps":"The year-5 cash flow of 40 starts a growing perpetuity, worth 40/(0.13 − 0.05) = 500 at t = 4. V₀ = 25/1.13 + 28/1.13² + 32/1.13³ + 37/1.13⁴ + 500/1.13⁴ = $395.58 million. (Equivalently: discount years 1–5 and add 40 × 1.05/0.08 at t = 5.) Discounting the terminal value one year too many, or forgetting the growth, gives the lower options.","th":["apr_ear","ev","fcf"],"case":"y18c18","keep":false,"model":null,"src":"p2018","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2018 (StudentWiki capture, version code 2)"},"y24_1":{"id":"y24_1","ch":"Ch 5","type":"mc","q":"Consider the following two statements:<br>1. An annual percentage rate (APR) indicates the amount of simple interest earned in one year.<br>2. An Effective Annual Rate (EAR) indicates the amount of interest earned without the effect of compounding.","opts":["Both statements are false","Statement 1 is true, statement 2 is false","Both statements are true","Statement 2 is true, statement 1 is false"],"ans":1,"why":null,"steps":"Statement 1 is true: the APR is the periodic rate times the number of periods per year, so it ignores compounding (simple interest over one year). The EAR is the rate you actually earn after compounding, EAR = (1 + APR/k)^k − 1 (interest on interest). Statement 2 is false because it describes the APR, not the EAR: the EAR is exactly the rate <b>with<\/b> the effect of compounding. Whenever compounding happens more than once a year, EAR &gt; APR.","th":["apr_ear","matchperiod"],"case":null,"keep":true,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_fiets":{"id":"y24_fiets","ch":"Ch 2","type":"open","q":"Which of the following statements about the firm is TRUE?<br><i>[The answer options are not visible in the source screenshots. Self-check: compute book equity, market cap, MTB, current ratio, EV and debt-to-capital, and decide which kinds of statements would be true.]<\/i>","model":"Total assets = 110.836 + 154.960 = €265.796. Total liabilities = 16.437 + 58.646 = €75.083 → book equity = <b>€190.713<\/b>. Market cap = 1,62 × 150.000 = <b>€243.000<\/b> → MTB = <b>1.27<\/b>. Current ratio = 154.960/58.646 = <b>2.64<\/b>. Interest-bearing debt = 16.437 + 30.762 = 47.199 → EV = 243.000 + 47.199 − 45.298 = <b>€244.901<\/b>. Debt-to-capital (book) = 47.199/(190.713 + 47.199) = <b>0.198<\/b>.","steps":"","rubric":null,"th":["bookmarket","ev","ratios"],"case":"fiets","pts":1,"msrc":"computed","note":"Question 2 of the 2024 capture; options missing in the source, so it is self-marked.","src":"p2024","srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_2":{"id":"y24_2","ch":"Ch 6","type":"mc","q":"A bond is trading above par. Which of the following statements is TRUE?","opts":["The bond’s price is equal to the present value of the coupons of the bond.","The bond’s yield is lower than the risk-free rate.","The bond’s price is equal to the face value of the bond.","The bond’s yield is lower than the bond’s coupon rate."],"ans":3,"why":null,"steps":"Price = PV of the coupons + PV of the face value, discounted at the yield. Above par means price &gt; face value, which happens when the coupon rate is higher than the yield to maturity: the bond pays more than the market requires, so investors bid its price up. A is false because the face value is also part of the price. B is false because the yield is not compared with the risk-free rate here (a risky bond’s yield is usually above it). C describes a bond trading AT par (yield = coupon rate).","th":["ytm"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_3":{"id":"y24_3","ch":"Ch 6","type":"mc","q":"What is the yield-to-maturity of the zero-coupon bond with 5 years to maturity closest to?","opts":["5.0%","5.5%","4.0%","4.5%"],"ans":0,"why":null,"steps":"For a zero-coupon bond: YTM = (Face/Price)^(1/n) − 1 = (100/78.35)^(1/5) − 1 = 1.2763^0.2 − 1 = 5.0%. Only the 5-year price is needed. Dividing the total gain by 5 without compounding gives (100/78.35 − 1)/5 = 5.5%, and using the wrong number of years gives the lower options.","th":["apr_ear","credit","ytm"],"case":"y24c3","keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_4":{"id":"y24_4","ch":"Ch 4","type":"mc","q":"A risk-free project with an NPV of 0 requires an investment of €1.450 today and will generate a one time cash flow of €1.600 in two years.<br>What is the risk-free annual interest rate closest to?","opts":["10%","5%","8%","4%"],"ans":1,"why":null,"steps":"NPV = 0 means 1,450 = 1,600/(1+r)², so (1+r)² = 1,600/1,450 = 1.1034 and r = √1.1034 − 1 = 5.0%. 10% is the total 2-year return (1,600/1,450 − 1 = 10.3%) without converting it to an annual rate. Halving that without compounding also lands near 5%, but the correct method is the square root.","th":["apr_ear","npvrule"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_5":{"id":"y24_5","ch":"Ch 7","type":"mc","q":"The appropriate discount rate for this project is 10%. Management applies the payback period rule when deciding if this project is attractive and sets a payback cutoff of 3 years. Should the project be accepted?<br><i>(Only the first two options are visible in the screenshot.)<\/i>","opts":["No, because it has a payback period of more than 3 years.","No, because it has a negative NPV."],"ans":0,"why":null,"steps":"Cumulative cash flows: −17,870 + 6,040 + 7,025 + 4,095 = −710 after 3 years, so the investment is not yet recovered: payback = 3 + 710/3,470 = 3.2 years &gt; 3, so the payback rule rejects. The question asks what management decides <b>under the payback rule<\/b>. The second option is wrong: at 10% the NPV is +$580, so NPV would actually accept. This is exactly the weakness of payback: it ignores the cash flows after the cutoff.","th":["apr_ear","npvrule","payback"],"case":"y24c5","keep":false,"model":null,"note":"Only two answer options are visible in the screenshot; the other options are cut off.","src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_6":{"id":"y24_6","ch":"Ch 8","type":"mc","q":"Below is the financial information related to a new project. Determine which information is relevant and use that information to calculate the project’s unlevered net income.<ul><li>Sales revenues equal $20 million<\/li><li>Cost of goods sold is equal to 55% of sales<\/li><li>Selling, general, and administrative expenses is equal to 17% of sales<\/li><li>Depreciation expense is $215,000<\/li><li>Interest expense is $100,000<\/li><li>$15 million of cash was raised from issuing new shares of company stock<\/li><li>The marginal corporate profit tax rate is 30%.<\/li><\/ul>What is unlevered net income for this project closest to?<br><i>(The fourth option is hidden in the screenshot; it is filled in with the calculated answer.)<\/i>","opts":["$4,200,300","$3,699,500","$3,927,300","$3,769,500"],"ans":3,"why":null,"steps":"EBIT = 20,000,000 × (1 − 0.55 − 0.17) − 215,000 = 5,600,000 − 215,000 = 5,385,000. Unlevered net income = 5,385,000 × (1 − 0.30) = $3,769,500. Interest is left out (unlevered: financing is judged separately) and the share issue is a financing flow, not income. $3,699,500 deducts the interest ((5,385,000 − 100,000) × 0.7).","th":["ev","fcf","ratios","uni"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_7":{"id":"y24_7","ch":"Ch 5","type":"mc","q":"The interest rate of a loan is quoted as 12% APR with quarterly compounding. A project with the same risk as the loan has monthly cash flows. What is the correct discount rate per month for the project closest to?","opts":["1%","0.74%","3%","12.6%"],"ans":0,"why":null,"steps":"Quarterly rate = 12%/4 = 3%. One quarter is three months, so the monthly rate solves (1 + r)³ = 1.03: r = 1.03^(1/3) − 1 = 0.99% ≈ 1%. 3% is the quarterly rate. 12.6% is the EAR (1.03⁴ − 1 = 12.55%), which is an annual rate. Match the rate to the period of the cash flows.","th":["apr_ear","loan","matchperiod"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_8":{"id":"y24_8","ch":"Ch 1","type":"mc","q":"Jan repairs bikes. He started a bike shop as a sole proprietorship 10 years ago. This year, his brother Cees joined his business and they formed a partnership. They planned to expand into nearby towns but unfortunately, things did not go well for the partnership. According to the bank, the partnership now owes €10.000.<br>Who is or are personally liable for this debt?","opts":["Both Jan and Cees, because they are partners.","Jan, because he founded the business.","Cees, because he is the latest owner.","Neither Jan nor Cees, because they are protected by limited liability."],"ans":0,"why":null,"steps":"In a (general) partnership all partners are personally liable for the firm’s debts, regardless of who founded the business or who joined last. Limited liability belongs to corporations (and limited partners), not to a general partnership.","th":["apr_ear","firmtypes"],"case":null,"keep":true,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_9":{"id":"y24_9","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>1. Maximizing shareholder value is the same as maximizing shareholder welfare.<br>2. Maximizing shareholder value is not the same as maximizing profit.","opts":["Statement 1 is true, statement 2 is false","Statement 2 is true, statement 1 is false","Both statements are false","Both statements are true"],"ans":1,"why":null,"steps":"Statement 1 is false: Hart &amp; Zingales argue that shareholders also care about non-financial (social) goals, so shareholder <b>welfare<\/b> is broader than shareholder <b>value<\/b> (the market value of the shares). Statement 2 is true: value is the present value of all future cash flows, taking timing and risk into account, while profit is an accounting figure for one period.","th":["goal","hz"],"case":null,"keep":true,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_10":{"id":"y24_10","ch":"Ch 8","type":"mc","q":"What is this investment’s unlevered net income closest to?<br><i>(Only the correct option was visible in the screenshot; the three other options are rebuilt from typical mistakes.)<\/i>","opts":["€2.305.220","€2.421.940","€2.210.420","€2.352.620"],"ans":0,"why":null,"steps":"Unlevered net income = (Revenues − Costs − Depreciation) × (1 − marginal tax rate). EBIT = 6,000,000 − 2,750,000 − 272,000 − 60,000 = 2,918,000. × (1 − 0.21) = €2,305,220. Interest and the bank loan are ignored (unlevered: financing is judged separately). €2,421,940 uses the average rate (2,918,000 × 0.83): the marginal rate applies to extra income. €2,210,420 deducts interest ((2,918,000 − 120,000) × 0.79). €2,352,620 forgets to deduct depreciation.","th":["ev","fcf","loan","ratios"],"case":"y24c10","keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_11":{"id":"y24_11","ch":"Ch 7","type":"mc","q":"The appropriate discount rate for this project is 10%. What is the profitability index for this project closest to?<br><i>(A fourth option is cut off in the screenshot.)<\/i>","opts":["0,313","2,313","1,313"],"ans":2,"why":null,"steps":"Profitability index = NPV / resources consumed (here the $10,000 investment, the constrained resource). PV of the inflows at 10% = 6,700/1.1 + 7,250/1.1² + 8,000/1.1³ + 7,375/1.1⁴ = 6,091 + 5,992 + 6,011 + 5,037 = 23,130. NPV = 23,130 − 10,000 = 13,130, so PI = 13,130/10,000 = 1.313. 2.313 is PV of inflows / investment: that forgets to subtract the investment from the numerator.","th":["apr_ear","pi"],"case":"y24c11","keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_12":{"id":"y24_12","ch":"Ch 6","type":"mc","q":"What is the current price of bond A closest to?","opts":["$100","$125","$80","$160"],"ans":3,"why":null,"steps":"Price = coupons (annuity) + face value discounted at the YTM. Coupon = 10% × 100 = $10. PV of coupons = 10 × [1 − 1.05⁻²⁰]/0.05 = 124.62. PV of face value = 100/1.05²⁰ = 37.69. Price = 162.31, closest to $160. Because the coupon rate (10%) is above the yield (5%), the price must exceed par: that rules out $100 (par, only if yield = coupon) and $80. $125 is just the PV of the coupons without the face value.","th":["apr_ear","ytm"],"case":"y24c12","keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_13":{"id":"y24_13","ch":"Ch 8","type":"mc","q":"Coffee &amp; Co. has provided the following estimates for a new project under consideration. The project will require an initial investment in project assets of €450.000. The assets will be depreciated to a book value of zero over the three-year life of the project using the straight-line method. The project will produce revenues in the first year of €650.000, in the second year of €725.000, and in the third and final year of €725.000. Cost of goods sold is equal to 30% of sales. The applicable corporate tax rate is 25%. An investment in net working capital of €30.000 will be required at the end of the first year of the project and will increase by 20% for the second year. Net working capital will then remain stable and will be fully recovered (i.e. go down to €0) in the final year of the project.<br>What is the free cash flow for the second year of the project closest to?","opts":["€412.125","€382.125","€348.750","−€101.250"],"ans":0,"why":null,"steps":"Year 2: revenues 725,000; COGS 30% = 217,500; depreciation = 450,000/3 = 150,000. EBIT = 725,000 − 217,500 − 150,000 = 357,500. Unlevered net income = 357,500 × 0.75 = 268,125. NWC is 30,000 after year 1 and grows 20% to 36,000, so ΔNWC in year 2 is only +6,000. FCF = UNI + depreciation − CapEx − ΔNWC = 268,125 + 150,000 − 0 − 6,000 = €412,125. €382,125 subtracts the whole NWC level (36,000) instead of the change. The investment of 450,000 is spent at t = 0, not in year 2.","th":["apr_ear","ev","fcf"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_14":{"id":"y24_14","ch":"Ch 3","type":"mc","q":"Do these securities and prices indicate an arbitrage opportunity?","opts":["No as all prices should reflect the present value of their cash flows.","No as the price of security D is equal to its no-arbitrage price.","Yes as the no-arbitrage price of security D is $400 which is lower than $510","Yes as the no-arbitrage price of security D is $490 which is higher than $510"],"ans":3,"why":null,"steps":"Replicate D (200, 300, 100) with A, B and C: 2 × A gives 200 at time 1 and costs 180; 1.5 × B gives 300 at time 2 and costs 240; 1 × C gives 100 at time 3 and costs 70. The portfolio costs 180 + 240 + 70 = $490 and pays exactly the same as D. By the law of one price D should cost $490 but trades at $510, so D is overpriced: sell D, buy the portfolio, and lock in a risk-free $20 today. (The printed wording ‘$490 which is higher than $510’ is a typo in the exam, but this is the option the key marks correct.) The $400 in option C is a miscalculation, and A and B are wrong because the prices do differ from the replicating cost.","th":["arbitrage","replicate"],"case":"y24c14","keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_15":{"id":"y24_15","ch":"Ch 5","type":"mc","q":"A car dealer offers you a car loan with a 4.5% APR with monthly compounding for 5 years. The price of the car today is $25,000. You will pay a fixed amount $X at the end of each month for this car loan. What is X closest to?","opts":["$475","$465","$435","$400"],"ans":1,"why":null,"steps":"A loan with fixed monthly payments is an annuity: PV = X × [1 − (1+r)⁻ⁿ]/r. Monthly rate r = 4.5%/12 = 0.375%, n = 5 × 12 = 60. So X = 25,000 × 0.00375 / (1 − 1.00375⁻⁶⁰) = $466.08, closest to $465. $400 is roughly 25,000/60 = 417 (principal only, no interest). Using the APR for the whole year or the wrong number of periods gives the other values.","th":["apr_ear","loan","matchperiod"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_16":{"id":"y24_16","ch":"Ch 7","type":"mc","q":"A project requires an initial investment of €450.000. The project will produce yearly free cash flows lasting forever where the first cash flow is €55.000 and which occurs at the end of the first year. After this the yearly cash flow will decline at 1% per year. The applicable discount rate is 6%. Should this project be accepted according to the IRR-rule?","opts":["Yes as the IRR is around 11% which is larger than the cost of capital.","There is no optimal decision as both IRR and the cost of capital are positive.","No as the IRR is around 8% which is smaller than the cost of capital.","Yes as the IRR is around 13% which is larger than the cost of capital."],"ans":0,"why":null,"steps":"A growing perpetuity gives 0 = −450,000 + 55,000/(IRR − g), so IRR = 55,000/450,000 + g = 12.2% + (−1%) = 11.2%. The cash flow <b>declines<\/b>, so g is negative. 11% &gt; 6%, so accept. The 13% option comes from adding g instead of subtracting it (a sign slip). Positive rates on both sides say nothing about the decision; the rule is IRR &gt; cost of capital. 8% would need a decline of about 4% a year.","th":["apr_ear","ev","fcf","irrrule"],"case":null,"keep":true,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_17":{"id":"y24_17","ch":"Ch 7","type":"mc","q":"Management is evaluating two mutually exclusive projects: project Zeus en project Apollo. For both projects a required rate of return of 12% applies. Project Zeus has an estimated NPV of €150.000 and an IRR of 23%, while Project Apollo has an estimated NPV of €200.000 and an IRR of 19%. Which of the following statements is TRUE:","opts":["Management should choose the project with the highest IRR when evaluating mutually exclusive projects which in this case is project Zeus.","Management should calculate and apply the payback period rule in order to reach a final decision with confidence.","Management cannot choose either project with confidence, given the conflicting indications of the NPV and IRR decision rules.","Management should choose the project with the highest NPV when evaluating mutually exclusive projects which in this case is Apollo."],"ans":3,"why":null,"steps":"For mutually exclusive projects choose the highest NPV: Apollo (€200,000) beats Zeus (€150,000). NPV measures the value created in euros; IRR is a percentage that ignores scale and timing, so a higher IRR (Zeus 23%) can go with a lower value creation. Both IRRs exceed 12%, so both projects are worth doing on their own, but only one can be chosen. The ‘conflict’ is not a real problem because NPV is the reliable rule. Payback ignores discounting and later cash flows, so it would not add confidence.","th":["ev","irrrule","mutual","npvrule"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y24_18":{"id":"y24_18","ch":"Ch 8","type":"mc","q":"Which of the following statements is FALSE?","opts":["Opportunity costs reflects the value a resource could have provided in its best alternative use.","Sunk costs are unrecoverable costs for which the firm is already liable.","Opportunity costs are costs that have been or will be paid, regardless of whether or not an investment is undertaken.","Overhead costs are costs associated with activities that are not directly attributable to a single business activity."],"ans":2,"why":null,"steps":"The third statement is false: costs that have been or will be paid regardless of whether the investment is undertaken are SUNK costs, not opportunity costs. An opportunity cost is the value a resource could have produced in its best alternative use (e.g. rent forgone on an office the project uses), and it is incremental. The other three statements are correct definitions: sunk costs are unrecoverable and already owed, and overhead is not tied to one single activity (it only counts if the project changes it).","th":["firmtypes","incremental","oppcost"],"case":null,"keep":false,"model":null,"src":"p2024","msrc":"official","pts":1,"srcl":"Past exam · Midterm 2024 (StudentWiki capture, TestVision)"},"y19_1":{"id":"y19_1","ch":"Ch 7","type":"mc","q":"Which of the following statements is <b>FALSE<\/b>?","opts":["The internal rate of return (IRR) investment rule is based upon the notion that if the return on other alternatives with equivalent risk and maturity is greater than the return on the investment opportunity, you should undertake the investment opportunity.","It is possible that an IRR does not exist for an investment opportunity.","It is possible that there is no discount rate that will set the NPV equal to zero.","If the payback period is less than a pre-specified length of time, you accept the project."],"ans":0,"why":null,"steps":"The first statement turns the IRR rule upside down. The rule says: take the investment if its IRR is <b>higher<\/b> than the return on alternatives with equivalent risk and maturity (the cost of capital). If the alternatives return more, you should <b>not<\/b> undertake it. The other three are true: an IRR may not exist (e.g. all cash flows positive), which is the same as saying no discount rate sets the NPV to zero, and the payback rule accepts when payback is shorter than the cutoff.","th":["irrrule","npvrule","payback"],"case":null,"keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_2":{"id":"y19_2","ch":"Ch 8","type":"mc","q":"The level of Net Working Capital (NWC) one year from now (at t=1) is $5,000, at t=2 the level of NWC is $10,000 and at t=3, the NWC is $0.<br>What is the NPV of the Renewable Industries’ project closest to?","opts":["−$8,448","$14,870","$7,793","$11,946"],"ans":3,"why":null,"steps":"FCF = UNI + depreciation − CapEx − ΔNWC. Use the <b>changes<\/b> in NWC: +5,000 at t=1, +5,000 at t=2 and −10,000 at t=3 (recovered). FCF: t0 = −90,000; t1 = 13,000 + 30,000 − 5,000 = 38,000; t2 = 43,000 − 5,000 = 38,000; t3 = 43,000 + 10,000 = 53,000. NPV = −90,000 + 38,000/1.12 + 38,000/1.12² + 53,000/1.12³ = −90,000 + 33,929 + 30,293 + 37,724 = $11,946. Typical mistakes: subtracting the NWC <b>levels<\/b> instead of the changes, or forgetting that NWC is recovered at the end. (The third option is printed as ‘$7,7937’ in the original.)","th":["apr_ear","ev","fcf","npvrule"],"case":"y19c2","keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_3":{"id":"y19_3","ch":"Ch 6","type":"mc","q":"JK Inc. has a bond outstanding with a face value of $1,000 that reaches maturity in 10 years. The bond certificate indicates that the coupon rate for this bond is 3% and that the coupon payments are to be made quarterly. Suppose the yield of the JK Inc. bond is 2%. What can be stated about the price of the bond?","opts":["There is not enough information to say anything about the price of the bond.","The bond trades at par.","The bond trades at a premium.","The bond trades at a discount."],"ans":2,"why":null,"steps":"Compare the coupon rate with the yield: the coupon rate (3%) is above the yield (2%), so the bond pays more than the market requires and its price is above face value: a premium. No calculation is needed; the quarterly payments do not change this (both rates are quoted the same way). At par the coupon rate would equal the yield; at a discount the coupon rate would be below it.","th":["apr_ear","ytm"],"case":null,"keep":false,"model":null,"src":"pbund","msrc":"official","pts":1,"srcl":"Past exam · 'Midterm 2019' capture (screenshots show 'Exambundle Finance 1 Midterm 24-25')"},"y19_4":{"id":"y19_4","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>1) A corporation is a legal entity, separate from its owners.<br>2) If you own shares of a corporation, you are not personally liable for the firm’s debt in case of a default.","opts":["Both statements are correct.","Only statement 2 is correct.","Only statement 1 is correct.","Neither statement is correct."],"ans":0,"why":null,"steps":"Both are core features of
