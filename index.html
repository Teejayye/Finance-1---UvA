const WEEKS=[
{n:1,title:"Corporation, statements, arbitrage",ch:"Ch 1, 2, 3 + Hart & Zingales (2017)",
sections:[
{h:"Ch 1 · The corporation",html:`<p>A <b>sole proprietorship</b> (eenmanszaak) has one owner who is also manager and is personally liable. In a <b>partnership</b> (VOF, maatschap, CV) all partners are personally liable. An <b>LLC</b> (BV) and a <b>corporation</b> (NV) are legal entities: shareholders are <b>not</b> liable for the firm’s debts, and ownership is separated from control. NV shares trade on an exchange, BV shares do not. Corporate profit is taxed twice: corporate tax, then income tax on dividends.</p>
<p><b>Objective:</b> maximize <b>shareholder value</b> (the value of the shares), not profit. Shareholders are the residual claimants (last in line), so in theory they care about everyone else too. This assumes no agency problems and that externalities are priced or regulated.</p>
<p><b>Agency problem:</b> managers (agents) can pursue their own utility instead of shareholders’ (principals’), e.g. Tyco’s CEO Kozlowski. Remedies: board oversight, pay tied to performance, product-market competition, and takeovers after the share price falls.</p>
<p><b>Trading:</b> you buy at the <b>ask</b>, sell at the <b>bid</b>; the <b>bid-ask spread</b> is the market maker’s profit.</p>`},
{h:"Ch 2 · Statements, market vs book value",html:`<p><b>Balance sheet:</b> Assets = Liabilities + Equity. <b>Income statement:</b> Sales − COGS = gross profit; − general costs − depreciation = operating income = <b>EBIT</b>; − interest = pretax income (EBT); − taxes = <b>net income</b>.</p>
<p><b>Book value</b> is backward-looking (historical cost, accounting rules). <b>Market value</b> is forward-looking (expected cash flows, risk, sentiment). Market cap = share price × shares. Market-to-book = market value of equity ÷ book value of equity. Example: Firm Z, factory cost $100, pays $150 in 1 year at 8%: assets are worth 150/1.08 = $139, so equity = 139 − 40 = $99, share price $9.90, M/B = 99/60 = 1.65. A project with NPV $5 raises equity to $104 and the price to $10.40.</p>
<p><b>Enterprise value</b> = market cap + debt − cash = value of the operating assets. Net debt = debt − cash.</p>
<div class="scroll"><table><tr><th>Ratio group</th><th>On midterm formula sheet</th><th>Learn by heart (not given)</th></tr>
<tr><td>Liquidity, coverage, leverage</td><td>Current ratio, EBIT/interest, debt-to-capital</td><td>Debt-equity (book, market), debt-to-EV, net profit margin</td></tr>
<tr><td>Working capital</td><td>AR days, AP days, inventory days</td><td>–</td></tr>
<tr><td>Returns, valuation</td><td>ROE</td><td>M/B, P/E, EV/Sales, EV/EBITDA</td></tr></table></div>
<p>Per your screenshot, the crossed-out ratios (margins except net, quick, cash, equity multipliers, EV/EBIT, asset turnover, ROA, ROIC, EBITDA coverage) are excluded.</p>`},
{h:"Profit versus cash flow",html:`<p>Profit follows accounting rules; cash flow follows money. Revenues are not always inflows and costs not always outflows. <b>Cash flow = profit − increase in NWC</b>, where NWC = current assets − current liabilities (here accounts receivable − accounts payable). Example: sales 100 (80 received), COGS 70 (60 paid): profit 30, cash flow 20, increase in NWC 10.</p>
<ul><li>Taxes are based on profit: 30% of EBIT 30 = 9, so cash flow = 21 − 10 = 11.</li><li><b>Capex</b> is a cash outflow but not a cost. <b>Depreciation</b> is a cost but not a cash outflow. It creates a <b>depreciation tax shield</b> (tax rate × depreciation).</li><li>Inventory purchases are cash outflows that are not in profit.</li></ul>
<p><b>FCF = unlevered net income + depreciation − capex − increase in NWC.</b> Example: 15.4 + 8 − 24 − 10 = −10.6. Free cash flow excludes financing flows (separation principle); unlevered net income ignores interest.</p>`},
{h:"Ch 3 · Valuation, arbitrage, law of one price",html:`<p>Use <b>market prices</b> to get cash values, but only in <b>competitive markets</b> (same price to buy and sell, ignoring transaction costs). A euro today beats a euro next year because you can invest it. Compare only at the <b>same moment</b>: <b>PV</b> = CF/(1+r) (discounting), <b>FV</b> = CF×(1+r) (compounding). Value a stream by adding the PVs.</p>
<p><b>NPV</b> = PV(benefits) − PV(costs). Take the highest-NPV alternative; accept NPV &gt; 0. Invest 8 to get 9 at 10%: NPV = −8 + 9/1.10 = 0.18 &gt; 0, so accept.</p>
<p><b>Arbitrage:</b> profit without risk or net investment (rare). <b>No-arbitrage price</b> = PV of all cash flows. A <b>normal market</b> has no arbitrage. Then the <b>law of one price</b> holds (equivalent assets trade at one price), which gives <b>value additivity</b>: Price(A+B) = Price(A) + Price(B), and firm value V = D + E. It also gives the <b>separation principle</b>: buying or selling securities has NPV 0, so investment decisions can be separated from financing decisions.</p>
<p><b>Bond arbitrage method:</b> match the coupon bond’s cash flows with zero-coupon bonds and compare prices. Zeros at 972.14, 939.62 and 906.24: the 10% coupon bond is worth 0.1×972.14 + 0.1×939.62 + 1.1×906.24 ≈ $1188, but trades at $1183.95. Buy the cheap bond, sell the replicating zeros.</p>`},
{h:"Article · Hart & Zingales (2017)",html:`<p>Friedman argued managers should make as much money as possible within the rules. Hart and Zingales say <b>shareholder welfare ≠ market value</b>: shareholders are prosocial and care about more than money. Friedman’s <b>separability</b> assumption (let companies make money and let people give to charity) fails when profit and damage are inseparable, e.g. oil digging, or Walmart selling high-capacity magazines. Politics also does not fix everything.</p>
<p><b>Amoral drift:</b> hostile bidders only care about money, and dispersed shareholders tender anyway (collective action problem), so takeovers push firms from clean to dirty. There is no mirror-image drift, because nobody gains by buying a dirty firm to clean it. <b>Voting</b> by shareholders avoids this asymmetry. Authors’ proposal: managers and asset managers follow investors’ preferences, via votes or polls. Fiduciary duty is not just maximizing value (the Shkreli example). Prefer <b>invest and engage</b> over divestment.</p>`}],
terms:[["Sole proprietorship","One owner who is also the manager; personal liability."],["Partnership","Several owners, all personally liable (VOF, maatschap)."],["Limited liability","Shareholders lose at most their investment, not the firm’s debts."],["Shareholder value","The value of the firm’s shares; the standard objective of the corporation."],["Residual claimant","Shareholders are paid last, after creditors."],["Agency problem","Managers pursue their own interests instead of the shareholders’."],["Externality","A cost or benefit to others that is not priced (e.g. pollution)."],["Bid-ask spread","Ask price minus bid price; the market maker’s profit."],["EBIT","Earnings before interest and taxes = operating income + other income."],["Market capitalization","Share price × number of shares = market value of equity."],["Market-to-book ratio","Market value of equity ÷ book value of equity."],["Enterprise value","Market cap + debt − cash; market value of operating assets."],["Net working capital","Current assets − current liabilities."],["Free cash flow","Unlevered net income + depreciation − capex − increase in NWC."],["Depreciation tax shield","Tax saved because depreciation is deductible: tax rate × depreciation."],["Discount factor","1/(1+r): converts a future cash flow into present value."],["NPV","PV of all cash flows including the initial investment."],["Arbitrage","Risk-free profit with no net investment."],["Law of one price","Equivalent assets in competitive markets trade at the same price."],["Value additivity","Price of a bundle = sum of the prices of its components."],["Separation principle","Securities trades have NPV 0, so investment and financing decisions are separate."],["Amoral drift","Hart & Zingales: takeovers push companies toward ignoring externalities."]],
formulas:[["Current ratio","Current assets / Current liabilities","s"],["EBIT / interest","EBIT / Interest expense","s"],["Debt-to-capital","Debt / (Equity + Debt)","s"],["ROE","Net income / Book equity","s"],["AR days","AR / Avg daily sales","s"],["AP days","AP / Avg daily COGS","s"],["Inventory days","Inventory / Avg daily COGS","s"],["Free cash flow","UNI + Depr − CapEx − ΔNWC","s"],["FV","CF × (1+r)^n","s"],["PV","CF / (1+r)^n","s"],["Enterprise value","Mkt cap + Debt − Cash"],["Market cap","Price × Shares"],["Market-to-book","Mkt equity / Book equity"],["P/E","Price / EPS"],["Net profit margin","Net income / Sales"],["Debt-equity","Debt / Equity (book or market)"],["NPV","−Investment + Σ CF/(1+r)^t"],["Cash flow (simple)","Profit − increase in NWC"],["No-arbitrage price","PV of all the security’s cash flows"]],
q:[
{t:"mc",q:"According to the book, what is the objective of the firm?",o:["Maximize profit","Maximize shareholder value","Maximize growth","Maximize employee welfare"],a:1,e:"Shareholder value (share value), not profit. The slides stress it ‘is a good start’ but ignores externalities and agency problems."},
{t:"mc",q:"Which legal form has limited liability AND a separation of ownership and control?",o:["Sole proprietorship","Partnership (VOF)","Corporation (NV)","Both a sole proprietorship and a partnership"],a:2,e:"Only the BV and NV are separate legal entities with limited liability and separation of ownership and control."},
{t:"mc",q:"A CEO spends shareholders’ money on a lavish lifestyle. This is an example of…",o:["An externality","An agency problem","Arbitrage","Value additivity"],a:1,e:"Self-interested managers (agents) maximize their own utility instead of shareholder value (Tyco example)."},
{t:"mc",q:"Which is NOT a mechanism that pushes managers to serve shareholders?",o:["A board of directors overseeing the CEO","Pay tied to firm performance","Hostile takeovers after a falling share price","A fixed salary regardless of performance"],a:3,e:"Fixed pay gives no incentive link. The other three are the corporate governance mechanisms from the slides."},
{t:"mc",q:"Which statement is true?",o:["Book value of equity includes the firm’s future prospects","Market value of equity can be read off the financial statements","Market cap is the market value of equity and includes future prospects","Average profit of 3–5 years gives the market value"],a:2,e:"Market value is forward-looking; book value is historical and backward-looking."},
{t:"mc",q:"Depreciation is…",o:["A cash outflow but not a cost","A cost but not a cash outflow","Both a cost and a cash outflow","Neither a cost nor a cash outflow"],a:1,e:"It spreads a past capex over the asset’s life. It lowers profit and taxes but no cash leaves the firm. Capex is the cash outflow."},
{t:"mc",q:"Which is a true arbitrage opportunity?",o:["Buying an undervalued stock to hold it for a rise","Buying a stock in one market and selling it immediately for more in another","Buying a $99 risk-free bond paying $100 in a year at 1.01% interest","Borrowing at 5% to buy shares expected to return 8%"],a:1,e:"Arbitrage is risk-free and needs no net investment. The bond is fairly priced (100/1.0101 = 99); the others carry risk."},
{t:"mc",q:"The separation principle says that…",o:["Owners and managers must be separate","In a normal market the investment decision can be separated from the financing decision","Debt and equity must be priced separately","Profit and cash flow are unrelated"],a:1,e:"Security transactions at fair prices have NPV 0, so they neither create nor destroy value."},
{t:"mc",q:"Hart & Zingales argue that Friedman’s case for profit maximization fails when…",o:["Shareholders are not prosocial","Externalities are inseparable from the money-making activity","Managers have no agency problem","Governments perfectly regulate externalities"],a:1,e:"If damage and profit are inseparable, shareholders cannot undo the damage themselves. Shareholder welfare then differs from market value."},

{n:2,title:"Time value, interest rates, bonds",ch:"Ch 4, 5, 6",
sections:[
{h:"Ch 4 · Time value of money",html:`<p>$1 now is worth more than $1 later because of <b>impatience</b> (people prefer consumption now), <b>inflation</b> (money loses value) and <b>risk</b> (future cash flows are uncertain and people are risk averse).</p>
<p><b>Three rules of time travel:</b> (1) only values at the <b>same point in time</b> can be compared or combined; (2) to move a cash flow forward, <b>compound</b> it: FV = C × (1+r)^n; (3) to move it backward, <b>discount</b> it: PV = C / (1+r)^n. Example at r = 5%: 1,000 today = 1,050 in a year. Both ways give the same answer, there is no preference. A stream is valued by adding the PV of each cash flow, and <b>NPV</b> &gt; 0 means invest.</p>`},
{h:"Ch 4 · Perpetuities, annuities, loans, IRR",html:`<p><b>Perpetuity</b> (constant C forever): PV = C/r. <b>Growing perpetuity</b>: PV = C/(r − g), only valid if <b>g &lt; r</b>. <b>Annuity</b> (constant C for N periods): PV = C/r × (1 − 1/(1+r)^N). <b>Growing annuity</b>: PV = C/(r − g) × (1 − ((1+g)/(1+r))^N). <b>FV of an annuity</b> = PV × (1+r)^N. Example: $2m growing 4% for 10 years at 11%: PV = 2/0.07 × (1 − (1.04/1.11)^10) ≈ $13.68m.</p>
<p><b>Early and late annuities:</b> the formula assumes the first payment at time 1. If it starts at time 0 (early), multiply by (1+r), because every payment arrives one period sooner. If it starts at time 2 (late), divide by (1+r). The same adjustment works for perpetuities: with C = 10 and r = 2%, first payment at time 1 gives 500, at time 0 gives 510, first payment at time 2 gives 500/1.02 ≈ 490.20.</p>
<p><b>Loan payment</b> (solve for C): C = P × r / (1 − (1+r)^−N). A $100,000 loan at 8% over 10 years costs $14,903 per year. <b>IRR</b> is the rate that makes NPV = 0: turning 1,000 into 2,000 in 6 years gives (2)^(1/6) − 1 = 12.25%.</p>`},
{h:"Ch 5 · APR, EAR and matching the period",html:`<p><b>Key rule:</b> change the interest rate to match the cash flow period, never the cash flows to match the rate. <b>APR</b> is simple interest per year without compounding: 1% per month is 12% APR with monthly compounding. <b>EAR</b> includes compounding: EAR = (1 + APR/k)^k − 1, so 1% per month = 1.01^12 − 1 = 12.68%. APR is a red flag: it cannot be used directly for PV or FV.</p>
<p><b>Converting:</b> APR to period rate: divide by k (9% APR, quarterly → 2.25%). EAR to period rate: (1+EAR)^(1/k) − 1 (9% EAR → 1.09^(1/4) − 1 = 2.18% per quarter, 0.72% per month).</p>
<p><b>Four steps for a time-value question:</b> (1) which cash flow form (annuity, perpetuity…); (2) which rate matches the cash flow period; (3) how many periods; (4) PV or FV. Example: $5 per month for 18 years at 6% APR: monthly rate 0.5%, N = 216, PV = 659.49, FV = 659.49 × 1.005^216 = 1,936.77. An <b>annuity (amortizing) loan</b> has equal payments, each part interest and part repayment, and the loan is fully repaid at time N. A <b>fair loan</b> has a balance equal to the PV of its payments: that PV is what you can borrow.</p>`},
{h:"Ch 5 · What determines interest rates",html:`<p><b>Nominal rates</b> are the quoted ones and discount nominal cash flows. <b>Real rate:</b> (1 + r) = (1 + rr)(1 + i), so rr ≈ r − i. Use nominal with nominal, or real with real. 6% nominal with 2% inflation gives 3.92% real.</p>
<p><b>Term structure / yield curve:</b> the interest rate depends on maturity, and the yield curve plots EAR against term. It is usually upward sloping (normal); it is <b>inverted</b> when short rates are above long rates, which signals that investors expect lower future rates. Tutorial: one-year rates 2%, 1%, 0%, 0% give EARs of 2%, 1.499%, 0.997% and 0.75%. Match the term: discount a year-3 cash flow at the 3-year rate (10/1.00997^3 = $9.71, same as 10/(1.02 × 1.01 × 1.00)).</p>
<p><b>Taxes:</b> use the after-tax rate, r × (1 − τ). <b>Risk:</b> riskier cash flows get a higher discount rate; use expected cash flows. The <b>opportunity cost of capital</b> is the best expected return available on an investment of comparable risk and term, and it is the discount rate you should use.</p>`},
{h:"Ch 6 · Bonds, prices and yields",html:`<p>A <b>bond</b> is a tradeable debt contract. The issuer receives money now and promises coupons plus the <b>face value</b> at maturity; the holder carries the default risk. The coupon payment is CPN = coupon rate × face value / k. The <b>coupon rate only sets the cash flows</b>, it is never the discount rate. Equity, in contrast, promises no fixed cash flows. <i>Advantages of bonds:</i> easy external capital, cheaper than bank loans for large amounts, no voting rights, tax shield. <i>Disadvantages:</i> emission costs, fixed interest can trigger bankruptcy, default risk for the holder.</p>
<p><b>Prices:</b> zero-coupon P = FV/(1+YTM)^n. Coupon bond P = CPN × annuity factor(y, N) + FV/(1+y)^N. <b>YTM</b> is the IRR of the promised cash flows, quoted as an APR (5% per 6 months = 10%). Price &lt; face = <b>discount</b> bond, = face = <b>par</b>, &gt; face = <b>premium</b>. Example: 6% coupon, semi-annual, 10 years, YTM 7.5% APR: 3.75% per period, 20 periods, P = 895.78. A zero priced at 96,618.36 for 100,000 in one year has YTM = 100,000/96,618.36 − 1 = 3.5%.</p>
<p><b>Rates and prices move opposite:</b> when yields rise, prices fall, and the effect is bigger for longer maturities (<b>interest rate risk</b>). Tutorial: the 5-year, 6% semi-annual bond at 3% YTM costs 1,138.33; at 3.5% it costs 1,113.77; at 1,200 the YTM is 0.90% per half-year (1.80% APR). A bond bought at its fair price has NPV = 0, otherwise investors would push the price until it does.</p>`},
{h:"Ch 6 · Bond arbitrage and credit risk",html:`<p><b>Replicate a coupon bond</b> with zero-coupon bonds and compare prices (law of one price). Method 1, matching cash flows: a 10% annual, 3-year bond equals 0.1 of the 1-year zero, 0.1 of the 2-year zero and 1.1 of the 3-year zero: 0.1 × 972.14 + 0.1 × 939.62 + 1.1 × 906.24 = 1,188.04. If it trades below that, buy the bond and sell the zeros; if above, do the opposite. Method 2, yields: find each zero’s YTM and discount the coupon bond’s cash flows with them (book example: 100/1.035 + 100/1.04² + 1,100/1.045³ ≈ 1,153).</p>
<p><b>Credit risk:</b> a bond’s promised yield (YTM, based on promised cash flows) is higher than its <b>expected return</b> (based on expected cash flows) when default is possible. The <b>yield spread</b> (credit or default spread) = corporate yield − Treasury yield: 3% − 2% = 1%. Ratings run from AAA to D; below BBB (Baa) is <b>speculative grade (junk)</b>. Quoted prices are <b>clean</b>; dirty (invoice) price = clean + accrued interest.</p>`}],
terms:[["Time value of money","A positive interest rate makes money now worth more than the same amount later."],["Compounding","Moving a cash flow forward in time: FV = C × (1+r)^n."],["Discounting","Moving a cash flow backward in time: PV = C / (1+r)^n."],["Perpetuity","Constant cash flow C forever; PV = C/r."],["Growing perpetuity","Cash flow growing at g forever; PV = C/(r − g), needs g &lt; r."],["Annuity","Constant cash flow for a limited number of periods."],["Early / late annuity","First payment before (time 0) or after (time 2) the normal time 1; multiply or divide the PV by (1+r)."],["IRR","Interest rate that makes the NPV of the cash flows zero."],["Amortizing (annuity) loan","Equal periodic payments, each with interest and repayment; fully repaid at time N."],["Fair loan","Loan balance equals the PV of the loan payments."],["APR","Simple annual rate without compounding; 1% a month = 12% APR."],["EAR","Annual rate including compounding: (1 + APR/k)^k − 1."],["Nominal vs real rate","Nominal includes inflation; real is corrected for it: (1+r) = (1+rr)(1+i)."],["Term structure","The relationship between investment term and interest rate."],["Yield curve","Graph of the term structure; inverted when short rates exceed long rates."],["Opportunity cost of capital","Best expected return on an investment of comparable risk and term; the discount rate."],["Face value (par)","Amount repaid to the bondholder at maturity."],["Coupon rate","Sets the coupon payment (rate × face value); not a discount rate."],["Zero-coupon bond","Bond with one payment, the face value at maturity; trades at a discount."],["Yield to maturity (YTM)","IRR of a bond’s promised cash flows; quoted as an APR."],["Discount / par / premium bond","Price below / equal to / above face value."],["Interest rate risk","Bond prices fall when rates rise, more so for long maturities."],["Yield spread","Corporate bond yield minus Treasury yield (credit or default spread)."],["Junk bond","Speculative-grade bond rated below BBB (Baa)."],["Clean / dirty price","Clean is the quoted price; dirty = clean + accrued interest."]],

/* ===== Weekly quiz data: add a quiz to any week with WEEKS[i].quiz=[{ch,t,q,o,a,e} or {ch,t:"num",q,a,tol,u,e}] ===== */
WEEKS[0].quiz=[
{ch:"Ch 1",t:"mc",q:"A corporation earns profit and pays it out as a dividend. How is that money taxed?",o:["Only at the corporate level","Only at the shareholder level","At the corporate level and again at the shareholder level","It is not taxed"],a:2,e:"Double taxation: corporate tax on profit, then income tax on the dividend."},
{ch:"Ch 1",t:"mc",q:"Shareholders are called residual claimants because they…",o:["Hold the residual value of the firm’s buildings","Are paid only after creditors have been paid","Cannot vote on corporate policy","Receive a fixed payment each year"],a:1,e:"Debt holders have a prior claim. Shareholders get what is left, which is why in theory they care about everyone else’s claims too."},
{ch:"Ch 1",t:"mc",q:"Which is the clearest example of an agency problem?",o:["A firm dumps waste in a river","A CEO buys a corporate jet mainly for personal use","Shareholders sell their shares at the ask price","A firm switches from a BV to an NV"],a:1,e:"Manager (agent) spends shareholders’ money on own benefit. The river is an externality."},
{ch:"Ch 1",t:"mc",q:"Hart & Zingales (2017) argue that a firm should maximize…",o:["Market value of the shares","Shareholder welfare, which also includes ethical concerns","Stakeholder profit only","Government revenue"],a:1,e:"Shareholders are not only interested in money, so welfare is not the same as market value."},
{ch:"Ch 1",t:"num",q:"A market maker quotes bid $20.10 and ask $20.30. You buy one share and immediately sell it back. How much do you lose?",a:.2,tol:.005,u:"$",e:"You pay the ask 20.30 and receive the bid 20.10: the spread is $0.20."},
{ch:"Ch 2",t:"num",q:"Share price $12, 50 million shares, debt $200m, cash $80m. Enterprise value?",a:720,tol:.5,u:"$ million",e:"Market cap 600 + debt 200 − cash 80 = 720."},
{ch:"Ch 2",t:"num",q:"Accounts payable are $45m and annual COGS $730m (365 days). Accounts payable days?",a:22.5,tol:.1,u:"days",e:"Daily COGS = 2; 45/2 = 22.5 days."},
{ch:"Ch 2",t:"num",q:"Total debt $300m, book equity $700m. Debt-to-capital ratio?",a:30,tol:.1,u:"%",e:"Debt / (equity + debt) = 300 / 1,000 = 30%."},
{ch:"Ch 2",t:"mc",q:"A firm has a market-to-book ratio of 0.8. The most consistent interpretation is that…",o:["Investors expect the assets to earn more than their accounting value suggests","Investors expect poor prospects relative to book value","The firm has no debt","Book value is forward-looking"],a:1,e:"Market value below book value signals that investors expect the assets to create less value than their historical cost."},
{ch:"Ch 2",t:"num",q:"Unlevered net income 40, depreciation 10, capex 25, and NWC rises from 30 to 38. Free cash flow?",a:17,tol:.05,u:"",e:"40 + 10 − 25 − 8 = 17."},
{ch:"Ch 3",t:"num",q:"€1,500 will be received in one year. The risk-free rate is 3%. Present value?",a:1456.31,tol:.05,u:"€",e:"1,500 / 1.03 = 1,456.31."},
{ch:"Ch 3",t:"num",q:"Invest €400 today and receive €440 in a year; r = 8%. NPV?",a:7.41,tol:.02,u:"€",e:"−400 + 440/1.08 = 7.41, so accept."},
{ch:"Ch 3",t:"mc",q:"Projects X, Y, Z have NPVs of 12, 30 and −5. The firm can accept as many as it wants. It should accept…",o:["Y only","X and Y","X, Y and Z","None"],a:1,e:"Accept every positive-NPV project. ‘Y only’ is the answer only if the projects are mutually exclusive."},
{ch:"Ch 3",t:"num",q:"Security A pays €100 in one year and costs €92. Security B pays €300 in one year. No-arbitrage price of B?",a:276,tol:.5,u:"€",e:"B equals 3 × A, so price 3 × 92 = 276."},
{ch:"Ch 3",t:"mc",q:"A risk-free security paying €100 in one year trades at €97 while r = 5% (PV = €95.24). What is the best action?",o:["Buy it: it pays 3.1%","Sell it and invest €95.24 at the bank, keeping the difference","Do nothing: the market is normal","Buy it and hold it for a price rise"],a:1,e:"Overpriced by €1.76: selling it and investing the PV replicates the payment risk-free. This is arbitrage."}];

const ok=(q,v)=>q.t==="mc"?v===q.a:v!=null&&v!==""&&Math.abs(parseFloat(String(v).replace(",","."))-q.a)<=q.tol;
function quiz(w){const Q=w.quiz||[],z=S.qz,B=$("#body");
if(!Q.length){B.innerHTML='<div class="empty">No quiz for this week yet.</div>';return}
const chs=[...new Set(Q.map(q=>q.ch))];
if(!z){const b=P["z"+w.n];B.innerHTML=`<div class="q"><h3 style="margin-top:0">Week ${w.n} quiz</h3><p>${Q.length} exam-style questions, ${Q.length/chs.length} per chapter (${chs.join(", ")}). Multiple choice and fill-in-the-number. You see the answers only after you finish, like in the exam. Have your formula sheet and calculator ready.</p>${b!=null?`<p class="lead">Best score: ${b}/${Q.length}</p>`:""}<button class="btn" id="go">Start quiz</button></div>`;$("#go").onclick=()=>{S.qz={i:0,a:{},fin:false};draw()};return}
if(z.fin)return qres(w,Q,chs);
const q=Q[z.i],v=z.a[z.i];
B.innerHTML=`<div class="q"><div class="pg"><i style="width:${Object.keys(z.a).length/Q.length*100}%"></i></div><span class="tag">${q.ch}</span> <span class="tag">${z.i+1} / ${Q.length}</span><p class="t">${q.q}</p>`+
(q.t==="mc"?q.o.map((o,i)=>`<button class="opt ${v===i?"sel":""}" data-o="${i}"><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join(""):`<div class="row"><input type="text" id="num" inputmode="decimal" value="${v??""}" placeholder="Your answer" aria-label="Answer"> <span>${q.u||""}</span></div>`)+
`<div class="dots">${Q.map((_,i)=>`<button class="${i in z.a?"a":""} ${i===z.i?"c":""}" data-j="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div><div class="row"><button class="btn s" id="pv" ${z.i?"":"disabled"}>Back</button>${z.i<Q.length-1?'<button class="btn" id="nx2">Next</button>':'<button class="btn" id="fn">Finish and grade</button>'}</div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{z.a[z.i]=+b.dataset.o;draw()});
document.querySelectorAll(".dots button").forEach(b=>b.onclick=()=>{z.i=+b.dataset.j;draw()});
if($("#num"))$("#num").oninput=e=>{const x=e.target.value.trim();if(x)z.a[z.i]=x;else delete z.a[z.i];document.querySelectorAll(".dots button")[z.i].classList.toggle("a",!!x)};
$("#pv").onclick=()=>{z.i--;draw()};
if($("#nx2"))$("#nx2").onclick=()=>{z.i++;draw()};
if($("#fn"))$("#fn").onclick=()=>{const un=Q.length-Object.keys(z.a).length;if(un&&!confirm(un+" unanswered. Finish anyway?"))return;z.fin=true;draw()}}
function qres(w,Q,chs){const z=S.qz,r=Q.map((q,i)=>ok(q,z.a[i])),n=r.filter(Boolean).length,g=Math.max(1,10*n/Q.length);

Q.map((q,i)=>`<div class="rv"><span class="tag ${r[i]?"g":"b"}">${r[i]?"Correct":"Wrong"}</span> <span class="tag">${q.ch}</span><p><b>${i+1}. ${q.q}</b></p><p>Your answer: ${z.a[i]==null?"–":q.t==="mc"?q.o[z.a[i]]:z.a[i]} · Correct: ${q.t==="mc"?q.o[q.a]:q.a+" "+(q.u||"")}</p><p style="color:var(--mut)">${q.e}</p></div>`).join("");
$("#re").onclick=()=>{S.qz=null;draw()}}

{n:1,t:"Chapter 1: The Corporation",note:"Read chapter 1 from the book (see Canvas week 1 page for which sections or topics in the chapter are not part of the material), read the relevant week 1 lecture slides (when available), watch the week 1 videos and then answer question 1 below.",intro:"Consider the following questions about what the corporation is trying to achieve.",p:[
{q:"What is the objective of the firm (according to the book)? [PREPARE]<br>Hint: this is not maximizing profit.",o:["Maximize shareholder value (the value of the firm’s shares)","Maximize revenue and market share","Maximize employee welfare and job security"],e:["Right: the book’s objective is decisions that increase the value of the firm’s shares.","Wrong: revenue and market share can grow while destroying value.","Wrong: employees are stakeholders, but the objective in the book is shareholder value."]},
{q:"Name two advantages and two disadvantages of using this objective. [PREPARE]",o:["Advantages: clear and measurable (share price), aligned with the owners. Disadvantages: ignores externalities such as pollution, and managers’ own goals (agency problems) get in the way","Advantages: protects all stakeholders equally and removes agency problems. Disadvantages: too hard to measure","Advantages: guarantees ethical behaviour, so no regulation is needed. Disadvantages: the share price is too stable"],e:["Right: this matches the slides (‘a good start’, but externalities and agency problems limit it).","Wrong: the objective does not protect all stakeholders and does not remove agency problems; the share price is easy to measure.","Wrong: it does not guarantee ethics, and the slides say regulation is needed."]},
{q:"What mechanisms exist that push managers to act in the interests of shareholders? Describe at least 2 mechanisms. [IN CLASS]",o:["A board overseeing the CEO, pay tied to firm performance, competition in product markets, and the threat of a hostile takeover after a falling share price","Fixed salaries, secrecy about results, and a weaker board","Higher dividends only, and avoiding a stock-market listing"],e:["Right: these are the corporate governance mechanisms in the lecture.","Wrong: fixed pay and less oversight remove the link to shareholder interests.","Wrong: dividends alone don’t control managers, and avoiding a listing removes market discipline."]}]},
{n:2,t:"Chapter 2: Financial Statement Analysis",note:"Read chapter 2 of the book and the available lecture slides and watch the week 2 videos. Then answer question 2 below.",intro:"At the beginning of 2017, Coca-Cola (ticker KO) had a book value of equity of $23.1 billion, 4.345 billion shares outstanding, and a market price of $41.74 per share. KO also had cash of $8.6 billion, and total (interest bearing) debt of $64.2 billion. One year later, at the beginning of 2018, KO had a book value of equity of $17.1 billion, 4.261 billion shares outstanding at a market price of $46.07 per share, cash of $6.0 billion, and total (interest bearing) debt of $70.8 billion.",p:[
{q:"Show that the change in KO’s market capitalization was $14.94 billion. [SOLVE YOURSELF]<br>If you cannot solve this question, check the answer at the end of this document.",o:["46.07 × 4.261 − 41.74 × 4.345 = 196.30 − 181.36 = 14.94","17.1 − 23.1 = −6.0","(46.07 − 41.74) = 4.33"],e:["Right: market cap = share price × shares, computed for both years.","Wrong: that is the change in book equity, not market value.","Wrong: that is the change in price per share, and the share count also changed."]},
{q:"Show that KO’s market-to-book ratio went from 7.85 in 2017 to 11.48 in 2018. [PREPARE]",o:["Market cap ÷ book equity: 181.36/23.1 = 7.85 and 196.30/17.1 = 11.48","Price ÷ shares: 46.07/4.261 = 10.81","Net debt ÷ book equity: 55.6/23.1 = 2.41 and 64.8/17.1 = 3.79"],e:["Right: M/B = market value of equity ÷ book value of equity.","Wrong: dividing a price by a share count has no meaning here.","Wrong: that is a leverage measure, not market-to-book."]},
{q:"Look up the most recent market-to-book ratio (Price/Book) of KO at finance.yahoo.com (under statistics). Did the ratio increase or decrease compared to 2017 or 2018? How can this change be interpreted? [PREPARE]",o:["Compare the Yahoo number with 7.85 and 11.48. A higher ratio means investors value the equity more relative to book value (strong expected prospects); a lower ratio means weaker expectations","A higher ratio means the firm has more debt","The ratio cannot change, because book value fixes market value"],e:["Right: you must look up the current ratio yourself, and the interpretation is about expectations.","Wrong: debt does not drive M/B directly.","Wrong: market value moves with investors’ expectations; book value is historical."]},
{q:"Show that the change in KO’s enterprise value from 2017 to 2018 was $24.1 billion. What does the enterprise value represent? [PREPARE]",o:["EV = market cap + debt − cash: 2017 = 181.36 + 64.2 − 8.6 = 236.96; 2018 = 196.30 + 70.8 − 6.0 = 261.10; change 24.1. It is the market value of the operating assets","EV = market cap − debt + cash: 125.76 in 2017 and 131.50 in 2018","EV = book equity + debt: 87.3 in 2017 and 87.9 in 2018"],e:["Right: EV is market cap plus net debt, the value of the underlying business.","Wrong: the signs are reversed, and the change would only be 5.7.","Wrong: that uses book values; the change would be only 0.6."]},
{q:"Name a ratio that can be used to analyze the liquidity position of a firm. [IN CLASS]",o:["The current ratio (current assets ÷ current liabilities)","Return on equity","The price-earnings ratio"],e:["Right: it measures whether short-term assets cover short-term liabilities.","Wrong: ROE measures profitability.","Wrong: P/E is a valuation ratio."]},
{q:"If the EBITDA to interest expense ratio of a firm is 1.3, what does this tell us about the performance of this firm?  [IN CLASS]",o:["Operating cash earnings only just cover interest: a small buffer and a higher risk of financial distress","The firm earns a 1.3% return on equity","The firm is very safe, because the ratio is above 1"],e:["Right: the usual norm for coverage is well above this (about 3 to 5 for EBIT coverage).","Wrong: it is a coverage ratio, not a return.","Wrong: above 1 only means interest is just paid; there is almost no margin for error."]},
{q:"What do you think gives a more accurate assessment of a firm’s net worth: the market value or book value of equity? Explain why. [IN CLASS]",o:["Market value: it is forward-looking and reflects expected cash flows and risk (though sentiment and bubbles can distort it)","Book value: it includes all future prospects and intangibles","They are always equal"],e:["Right: this is the lecture’s contrast between market and book value.","Wrong: book value is backward-looking (historical cost) and misses much of future value.","Wrong: KO’s market-to-book of 7.85 and 11.48 shows they differ a lot."]}]},
{n:3,t:"Chapter 3: Financial Decision Making",note:"Read the relevant sections from chapter 3 of the book and the available lecture slides. Watch the week 1 Time value of money videos on Canvas. Then answer question 3 below.",intro:"Your firm has identified four potential investment projects as listed in the table below. Suppose all cash flows are certain and the risk-free interest rate is 2% per year.",img:1,p:[
{q:"Show that the NPV of project A is €47.06. [SOLVE YOURSELF]<br>Show that the NPV of project B is €2.94. [PREPARE]<br>What are the NPVs of projects C and D? [PREPARE]",o:["A = −100 + 150/1.02 = 47.06; B = 150 − 150/1.02 = 2.94; C = 100 − 102/1.02 = 0; D = −50 + 50/1.02 = −0.98","A = 150 − 100 = 50; B = 0; C = −2; D = 0 (no discounting)","A = −100 + 150 × 1.02 = 53; B = −3; C = −4.04; D = 1 (multiplying instead of discounting)"],e:["Right: discount the year-1 cash flow by 1.02 and add the cash flow today.","Wrong: ignores the time value of money.","Wrong: a future cash flow is discounted (divided), not compounded."]},
{q:"If the projects are mutually exclusive, which project should the firm accept? [PREPARE]",o:["Project A, the highest NPV (47.06)","Projects A and B","Project B, because it pays cash today"],e:["Right: pick the alternative with the highest NPV.","Wrong: that is the answer if the firm may take as many as it likes.","Wrong: B’s NPV is only 2.94, and cash timing is not the rule."]},
{q:"If the firm can choose as many projects as desired, which should it choose? [PREPARE]",o:["A and B (positive NPV); C is indifferent at 0 and D is rejected","Only A","All four"],e:["Right: accept every project with a positive NPV.","Wrong: B also adds value (2.94).","Wrong: D destroys value (−0.98), and C adds nothing."]},
{q:"Show that the NPV of project A would decrease if the interest rate increases. What would happen to the NPVs of the other projects if the interest rate increases?<br>Note: not all project NPVs move in the same direction. [IN CLASS]",o:["A falls because its €150 is discounted more; D falls too; B and C rise, because they receive cash now and pay later","All four NPVs fall","All four NPVs rise"],e:["Right: projects with a later inflow lose value; projects with a later outflow gain.","Wrong: B and C have the outflow in year 1, so a higher rate makes the payment cheaper.","Wrong: A and D have the inflow in year 1, so they lose value."]},
{q:"Show that the NPV of project B would increase if we postpone the payment in one year to a payment in two years. What would happen to the NPVs of the other projects if we also postpone their year one cash flow? [IN CLASS]",o:["B = 150 − 150/1.02² = 5.83 (up from 2.94) and C = 1.97 rise; A = 44.18 and D = −1.46 fall","All NPVs rise, because the money is held longer","Nothing changes: NPV does not depend on timing"],e:["Right: a later payment has a smaller present value, and a later receipt is worth less.","Wrong: A and D receive money later, so they lose value.","Wrong: timing is the whole point of discounting."]}]},
{n:4,t:"Chapter 3: Financial Decision Making",note:"Read the relevant sections from chapter 3 of the book and watch the week 1 Bond arbitrage video on Canvas. Then answer question 4 below.",intro:"Consider two securities that pay risk-free cash flows over the next two years and that have the current market prices shown here:",img:2,p:[
{q:"Show that the no-arbitrage price of a risk-free security (S3) that pays both a cash flow of €60 in one year and a cash flow of €60 in two years is €95. [PREPARE]<br>Hint: all securities have the same risk so you only need to compare the cash flows.<br>Challenge question: show that the following two methods lead to the same result of €95. Method 1: compare cash flows and prices. Method 2: use cash flows and prices to find the yield per year and then discount the cash flows of S3 using these yields.",o:["Method 1: S3 = S1 + S2 = 50 + 45 = 95. Method 2: yields are 20% (60/50) and 15.47% ((60/45)^½ − 1), so 60/1.2 + 60/1.1547² = 50 + 45 = 95","S3 = 60 + 60 = 120 (adding cash flows)","S3 = 60/1.1 + 60/1.1² ≈ 104.13 (guessing a 10% rate)"],e:["Right: the two methods give the same price, as the law of one price requires.","Wrong: that ignores discounting.","Wrong: the rate must come from the prices of S1 and S2, not a guess."]},
{q:"Suppose a risk-free security (S4) with cash flows of €120 in one year and €180 in two years is trading at a price of €245.<br>What is the no-arbitrage price of S4? [IN CLASS]<br>What arbitrage opportunity is available? [IN CLASS]<br>How can investors profit from this opportunity? [IN CLASS]",o:["No-arbitrage price = 2×S1 + 3×S2 = 100 + 135 = 235. S4 is overpriced: sell S4, buy 2 S1 and 3 S2, and keep €10 today with no later cash flows","No-arbitrage price = 245: the market price is always right","No-arbitrage price = 300 (120 + 180), so buying at 245 earns €55"],e:["Right: replicate S4’s cash flows with S1 and S2 and compare prices.","Wrong: if the price differs from the replicating portfolio’s cost there is arbitrage.","Wrong: that adds undiscounted cash flows."]},
{q:"What does the no-arbitrage condition imply for financial markets? [IN CLASS]",o:["Equivalent assets trade at the same price (law of one price), so prices equal PV of cash flows, giving value additivity and the separation principle","All securities must have the same return whatever their risk","Investors can expect to profit regularly from arbitrage"],e:["Right: this is why a normal market has security-trade NPVs of 0.","Wrong: only assets with the same cash flows and risk must have one price.","Wrong: arbitrage is rare and disappears as soon as it is exploited."]}]}];

const HWQ2=[
{n:1,t:"Chapter 4: Time Value of Money",note:"Tutorial 2, question 1. Try each part yourself, then check.",intro:"You smoke 200 packs of cigarettes per year and a pack costs €8.06. You pay at the end of each year. The discount rate is 2% per year. How much do you save (in monetary terms calculated today) when you quit smoking in the following cases?",p:[
{q:"You are 20 now and die at 70. [SOLVE YOURSELF]",o:["C = 200 × 8.06 = 1,612 for N = 50 years: PV = 1,612/0.02 × (1 − 1/1.02^50) = €50,654.85","Perpetuity: 1,612/0.02 = €80,600","1,612 × 50/1.02 ≈ €79,020 (adds up the payments and discounts once)"],e:["Right: a stream of equal payments for a limited time is an annuity.","Wrong: you do not live forever, so this is not a perpetuity.","Wrong: each payment must be discounted for its own number of years."]},
{q:"You are 20 now and will live forever.",o:["Perpetuity: PV = C/r = 1,612/0.02 = €80,600 (the same at 25, since it never ends)","Annuity with N = 70: about €60,450","1,612 × 1.02^50 ≈ €4,339"],e:["Right: payments without an end date use the perpetuity formula.","Wrong: there is no final year to build an annuity on.","Wrong: that compounds one payment forward and is not a present value."]},
{q:"You turn 20, stop smoking and invest the money in the stock market at 8% (ignore the 2% discount rate). How much will you have at 30?",o:["FV of an annuity: 1,612/0.08 × (1 − 1/1.08^10) × 1.08^10 = €23,352.34","1,612/0.02 × (1 − 1/1.02^10) = about €14,480 (wrong rate, and a PV)","1,612 × 10 = €16,120 (no interest)"],e:["Right: take the PV of the annuity at 8% and move it forward 10 years.","Wrong: the stock market earns 8%, and the question asks for a future value.","Wrong: invested money earns interest on interest."]}]},
{n:2,t:"Chapter 5: Interest Rates",note:"Tutorial 2, question 2. Try each part yourself, then check.",intro:"The current one-year interest rate is 2%. You expect that in year 2 the economy slows and the rate falls to 1%. From year 3 you expect a recession and the ECB cuts the rate to 0% for years 3 and 4. All rates are 1-year rates.<div class=\"scroll\"><table><tr><th>Year</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>One-year rate</td><td>2%</td><td>1%</td><td>0%</td><td>0%</td></tr></table></div>",p:[
{q:"Show that the current two-year (annualized) rate consistent with these expectations is 1.499%. [SOLVE YOURSELF]",o:["(1 + r)² = 1.02 × 1.01 = 1.0302, so r = 1.0302^(1/2) − 1 = 1.499%","(2% + 1%)/2 = 1.5% exactly","1.02 × 1.01 − 1 = 3.02%"],e:["Right: find the single annual rate equivalent to the two different rates, then take the square root.","Wrong: a simple average ignores compounding (1.499% is not 1.5%).","Wrong: that is the return over two years, not an annual rate."]},
{q:"Which term structure (EARs for 1 to 4 years) is consistent with these expectations? What shape is the yield curve?",o:["2%, 1.499%, 0.997%, 0.75%: downward sloping (inverted)","2%, 1%, 0%, 0%: the one-year rates themselves","2%, 3.02%, 3.02%, 3.02%: the cumulative returns"],e:["Right: the yield for n years is (product of the 1-year factors)^(1/n) − 1. The yield curve only uses EARs.","Wrong: those are one-year rates for each year, not annualized rates for each term.","Wrong: those are not annualized."]},
{q:"What is the PV of $10 received at the end of year 3? [IN CLASS]",o:["Use the 3-year rate 0.997%: 10/1.00997³ = $9.71, same as 10/(1.02 × 1.01 × 1.00)","Use the 1-year rate: 10/1.02³ = $9.42","Use the year-3 one-year rate 0%: PV = $10"],e:["Right: match the term of the rate to the term of the cash flow.","Wrong: that ignores the lower expected rates in years 2 and 3.","Wrong: you must also discount through years 1 and 2."]}]},
{n:3,t:"Chapter 6: Bonds",note:"Tutorial 2, question 3. Watch the Canvas bond videos first.",intro:"A 5-year corporate bond has a 6% annual coupon rate with semi-annual coupons and a face value of $1,000. It trades at a yield-to-maturity of 3% (APR with semi-annual compounding).",p:[
{q:"What are the cash flows of this bond? [SOLVE YOURSELF]",o:["10 coupons of 3% × 1,000 = $30 every 6 months, plus $1,000 after 5 years (period 10)","5 coupons of $60 plus $1,000 at year 5","10 coupons of $60 plus $1,000 at period 10"],e:["Right: the annual coupon rate is split over two payments per year.","Wrong: the coupons are semi-annual, so there are 10 of them.","Wrong: $60 is the whole year’s coupon, so each half-year payment is $30."]},
{q:"Show that today’s price is $1,138.33. Is this a discount, par or premium bond?",o:["P = 30/0.015 × (1 − 1/1.015^10) + 1,000/1.015^10 = 1,138.33 > 1,000: premium bond","Discounting at 3% per period gives exactly $1,000: par bond","Price = 10 × 30 + 1,000 = 1,300: premium bond"],e:["Right: the 3% APR is 1.5% per six months, and the coupon (3%) exceeds that yield.","Wrong: 3% is an APR, per half-year it is 1.5%.","Wrong: that adds the cash flows without discounting."]},
{q:"If the YTM increases, what happens to the price? Define interest rate risk and say for which bonds it is highest. [IN CLASS]",o:["The price falls (at 3.5% APR it is $1,113.77). Interest rate risk is the risk that a change in rates changes the bond’s value; it is highest for long-maturity bonds","The price rises, because the coupons stay fixed","The price stays the same, because the coupons and face value are fixed"],e:["Right: higher yield means heavier discounting, and long maturities are hit hardest.","Wrong: fixed cash flows discounted at a higher rate are worth less.","Wrong: the cash flows are fixed but their present value is not."]}]}];

S.hq=1;
function hw2(){const H=S.w===2?HWQ2:HWQ,pf=S.w===2?"w2h":"h",q=H[S.hq-1],cnt=n=>H[n-1].p.filter((_,i)=>P[pf+n+"_"+i]!=null).length;
let h=`<div class="row">${H.map(x=>`<button class="pill ${S.hq===x.n?"on":""}" data-q="${x.n}">Question ${x.n} · ${cnt(x.n)}/${x.p.length}</button>`).join("")}</div><h3 style="margin-top:4px">${q.t}</h3><p class="lead">${q.note}</p><div class="q"><p style="margin-top:0">${q.intro}</p>${q.img?`<img class="tbl" alt="Table for question ${q.n}" src="${HWIMG[q.img]}">`:""}</div><h3>Question ${q.n}</h3>`;
q.p.forEach((p,i)=>{const k=pf+q.n+"_"+i,c=P[k],d=c!=null,ord=[0,1,2].map(x=>(x+(q.n+i)%3)%3);
h+=`<div class="q hp"><span class="tag">${"abcdefg"[i]}</span><p class="t">${p.q}</p>`+ord.map((oi,j)=>`<button class="opt ${d?(oi===0?"ok":oi===c?"no":""):""}" data-k="${k}" data-o="${oi}" ${d?"disabled":""}><b>${"ABC"[j]}</b><span>${p.o[oi]}</span></button>`).join("")+(d?`<div class="fb ${c===0?"ok":"no"}"><b>${c===0?"Correct.":"Incorrect."}</b>${ord.map((oi,j)=>`<p>${oi===0?"✓":"✗"} <b>${"ABC"[j]}</b>: ${p.e[oi]}</p>`).join("")}</div>`:"")+"</div>"});
h+=`<button class="btn s" id="rh">Retry question ${q.n}</button>`;$("#body").innerHTML=h;
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.hq=+b.dataset.q;draw();scrollTo(0,0)});
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const y=scrollY;P[b.dataset.k]=+b.dataset.o;save();draw();scrollTo(0,y)});
$("#rh").onclick=()=>{q.p.forEach((_,i)=>delete P[pf+q.n+"_"+i]);save();draw();scrollTo(0,0)}}

draw();
</script></body></html>
