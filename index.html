const WEEKS=[
{n:1,title:"Corporation, statements, arbitrage",ch:"Ch 1, 2, 3 + Hart & Zingales (2017)",
sections:[
{h:"Ch 1 · The corporation",html:`<p>A <b>sole proprietorship</b> (eenmanszaak) has one owner who is also manager and is personally liable. In a <b>partnership</b> (VOF, maatschap, CV) all partners are personally liable. An <b>LLC</b> (BV) and a <b>corporation</b> (NV) are legal entities: shareholders are <b>not</b> liable for the firm’s debts, and ownership is separated from control. NV shares trade on an exchange, BV shares do not. Corporate profit is taxed twice: corporate tax, then income tax on dividends.</p>
<p><b>Objective:</b> maximize <b>shareholder value</b> (the value of the shares), not profit. Shareholders are the residual claimants (last in line), so in theory they care about everyone else too. This assumes no agency problems and that externalities are priced or regulated.</p>
<p><b>Agency problem:</b> managers (agents) can pursue their own utility instead of shareholders’ (principals’), e.g. Tyco’s CEO Kozlowski. Remedies: board oversight, pay tied to performance, product-market competition, and takeovers after the share price falls.</p>
<p><b>Trading:</b> you buy at the <b>ask</b>, sell at the <b>bid</b>; the <b>bid-ask spread</b> is the market maker’s profit.</p>`},
{h:"Ch 2 · Statements, market vs book value",html:`<p><b>Balance sheet:</b> Assets = Liabilities + Equity. <b>Income statement:</b> Sales − COGS = gross profit; − general costs − depreciation = operating income = <b>EBIT</b>; − interest = pretax income (EBT); − taxes = <b>net income</b>.</p>
<p><b>Book value</b> is backward-looking (historical cost, accounting rules). <b>Market value</b> is forward-looking (expected cash flows, risk, sentiment). Market cap = share price × shares. Market-to-book = market value of equity ÷ book value of equity. Example: Firm Z, factory cost $100, pays $150 in 1 year at 8%: assets are worth 150/1.08 = $139, so equity = 139 − 40 = $99, share price $9.90, M/B = 99/60 = 1.65. A project with NPV $5 raises equity to $104 and the price to $10.40.</p>
<p><b>Enterprise value</b> = market cap + debt − cash = value of the operating assets. Net debt = debt − cash.</p>
<div class="scroll"><table><tr><th>Ratio group</th><th>On midterm formula sheet</th><th>Learn by heart (not given)</th></tr>
<tr><td>Liquidity, coverage, leverage</td><td>Current ratio, EBIT/interest, debt-to-capital</td><td>Debt-equity (book, market), debt-to-EV, net profit margin</td></tr>
<tr><td>Working capital</td><td>AR days, AP days, inventory days</td><td>–</td></tr>
<tr><td>Returns, valuation</td><td>ROE</td><td>M/B, P/E, EV/Sales, EV/EBITDA</td></tr></table></div>
<p>Per your screenshot, the crossed-out ratios (margins except net, quick, cash, equity multipliers, EV/EBIT, asset turnover, ROA, ROIC, EBITDA coverage) are excluded.</p>`},
{h:"Profit versus cash flow",html:`<p>Profit follows accounting rules; cash flow follows money. Revenues are not always inflows and costs not always outflows. <b>Cash flow = profit − increase in NWC</b>, where NWC = current assets − current liabilities (here accounts receivable − accounts payable). Example: sales 100 (80 received), COGS 70 (60 paid): profit 30, cash flow 20, increase in NWC 10.</p>
<ul><li>Taxes are based on profit: 30% of EBIT 30 = 9, so cash flow = 21 − 10 = 11.</li><li><b>Capex</b> is a cash outflow but not a cost. <b>Depreciation</b> is a cost but not a cash outflow. It creates a <b>depreciation tax shield</b> (tax rate × depreciation).</li><li>Inventory purchases are cash outflows that are not in profit.</li></ul>
<p><b>FCF = unlevered net income + depreciation − capex − increase in NWC.</b> Example: 15.4 + 8 − 24 − 10 = −10.6. Free cash flow excludes financing flows (separation principle); unlevered net income ignores interest.</p>`},
{h:"Ch 3 · Valuation, arbitrage, law of one price",html:`<p>Use <b>market prices</b> to get cash values, but only in <b>competitive markets</b> (same price to buy and sell, ignoring transaction costs). A euro today beats a euro next year because you can invest it. Compare only at the <b>same moment</b>: <b>PV</b> = CF/(1+r) (discounting), <b>FV</b> = CF×(1+r) (compounding). Value a stream by adding the PVs.</p>
<p><b>NPV</b> = PV(benefits) − PV(costs). Take the highest-NPV alternative; accept NPV &gt; 0. Invest 8 to get 9 at 10%: NPV = −8 + 9/1.10 = 0.18 &gt; 0, so accept.</p>
<p><b>Arbitrage:</b> profit without risk or net investment (rare). <b>No-arbitrage price</b> = PV of all cash flows. A <b>normal market</b> has no arbitrage. Then the <b>law of one price</b> holds (equivalent assets trade at one price), which gives <b>value additivity</b>: Price(A+B) = Price(A) + Price(B), and firm value V = D + E. It also gives the <b>separation principle</b>: buying or selling securities has NPV 0, so investment decisions can be separated from financing decisions.</p>
<p><b>Bond arbitrage method:</b> match the coupon bond’s cash flows with zero-coupon bonds and compare prices. Zeros at 972.14, 939.62 and 906.24: the 10% coupon bond is worth 0.1×972.14 + 0.1×939.62 + 1.1×906.24 ≈ $1188, but trades at $1183.95. Buy the cheap bond, sell the replicating zeros.</p>`},
{h:"Article · Hart & Zingales (2017)",html:`<p>Friedman argued managers should make as much money as possible within the rules. Hart and Zingales say <b>shareholder welfare ≠ market value</b>: shareholders are prosocial and care about more than money. Friedman’s <b>separability</b> assumption (let companies make money and let people give to charity) fails when profit and damage are inseparable, e.g. oil digging, or Walmart selling high-capacity magazines. Politics also does not fix everything.</p>
<p><b>Amoral drift:</b> hostile bidders only care about money, and dispersed shareholders tender anyway (collective action problem), so takeovers push firms from clean to dirty. There is no mirror-image drift, because nobody gains by buying a dirty firm to clean it. <b>Voting</b> by shareholders avoids this asymmetry. Authors’ proposal: managers and asset managers follow investors’ preferences, via votes or polls. Fiduciary duty is not just maximizing value (the Shkreli example). Prefer <b>invest and engage</b> over divestment.</p>`}],
terms:[["Sole proprietorship","One owner who is also the manager; personal liability."],["Partnership","Several owners, all personally liable (VOF, maatschap)."],["Limited liability","Shareholders lose at most their investment, not the firm’s debts."],["Shareholder value","The value of the firm’s shares; the standard objective of the corporation."],["Residual claimant","Shareholders are paid last, after creditors."],["Agency problem","Managers pursue their own interests instead of the shareholders’."],["Externality","A cost or benefit to others that is not priced (e.g. pollution)."],["Bid-ask spread","Ask price minus bid price; the market maker’s profit."],["EBIT","Earnings before interest and taxes = operating income + other income."],["Market capitalization","Share price × number of shares = market value of equity."],["Market-to-book ratio","Market value of equity ÷ book value of equity."],["Enterprise value","Market cap + debt − cash; market value of operating assets."],["Net working capital","Current assets − current liabilities."],["Free cash flow","Unlevered net income + depreciation − capex − increase in NWC."],["Depreciation tax shield","Tax saved because depreciation is deductible: tax rate × depreciation."],["Discount factor","1/(1+r): converts a future cash flow into present value."],["NPV","PV of all cash flows including the initial investment."],["Arbitrage","Risk-free profit with no net investment."],["Law of one price","Equivalent assets in competitive markets trade at the same price."],["Value additivity","Price of a bundle = sum of the prices of its components."],["Separation principle","Securities trades have NPV 0, so investment and financing decisions are separate."],["Amoral drift","Hart & Zingales: takeovers push companies toward ignoring externalities."]],
formulas:[["Current ratio","Current assets / Current liabilities","s"],["EBIT / interest","EBIT / Interest expense","s"],["Debt-to-capital","Debt / (Equity + Debt)","s"],["ROE","Net income / Book equity","s"],["AR days","AR / Avg daily sales","s"],["AP days","AP / Avg daily COGS","s"],["Inventory days","Inventory / Avg daily COGS","s"],["Free cash flow","UNI + Depr − CapEx − ΔNWC","s"],["FV","CF × (1+r)^n","s"],["PV","CF / (1+r)^n","s"],["Enterprise value","Mkt cap + Debt − Cash"],["Market cap","Price × Shares"],["Market-to-book","Mkt equity / Book equity"],["P/E","Price / EPS"],["Net profit margin","Net income / Sales"],["Debt-equity","Debt / Equity (book or market)"],["NPV","−Investment + Σ CF/(1+r)^t"],["Cash flow (simple)","Profit − increase in NWC"],["No-arbitrage price","PV of all the security’s cash flows"]],

{t:"mc",q:"According to the book, what is the objective of the firm?",o:["Maximize shareholder value","Maximize profit","Maximize growth","Maximize employee welfare"],a:0,e:"Shareholder value (share value), not profit. The slides stress it ‘is a good start’ but ignores externalities and agency problems."},
{t:"mc",q:"Which legal form has limited liability AND a separation of ownership and control?",o:["Sole proprietorship","Partnership (VOF)","Corporation (NV)","Both a sole proprietorship and a partnership"],a:2,e:"Only the BV and NV are separate legal entities with limited liability and separation of ownership and control."},
{t:"mc",q:"A CEO spends shareholders’ money on a lavish lifestyle. This is an example of…",o:["An externality","Arbitrage","An agency problem","Value additivity"],a:2,e:"Self-interested managers (agents) maximize their own utility instead of shareholder value (Tyco example)."},
{t:"mc",q:"Which is NOT a mechanism that pushes managers to serve shareholders?",o:["A board of directors overseeing the CEO","Pay tied to firm performance","Hostile takeovers after a falling share price","A fixed salary regardless of performance"],a:3,e:"Fixed pay gives no incentive link. The other three are the corporate governance mechanisms from the slides."},
{t:"mc",q:"Which statement is true?",o:["Book value of equity includes the firm’s future prospects","Market value of equity can be read off the financial statements","Market cap is the market value of equity and includes future prospects","Average profit of 3–5 years gives the market value"],a:2,e:"Market value is forward-looking; book value is historical and backward-looking."},
{t:"mc",q:"Depreciation is…",o:["A cost but not a cash outflow","A cash outflow but not a cost","Both a cost and a cash outflow","Neither a cost nor a cash outflow"],a:0,e:"It spreads a past capex over the asset’s life. It lowers profit and taxes but no cash leaves the firm. Capex is the cash outflow."},
{t:"mc",q:"Which is a true arbitrage opportunity?",o:["Buying a stock in one market and selling it immediately for more in another","Buying a $99 risk-free bond paying $100 in a year at 1.01% interest","Buying an undervalued stock to hold it for a rise","Borrowing at 5% to buy shares expected to return 8%"],a:0,e:"Arbitrage is risk-free and needs no net investment. The bond is fairly priced (100/1.0101 = 99); the others carry risk."},
{t:"mc",q:"The separation principle says that…",o:["Profit and cash flow must always be evaluated in the same period","Owners and managers must be separate people to avoid agency problems","Debt and equity holders must be paid out of separate cash flows","In a normal market the investment decision can be separated from the financing decision"],a:3,e:"Security transactions at fair prices have NPV 0, so they neither create nor destroy value."},

{q:"Ch 1 · [IN CLASS] Mechanisms that push managers toward shareholder interests.",a:"Board oversight, performance-based pay, competition in product markets, takeover threat after poor performance."},
{q:"Ch 2 · KO: show the market cap change is $14.94bn, and M/B went 7.85 → 11.48.",a:"2017: 41.74 × 4.345 = 181.36bn; 2018: 46.07 × 4.261 = 196.30bn; change 14.94bn. M/B 2017 = 181.36/23.1 = 7.85; 2018 = 196.30/17.1 = 11.48."},
{q:"Ch 2 · KO: show the EV changed by $24.1bn. What does EV represent?",a:"EV 2017 = 181.36 + 64.2 − 8.6 = 236.96; EV 2018 = 196.30 + 70.8 − 6.0 = 261.10; change 24.14bn. EV is the market value of the operating assets, independent of financing."},
{q:"Ch 2 · [IN CLASS] A liquidity ratio? EBITDA/interest of 1.3?",a:"Current ratio (formula sheet). EBITDA/interest of 1.3 means operating cash earnings barely cover interest: little buffer, high financial risk."},
{q:"Ch 2 · [IN CLASS] Which is the better measure of net worth: market or book value of equity?",a:"Market value: forward-looking, reflects expected cash flows and risk. Book value is historical cost and misses intangibles; but market values can be affected by bubbles and sentiment."},
{q:"Ch 3 · Projects (r = 2%): A −100/+150, B +150/−150, C +100/−102, D −50/+50. NPVs? Which to pick?",a:"A = 47.06, B = 2.94, C = 0, D = −0.98. Mutually exclusive: A. Unlimited choice: A and B (C is indifferent)."},
{q:"Ch 3 · [IN CLASS] What happens if r rises? If B’s year-1 payment is moved to year 2?",a:"A falls (cost today, benefit later). B and C rise, because they are borrowing-type flows (receive now, pay later). Postponing B’s payment makes it cheaper in PV, so B’s NPV rises."},
{q:"Ch 3 · S1 (€50 → 60 in yr 1), S2 (€45 → 60 in yr 2): no-arbitrage price of S3 (60 and 60)? S4 (120, 180) trades at €245?",a:"S3 = 50 + 45 = 95. S4 = 2×S1 + 3×S2 = 100 + 135 = 235. At 245 it is overpriced by €10: sell S4, buy 2 S1 and 3 S2, keep €10 today with zero later cash flows. No-arbitrage means equivalent cash flows have one price."}]},
{n:2,title:"Time value, interest rates, bonds",ch:"Ch 4, 5, 6",
sections:[
{h:"Ch 4 · Time value of money",html:`<p>$1 now is worth more than $1 later because of <b>impatience</b> (people prefer consumption now), <b>inflation</b> (money loses value) and <b>risk</b> (future cash flows are uncertain and people are risk averse).</p>
<p><b>Three rules of time travel:</b> (1) only values at the <b>same point in time</b> can be compared or combined; (2) to move a cash flow forward, <b>compound</b> it: FV = C × (1+r)^n; (3) to move it backward, <b>discount</b> it: PV = C / (1+r)^n. Example at r = 5%: 1,000 today = 1,050 in a year. Both ways give the same answer, there is no preference. A stream is valued by adding the PV of each cash flow, and <b>NPV</b> &gt; 0 means invest.</p>`},
{h:"Ch 4 · Perpetuities, annuities, loans, IRR",html:`<p><b>Perpetuity</b> (constant C forever): PV = C/r. <b>Growing perpetuity</b>: PV = C/(r − g), only valid if <b>g &lt; r</b>. <b>Annuity</b> (constant C for N periods): PV = C/r × (1 − 1/(1+r)^N). <b>Growing annuity</b>: PV = C/(r − g) × (1 − ((1+g)/(1+r))^N). <b>FV of an annuity</b> = PV × (1+r)^N. Example: $2m growing 4% for 10 years at 11%: PV = 2/0.07 × (1 − (1.04/1.11)^10) ≈ $13.68m.</p>
<p><b>Early and late annuities:</b> the formula assumes the first payment at time 1. If it starts at time 0 (early), multiply by (1+r), because every payment arrives one period sooner. If it starts at time 2 (late), divide by (1+r). The same adjustment works for perpetuities: with C = 10 and r = 2%, first payment at time 1 gives 500, at time 0 gives 510, first payment at time 2 gives 500/1.02 ≈ 490.20.</p>
<p><b>Loan payment</b> (solve for C): C = P × r / (1 − (1+r)^−N). A $100,000 loan at 8% over 10 years costs $14,903 per year. <b>IRR</b> is the rate that makes NPV = 0: turning 1,000 into 2,000 in 6 years gives (2)^(1/6) − 1 = 12.25%.</p>`},
{h:"Ch 5 · APR, EAR and matching the period",html:`<p><b>Key rule:</b> change the interest rate to match the cash flow period, never the cash flows to match the rate. <b>APR</b> is simple interest per year without compounding: 1% per month is 12% APR with monthly compounding. <b>EAR</b> includes compounding: EAR = (1 + APR/k)^k − 1, so 1% per month = 1.01^12 − 1 = 12.68%. APR is a red flag: it cannot be used directly for PV or FV.</p>
<p><b>Converting:</b> APR to period rate: divide by k (9% APR, quarterly → 2.25%). EAR to period rate: (1+EAR)^(1/k) − 1 (9% EAR → 1.09^(1/4) − 1 = 2.18% per quarter, 0.72% per month).</p>
<p><b>Four steps for a time-value question:</b> (1) which cash flow form (annuity, perpetuity…); (2) which rate matches the cash flow period; (3) how many periods; (4) PV or FV. Example: $5 per month for 18 years at 6% APR: monthly rate 0.5%, N = 216, PV = 659.49, FV = 659.49 × 1.005^216 = 1,936.77. An <b>annuity (amortizing) loan</b> has equal payments, each part interest and part repayment, and the loan is fully repaid at time N. A <b>fair loan</b> has a balance equal to the PV of its payments: that PV is what you can borrow.</p>`},
{h:"Ch 5 · What determines interest rates",html:`<p><b>Nominal rates</b> are the quoted ones and discount nominal cash flows. <b>Real rate:</b> (1 + r) = (1 + rr)(1 + i), so rr ≈ r − i. Use nominal with nominal, or real with real. 6% nominal with 2% inflation gives 3.92% real.</p>
<p><b>Term structure / yield curve:</b> the interest rate depends on maturity, and the yield curve plots EAR against term. It is usually upward sloping (normal); it is <b>inverted</b> when short rates are above long rates, which signals that investors expect lower future rates. Tutorial: one-year rates 2%, 1%, 0%, 0% give EARs of 2%, 1.499%, 0.997% and 0.75%. Match the term: discount a year-3 cash flow at the 3-year rate (10/1.00997^3 = $9.71, same as 10/(1.02 × 1.01 × 1.00)).</p>
<p><b>Taxes:</b> use the after-tax rate, r × (1 − τ). <b>Risk:</b> riskier cash flows get a higher discount rate; use expected cash flows. The <b>opportunity cost of capital</b> is the best expected return available on an investment of comparable risk and term, and it is the discount rate you should use.</p>`},
{h:"Ch 6 · Bonds, prices and yields",html:`<p>A <b>bond</b> is a tradeable debt contract. The issuer receives money now and promises coupons plus the <b>face value</b> at maturity; the holder carries the default risk. The coupon payment is CPN = coupon rate × face value / k. The <b>coupon rate only sets the cash flows</b>, it is never the discount rate. Equity, in contrast, promises no fixed cash flows. <i>Advantages of bonds:</i> easy external capital, cheaper than bank loans for large amounts, no voting rights, tax shield. <i>Disadvantages:</i> emission costs, fixed interest can trigger bankruptcy, default risk for the holder.</p>
<p><b>Prices:</b> zero-coupon P = FV/(1+YTM)^n. Coupon bond P = CPN × annuity factor(y, N) + FV/(1+y)^N. <b>YTM</b> is the IRR of the promised cash flows, quoted as an APR (5% per 6 months = 10%). Price &lt; face = <b>discount</b> bond, = face = <b>par</b>, &gt; face = <b>premium</b>. Example: 6% coupon, semi-annual, 10 years, YTM 7.5% APR: 3.75% per period, 20 periods, P = 895.78. A zero priced at 96,618.36 for 100,000 in one year has YTM = 100,000/96,618.36 − 1 = 3.5%.</p>
<p><b>Rates and prices move opposite:</b> when yields rise, prices fall, and the effect is bigger for longer maturities (<b>interest rate risk</b>). Tutorial: the 5-year, 6% semi-annual bond at 3% YTM costs 1,138.33; at 3.5% it costs 1,113.77; at 1,200 the YTM is 0.90% per half-year (1.80% APR). A bond bought at its fair price has NPV = 0, otherwise investors would push the price until it does.</p>`},
{h:"Ch 6 · Bond arbitrage and credit risk",html:`<p><b>Replicate a coupon bond</b> with zero-coupon bonds and compare prices (law of one price). Method 1, matching cash flows: a 10% annual, 3-year bond equals 0.1 of the 1-year zero, 0.1 of the 2-year zero and 1.1 of the 3-year zero: 0.1 × 972.14 + 0.1 × 939.62 + 1.1 × 906.24 = 1,188.04. If it trades below that, buy the bond and sell the zeros; if above, do the opposite. Method 2, yields: find each zero’s YTM and discount the coupon bond’s cash flows with them (book example: 100/1.035 + 100/1.04² + 1,100/1.045³ ≈ 1,153).</p>
<p><b>Credit risk:</b> a bond’s promised yield (YTM, based on promised cash flows) is higher than its <b>expected return</b> (based on expected cash flows) when default is possible. The <b>yield spread</b> (credit or default spread) = corporate yield − Treasury yield: 3% − 2% = 1%. Ratings run from AAA to D; below BBB (Baa) is <b>speculative grade (junk)</b>. Quoted prices are <b>clean</b>; dirty (invoice) price = clean + accrued interest.</p>`}],
terms:[["Time value of money","A positive interest rate makes money now worth more than the same amount later."],["Compounding","Moving a cash flow forward in time: FV = C × (1+r)^n."],["Discounting","Moving a cash flow backward in time: PV = C / (1+r)^n."],["Perpetuity","Constant cash flow C forever; PV = C/r."],["Growing perpetuity","Cash flow growing at g forever; PV = C/(r − g), needs g &lt; r."],["Annuity","Constant cash flow for a limited number of periods."],["Early / late annuity","First payment before (time 0) or after (time 2) the normal time 1; multiply or divide the PV by (1+r)."],["IRR","Interest rate that makes the NPV of the cash flows zero."],["Amortizing (annuity) loan","Equal periodic payments, each with interest and repayment; fully repaid at time N."],["Fair loan","Loan balance equals the PV of the loan payments."],["APR","Simple annual rate without compounding; 1% a month = 12% APR."],["EAR","Annual rate including compounding: (1 + APR/k)^k − 1."],["Nominal vs real rate","Nominal includes inflation; real is corrected for it: (1+r) = (1+rr)(1+i)."],["Term structure","The relationship between investment term and interest rate."],["Yield curve","Graph of the term structure; inverted when short rates exceed long rates."],["Opportunity cost of capital","Best expected return on an investment of comparable risk and term; the discount rate."],["Face value (par)","Amount repaid to the bondholder at maturity."],["Coupon rate","Sets the coupon payment (rate × face value); not a discount rate."],["Zero-coupon bond","Bond with one payment, the face value at maturity; trades at a discount."],["Yield to maturity (YTM)","IRR of a bond’s promised cash flows; quoted as an APR."],["Discount / par / premium bond","Price below / equal to / above face value."],["Interest rate risk","Bond prices fall when rates rise, more so for long maturities."],["Yield spread","Corporate bond yield minus Treasury yield (credit or default spread)."],["Junk bond","Speculative-grade bond rated below BBB (Baa)."],["Clean / dirty price","Clean is the quoted price; dirty = clean + accrued interest."]],
formulas:[["PV perpetuity","C / r","s"],["PV growing perpetuity","C / (r − g), g < r","s"],["PV annuity","C/r × (1 − 1/(1+r)^N)","s"],["PV growing annuity","C/(r−g) × (1 − ((1+g)/(1+r))^N)","s"],["EAR from APR","(1 + APR/k)^k − 1","s"],["Zero-coupon bond price","FV / (1+YTM)^n","s"],["Coupon bond price","CPN/y × (1 − 1/(1+y)^N) + FV/(1+y)^N","s"],["FV annuity","PV annuity × (1+r)^N"],["Early annuity (t = 0)","PV annuity × (1+r)"],["Period rate from APR","APR / k"],["Period rate from EAR","(1+EAR)^(1/k) − 1"],["Loan payment","C = P × r / (1 − (1+r)^−N)"],["IRR (one cash flow)","(FV/PV)^(1/n) − 1"],["Real rate","(1+r)/(1+i) − 1 ≈ r − i"],["After-tax rate","r × (1 − tax rate)"],["Coupon payment","CPN = coupon rate × FV / k"],["Multi-year EAR","[(1+r1)(1+r2)…(1+rn)]^(1/n) − 1"],["Yield spread","Corporate yield − Treasury yield"]],
q:[
{t:"mc",q:"Which is NOT a reason why $1 now is worth more than $1 in a year?",o:["Limited liability","Impatience","Risk aversion","Inflation"],a:0,e:"The lecture names three reasons: <b>impatience</b> (people prefer consuming now), <b>inflation</b> (a euro buys less later) and <b>risk</b> (future cash flows are uncertain and people dislike risk, so a sure dollar now beats an uncertain one later). Limited liability is a legal feature of corporations from week 1. It says nothing about why money changes value over time, so it is the odd one out."},
{t:"mc",q:"The growing perpetuity formula C/(r − g) is only valid if…",o:["g < r","g > r","g = 0","C is negative"],a:0,e:"The PV is C/(1+r) + C(1+g)/(1+r)² + …, a geometric series with ratio (1+g)/(1+r). A series like that only adds up to a finite number, C/(r − g), when the ratio is below 1, which means g &lt; r. If g ≥ r the payments grow at least as fast as the discounting, the sum never settles, and the formula would give a negative or meaningless value. g = 0 is just an ordinary perpetuity (a special case, not a requirement)."},
{t:"mc",q:"An annuity pays at times 0, 1 and 2 instead of 1, 2 and 3. Compared with the standard annuity formula its PV is…",o:["Divided by (1+r)","Unchanged","Multiplied by (1+r)","Multiplied by (1+r)^N"],a:2,e:"The standard formula values payments at times 1, 2, 3. Your payments are at 0, 1, 2, so each one arrives exactly one period earlier. A cash flow that comes one period sooner is worth (1+r) times more, so the whole PV is multiplied by (1+r). Dividing by (1+r) would be for a late annuity (payments at 2, 3, 4). Multiplying by (1+r)^N is a future value, not a PV."},
{t:"mc",q:"Monthly cash flows, interest quoted as APR with monthly compounding. What do you adjust to match the periods?",o:["The interest rate, to a monthly rate","The cash flows, to annual","Neither","Both"],a:0,e:"The rule is: change the interest rate to match the cash flow period, never the cash flows to match the rate. Monthly cash flows need a monthly rate, so convert the quoted APR: monthly rate = APR/12. Converting the cash flows to annual would change what the question describes and usually causes errors. Changing only the rate is the one fixed method."},
{t:"mc",q:"The yield curve slopes downward (1 year 5.0%, 5 years 4.5%, 20 years 4.15%). It is…",o:["Normal; investors expect higher future rates","Inverted; investors expect higher future rates","Normal; investors expect lower future rates","Inverted; investors expect lower future rates"],a:3,e:"The yield curve plots EAR against maturity. When long-term rates are lower than short-term rates, the curve slopes down, which is called <b>inverted</b> (here 5.0% → 4.15%). A long-term rate is roughly an average of the expected one-year rates, so a lower long-term rate means investors expect future rates to be lower. A normal curve slopes up and signals higher expected rates."},
{t:"mc",q:"A bond’s coupon rate is used to…",o:["Discount the bond’s cash flows","Set the bond’s price","Compute the yield spread","Determine the coupon payments"],a:3,e:"The coupon rate × face value gives the coupon payment, so it only determines the <b>cash flows</b>. To value those cash flows you need a discount rate that reflects today’s risk and maturity, the yield to maturity. Using the coupon rate to discount would give a price of exactly the face value every time, which ignores the market. The spread is yield-based and the price comes from discounting at the YTM."},
{t:"mc",q:"Market yields rise. Which bond’s price falls the most?",o:["30-year zero-coupon bond","2-year zero-coupon bond","All fall equally","None fall"],a:0,e:"Bond prices are PVs, so a higher discount rate lowers every price. The effect grows with maturity because the face value is discounted over more periods: 1/(1+y)^n shrinks faster when n is large. Example at 5% → 6%: a 2-year zero falls about 1.9%, a 30-year zero about 42%. This sensitivity is interest rate risk, and the 30-year bond has the most."},
{t:"mc",q:"A corporate bond has default risk. Compared with its YTM, its expected return is…",o:["Lower","Equal","Higher","Unrelated"],a:0,e:"The YTM is calculated from the <b>promised</b> cash flows (the IRR if every payment is made). With default risk, the cash flows you actually expect are lower than the promised ones, so the return you expect is lower than the YTM. The difference is compensation for default risk. They are only equal for a risk-free bond."},
{t:"mc",q:"A coupon bond trades below the cost of the zero-coupon portfolio that replicates it. The arbitrage is to…",o:["Buy the coupon bond and sell the zeros","Sell the coupon bond and buy the zeros","Do nothing","Buy both"],a:0,e:"By the law of one price, two sets of identical cash flows should have the same price. If the coupon bond is cheaper than the zeros that replicate it, buy the cheap one and sell the expensive one. Their cash flows cancel in every future period, so you keep today’s price difference with no risk and no net investment. That is arbitrage. Selling the bond and buying the zeros would lose money."},
{t:"num",q:"Pay €1,612 at the end of each year for 50 years; r = 2%. Present value?",a:50654.85,tol:.5,u:"€",e:"Equal payments for a limited time are an annuity. PV = C/r × (1 − 1/(1+r)^N) with C = 1,612, r = 0.02, N = 50. Step 1: 1.02^50 = 2.6916, so 1/2.6916 = 0.3715. Step 2: 1 − 0.3715 = 0.6285. Step 3: 1,612/0.02 = 80,600, and 80,600 × 0.6285 = 50,654.85. It is below the perpetuity value of 80,600 because the payments stop after 50 years."},
{t:"num",q:"€1,612 per year forever, r = 2%. Present value?",a:80600,tol:1,u:"€",e:"Equal payments that never end are a perpetuity: PV = C/r. Here 1,612/0.02 = 80,600. Intuition: 80,600 invested at 2% pays exactly 1,612 interest per year and never uses up the principal, so that is what the stream is worth."},
{t:"num",q:"Deposit €1,612 per year for 10 years at 8%. Value at the end of year 10?",a:23352.34,tol:.5,u:"€",e:"Step 1, PV of the annuity at 8%: 1,612/0.08 × (1 − 1/1.08^10) = 20,150 × 0.5368 = 10,816.6. Step 2, move it forward 10 years: 10,816.6 × 1.08^10 = 10,816.6 × 2.1589 = 23,352.34. You use 8% because that is what the money earns in the stock market, and you use the FV because the question asks for the value at the end of year 10."},
{t:"num",q:"1% interest per month. EAR?",a:12.68,tol:.02,u:"%",e:"APR is simple interest: 12 × 1% = 12%. The EAR includes interest on interest. After one month you have 1.01, after 12 months 1.01^12 = 1.1268. EAR = 1.1268 − 1 = 12.68%, which is higher than the 12% APR because of compounding."},
{t:"num",q:"EAR 9%. Effective rate per quarter?",a:2.18,tol:.01,u:"%",e:"The EAR is for a whole year, so the quarterly rate must compound 4 times back to the EAR: (1 + quarterly)^4 = 1.09. Take the fourth root: 1.09^(1/4) = 1.02178, so 2.18% per quarter. Do not divide by 4 (2.25%): that only works if 9% is an APR with quarterly compounding, and here it is an EAR."},
{t:"num",q:"One-year rates are 2% in year 1 and 1% in year 2. The 2-year annualized rate (EAR)?",a:1.499,tol:.01,u:"%",e:"Money grows 1.02 in year 1 and 1.01 in year 2, so over two years it grows 1.02 × 1.01 = 1.0302. You want the single annual rate that gives the same growth: (1+r)² = 1.0302, so r = 1.0302^(1/2) − 1 = 1.499%. A simple average (1.5%) ignores compounding, and 3.02% is the two-year total, not an annual rate."},
{t:"num",q:"Zero-coupon bond, face 100, price 85.4, 3 years. YTM?",a:5.4,tol:.05,u:"%",e:"A zero-coupon bond has one cash flow, so P = FV/(1+YTM)^n. Rearranged: (1+YTM)^3 = 100/85.4 = 1.1710. Take the cube root: 1.1710^(1/3) = 1.054. YTM = 5.4%. This is the annual return you earn by buying at 85.4 and receiving 100 after 3 years."},
{t:"num",q:"EARs are 5.00%, 4.80% and 4.60% for 1, 2 and 3 years. PV of $1,000 at the end of each of the next 3 years?",a:2736.7,tol:1,u:"$",e:"Each cash flow is discounted at the rate for its own term (term structure): year 1 at 5.00%, year 2 at 4.80%, year 3 at 4.60%. PV = 1,000/1.05 + 1,000/1.048² + 1,000/1.046³ = 952.38 + 910.47 + 873.81 = 2,736.66. Using one single rate for all three would be wrong, because the rates differ by maturity."},
{t:"num",q:"5-year bond, 6% coupon paid semi-annually, face $1,000, YTM 3% (APR). Price?",a:1138.33,tol:.1,u:"$",e:"Everything must be semi-annual. Coupon: 6%/2 × 1,000 = $30 per period. Periods: 5 × 2 = 10. Rate per period: 3%/2 = 1.5% (the YTM is an APR). Price = PV of coupons + PV of face value = 30/0.015 × (1 − 1/1.015^10) + 1,000/1.015^10 = 2,000 × 0.1383 + 861.67 = 276.65 + 861.67 = 1,138.33. It is above 1,000, a premium bond, because the coupon (3% per period) is higher than the yield (1.5% per period)."},
{t:"num",q:"Same bond, but the price is $1,200. YTM as an APR?",a:1.8,tol:.02,u:"%",e:"Set the price formula equal to 1,200: 1,200 = 30/y × (1 − 1/(1+y)^10) + 1,000/(1+y)^10. There is no direct algebraic solution, so use trial and error. At y = 1.5% the price is 1,138.33, which is too low, so y must be lower. At y = 0.90% the price is about 1,200. That is 0.90% per half-year, and the YTM is quoted as an APR, so multiply by 2: 1.80%. Higher price means lower yield."},
{t:"num",q:"3 zero-coupon bonds (1000 face) cost 972.14, 939.62 and 906.24 for 1, 2 and 3 years. No-arbitrage price of a 3-year bond with 10% annual coupons, face 1000?",a:1188.04,tol:.1,u:"$",e:"Replicate the coupon bond: its cash flows are 100 at year 1, 100 at year 2 and 1,100 at year 3. That equals 0.1 of the 1-year zero (cost 972.14), 0.1 of the 2-year zero (939.62) and 1.1 of the 3-year zero (906.24). By the law of one price the coupon bond must cost the same: 97.21 + 93.96 + 996.86 = 1,188.04. If it trades elsewhere, there is arbitrage."}],

{n:3,title:"Investment rules, capital budgeting",ch:"Ch 7, 8 + Graham & Harvey (2022)",
sections:[
{h:"Ch 7 · NPV and the IRR rule",html:`<p><b>NPV</b> = −I₀ + PV(CF). Accept if NPV &gt; 0: what you receive is worth more than what you invest, and firm value rises by the NPV today. Invest $100 for $120 in a year at 10%: NPV = −100 + 120/1.10 = $9.09. Perpetuity project (invest 250, 35 per year forever, r = 10%): NPV = −250 + 35/0.10 = 100.</p>
<p><b>IRR</b> = the discount rate that makes NPV = 0 (like a bond’s YTM). Accept if IRR &gt; opportunity cost of capital. Invest 100, get 120: IRR = 20%. Perpetuity: IRR = C/I (35/250 = 14%). Growing perpetuity: IRR = C₁/I + g (25/400 + 1% = 7.25%). IRR − cost of capital is the maximum error in your cost-of-capital estimate that leaves the decision unchanged (14% − 10% = 4 points).</p>`},
{h:"Ch 7 · When the IRR rule fails",html:`<p>IRR works for stand-alone projects where <b>all negative cash flows come before the positive ones</b>: NPV is then a smoothly <b>decreasing</b> function of the discount rate. It can disagree with NPV in three cases:</p>
<ul><li><b>Delayed investment</b> (benefits first, costs later). Book deal: +1,000,000 now, −500,000 at t = 1, 2, 3. NPV at 10% = −243,426 (reject), but IRR = 23.38% &gt; 10% (accept). NPV is <b>increasing</b> in r, so the rule is reversed.</li>
<li><b>Multiple IRRs</b> (cash flows change sign more than once). Book deal plus: +550,000, −500,000 ×3, +1,000,000 at t = 4 has IRRs of 7.164% and 33.673%. NPV is negative between them, −10,413 at 10%: reject.</li>
<li><b>No IRR</b>: NPV is always positive or always negative.</li></ul>
<p>Most important lesson: <b>when in doubt, use NPV</b>.</p>`},
{h:"Ch 7 · Payback, ROCE and Graham (2022)",html:`<p><b>Payback period</b> = time to recover the initial investment. Accept if payback &lt; the <b>cutoff period</b>. Invest 120, receive 30 per year: payback 4 years, so reject with a 3-year cutoff. Invest 250, receive 35 per year: 250/35 = 7.14 years.</p>
<p><b>Drawbacks:</b> ignores time value of money, cost of capital and risk; ignores cash flows after the payback period; the cutoff is ad hoc. <b>Why used:</b> simple, fine for projects with similar risk and timing, and for liquidity-constrained (often small) firms. <b>ROCE / accounting rate of return</b> = average annual accounting profit ÷ investment, accept if above a hurdle rate; it uses accounting data, no risk or time-value correction.</p>
<p><b>Graham (2022) survey:</b> NPV and IRR are used by roughly 75–80% of firms, but payback is still used by a large share (roughly 60–65%, more in small firms), despite its shortcomings.</p>`},
{h:"Ch 7 · Choosing between projects, resource constraints",html:`<p><b>Mutually exclusive</b> (at most one project): choose the highest <b>NPV</b>. Highest IRR can mislead when projects differ in <b>scale</b> (500% on €1 vs 20% on €1 million), <b>timing</b> (50% return for 1 year vs 5 years: NPV 36.36 vs 371.51 at 10%) or <b>risk</b>. Book store (invest 300,000, 63,000 growing 3%, r = 8%): IRR 24%, NPV = 1,260,000 − 300,000 = 960,000. Coffee shop (400,000, 80,000): IRR 23%, NPV = 1,600,000 − 400,000 = 1,200,000. Choose the coffee shop.</p>
<p><b>Resource constraints</b> (not all positive-NPV projects fit): (1) check every feasible combination and take the highest total NPV, or (2) <b>profitability index</b> PI = NPV / resource consumed, invest in the highest PI first. PI is fast but not always right. Budget 20: PI picks A+B+C (NPV 31.3) but A+B+D gives 34.</p>`},
{h:"Ch 8 · Incremental earnings and unlevered net income",html:`<p><b>Incremental earnings</b> = earnings with the project − earnings without it. Items that are the same either way are ignored.</p>
<ul><li><b>Include:</b> extra revenues and costs, depreciation, <b>opportunity costs</b> (value of a resource in its best alternative use, e.g. lost rent), <b>cannibalization</b> (lost sales of existing products), salvage and terminal value.</li>
<li><b>Exclude:</b> <b>sunk costs</b> (paid regardless: past R&amp;D, a completed feasibility study), fixed overhead that does not change, and <b>interest</b> (financing is judged separately: separation principle).</li></ul>
<p><b>Unlevered net income</b> = EBIT × (1 − τc) = (Revenues − Costs − Depreciation) × (1 − τc). HomeNet year 1: (26,000 − 11,000 − 2,800 − 1,500) × 0.6 = 6,420 ($000s). Cannibalization: 25% × 100,000 × $100 = $2.5m lost sales and 25% × 100,000 × $60 = $1.5m lost costs, net $1.0m pre-tax.</p>`},
{h:"Ch 8 · Free cash flow, NWC and NPV",html:`<p>Profit ≠ cash flow. Corrections: credit sales and purchases (<b>ΔNWC</b>), depreciation (non-cash: add back, but it still saves tax = τc × depreciation, the <b>depreciation tax shield</b>), <b>CapEx</b> (cash out, not a cost). New loans and equity are financing and are ignored.</p>
<p><b>FCF = UNI + Depreciation − CapEx − ΔNWC.</b> NWC = current assets − current liabilities = cash + inventory + receivables − payables. An increase in NWC is a cash outflow: NWC of 130 → 150 means −20. NWC is recovered at the end, so its cash flows sum to zero but still affect NPV through timing. Example: (2,400 − 900 − 480) × 0.75 + 480 − 600 − 120 = 525.</p>
<p>HomeNet FCF: −16,500; 5,100; 7,200; 7,200; 7,200; 2,700. At 12%: NPV = $5,027 ($000s), IRR = 24.1%.</p>`},
{h:"Ch 8 · Analysing the project, two-stage valuation",html:`<p><b>Break-even analysis:</b> the input level where NPV = 0 (for the discount rate it is the IRR). Invest 50, 10 forever, r = 5%: NPV = 150, IRR = 10/50 = 20%, break-even investment = 200, break-even cash flow = 50 × 0.05 = 2.5. <b>Sensitivity analysis:</b> change one assumption at a time (best/worst case) to see which matters most. <b>Scenario analysis:</b> change several at once (e.g. price and volume together).</p>
<p><b>Two-stage valuation:</b> dividends of $2 for 5 years, then growing 2% forever, r = 7%. Stage 1 is an annuity: 2/0.07 × (1 − 1/1.07⁵) = 8.20. Stage 2 is a growing perpetuity valued at t = 5: 2.04/(0.07 − 0.02) = 40.80, discounted: 40.80/1.07⁵ = 29.09. Price = 37.29.</p>`}],
terms:[["Capital budgeting","Deciding which investment projects (capital expenditures) a firm should accept."],["NPV rule","Accept projects with NPV &gt; 0; among alternatives take the highest NPV."],["Internal rate of return (IRR)","The discount rate that makes NPV = 0; accept if IRR &gt; cost of capital (only reliable for normal projects)."],["Delayed investment","Benefits come before costs; NPV rises with r and the IRR rule gives the wrong answer."],["Multiple IRRs","Several discount rates give NPV = 0 when cash flows change sign more than once."],["Payback period","Years needed to recover the initial investment; accept if below the cutoff."],["Cutoff period","The pre-set maximum payback time."],["ROCE / accounting rate of return","Average annual accounting profit ÷ investment; compared with a hurdle rate."],["Mutually exclusive projects","At most one project can be chosen."],["Profitability index","NPV ÷ resources consumed; a quick way to pick projects under a resource constraint."],["Incremental earnings","Earnings with the project minus earnings without it."],["Cannibalization","Sales of the new product displace sales of an existing product."],["Opportunity cost","Value a resource would have provided in its best alternative use."],["Sunk cost","A cost paid regardless of the decision; never included."],["Unlevered net income","EBIT × (1 − τc), ignoring interest."],["Free cash flow (FCF)","UNI + depreciation − CapEx − ΔNWC: incremental cash available to financiers."],["Net working capital (NWC)","Current assets − current liabilities; an increase is a cash outflow."],["Depreciation tax shield","Tax saved because depreciation is deductible: τc × depreciation."],["Break-even analysis","Finding the input level at which NPV = 0."],["Sensitivity analysis","Varying one assumption to see the effect on NPV."],["Scenario analysis","Varying several assumptions at the same time."],["Continuation (terminal) value","Value of cash flows after the explicit forecast period, e.g. a growing perpetuity at the end."]],
formulas:[["Free cash flow","UNI + Depr − CapEx − ΔNWC","s"],["PV perpetuity","C / r","s"],["PV growing perpetuity","C / (r − g), g < r","s"],["PV annuity","C/r × (1 − 1/(1+r)^N)","s"],["NPV","−I₀ + Σ CF_t / (1+r)^t"],["IRR","rate where NPV = 0"],["IRR (perpetuity)","C / I₀  (growing: C₁/I₀ + g)"],["Payback period","years until cumulative CF ≥ I₀"],["Profitability index","NPV / resources consumed"],["Unlevered net income","(Rev − Costs − Depr) × (1 − τc)"],["Depreciation tax shield","τc × Depreciation"],["NWC","Cash + Inventory + Receivables − Payables"],["Cash flow from NWC","−ΔNWC"],["Break-even","level of input where NPV = 0"]],
q:[
{t:"mc",q:"$250 million initial investment, cash flow of $35 million at the end of each year, lasting forever. Opportunity cost of capital 10%. NPV? Accept according to NPV?",o:["−$100 million, reject","$0, neutral","$350 million, accept","$100 million, accept"],a:3,e:"Perpetuity: PV of inflows = C/r = 35/0.10 = 350. NPV = −250 + 350 = $100 million &gt; 0, accept. $350 million is only the PV of the inflows; NPV = PV(CF) − I₀, so you must subtract the investment."},
{t:"mc",q:"Same project ($250 million, $35 million forever, opportunity cost 10%). What is the IRR and do you accept according to IRR?",o:["6%, reject","12%, reject","14%, accept","16%, accept"],a:2,e:"IRR solves 0 = −250 + 35/IRR, so IRR = 35/250 = 14%. 14% &gt; 10%: accept, the same as NPV (normal project: outflow first, then inflows)."},
{t:"mc",q:"A firm requires projects to pay back within 5 years. Project: initial investment $250 million, yearly cash flows of $35 million lasting forever. Accept according to the payback rule?",o:["Yes","No","This depends on the discount rate of the cash flows"],a:1,e:"Payback = 250/35 = 7.14 years &gt; 5-year cutoff: reject. The rule uses no discount rate (so C is wrong) and ignores all cash flows after payback, which here are worth a lot (NPV = +100 at 10%): payback can reject value-adding projects."},
{t:"mc",q:"Fintech Inc. considers acquiring a startup for $400 million today. It is expected to generate $25 million at the end of each year forever. Opportunity cost of capital 5%.",o:["Wise decision: NPV is positive $500 million","Wise decision: NPV is positive $100 million","Cannot say: you do not know the alternatives","Cannot say: if the risk of the cash flows is high, this might reduce firm value"],a:1,e:"NPV = −400 + 25/0.05 = −400 + 500 = $100 million &gt; 0. The opportunity cost of capital already reflects the alternatives and the risk of the cash flows, so C and D are wrong. $500 million is the PV of the inflows, not the NPV."},
{t:"mc",q:"Risky project: initial investment $100 million, cash flow of $15 million at the <b>beginning</b> of each of the next 8 years. Risk-free rate 2%, discount rate 5%. Accept according to NPV?",o:["Accept, NPV = $3.2 million","Accept, NPV = $1.8 million","Reject, NPV = −$3.0 million","Reject, NPV = −$6.1 million"],a:1,e:"First payment is today (t = 0), the other 7 at t = 1 to 7: NPV = −100 + 15 + 15 × [1/0.05 − 1/(0.05 × 1.05⁷)] = −100 + 15 + 86.80 = $1.80 million. Use the project’s 5% discount rate, not the 2% risk-free rate. Treating it as an ordinary 8-year annuity gives 15 × 6.463 = 96.95 and NPV ≈ −3.0 (option C): the classic timing slip."},
{t:"mc",q:"Fintech Inc. buys a startup for $400 million. Cash flows at the end of each year forever; the first is $25 million and then grows 1% per year. Opportunity cost of capital 5%.",o:["IRR is 5%, equal to the OCC, so do the acquisition","IRR is 7.25%, higher than the OCC, so accept","IRR cannot be used: the first cash flow is negative and all further cash flows are positive","IRR is 6.25% and this is higher than 5%, so accept"],a:1,e:"Growing perpetuity: 0 = −400 + 25/(IRR − 1%), so IRR = 25/400 + 1% = 6.25% + 1% = 7.25% &gt; 5%: accept. D forgets to add g. C is wrong: an outflow followed by inflows is exactly the pattern where the IRR rule works."},
{t:"mc",q:"Which of the following statements regarding the IRR rule is TRUE?",o:["The IRR rule (IRR &gt; r) can be used when the project first has positive cash flows followed by negative cash flows","The IRR rule will never lead to the highest NPV for mutually exclusive projects","The IRR rule (choose highest IRR) can be used for mutually exclusive projects that have a different initial investment","The IRR rule (choose highest IRR) cannot be used for mutually exclusive projects that have different risk"],a:3,e:"D is true: a higher IRR does not compensate for higher risk, so NPV with risk-adjusted rates is needed. A is false: positive-then-negative is a delayed investment, where IRR fails. B is false: IRR sometimes picks the highest-NPV project, it just is not guaranteed. C is false: differences in scale are a reason NOT to use the IRR ranking (400k at 23% can beat 300k at 24% in NPV)."},
{t:"mc",q:"Initial investment $250, $35 end-of-year cash flow for 10 years, cutoff period 5 years. What is the payback period and should the firm accept?",o:["$100, accept","14%, accept","7 years, reject","More than 7 years, reject"],a:3,e:"Payback = 250/35 = 7.14 years: more than 7 (so C is wrong) and above the 5-year cutoff, so reject. Payback is measured in years, so $100 and 14% cannot be payback periods."},
{t:"mc",q:"True or false? If the cutoff period is longer than the entire length of the project, the payback period rule leads to the same conclusion as the NPV rule.",o:["True","False"],a:1,e:"False. Payback does not discount, so a project can pay back within its life and still have a negative NPV. Example: invest 100, receive 30 per year for 5 years: payback 3.3 years, but at 20% NPV = 30 × 2.991 − 100 = −10.3."},
{t:"mc",q:"True or false? Graham (2022) shows that because of the shortcomings of the payback period rule, few managers use this rule in practice.",o:["True","False"],a:1,e:"False. Graham’s survey shows NPV and IRR are most used (about 75–80% of firms), but payback is still used by a large share (roughly 60–65%, more in small firms) because it is simple, suits similar projects and liquidity-constrained firms."},
{t:"mc",q:"A firm considers two mutually exclusive projects. Project A has an IRR of 8%, project B has an IRR of 26%. The last project the firm accepted had a cost of capital of 8%. Which project should the firm accept?",o:["Only project A","Only project B","Both projects A and B","None of these projects","It is not clear what project(s) should be accepted"],a:4,e:"For mutually exclusive projects you must compare NPVs. The IRR ranking can be wrong when scale, timing or risk differ, and the 8% belongs to a previous project, not to A or B. Without cash flows and each project’s own cost of capital you cannot compute the NPVs. Rule: when in doubt, use NPV."},
{t:"mc",q:"A firm considers 4 projects (investment at t = 0; perpetual cash flow from t = 1; accounting profit in year 1; machine hours): A: 100, 12, 20, 40 h; B: 50, 8, 25, 20 h; C: 50, 7, 15, 25 h; D: 80, 10, 20, 30 h. Only 80 machine hours are available; cost of capital 8%. Which projects does the profitability index select?",o:["B, C and D","A, B and C","A and B","A and D"],a:0,e:"NPV = −I + CF/0.08: A 50, B 50, C 37.5, D 45. The constrained resource is machine hours, so PI = NPV/hours: A 1.25, B 2.5, C 1.5, D 1.5. Highest PI first: B (20 h), then C and D (25 + 30 h): 75 h ≤ 80, total NPV 132.5. Year-1 profit is an accounting number, not a cash flow, so ignore it."},
{t:"mc",q:"Capital budget of $20. Projects (NPV, investment): A (18, 10), B (8.5, 5), C (4.8, 3), D (7.5, 5). Which projects does the profitability index (NPV per $ invested) select?",o:["A, C and D","A, B and D","A, B and C","B, C and D"],a:2,e:"PI: A 1.8, B 1.7, C 1.6, D 1.5. Take A (10), B (5), C (3) = 18 invested, total NPV 31.3. D (5) no longer fits in the remaining 2."},
{t:"num",q:"Same capital budget of $20 and projects A (NPV 18, cost 10), B (8.5, 5), C (4.8, 3), D (7.5, 5). What is the highest total NPV that can be achieved?",a:34,tol:.05,u:"$",e:"Check all feasible combinations. A+B+C = 31.3 (cost 18). A+B+D = 18 + 8.5 + 7.5 = 34 (cost 20). Others are lower (e.g. B+C+D = 20.8). So A+B+D is optimal and PI (A+B+C) was not: PI is a quick shortcut, not always correct (projects are indivisible and 2 of the budget is wasted)."},
{t:"mc",q:"Mutually exclusive: Book store (investment $300,000, IRR 24%, PV of future cash flows $1,260,000) and Coffee shop (investment $400,000, IRR 23%, PV of future cash flows $1,600,000), cost of capital 8%. Which should be chosen?",o:["Book store, highest IRR","Coffee shop, highest NPV","Both projects","Neither project"],a:1,e:"NPV book store = 1,260,000 − 300,000 = 960,000. NPV coffee shop = 1,600,000 − 400,000 = 1,200,000. The projects differ in scale, so IRR misleads; for mutually exclusive projects choose the highest NPV."},
{t:"num",q:"You receive $1,000,000 upfront and pay costs of $500,000 at the end of each of the next 3 years. Opportunity cost of capital 10%. NPV?",a:-243426,tol:5,u:"$",e:"NPV = 1,000,000 − 500,000/1.1 − 500,000/1.1² − 500,000/1.1³ = 1,000,000 − 454,545 − 413,223 − 375,657 = −243,426: reject. The IRR is 23.38% &gt; 10%, which would wrongly say accept: with benefits before costs (delayed investment) NPV increases with r."},
{t:"mc",q:"Book deal plus: cash flows +550,000, −500,000, −500,000, −500,000, +1,000,000 (t = 0 to 4). IRRs are 7.164% and 33.673%; cost of capital 10%. What should you do?",o:["Accept: the highest IRR (33.67%) exceeds the 10% cost of capital","It cannot be evaluated, because the IRR rule gives two answers","Accept: the lowest IRR (7.16%) is below the 10% cost of capital","Reject: NPV is negative between the two IRRs (−$10,413 at 10%)"],a:3,e:"With several sign changes there are multiple IRRs and the IRR rule is unclear. NPV is negative between 7.164% and 33.673%, so at 10% NPV = 550,000 − 454,545 − 413,223 − 375,657 + 683,013 = −10,413: reject. NPV can always be computed."},
{t:"num",q:"Project A free cash flows ($000s): year 0 −16,500; years 1 to 5: 5,100; 7,200; 7,200; 7,200; 2,700. Payback period in years (interpolate within the year)?",a:2.58,tol:.02,u:"years",e:"Cumulative cash flow: 5,100 after year 1, 12,300 after year 2. Still 16,500 − 12,300 = 4,200 to recover in year 3: 2 + 4,200/7,200 = 2.58 years. A project B with only the first three years has the same payback although it is worth less: payback ignores later cash flows."},
{t:"num",q:"A long-term project costs 100 today and grows 50% per year, paying 100 × 1.5⁵ = 759.375 in year 5. Cost of capital 10%. NPV?",a:371.51,tol:.05,u:"",e:"NPV = −100 + 759.375/1.1⁵ = −100 + 471.51 = 371.51. A short project (−100, +150 in year 1) has the same 50% IRR but NPV = −100 + 150/1.1 = 36.36. Equal IRR, very different NPV: IRR ignores timing and scale."},
{t:"mc",q:"Which of the following should be included in the incremental unlevered earnings of an investment project? A. Additional revenues of the project. B. Cannibalisation. C. Depreciation of initial investment. D. Interest payments for a loan to finance the investment. E. Corporate overhead costs allocated to the project that are not changing due to the project. F. Marketing research that has been done and paid for to assess the financials of the project.",o:["A, B and E","A, B, C and F","A, B, C and D","A, B and C"],a:3,e:"Incremental earnings = with project − without. A, B (lost sales of existing products) and C (accounting cost that lowers tax) are included. D is financing (unlevered earnings ignore interest, separation principle). E is not incremental. F is a sunk cost."},
{t:"mc",q:"Which items to include in capital budgeting? A. Cost of goods sold of additional sales. B. Investments in working capital. C. Purchase price of a new building. D. Use of an empty building already owned by the firm. E. Possible dangers of a failed project (claims). F. Cash flows more than 10 years in the future. G. Tax benefits caused by negative earnings in the first years. H. The sales of existing projects.",o:["A, B and C only","A to G (all except H)","A to H (all items)","A, B, C and D only"],a:1,e:"A, B, C are incremental. D counts as an opportunity cost (what the building could earn otherwise). E counts at probability × damage. F counts, but is discounted heavily. G counts (timing depends on tax rules). H does not: existing sales that do not change are not incremental (only the lost part, cannibalization, is)."},
{t:"mc",q:"Linksys has completed a $300,000 feasibility study to assess a new product, HomeNet. Should the cost of the study be included in the capital budgeting decision?",o:["No, the $300,000 is not incremental","Yes, for $300,000 less taxes","No, the $300,000 is a financing cash flow","Yes, for $300,000"],a:0,e:"The study is already done and paid: a sunk cost, identical with or without the project, so not incremental. It is not a financing flow either (that would be interest or loans)."},
{t:"mc",q:"All numbers in $000s. Profit tax 40%. Interest expense is $5,000 (5 mil). Year 1: sales 26,000, cost of goods sold 11,000, selling, general and administrative 2,800, R&amp;D 0, depreciation 1,500. What is unlevered net income in year 1?",o:["4,280","1,420","10,700","6,420"],a:3,e:"EBIT = 26,000 − 11,000 − 2,800 − 1,500 = 10,700. UNI = EBIT × (1 − 0.4) = 6,420. Interest is ignored (unlevered). 10,700 is EBIT before tax and 4,280 is the tax itself. 1,420 comes from also deducting the interest."},
{t:"mc",q:"What is the free cash flow in year 1? Revenues 2400; operating expenses (excl. depreciation) 900; depreciation 480; increase in working capital 120; capital expenditures 600; marginal corporate tax rate 25%.",o:["405","732.5","525","765"],a:2,e:"UNI = (2400 − 900 − 480) × 0.75 = 765. FCF = UNI + depreciation − CapEx − ΔNWC = 765 + 480 − 600 − 120 = 525. 765 is only the unlevered net income: you must add back depreciation (non-cash) and subtract CapEx and the increase in NWC."},
{t:"num",q:"NWC components: 2020: inventory 100, cash needed 40, accounts receivable 50, accounts payable 60. 2021: inventory 120, cash needed 50, receivable 70, payable 90. What is the cash flow in 2021 related to NWC?",a:-20,tol:.01,u:"$",e:"NWC = cash + inventory + receivables − payables: 2020 = 40 + 100 + 50 − 60 = 130; 2021 = 50 + 120 + 70 − 90 = 150. NWC rises by 20, and an increase in NWC is a cash outflow: −20."},
{t:"num",q:"HomeNet free cash flows ($000s): year 0 −16,500; years 1 to 5: 5,100; 7,200; 7,200; 7,200; 2,700. Cost of capital 12%. NPV?",a:5027,tol:3,u:"$000s",e:"NPV = −16,500 + 5,100/1.12 + 7,200/1.12² + 7,200/1.12³ + 7,200/1.12⁴ + 2,700/1.12⁵ = −16,500 + 4,554 + 5,740 + 5,125 + 4,576 + 1,532 = 5,027 (the slides use rounded discount factors). NPV &gt; 0: accept."},
{t:"num",q:"For the same HomeNet cash flows, at which discount rate does the NPV become 0 (the NPV break-even discount rate)?",a:24.1,tol:.1,u:"%",e:"The discount rate that makes NPV = 0 is the IRR: 24.1%. It is found by trial and error. The decision stays ‘accept’ as long as the cost of capital stays below 24.1%."},
{t:"num",q:"A project requires a $50 upfront investment and generates $10 at the end of each year forever. Discount rate 5%. What is the NPV break-even level of the yearly cash flow?",a:2.5,tol:.01,u:"$ per year",e:"Solve 0 = −50 + C/0.05, so C = 50 × 0.05 = 2.5. (NPV = −50 + 10/0.05 = 150 and IRR = 10/50 = 20%; the break-even investment is 200.) The cash flow can fall from 10 to 2.5 before the decision changes."},
{t:"num",q:"A project has a $100 upfront investment and constant sales at the end of each year forever. Cost of goods sold is 50% of sales, general costs $40 per period, tax 30%, opportunity cost 12%, no depreciation, CapEx or NWC changes. What is the NPV break-even level of yearly sales?",a:114.3,tol:.1,u:"$",e:"Cash flow = (0.5 × sales − 40) × 0.7. Solve 0 = −100 + CF/0.12, so CF = 12. Then 0.5 × sales − 40 = 12/0.7 = 17.14, so sales = (40 + 17.14)/0.5 = 114.3."},
{t:"mc",q:"You recalculate a project’s NPV with a lower sales price and a higher sales volume at the same time. What is this type of project analysis?",o:["Sensitivity analysis","Break-even analysis","Scenario analysis","Incremental analysis"],a:2,e:"Scenario analysis changes several assumptions at once. Sensitivity analysis changes one input at a time; break-even analysis finds the input level where NPV = 0."},
{t:"num",q:"A share pays a $2 dividend at the end of each of years 1 to 5. From year 6 the dividend grows 2% per year forever. Discount rate 7%. What is the share price today?",a:37.29,tol:.02,u:"$",e:"Stage 1 (annuity): 2/0.07 × (1 − 1/1.07⁵) = 8.20. Stage 2 (growing perpetuity from year 6): value at t = 5 is 2.04/(0.07 − 0.02) = 40.80; discounted to today 40.80/1.07⁵ = 29.09. Price = 8.20 + 29.09 = 37.29."}],

if(S.i>=a.length){const c=a.filter(q=>P[q.id]===1).length;$("#body").innerHTML=h+`<div class="q"><h3 style="margin-top:0">Round finished</h3><p>${c} of ${a.length} correct. Wrong answers are saved under My mistakes.</p><button class="btn" id="again">Go again</button></div>`;wire();$("#again").onclick=()=>{S.i=0;S.done=false;draw()};return}

/* ===== Weekly quiz data: add a quiz to any week with WEEKS[i].quiz=[{ch,t,q,o,a,e} or {ch,t:"num",q,a,tol,u,e}] ===== */
WEEKS[0].quiz=[
{ch:"Ch 1",t:"mc",q:"A corporation earns profit and pays it out as a dividend. How is that money taxed?",o:["At the corporate level and again at the shareholder level","Only at the shareholder level, as dividend income","Only at the corporate level, as profit of the firm","Not at all, because dividends are paid after tax"],a:0,e:"Double taxation: corporate tax on profit, then income tax on the dividend."},
{ch:"Ch 1",t:"mc",q:"Shareholders are called residual claimants because they…",o:["Hold the residual value of the firm’s buildings","Receive a fixed payment each year","Are paid only after creditors have been paid","Cannot vote on corporate policy"],a:2,e:"Debt holders have a prior claim. Shareholders get what is left, which is why in theory they care about everyone else’s claims too."},
{ch:"Ch 1",t:"mc",q:"Which is the clearest example of an agency problem?",o:["A firm dumps waste in a river","A firm switches from a BV to an NV","Shareholders sell their shares at the ask price","A CEO buys a corporate jet mainly for personal use"],a:3,e:"Manager (agent) spends shareholders’ money on own benefit. The river is an externality."},
{ch:"Ch 1",t:"mc",q:"Hart & Zingales (2017) argue that a firm should maximize…",o:["The market value of the shares, as Friedman argued","The tax revenue it generates for the government","The total profit of all stakeholders combined","Shareholder welfare, which also includes ethical concerns"],a:3,e:"Shareholders are not only interested in money, so welfare is not the same as market value."},
{ch:"Ch 1",t:"num",q:"A market maker quotes bid $20.10 and ask $20.30. You buy one share and immediately sell it back. How much do you lose?",a:.2,tol:.005,u:"$",e:"You pay the ask 20.30 and receive the bid 20.10: the spread is $0.20."},
{ch:"Ch 2",t:"num",q:"Share price $12, 50 million shares, debt $200m, cash $80m. Enterprise value?",a:720,tol:.5,u:"$ million",e:"Market cap 600 + debt 200 − cash 80 = 720."},
{ch:"Ch 2",t:"num",q:"Accounts payable are $45m and annual COGS $730m (365 days). Accounts payable days?",a:22.5,tol:.1,u:"days",e:"Daily COGS = 2; 45/2 = 22.5 days."},
{ch:"Ch 2",t:"num",q:"Total debt $300m, book equity $700m. Debt-to-capital ratio?",a:30,tol:.1,u:"%",e:"Debt / (equity + debt) = 300 / 1,000 = 30%."},
{ch:"Ch 2",t:"mc",q:"A firm has a market-to-book ratio of 0.8. The most consistent interpretation is that…",o:["Investors expect poor prospects relative to book value","Investors expect the assets to earn more than their accounting value suggests","The firm has no debt","Book value is forward-looking"],a:0,e:"Market value below book value signals that investors expect the assets to create less value than their historical cost."},
{ch:"Ch 2",t:"num",q:"Unlevered net income 40, depreciation 10, capex 25, and NWC rises from 30 to 38. Free cash flow?",a:17,tol:.05,u:"",e:"40 + 10 − 25 − 8 = 17."},
{ch:"Ch 3",t:"num",q:"€1,500 will be received in one year. The risk-free rate is 3%. Present value?",a:1456.31,tol:.05,u:"€",e:"1,500 / 1.03 = 1,456.31."},
{ch:"Ch 3",t:"num",q:"Invest €400 today and receive €440 in a year; r = 8%. NPV?",a:7.41,tol:.02,u:"€",e:"−400 + 440/1.08 = 7.41, so accept."},
{ch:"Ch 3",t:"mc",q:"Projects X, Y, Z have NPVs of 12, 30 and −5. The firm can accept as many as it wants. It should accept…",o:["X and Y","Y only","X, Y and Z","None"],a:0,e:"Accept every positive-NPV project. ‘Y only’ is the answer only if the projects are mutually exclusive."},
{ch:"Ch 3",t:"num",q:"Security A pays €100 in one year and costs €92. Security B pays €300 in one year. No-arbitrage price of B?",a:276,tol:.5,u:"€",e:"B equals 3 × A, so price 3 × 92 = 276."},
{ch:"Ch 3",t:"mc",q:"A risk-free security paying €100 in one year trades at €97 while r = 5% (PV = €95.24). What is the best action?",o:["Buy it: it returns 3.1%, which is the best risk-free return","Buy it and hold it, expecting its price to rise towards €95.24","Do nothing: a €1.76 gap is normal market noise","Sell it and invest €95.24 at the bank, keeping the difference"],a:3,e:"Overpriced by €1.76: selling it and investing the PV replicates the payment risk-free. This is arbitrage."}];

WEEKS[1].quiz=[
{ch:"Ch 4",t:"num",q:"€500 is received at the end of each year for 12 years; r = 6%. Present value?",a:4191.92,tol:.5,u:"€",e:"Equal yearly payments for a limited time: annuity. PV = 500/0.06 × (1 − 1/1.06^12). 1.06^12 = 2.0122, so 1/2.0122 = 0.4970 and 1 − 0.4970 = 0.5030. 500/0.06 = 8,333.33, and 8,333.33 × 0.5030 = 4,191.92."},
{ch:"Ch 4",t:"num",q:"A perpetuity pays €45 per year; r = 3%. Present value?",a:1500,tol:.5,u:"€",e:"Perpetuity: PV = C/r = 45/0.03 = 1,500. Check: 1,500 invested at 3% earns exactly 45 per year forever."},
{ch:"Ch 4",t:"num",q:"A growing perpetuity’s first payment (in one year) is €90 and grows 3% per year; r = 9%. Present value?",a:1500,tol:.5,u:"€",e:"Growing perpetuity: PV = C1/(r − g), where C1 is the first payment, one year from now. = 90/(0.09 − 0.03) = 90/0.06 = 1,500. The formula works because g (3%) is below r (9%)."},
{ch:"Ch 4",t:"num",q:"€100 is received at times 0, 1 and 2; r = 5%. Present value?",a:285.94,tol:.05,u:"€",e:"The first payment is today, so it is not discounted: 100. The others are discounted: 100/1.05 = 95.24 and 100/1.05² = 90.70. Sum = 285.94. Alternatively, treat it as a standard 3-period annuity (272.32) and multiply by 1.05 because it is early: 272.32 × 1.05 = 285.94."},
{ch:"Ch 4",t:"num",q:"You deposit €2,000 at the end of each year for 10 years at 5%. Value at the end of year 10?",a:25155.79,tol:1,u:"€",e:"Step 1, PV of the annuity: 2,000/0.05 × (1 − 1/1.05^10) = 40,000 × 0.3861 = 15,443.47. Step 2, move it to year 10: 15,443.47 × 1.05^10 = 15,443.47 × 1.6289 = 25,155.79. The shortcut FV = C × ((1+r)^N − 1)/r gives the same: 2,000 × 12.5779."},
{ch:"Ch 5",t:"num",q:"A loan quotes 8% APR compounded quarterly. EAR?",a:8.24,tol:.02,u:"%",e:"Quarterly rate = 8%/4 = 2%. Compounded over 4 quarters: 1.02^4 = 1.0824. EAR = 8.24%. It is above the 8% APR because interest is earned on interest each quarter."},
{ch:"Ch 5",t:"num",q:"EAR is 6%. Effective monthly rate?",a:.487,tol:.005,u:"%",e:"Twelve monthly growth factors must multiply to the yearly factor 1.06, so (1 + m)^12 = 1.06 and m = 1.06^(1/12) − 1 = 0.00487, which is 0.487% per month. Dividing 6% by 12 (0.5%) would be wrong, because 6% is an EAR, not an APR."},
{ch:"Ch 5",t:"num",q:"Nominal rate 7%, inflation 3%. Real rate (exact)?",a:3.88,tol:.02,u:"%",e:"Nominal and real rates are related by (1 + r) = (1 + rr)(1 + i). So 1 + rr = 1.07/1.03 = 1.03883, and rr = 3.88%. The quick estimate r − i = 4% is only an approximation. The exact formula shows your purchasing power grows 3.88%."},
{ch:"Ch 5",t:"num",q:"A €20,000 loan has 60 equal monthly payments at 6% APR (monthly compounding). Monthly payment?",a:386.66,tol:.1,u:"€",e:"Follow the four steps. Cash flow: equal monthly payments, an annuity. Rate: 6% APR/12 = 0.5% per month. Periods: 60. Solve for the payment C in PV = C/r × (1 − 1/(1+r)^N): C = PV × r/(1 − (1+r)^−N) = 20,000 × 0.005/(1 − 1.005^−60) = 100/0.25865 = 386.66."},
{ch:"Ch 5",t:"mc",q:"1-year rate 2%, 5-year 3%, 10-year 4%. The curve is…",o:["Inverted; rates expected to fall","Inverted; rates expected to rise","Flat","Normal; rates expected to rise"],a:3,e:"The yields rise with maturity (2%, 3%, 4%), so the curve slopes upward: <b>normal</b>. A long-term rate is like an average of expected future one-year rates, so higher long-term rates mean investors expect rates to rise (plus compensation for risk). An inverted curve slopes downward."},
{ch:"Ch 6",t:"num",q:"A 5-year zero-coupon bond, face $1,000, YTM 4%. Price?",a:821.93,tol:.1,u:"$",e:"One cash flow, so P = FV/(1+YTM)^n = 1,000/1.04^5. 1.04^5 = 1.2167, so P = 821.93. The price is below the face value: a discount bond. The $178 difference is your interest."},
{ch:"Ch 6",t:"num",q:"3-year bond, 5% annual coupon, face $1,000, YTM 4%. Price?",a:1027.75,tol:.1,u:"$",e:"Coupon = 5% × 1,000 = 50 per year for 3 years. Price = 50/0.04 × (1 − 1/1.04³) + 1,000/1.04³. 1.04³ = 1.1249, so 1/1.1249 = 0.8890. Coupons: 1,250 × 0.1110 = 138.76. Face value: 889.00. Total 1,027.75. Above 1,000: a premium bond, because the coupon (5%) exceeds the yield (4%)."},
{ch:"Ch 6",t:"mc",q:"Yields rise from 3% to 4% for two bonds with the same coupon, a 2-year and a 20-year. Which statement is right?",o:["Both prices rise, the 2-year more","Both prices fall, the 20-year more","Both prices fall, the 2-year more","Only the 20-year price changes"],a:1,e:"A higher yield means a higher discount rate, so both prices fall (rules out the options with a rise). The effect is bigger for the longer bond because its cash flows are discounted over more periods: a small rate change compounds over 20 years but hardly over 2. That is interest rate risk: it is higher for longer maturities."},
{ch:"Ch 6",t:"num",q:"A corporate bond yields 5.2% and the Treasury yield for the same maturity is 3.1%. Yield spread?",a:2.1,tol:.02,u:"%",e:"The yield spread (credit or default spread) is the corporate yield minus the yield of a risk-free Treasury with the same maturity: 5.2% − 3.1% = 2.1%. It is the extra yield investors demand for default risk."},
{ch:"Ch 6",t:"mc",q:"A 10% annual, 3-year coupon bond trades at €1,170 while the zeros that replicate it cost €1,188.04. The best action is to…",o:["Sell the bond and buy the zeros","Hold the bond: the price gap is within normal noise","Buy the bond and sell the zeros, locking in €18.04","Buy both the bond and the zeros to diversify the risk"],a:2,e:"The coupon bond’s cash flows can be copied exactly with zeros costing 1,188.04. The bond costs only 1,170, so it is underpriced compared to the copy. Buy the bond (1,170) and sell the replicating zeros (receive 1,188.04). Every future cash flow of the two positions cancels, so the profit is 1,188.04 − 1,170 = 18.04 today, risk-free."}];

WEEKS[2].quiz=[
{ch:"Ch 7",t:"num",q:"You invest €200 today and receive €250 in one year. Cost of capital 8%. What is the NPV?",a:31.48,tol:.05,u:"€",e:"NPV = −I₀ + PV(CF) = −200 + 250/1.08 = −200 + 231.48 = 31.48. Positive, so accept: the project adds €31.48 of value today. Common slip: 250 − 200 = 50 is not an NPV because it ignores that the €250 arrives a year later and must be discounted."},
{ch:"Ch 7",t:"num",q:"You invest €500 today and receive a single payment of €600 in two years. What is the IRR (in %)?",a:9.54,tol:.05,u:"%",e:"IRR is the rate that makes NPV = 0: 0 = −500 + 600/(1+IRR)². So (1+IRR)² = 1.2 and IRR = 1.2^0.5 − 1 = 9.54%. Dividing 20% by 2 years gives 10%, which is wrong because of compounding."},
{ch:"Ch 7",t:"mc",q:"A project costs €800 today and pays €60 at the end of each year forever. The cost of capital is 8%. What is the IRR and what does the IRR rule say?",o:["7.5%, accept","8%, indifferent","13.3%, accept","7.5%, reject"],a:3,e:"Perpetuity: 0 = −800 + 60/IRR, so IRR = 60/800 = 7.5%. That is below the 8% cost of capital, so reject. NPV agrees: −800 + 60/0.08 = −800 + 750 = −50 &lt; 0. Option C inverts the fraction (800/60). Option D would need a 10% cash-flow-to-investment ratio."},
{ch:"Ch 7",t:"num",q:"A project costs €1,000 today. Cash flows at the end of years 1 to 4: 200, 300, 500, 500. What is the payback period in years (interpolate within the year)?",a:3,tol:.02,u:"years",e:"Cumulative cash flow: 200 after year 1, 500 after year 2, 1,000 after year 3. The €1,000 is recovered exactly at the end of year 3, so payback = 2 + 500/500 = 3.0 years. Payback is not discounted: it only measures time to get the money back."},
{ch:"Ch 7",t:"mc",q:"You receive €5,000 today and must pay €3,000 at the end of year 1 and €3,000 at the end of year 2. The IRR is about 13.07% and the cost of capital is 10%. What is correct?",o:["Accept: IRR &gt; cost of capital and NPV &gt; 0","Reject: NPV = −207 &lt; 0, so the IRR rule gives the wrong answer here","Accept: the money is received immediately, so payback is zero","Reject: the IRR is below the cost of capital"],a:1,e:"NPV = 5,000 − 3,000/1.10 − 3,000/1.10² = 5,000 − 2,727 − 2,479 = −207: reject. This is a delayed investment (benefit first, costs later): NPV is an increasing function of r, so IRR &gt; r does not mean accept. D is false (13.07% &gt; 10%). C uses payback, which ignores the later costs. When in doubt use NPV."},
{ch:"Ch 7",t:"mc",q:"Mutually exclusive projects, cost of capital 10%. S: invest 100, receive 140 in one year (IRR 40%). L: invest 1,000, receive 1,200 in one year (IRR 20%). Which should you choose?",o:["L, the highest NPV (90.91 vs 27.27)","S, the highest IRR","Both","Neither, since IRR 20% is low"],a:0,e:"NPV(S) = −100 + 140/1.1 = 27.27. NPV(L) = −1,000 + 1,200/1.1 = 90.91. For mutually exclusive projects choose the highest NPV. IRR is a percentage and ignores scale: 40% on 100 creates less value than 20% on 1,000. Both are excluded by definition (only one can be chosen), and 20% still exceeds 10%."},
{ch:"Ch 7",t:"num",q:"Budget €100. Projects (NPV, investment): P (12, 40), Q (20, 50), R (8, 30). Projects cannot be split. What is the highest total NPV within the budget?",a:32,tol:.05,u:"€",e:"Profitability index = NPV/investment: Q 0.40, P 0.30, R 0.27. Take Q (50) then P (40) = 90, total NPV 32; R (30) no longer fits. Check all combinations: Q+R = 80, NPV 28; P+R = 70, NPV 20; all three cost 120 &gt; 100. So 32 is best, and PI found it here (PI is a shortcut and not always right)."},
{ch:"Ch 7",t:"mc",q:"A firm uses a 3-year payback cutoff. Project Z has a positive NPV but pays back in 4 years. What does the payback rule do and why is that a weakness?",o:["Rejects Z, because it ignores cash flows after the cutoff and the time value of money","Accepts Z, because a positive NPV always passes the payback rule","Accepts Z, because payback is rounded down to 3 whole years","Is indifferent, because 4 years is close to the 3-year cutoff"],a:0,e:"Payback &lt; cutoff is required: 4 &gt; 3, so reject. The rule ignores everything after the cutoff (Z may earn a lot later), ignores discounting and risk, and the cutoff is ad hoc. So it can reject value-adding projects. Graham’s survey shows it is still widely used (simple, liquidity-constrained firms), but NPV is the better criterion."},
{ch:"Ch 8",t:"num",q:"Revenues 5,000; costs 3,200; depreciation 600; interest expense 400; tax rate 30%. What is the unlevered net income?",a:840,tol:.5,u:"",e:"Unlevered net income = (Revenues − Costs − Depreciation) × (1 − τc) = (5,000 − 3,200 − 600) × 0.7 = 1,200 × 0.7 = 840. Interest is left out because financing is judged separately (separation principle). Deducting it would give a levered number: (1,200 − 400) × 0.7 = 560."},
{ch:"Ch 8",t:"num",q:"Same project: unlevered net income 840, depreciation 600, capital expenditures 700, increase in net working capital 150. What is the free cash flow?",a:590,tol:.5,u:"",e:"FCF = UNI + Depreciation − CapEx − ΔNWC = 840 + 600 − 700 − 150 = 590. Depreciation is added back because it is a non-cash cost; CapEx is a cash outflow that is not an expense; a rise in NWC ties up cash, so it is subtracted."},
{ch:"Ch 8",t:"mc",q:"A firm already paid €50,000 for a market study. The project also uses an owned warehouse that could be rented out for €20,000 per year and reduces profits of an existing product by €30,000 per year. Which items are incremental?",o:["All three: each is linked to the project","Only the lost profit on the existing product","The lost rent and the lost profit, not the study","Only the study, since it was paid for the project"],a:2,e:"Incremental = with project − without. The lost rent is an opportunity cost (value of the warehouse in its best alternative use). The lost profit is cannibalization. The €50,000 study is a sunk cost: it is already paid and is the same with or without the project, so it is excluded."},
{ch:"Ch 8",t:"num",q:"Net working capital last year: receivables 80, inventory 60, payables 50. This year: receivables 110, inventory 75, payables 70. What is the cash flow related to NWC this year?",a:-25,tol:.01,u:"",e:"NWC = receivables + inventory − payables (cash needs ignored). Last year 80 + 60 − 50 = 90; this year 110 + 75 − 70 = 115. NWC rises by 25. An increase in NWC is cash tied up, so the cash flow is −25 (ΔNWC = +25 is subtracted in FCF)."},
{ch:"Ch 8",t:"num",q:"A machine costs €1.2 million and is depreciated straight-line over 4 years. The tax rate is 25%. What is the yearly depreciation tax shield (in €)?",a:75000,tol:1,u:"€",e:"Yearly depreciation = 1,200,000/4 = 300,000. Depreciation tax shield = τc × depreciation = 0.25 × 300,000 = 75,000. Depreciation is not a cash flow itself, but it lowers taxable profit, so the firm pays €75,000 less tax each year."},
{ch:"Ch 8",t:"num",q:"At the end of the project an asset with a book value of 0 is sold for €200,000. The tax rate is 30%. What is the after-tax cash flow from the sale (in €)?",a:140000,tol:1,u:"€",e:"Book value is 0, so the entire €200,000 is a taxable gain. Tax = 0.30 × 200,000 = 60,000. After-tax cash flow = 200,000 − 60,000 = 140,000 (the same as 200,000 × 0.7). Forgetting the tax gives 200,000."},
{ch:"Ch 8",t:"num",q:"A project requires €120 upfront and pays the same cash flow C at the end of each year forever. The cost of capital is 6%. What is the NPV break-even yearly cash flow?",a:7.2,tol:.01,u:"€",e:"Break-even means NPV = 0: 0 = −120 + C/0.06, so C = 120 × 0.06 = 7.2. Above €7.2 per year the project has a positive NPV; below it, negative. This is also the cash flow at which the IRR equals 6%."},
{ch:"Ch 8",t:"mc",q:"Why is interest expense left out when calculating a project’s free cash flow?",o:["Interest is not tax-deductible, so it does not affect the tax bill","The project is judged on its own, and financing costs are already in the discount rate (separation principle)","Interest is a sunk cost that is paid whether or not the project goes ahead","Interest is already included in the cost of goods sold of the project"],a:1,e:"Free cash flow is unlevered: it measures cash from operations and investment, not financing. The cost of financing is captured in the cost of capital used to discount, so deducting interest too would count it twice. Interest is generally tax-deductible (A is false) and it is not sunk (C is false)."}];

const EXAMS=[{id:"m2024",title:"Midterm 2024",kind:"past",note:"18 of the 20 questions of the 2024 paper, in the original order and wording. Two questions are left out because the screenshots do not show them fully: the De Fietsfabriek balance sheet question (no answer options visible) and the operating/net profit margin question (most of the income statement is cut off).",q:[
{ch:"Ch 5",t:"mc",q:"Consider the following two statements:<br>1. An annual percentage rate (APR) indicates the amount of simple interest earned in one year.<br>2. An Effective Annual Rate (EAR) indicates the amount of interest earned without the effect of compounding.",o:["Both statements are false","Statement 1 is true, statement 2 is false","Both statements are true","Statement 2 is true, statement 1 is false"],a:1,e:"Statement 1 is true: the APR is the periodic rate times the number of periods per year, so it ignores compounding (simple interest over one year). The EAR is the rate you actually earn after compounding, EAR = (1 + APR/k)^k − 1 (interest on interest). Statement 2 is false because it describes the APR, not the EAR: the EAR is exactly the rate <b>with</b> the effect of compounding. Whenever compounding happens more than once a year, EAR &gt; APR."},
{ch:"Ch 6",t:"mc",q:"A bond is trading above par. Which of the following statements is TRUE?",o:["The bond’s price is equal to the present value of the coupons of the bond.","The bond’s yield is lower than the risk-free rate.","The bond’s price is equal to the face value of the bond.","The bond’s yield is lower than the bond’s coupon rate."],a:3,e:"Price = PV of the coupons + PV of the face value, discounted at the yield. Above par means price &gt; face value, which happens when the coupon rate is higher than the yield to maturity: the bond pays more than the market requires, so investors bid its price up. A is false because the face value is also part of the price. B is false because the yield is not compared with the risk-free rate here (a risky bond’s yield is usually above it). C describes a bond trading AT par (yield = coupon rate)."},
{ch:"Ch 6",t:"mc",q:"The following table summarizes prices of various default-free zero-coupon bonds (expresses as a percentage of face value).<div class='scroll'><table><tr><th>Maturity (years)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Price (per $100 face value)</td><td>94.52</td><td>89.68</td><td>85.40</td><td>81.65</td><td>78.35</td></tr></table></div>What is the yield-to-maturity of the zero-coupon bond with 5 years to maturity closest to?",o:["5.0%","5.5%","4.0%","4.5%"],a:0,e:"For a zero-coupon bond: YTM = (Face/Price)^(1/n) − 1 = (100/78.35)^(1/5) − 1 = 1.2763^0.2 − 1 = 5.0%. Only the 5-year price is needed. Dividing the total gain by 5 without compounding gives (100/78.35 − 1)/5 = 5.5%, and using the wrong number of years gives the lower options."},
