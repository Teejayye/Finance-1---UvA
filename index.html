/b>; max error = <b>22.49%<\/b>."],"trap":["IRR > r does not guarantee NPV > 0."],"th":["npvrule","irr","irrrule"]},{"h":"Ch 7 · When the IRR rule fails","html":"<p>IRR works for stand-alone projects where <b>all negative cash flows come before the positive ones<\/b>: NPV is then a smoothly <b>decreasing<\/b> function of the discount rate. It can disagree with NPV in three cases:<\/p>\n<ul><li><b>Delayed investment<\/b> (benefits first, costs later). Book deal: +1,000,000 now, −500,000 at t = 1, 2, 3. NPV at 10% = −243,426 (reject), but IRR = 23.38% &gt; 10% (accept). NPV is <b>increasing<\/b> in r, so the rule is reversed.<\/li>\n<li><b>Multiple IRRs<\/b> (cash flows change sign more than once). Book deal plus: +550,000, −500,000 ×3, +1,000,000 at t = 4 has IRRs of 7.164% and 33.673%. NPV is negative between them, −10,413 at 10%: reject.<\/li>\n<li><b>No IRR<\/b>: NPV is always positive or always negative.<\/li><\/ul>\n<p>Most important lesson: <b>when in doubt, use NPV<\/b>.<\/p>","key":["HW3 Armstrong: +10m now, −6m at t = 1 and 2 at 10% → NPV = <b>−0.41m<\/b> (reject).","Book deal plus (Lecture 3a): IRRs 7.164% and 33.673%, NPV at 10% = −10,413."],"trap":["IRR rule works only when all negative cash flows come first.","Multiple sign changes → possibly multiple IRRs."],"th":["irrrule"]},{"h":"Ch 7 · Payback, ROCE and Graham (2022)","html":"<p><b>Payback period<\/b> = time to recover the initial investment. Accept if payback &lt; the <b>cutoff period<\/b>. Invest 120, receive 30 per year: payback 4 years, so reject with a 3-year cutoff. Invest 250, receive 35 per year: 250/35 = 7.14 years.<\/p>\n<p><b>Drawbacks:<\/b> ignores time value of money, cost of capital and risk; ignores cash flows after the payback period; the cutoff is ad hoc. <b>Why used:<\/b> simple, fine for projects with similar risk and timing, and for liquidity-constrained (often small) firms. <b>ROCE / accounting rate of return<\/b> = average annual accounting profit ÷ investment, accept if above a hurdle rate; it uses accounting data, no risk or time-value correction.<\/p>\n<p><b>Graham (2022) survey:<\/b> NPV and IRR are used by roughly 75–80% of firms, but payback is still used by a large share (roughly 60–65%, more in small firms), despite its shortcomings.<\/p>","key":["Payback ignores time value and later cash flows.","Graham (2022): NPV/IRR most used, payback still popular."],"trap":["Passing payback does not mean NPV > 0 (Seattle Corp, mock Q17)."],"th":["payback","graham"]},{"h":"Ch 7 · Choosing between projects, resource constraints","html":"<p><b>Mutually exclusive<\/b> (at most one project): choose the highest <b>NPV<\/b>. Highest IRR can mislead when projects differ in <b>scale<\/b> (500% on €1 vs 20% on €1 million), <b>timing<\/b> (50% return for 1 year vs 5 years: NPV 36.36 vs 371.51 at 10%) or <b>risk<\/b>. Book store (invest 300,000, 63,000 growing 3%, r = 8%): IRR 24%, NPV = 1,260,000 − 300,000 = 960,000. Coffee shop (400,000, 80,000): IRR 23%, NPV = 1,600,000 − 400,000 = 1,200,000. Choose the coffee shop.<\/p>\n<p><b>Resource constraints<\/b> (not all positive-NPV projects fit): (1) check every feasible combination and take the highest total NPV, or (2) <b>profitability index<\/b> PI = NPV / resource consumed, invest in the highest PI first. PI is fast but not always right. Budget 20: PI picks A+B+C (NPV 31.3) but A+B+D gives 34.<\/p>","key":["Mutually exclusive → highest NPV.","PI = NPV ÷ resource; rank highest first.","2024 Q11: PV = 23,130 → PI = 13,130/10,000 = <b>1.313<\/b>."],"trap":["PI is NPV/I, not PV/I.","Rank from highest PI, not lowest."],"th":["mutual","pi"]},{"h":"Ch 8 · Incremental earnings and unlevered net income","html":"<p><b>Incremental earnings<\/b> = earnings with the project − earnings without it. Items that are the same either way are ignored.<\/p>\n<ul><li><b>Include:<\/b> extra revenues and costs, depreciation, <b>opportunity costs<\/b> (value of a resource in its best alternative use, e.g. lost rent), <b>cannibalization<\/b> (lost sales of existing products), salvage and terminal value.<\/li>\n<li><b>Exclude:<\/b> <b>sunk costs<\/b> (paid regardless: past R&amp;D, a completed feasibility study), fixed overhead that does not change, and <b>interest<\/b> (financing is judged separately: separation principle).<\/li><\/ul>\n<p><b>Unlevered net income<\/b> = EBIT × (1 − τc) = (Revenues − Costs − Depreciation) × (1 − τc). HomeNet year 1: (26,000 − 11,000 − 2,800 − 1,500) × 0.6 = 6,420 ($000s). Cannibalization: 25% × 100,000 × $100 = $2.5m lost sales and 25% × 100,000 × $60 = $1.5m lost costs, net $1.0m pre-tax.<\/p>","key":["UNI = (Revenue − Costs − Depreciation)(1 − τ).","HW3 year 1: (1,850,000 − 1,038,000 − 417,500)(1 − 21%) = <b>€311,655<\/b>.","Include opportunity costs and cannibalisation; exclude sunk costs and interest."],"trap":["A completed feasibility study is sunk.","Use the marginal tax rate.","A bank loan and its interest are financing: ignore."],"th":["incremental","uni"]},{"h":"Ch 8 · Free cash flow, NWC and NPV","html":"<p>Profit ≠ cash flow. Corrections: credit sales and purchases (<b>ΔNWC<\/b>), depreciation (non-cash: add back, but it still saves tax = τc × depreciation, the <b>depreciation tax shield<\/b>), <b>CapEx<\/b> (cash out, not a cost). New loans and equity are financing and are ignored.<\/p>\n<p><b>FCF = UNI + Depreciation − CapEx − ΔNWC.<\/b> NWC = current assets − current liabilities = cash + inventory + receivables − payables. An increase in NWC is a cash outflow: NWC of 130 → 150 means −20. NWC is recovered at the end, so its cash flows sum to zero but still affect NPV through timing. Example: (2,400 − 900 − 480) × 0.75 + 480 − 600 − 120 = 525.<\/p>\n<p>HomeNet FCF: −16,500; 5,100; 7,200; 7,200; 7,200; 2,700. At 12%: NPV = $5,027 ($000s), IRR = 24.1%.<\/p>","key":["FCF = UNI + Dep − CapEx − ΔNWC. HW3 year 1: 311,655 + 417,500 − 198,000 = <b>€531,155<\/b>.","Nikola (mock): 290 + 160 − 110 − 20 = <b>320<\/b>. Bubba Ho-Tep (2018): 300 + 125 − 150 − 20 = <b>255<\/b>."],"trap":["Use the change in NWC.","FCF from net income: only works when there is no interest (otherwise start from EBIT)."],"th":["fcf"]},{"h":"Ch 8 · Analysing the project, two-stage valuation","html":"<p><b>Break-even analysis:<\/b> the input level where NPV = 0 (for the discount rate it is the IRR). Invest 50, 10 forever, r = 5%: NPV = 150, IRR = 10/50 = 20%, break-even investment = 200, break-even cash flow = 50 × 0.05 = 2.5. <b>Sensitivity analysis:<\/b> change one assumption at a time (best/worst case) to see which matters most. <b>Scenario analysis:<\/b> change several at once (e.g. price and volume together).<\/p>\n<p><b>Two-stage valuation:<\/b> dividends of $2 for 5 years, then growing 2% forever, r = 7%. Stage 1 is an annuity: 2/0.07 × (1 − 1/1.07⁵) = 8.20. Stage 2 is a growing perpetuity valued at t = 5: 2.04/(0.07 − 0.02) = 40.80, discounted: 40.80/1.07⁵ = 29.09. Price = 37.29.<\/p>","key":["Break-even tax (Canvas Ch 8 Q5): 25(1 − t)/0.08 = 200 → t = <b>36%<\/b>.","CCM/Amazon: 25/1.13 + 28/1.13² + 32/1.13³ + 37/1.13⁴ + [40/0.08]/1.13⁴ = <b>$395.6m<\/b>."],"trap":["TV = FCF<sub>N+1<\/sub>/(r − g) sits at t = N."],"th":["breakeven","terminal"]}]},{"title":"Not examined in the midterm","ch":"Ch 9+","secs":[{"h":"Outside the midterm scope","html":"<p>The midterm covers weeks 1–3: Ch 1–8 plus Hart &amp; Zingales (2017) and Graham (2022) (Lecture 3b, official slide). <b>Not examined<\/b> in the midterm: Ch 9 (valuing stocks), Ch 10–12 (risk &amp; return, portfolio theory, CAPM), capital structure (MM), working capital management (Ch 26–27). Some student-source Kahoot questions cover these: they are excluded here.<\/p><p>Within Ch 2, the ratio overview crosses out: gross, operating and EBIT margin, quick and cash ratio, equity multipliers, EV/EBIT, asset turnover, ROA, ROIC, EBITDA/interest coverage. The course also says 'check Canvas for which pages are not included' — that page was not uploaded, so finer exclusions inside chapters are unknown.<\/p>","key":[],"trap":[],"th":[]}]}],"G":[{"t":"Sole proprietorship","d":"One owner who is also the manager; personal liability.","ch":"Ch 1"},{"t":"Partnership","d":"Several owners, all personally liable (VOF, maatschap).","ch":"Ch 1"},{"t":"Limited liability","d":"Shareholders lose at most their investment, not the firm’s debts.","ch":"Ch 1"},{"t":"Shareholder value","d":"The value of the firm’s shares; the standard objective of the corporation.","ch":"Ch 1"},{"t":"Residual claimant","d":"Shareholders are paid last, after creditors.","ch":"Ch 1"},{"t":"Agency problem","d":"Managers pursue their own interests instead of the shareholders’.","ch":"Ch 1"},{"t":"Externality","d":"A cost or benefit to others that is not priced (e.g. pollution).","ch":"Ch 1"},{"t":"Bid-ask spread","d":"Ask price minus bid price; the market maker’s profit.","ch":"Ch 1"},{"t":"EBIT","d":"Earnings before interest and taxes = operating income + other income.","ch":"Ch 2"},{"t":"Market capitalization","d":"Share price × number of shares = market value of equity.","ch":"Ch 2"},{"t":"Market-to-book ratio","d":"Market value of equity ÷ book value of equity.","ch":"Ch 2"},{"t":"Enterprise value","d":"Market cap + debt − cash; market value of operating assets.","ch":"Ch 2"},{"t":"Net working capital","d":"Current assets − current liabilities.","ch":"Ch 2"},{"t":"Free cash flow","d":"Unlevered net income + depreciation − capex − increase in NWC.","ch":"Ch 2"},{"t":"Depreciation tax shield","d":"Tax saved because depreciation is deductible: tax rate × depreciation.","ch":"Ch 8"},{"t":"Discount factor","d":"1/(1+r): converts a future cash flow into present value.","ch":"Ch 3"},{"t":"NPV","d":"PV of all cash flows including the initial investment.","ch":"Ch 3"},{"t":"Arbitrage","d":"Risk-free profit with no net investment.","ch":"Ch 3"},{"t":"Law of one price","d":"Equivalent assets in competitive markets trade at the same price.","ch":"Ch 3"},{"t":"Value additivity","d":"Price of a bundle = sum of the prices of its components.","ch":"Ch 3"},{"t":"Separation principle","d":"Securities trades have NPV 0, so investment and financing decisions are separate.","ch":"Ch 3"},{"t":"Amoral drift","d":"Hart & Zingales: takeovers push companies toward ignoring externalities.","ch":"Ch 1"},{"t":"Time value of money","d":"A positive interest rate makes money now worth more than the same amount later.","ch":"Ch 4"},{"t":"Compounding","d":"Moving a cash flow forward in time: FV = C × (1+r)^n.","ch":"Ch 4"},{"t":"Discounting","d":"Moving a cash flow backward in time: PV = C / (1+r)^n.","ch":"Ch 4"},{"t":"Perpetuity","d":"Constant cash flow C forever; PV = C/r.","ch":"Ch 4"},{"t":"Growing perpetuity","d":"Cash flow growing at g forever; PV = C/(r − g), needs g &lt; r.","ch":"Ch 4"},{"t":"Annuity","d":"Constant cash flow for a limited number of periods.","ch":"Ch 4"},{"t":"Early / late annuity","d":"First payment before (time 0) or after (time 2) the normal time 1; multiply or divide the PV by (1+r).","ch":"Ch 4"},{"t":"IRR","d":"Interest rate that makes the NPV of the cash flows zero.","ch":"Ch 4"},{"t":"Amortizing (annuity) loan","d":"Equal periodic payments, each with interest and repayment; fully repaid at time N.","ch":"Ch 5"},{"t":"Fair loan","d":"Loan balance equals the PV of the loan payments.","ch":"Ch 5"},{"t":"APR","d":"Simple annual rate without compounding; 1% a month = 12% APR.","ch":"Ch 5"},{"t":"EAR","d":"Annual rate including compounding: (1 + APR/k)^k − 1.","ch":"Ch 5"},{"t":"Nominal vs real rate","d":"Nominal includes inflation; real is corrected for it: (1+r) = (1+rr)(1+i).","ch":"Ch 5"},{"t":"Term structure","d":"The relationship between investment term and interest rate.","ch":"Ch 5"},{"t":"Yield curve","d":"Graph of the term structure; inverted when short rates exceed long rates.","ch":"Ch 5"},{"t":"Opportunity cost of capital","d":"Best expected return on an investment of comparable risk and term; the discount rate.","ch":"Ch 5"},{"t":"Face value (par)","d":"Amount repaid to the bondholder at maturity.","ch":"Ch 6"},{"t":"Coupon rate","d":"Sets the coupon payment (rate × face value); not a discount rate.","ch":"Ch 6"},{"t":"Zero-coupon bond","d":"Bond with one payment, the face value at maturity; trades at a discount.","ch":"Ch 6"},{"t":"Yield to maturity (YTM)","d":"IRR of a bond’s promised cash flows; quoted as an APR.","ch":"Ch 6"},{"t":"Discount / par / premium bond","d":"Price below / equal to / above face value.","ch":"Ch 6"},{"t":"Interest rate risk","d":"Bond prices fall when rates rise, more so for long maturities.","ch":"Ch 6"},{"t":"Yield spread","d":"Corporate bond yield minus Treasury yield (credit or default spread).","ch":"Ch 6"},{"t":"Junk bond","d":"Speculative-grade bond rated below BBB (Baa).","ch":"Ch 6"},{"t":"Clean / dirty price","d":"Clean is the quoted price; dirty = clean + accrued interest.","ch":"Ch 6"},{"t":"Capital budgeting","d":"Deciding which investment projects (capital expenditures) a firm should accept.","ch":"Ch 7"},{"t":"NPV rule","d":"Accept projects with NPV &gt; 0; among alternatives take the highest NPV.","ch":"Ch 7"},{"t":"Internal rate of return (IRR)","d":"The discount rate that makes NPV = 0; accept if IRR &gt; cost of capital (only reliable for normal projects).","ch":"Ch 7"},{"t":"Delayed investment","d":"Benefits come before costs; NPV rises with r and the IRR rule gives the wrong answer.","ch":"Ch 7"},{"t":"Multiple IRRs","d":"Several discount rates give NPV = 0 when cash flows change sign more than once.","ch":"Ch 7"},{"t":"Payback period","d":"Years needed to recover the initial investment; accept if below the cutoff.","ch":"Ch 7"},{"t":"Cutoff period","d":"The pre-set maximum payback time.","ch":"Ch 7"},{"t":"ROCE / accounting rate of return","d":"Average annual accounting profit ÷ investment; compared with a hurdle rate.","ch":"Ch 7"},{"t":"Mutually exclusive projects","d":"At most one project can be chosen.","ch":"Ch 7"},{"t":"Profitability index","d":"NPV ÷ resources consumed; a quick way to pick projects under a resource constraint.","ch":"Ch 7"},{"t":"Incremental earnings","d":"Earnings with the project minus earnings without it.","ch":"Ch 8"},{"t":"Cannibalization","d":"Sales of the new product displace sales of an existing product.","ch":"Ch 8"},{"t":"Opportunity cost","d":"Value a resource would have provided in its best alternative use.","ch":"Ch 8"},{"t":"Sunk cost","d":"A cost paid regardless of the decision; never included.","ch":"Ch 8"},{"t":"Unlevered net income","d":"EBIT × (1 − τc), ignoring interest.","ch":"Ch 8"},{"t":"Free cash flow (FCF)","d":"UNI + depreciation − CapEx − ΔNWC: incremental cash available to financiers.","ch":"Ch 8"},{"t":"Net working capital (NWC)","d":"Current assets − current liabilities; an increase is a cash outflow.","ch":"Ch 8"},{"t":"Break-even analysis","d":"Finding the input level at which NPV = 0.","ch":"Ch 8"},{"t":"Sensitivity analysis","d":"Varying one assumption to see the effect on NPV.","ch":"Ch 8"},{"t":"Scenario analysis","d":"Varying several assumptions at the same time.","ch":"Ch 8"},{"t":"Continuation (terminal) value","d":"Value of cash flows after the explicit forecast period, e.g. a growing perpetuity at the end.","ch":"Ch 8"},{"t":"Corporation (NV)","d":"A legal entity separate from its owners; owners have limited liability; shares can be traded.","ch":"Ch 1"},{"t":"Limited liability company (BV)","d":"Firm whose owners have limited liability but whose shares are not traded on an exchange.","ch":"Ch 1"},{"t":"Limited partnership","d":"Partnership with at least one general partner (unlimited liability) and limited partners who can only lose their investment.","ch":"Ch 1"},{"t":"Double taxation","d":"Corporate profits are taxed at the firm level and again as dividend income: effective rate 1 − (1 − τc)(1 − τi).","ch":"Ch 1"},{"t":"Board of directors","d":"Elected by shareholders to monitor and hire/fire management.","ch":"Ch 1"},{"t":"Hostile takeover","d":"Acquisition against management's wishes; the threat disciplines managers when the share price is low.","ch":"Ch 1"},{"t":"Public vs private company","d":"Public: shares listed on an exchange (liquid). Private: no listed shares.","ch":"Ch 1"},{"t":"Market maker","d":"Trader who buys at the bid and sells at the ask, providing liquidity.","ch":"Ch 1"},{"t":"Liquidity","d":"How quickly an asset can be sold at a fair price.","ch":"Ch 1"},{"t":"Balance sheet","d":"Snapshot of assets, liabilities and equity at a point in time (book values).","ch":"Ch 2"},{"t":"Income statement","d":"Revenues and expenses over a period, ending in net income.","ch":"Ch 2"},{"t":"Book value of equity","d":"Total assets minus total liabilities on the balance sheet.","ch":"Ch 2"},{"t":"EPS","d":"Earnings per share = net income ÷ shares outstanding.","ch":"Ch 2"},{"t":"P/E ratio","d":"Share price ÷ EPS (= market cap ÷ net income).","ch":"Ch 2"},{"t":"Growth stock / value stock","d":"High market-to-book (growth) vs low market-to-book (value).","ch":"Ch 2"},{"t":"Interest-bearing debt","d":"Loans and bonds on which interest is paid (notes payable, long-term debt, current portion of LTD); excludes accounts payable.","ch":"Ch 2"},{"t":"Current ratio","d":"Current assets ÷ current liabilities (on the formula sheet).","ch":"Ch 2"},{"t":"Debt-to-capital ratio","d":"Total debt ÷ (total equity + total debt) (on the formula sheet).","ch":"Ch 2"},{"t":"Return on equity (ROE)","d":"Net income ÷ book value of equity (on the formula sheet).","ch":"Ch 2"},{"t":"Accounts receivable days","d":"Accounts receivable ÷ average daily sales (on the formula sheet).","ch":"Ch 2"},{"t":"Inventory days","d":"Inventory ÷ average daily COGS (on the formula sheet).","ch":"Ch 2"},{"t":"Accounts payable days","d":"Accounts payable ÷ average daily COGS (on the formula sheet).","ch":"Ch 2"},{"t":"EBITDA","d":"EBIT + depreciation and amortisation.","ch":"Ch 2"},{"t":"Competitive market","d":"Market where goods can be bought and sold at the same price.","ch":"Ch 3"},{"t":"Short sale","d":"Selling a security you do not own by borrowing it; you buy it back later.","ch":"Ch 3"},{"t":"No-arbitrage price","d":"The price that rules out arbitrage = PV of the security's cash flows.","ch":"Ch 3"},{"t":"Normal market","d":"A competitive market without arbitrage opportunities.","ch":"Ch 3"},{"t":"Risk premium","d":"Extra return investors require for bearing risk.","ch":"Ch 3"},{"t":"ETF","d":"Exchange traded fund: one security representing a portfolio of stocks.","ch":"Ch 3"},{"t":"Timeline","d":"Diagram placing each cash flow at its date; the first tool for any TVM question.","ch":"Ch 4"},{"t":"Growing annuity","d":"N cash flows growing at rate g, the first at t = 1.","ch":"Ch 4"},{"t":"Annuity due","d":"Annuity whose first payment is today (t = 0): PV = ordinary annuity × (1 + r).","ch":"Ch 4"},{"t":"Future value of an annuity","d":"Value at the time of the last payment: PV × (1 + r)^N.","ch":"Ch 4"},{"t":"Effective rate per period","d":"Actual return over one period including compounding; the only rate you may discount with.","ch":"Ch 5"},{"t":"Compounding frequency (k)","d":"Number of compounding periods per year (2, 4, 12, 52, 365).","ch":"Ch 5"},{"t":"Inverted yield curve","d":"Short-term rates above long-term rates; signals expected rate cuts and possible recession.","ch":"Ch 5"},{"t":"Inflation","d":"General rise in prices; reduces the purchasing power of money.","ch":"Ch 5"},{"t":"Coupon","d":"Regular interest payment of a bond = coupon rate × face value ÷ payments per year.","ch":"Ch 6"},{"t":"Maturity date","d":"Date the face value is repaid.","ch":"Ch 6"},{"t":"Default (credit) risk","d":"Risk that the issuer does not pay the promised cash flows.","ch":"Ch 6"},{"t":"Investment grade","d":"Bond rating BBB (Baa) or higher.","ch":"Ch 6"},{"t":"Duration","d":"Sensitivity of a bond's price to interest-rate changes; higher for longer, low-coupon bonds.","ch":"Ch 6"},{"t":"Treasury securities","d":"Government bonds considered (default) risk-free.","ch":"Ch 6"},{"t":"Hurdle rate","d":"Minimum return a project must earn; often set above the cost of capital in practice (Graham).","ch":"Ch 7"},{"t":"NPV profile","d":"Graph of NPV against the discount rate; crosses zero at the IRR.","ch":"Ch 7"},{"t":"Incremental IRR","d":"IRR of the difference in cash flows between two projects.","ch":"Ch 7"},{"t":"Resource constraint","d":"Limited budget, space or staff that prevents taking all positive-NPV projects.","ch":"Ch 7"},{"t":"Externality (project)","d":"Indirect effect of a project on the rest of the firm (e.g. cannibalisation).","ch":"Ch 8"},{"t":"Fixed overhead","d":"Costs not attributable to one activity; only incremental overhead counts.","ch":"Ch 8"},{"t":"Marginal tax rate","d":"Tax rate on the next euro of income; used in capital budgeting (not the average rate).","ch":"Ch 8"},{"t":"Salvage value","d":"Proceeds from selling project assets at the end.","ch":"Ch 8"},{"t":"Tax loss carryforward","d":"Past losses that reduce future taxes, raising future FCF.","ch":"Ch 8"},{"t":"CapEx","d":"Capital expenditures: cash spent on fixed assets (not an expense in the income statement).","ch":"Ch 8"},{"t":"Straight-line depreciation","d":"Equal yearly depreciation = (cost − salvage) ÷ useful life.","ch":"Ch 8"}],"FOCUS":[["Annuities (incl. growing, delayed, FV, savings)","Ch 4",4,"2018 Q3 (savings), Mock midterm Q9 (house deposit), 2024 Q15 (car loan), 'Exam bundle' Q7 (mortgage), Canvas mastery Annuities Q1–Q6, Kahoot (Aston Martin), HW2 Q1"],["APR / EAR conversions, matching the period","Ch 5",4,"2018 Q4, 2024 Q1 &amp; Q7, Mock Q10–Q11, Canvas mastery Interest rates (4 quizzes), Kahoot Q5, HW2"],["Bond pricing, YTM, premium/discount/par","Ch 6",4,"2018 Q10 &amp; Q13, 2024 Q2, Q3, Q12, 'Exam bundle' Q3, Mock Q13, Canvas mastery Bonds (6 quizzes), HW2 Q3"],["NPV / IRR rules and when IRR fails","Ch 7",4,"2018 Q11, Q14, Q15; 2024 Q16–Q17; 'Exam bundle' Q1 &amp; Q5; Mock Q14–Q16; HW3 Q1; Lecture 3a book deal"],["Free cash flow &amp; unlevered net income","Ch 8",4,"2018 Q17–Q18, 2024 Q6, Q10, Q13; 'Exam bundle' Q2; Mock Q18–Q19; HW3 Q3; Canvas Ch 8"],["Arbitrage, law of one price, replicating portfolios","Ch 3",3,"2018 Q1, Q6; 2024 Q14; Mock Q4–Q5; Canvas Ch 3 Q4; HW1 Q4; Lecture 2b bond arbitrage"],["Market value, EV, MTB, P/E, ratios","Ch 2",3,"2018 Q7–Q9 (Tesla), 2024 Fietsfabriek + margin Qs, 'Exam bundle' Q9 (Luther), Mock Q2–Q3, Canvas Ch 2, HW1 Q2"],["Corporation types, liability, goal of the firm, agency","Ch 1",3,"2018 Q5, 2024 Q8–Q9, 'Exam bundle' Q4, Mock Q1, Canvas Ch 1, HW1 Q1"],["Payback period and profitability index","Ch 7",3,"2018 Q12, 2024 Q5 &amp; Q11, Mock Q17, Canvas Ch 7 Q1 &amp; Q5"],["Incremental cash flow rules (sunk, opportunity, overhead)","Ch 8",3,"2024 Q18, Canvas Ch 8 Q4, Kahoot week 3, HW3 Q4"],["Term structure / yield curve, real rates","Ch 5",3,"'Exam bundle' Q6 &amp; Q8, Mock Q10, Canvas Ch 5 Q2, HW2 Q2"],["Double taxation","Ch 1",2,"Canvas Ch 1 Q3; textbook Ch 1 (not seen in past midterms)"],["Credit risk, yield vs expected return","Ch 6",3,"2018 Q16, Mock Q12, Canvas Ch 6 Q6, Bond exam Qs 2, HW2 Q3"],["Interest-rate risk / duration","Ch 6",2,"Canvas Ch 6 Q5, HW2 Q3 (IN CLASS), Bond basics"],["Break-even / sensitivity analysis","Ch 8",2,"Canvas Ch 8 Q5, video 'NPV break-even', Lecture 3b"],["Two-stage / terminal value valuation","Ch 8",3,"2018 Q18, Mock Q19, Canvas Ch 8 Q2"],["Hart &amp; Zingales (2017)","Ch 1",2,"Official midterm scope (Lecture 3b); no past-exam question seen; 2024 Q9 (welfare vs value) relates"],["Graham (2022) survey","Ch 7",1,"Official midterm scope (Lecture 3b); appears in the NPV/IRR/payback video; no past-exam question seen"],["Working capital days, ROE, current ratio","Ch 2",2,"On the formula sheet; Pearson A1 Q7 (EBITDA/interest); not seen in past midterms"],["Bid-ask spread, liquidity, short sales","Ch 1/3",2,"Pearson A1 Q3–Q4, Kahoot Ch 3, Mock Q5"],["Stock valuation, CAPM, risk &amp; return, MM","Ch 9–12",0,"Final exam only (Lecture 1a course outline; midterm = weeks 1–3)"],["Crossed-out ratios (margins except net, quick/cash, ROA, ROIC, EV/EBIT…)","Ch 2",0,"Ratio overview screenshot: crossed out"]],"Q":{"cv1_1":{"id":"cv1_1","ch":"Ch 1","type":"mc","q":"Which of the following statements is true?","opts":["1. If firm A makes more profit than firm B then firm A has a higher market value.","2. The objective of the corporation is to maximize profit.","3. All businesses are organised as corporations.","4. When the firm goes bankrupt, equity holders do not have a priority claim."],"ans":3,"why":["Market value depends on timing and risk of all future cash flows, not this year's profit.","The book's objective is maximising shareholder value, not profit.","Sole proprietorships and partnerships exist too.","Correct: equity holders are residual claimants, paid after creditors."],"steps":"Go through each statement against the definitions of Ch 1. Only the residual-claimant statement holds.","th":["goal","firmtypes"],"case":null,"keep":true,"model":null,"src":"cv1","msrc":"official","pts":1,"srcl":"Canvas · 1. Practice quiz Ch 1 The Firm"},"cv1_2":{"id":"cv1_2","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>Statement I: Firms that have as their objective to maximize shareholder value will automatically maximize their contribution to society.<br>Statement II: Firms that have as their objective to reduce layoffs (firing employees) to a minimum will automatically generate the highest market value of their equity.","opts":["Both statements are correct.","Both statements are incorrect.","First statement is correct, while the second one is incorrect.","First statement is incorrect, while the second one is correct."],"ans":1,"why":["Both fail: see the other options.","Correct: externalities break I; minimising layoffs is not value maximisation (II).","I is false: externalities (pollution) are not in shareholder value.","II is false: keeping unneeded staff lowers value."],"steps":"I: shareholder value ignores externalities that are not priced or regulated (Lecture 1a 'Issues with maximizing shareholder value due to externalities'). II: the goal that maximises equity value is shareholder value itself, not any other objective.","th":["goal","hz"],"case":null,"keep":true,"model":null,"src":"cv1","msrc":"official","pts":1,"srcl":"Canvas · 1. Practice quiz Ch 1 The Firm"},"cv1_3":{"id":"cv1_3","ch":"Ch 1","type":"mc","q":"Corporations face a system of double taxation. Consider corporation DEF that earns $2 per share before taxes. After it has paid taxes, it will distribute the remainder of its earnings to its shareholders as a dividend. The dividend is income to shareholders so they need to pay taxes on these earnings. The corporate tax rate is 18% and the tax rate on dividend income is 12%. What is the effective tax rate for shareholders on their share of the corporation's earnings closest to?","opts":["18.2%","20.2%","27.8%","30%"],"ans":2,"why":["Close to the corporate rate alone.","No valid combination of the rates.","Correct: 1 − 0.82 × 0.88.","Adds the two rates (12% is charged on the remainder only)."],"steps":"After corporate tax: 2 × (1 − 0.18) = 1.64. After dividend tax: 1.64 × (1 − 0.12) = 1.4432. Total tax = 2 − 1.4432 = 0.5568 → 0.5568/2 = <b>27.8%<\/b>.","th":["doubletax"],"case":null,"keep":false,"model":null,"src":"cv1","msrc":"official","pts":1,"srcl":"Canvas · 1. Practice quiz Ch 1 The Firm"},"cv1_4":{"id":"cv1_4","ch":"Ch 1","type":"mc","q":"Is the following statement true or false?<br>When a corporation goes bankrupt the assets of the firm are liquidated.","opts":["True","False"],"ans":1,"why":null,"steps":"Bankruptcy does not automatically mean liquidation: the firm can be reorganised and continue, with control passing to creditors.","th":["firmtypes"],"case":null,"keep":true,"model":null,"src":"cv1","msrc":"official","pts":1,"srcl":"Canvas · 1. Practice quiz Ch 1 The Firm"},"cv2_1":{"id":"cv2_1","ch":"Ch 2","type":"mc","q":"What was the change in Chaindrinkers’ Enterprise value?","opts":["$750 mln","$1.2 bln","$975 mln","$950 mln"],"ans":0,"why":["Correct: 3,200 − 2,450.","No valid route: e.g. adds debt and cash changes the wrong way.","Change in market cap (ignores debt and cash).","Adds cash instead of subtracting it."],"steps":"EV = market cap + interest-bearing debt − cash.<br>2016: 100 × 24 = 2,400 + 650 − 600 = 2,450.<br>2017: 125 × 27 = 3,375 + 525 − 700 = 3,200.<br>Change = <b>$750 mln<\/b>.","th":["ev"],"case":"chain","keep":false,"model":null,"src":"cv2","msrc":"official","pts":1,"srcl":"Canvas · 2. Practice quiz Ch 2 Financial statement analysis"},"cv2_2":{"id":"cv2_2","ch":"Ch 2","type":"mc","q":"What was the change in Chaindrinkers’ market-to-book (MTB) ratio (rounded to two digits)?","opts":["0.97","0.91","1.04","0.84"],"ans":0,"why":["Correct: 3.97 − 3.00.","Rounding/division error.","Uses the wrong equity figures.","Uses book equity of the wrong year."],"steps":"MTB 2016 = 2,400/800 = 3.00. MTB 2017 = 3,375/850 = 3.97. Change = <b>0.97<\/b>.","th":["bookmarket"],"case":"chain","keep":false,"model":null,"src":"cv2","msrc":"official","pts":1,"srcl":"Canvas · 2. Practice quiz Ch 2 Financial statement analysis"},"cv2_3":{"id":"cv2_3","ch":"Ch 2","type":"mc","q":"A company that has a market to book ratio below 1 has asset market values that are below historical cost (less any depreciation).","opts":["True","False"],"ans":0,"why":null,"steps":"MTB &lt; 1: investors value the equity below its book value, i.e. the assets are worth less in the market than their depreciated historical cost.","th":["bookmarket"],"case":null,"keep":true,"model":null,"src":"cv2","msrc":"official","pts":1,"srcl":"Canvas · 2. Practice quiz Ch 2 Financial statement analysis"},"cv2_4":{"id":"cv2_4","ch":"Ch 2","type":"mc","q":"Is the following statement true or false?<br>Capital expenditures are costs related to the depreciation of fixed assets.","opts":["True","False"],"ans":1,"why":null,"steps":"CapEx is cash spent on buying fixed assets; depreciation is the accounting cost that spreads that purchase over time.","th":["profitcash","fcf"],"case":null,"keep":true,"model":null,"src":"cv2","msrc":"official","pts":1,"srcl":"Canvas · 2. Practice quiz Ch 2 Financial statement analysis"},"cv3_1":{"id":"cv3_1","ch":"Ch 3","type":"mc","q":"Consider an investor who is risk-averse and uses a discount rate of 4%.<br>Which of the following investments does the investor prefer?<br>A. Receive $100 in one year.<br>B. Receive $96.15 today.<br>C. Reveive $20 today and $78 in one year.","opts":["Investment A","Investment B","Investment C","He is indifferent between investment A and B."],"ans":3,"why":["Same PV as B (96.15).","Same PV as A.","PV = 20 + 78/1.04 = 95.00, lowest.","Correct: 100/1.04 = 96.15 = B."],"steps":"Compare PVs at 4%: A = 100/1.04 = 96.15; B = 96.15; C = 20 + 75.00 = 95.00. A and B are equal → indifferent. (Risk aversion is already in the discount rate.)","th":["valuation","riskaverse"],"case":null,"keep":true,"model":null,"src":"cv3","msrc":"official","pts":1,"srcl":"Canvas · 3. Practice quiz Ch 3 Financial markets"},"cv3_2":{"id":"cv3_2","ch":"Ch 3","type":"num","q":"Your firm needs to buy a new $200,000 car. As part of a promotion deal, the car dealer has offered to let you pay $100,000 today, $25,000 next year and the final $75,000 after 2 years. Suppose the current risk-free interest rate is 4% and that the promotion deal has no risk.<br>What is the PV of what you save by taking the promotion deal instead of paying $200,000 upfront?<br>Round your answer to whole dollars.","blanks":[{"l":"Savings ($)","a":6620,"tol":2,"u":""}],"steps":"PV deal = 100,000 + 25,000/1.04 + 75,000/1.04² = 100,000 + 24,038.46 + 69,341.72 = 193,380.18. Savings = 200,000 − 193,380.18 = <b>$6,620<\/b>.","th":["valuation","timetravel"],"case":null,"model":null,"pts":1,"src":"cv3","msrc":"official","srcl":"Canvas · 3. Practice quiz Ch 3 Financial markets"},"cv3_3":{"id":"cv3_3","ch":"Ch 3","type":"mc","q":"An arbitrage opportunity has a positive NPV even if you are trading in risky assets.","opts":["True","False"],"ans":0,"why":null,"steps":"Arbitrage = profit today with no risk and no net investment, so its NPV is positive by definition (the risks of the assets cancel in the hedge).","th":["arbitrage"],"case":null,"keep":true,"model":null,"src":"cv3","msrc":"official","pts":1,"srcl":"Canvas · 3. Practice quiz Ch 3 Financial markets"},"cv3_4":{"id":"cv3_4","ch":"Ch 3","type":"num","q":"Consider the information below. What is the no-arbitrage price for security C? Round your answer to whole dollars.","blanks":[{"l":"Price of C ($)","a":3200,"tol":0,"u":""}],"steps":"Good economy: C pays 840 = 1 × A. Bad economy: C pays 4,200 = 5 × B. So C = 1A + 5B → price = 200 + 5 × 600 = <b>$3,200<\/b>.","th":["replicate","arbitrage"],"case":"cv3abc","model":null,"pts":1,"src":"cv3","msrc":"official","srcl":"Canvas · 3. Practice quiz Ch 3 Financial markets"},"cv4_1":{"id":"cv4_1","ch":"Ch 4","type":"mc","q":"A company is considering an investment opportunity that requires an investment of $1,000,000 today and will provide $250,000 one year from now, $450,000 two years from now, and $650,000 three years from now. The appropriate discount rate is 10% per year. What is the NPV of this opportunity closest to? Numbers between brackets indicate negative amounts.","opts":["($88,000)","$88,000","$300,000","$1,300,000"],"ans":1,"why":["Sign error.","Correct.","Undiscounted sum minus investment.","Undiscounted inflows."],"steps":"NPV = −1,000,000 + 250,000/1.1 + 450,000/1.21 + 650,000/1.331 = −1,000,000 + 227,273 + 371,901 + 488,355 = <b>+$87,528 ≈ $88,000<\/b>.","th":["npvrule","timetravel"],"case":null,"keep":true,"model":null,"src":"cv4","msrc":"official","pts":1,"srcl":"Canvas · 4. Practice quiz Ch 4 Time value of money"},"cv4_2":{"id":"cv4_2","ch":"Ch 4","type":"mc","q":"To calculate the present value of a growing perpetuity you can use the formula: PV = C / (r-g).<br>Consider the following two statements:<br>In order to make this formula work the discount rate needs to be higher than the growth rate.<br>In order to make this formula work the growth rate needs to be positive.","opts":["Both statements are correct.","Both statements are incorrect.","First statement is correct, while the second one is incorrect.","First statement is incorrect, while the second one is correct."],"ans":2,"why":["g may be negative.","r > g is required.","Correct.","Reversed."],"steps":"r &gt; g is needed (otherwise the sum is infinite/negative). g can be zero or negative (declining cash flows).","th":["perpetuity"],"case":null,"keep":true,"model":null,"src":"cv4","msrc":"official","pts":1,"srcl":"Canvas · 4. Practice quiz Ch 4 Time value of money"},"cv4_3":{"id":"cv4_3","ch":"Ch 4","type":"mc","q":"Is the following formula appropriate for determining the present value of a set of $10 cash flows to be received at the end of each of the years 2, 3, 4 and 5 when the discount rate is 6% per year?<br>PV = 10*(1/0,06)*(1-1/(1.06)^4)","opts":["Yes","No"],"ans":1,"why":["The formula values the stream at t = 1, not t = 0.","Correct: divide by 1.06 once more."],"steps":"The annuity formula gives the value one period before the first payment: here t = 1. Discount one more year: ÷ 1.06.","th":["timing","annuity"],"case":null,"keep":true,"model":null,"src":"cv4","msrc":"official","pts":1,"srcl":"Canvas · 4. Practice quiz Ch 4 Time value of money"},"cv4_4":{"id":"cv4_4","ch":"Ch 4","type":"num","q":"Consider a project that has an initial investment of $200 and a one time cash flow of $300 in 3 years.<br>What is the internal rate of return of this project? Give your answer as a percentage and round to two decimals.","blanks":[{"l":"IRR (%)","a":14.47,"tol":0.01,"u":""}],"steps":"0 = −200 + 300/(1 + IRR)³ → IRR = (300/200)<sup>1/3<\/sup> − 1 = 1.1447 − 1 = <b>14.47%<\/b>. The same IRR holds for 200m → 300m: IRR says nothing about size.","th":["irr"],"case":null,"model":null,"pts":1,"src":"cv4","msrc":"official","srcl":"Canvas · 4. Practice quiz Ch 4 Time value of money"},"cv5_1":{"id":"cv5_1","ch":"Ch 5","type":"mc","q":"Consider the four investments below. Which investment offers the lowest effective rate of return?","opts":["Investment A","Investment B","Investment C","Investment D"],"ans":0,"why":["Correct: EAR 6.25%.","EAR ≈ 6.29%.","EAR ≈ 6.27%.","EAR ≈ 6.29%."],"steps":"EAR = (1 + APR/k)<sup>k<\/sup> − 1. A 6.250%; B (1 + 0.061/365)<sup>365<\/sup> − 1 = 6.289%; C (1 + 0.06125/4)<sup>4<\/sup> − 1 = 6.267%; D (1 + 0.0612/12)<sup>12<\/sup> − 1 = 6.295%. Lowest: <b>A<\/b>.","th":["apr_ear"],"case":"cv5inv","keep":true,"model":null,"src":"cv5","msrc":"official","pts":1,"srcl":"Canvas · 5. Practice quiz Ch 5 Interest rates"},"cv5_2":{"id":"cv5_2","ch":"Ch 5","type":"mc","q":"In the year 2008, the average 1-year Treasury rate was about 1.82% and the rate of inflation was about 0.28%. What was the real interest rate in 2008?","opts":["2.100%","1.540%","1.536%","1.280%"],"ans":2,"why":["Adds inflation.","Approximation r − i.","Correct: exact formula.","No valid route."],"steps":"1 + r<sub>real<\/sub> = 1.0182/1.0028 = 1.01536 → <b>1.536%<\/b>.","th":["realrate"],"case":null,"keep":false,"model":null,"src":"cv5","msrc":"official","pts":1,"srcl":"Canvas · 5. Practice quiz Ch 5 Interest rates"},"cv5_3":{"id":"cv5_3","ch":"Ch 5","type":"mc","q":"Consider the following two statements.<br>1. For a risk-free project, the opportunity cost of capital will typically be greater than the yield to maturity of U.S. Treasury securities with a similar term.<br>2. The opportunity cost of capital is the highest available expected return offered in the market.","opts":["Both statements are correct.","Both statements are incorrect.","First statement is correct, while the second one is incorrect.","First statement is incorrect, while the second one is correct."],"ans":1,"why":["Neither holds.","Correct.","1 is false: a risk-free project's cost of capital equals the Treasury yield.","2 is false: it is the best return on investments of comparable risk."],"steps":"1: risk-free project → discount at the risk-free (Treasury) rate of the same term, not higher. 2: 'highest available' ignores risk; it must be comparable risk and term.","th":["oppcost"],"case":null,"keep":true,"model":null,"src":"cv5","msrc":"official","pts":1,"srcl":"Canvas · 5. Practice quiz Ch 5 Interest rates"},"cv5_4":{"id":"cv5_4","ch":"Ch 5","type":"num","q":"A company has just taken a $400,000 amortizing loan with constant end of year payments. The duration of the loan is 3 years and the interest rate is 6% per year.<br>Make a table that indicates for each of the three years the: yearly payments ($), interest paid ($), repayment ($), beginning of year outstanding loan balance ($), end of year outstanding loan balance ($).<br>What is the interest paid in the second year? Round your answer to the nearest dollar.","blanks":[{"l":"Interest year 2 ($)","a":16461,"tol":2,"u":""}],"steps":"Payment: 400,000 = C/0.06 × (1 − 1.06<sup>−3<\/sup>) → C = 149,644.<br>Year 1: interest 24,000; repayment 125,644; end balance 274,356.<br>Year 2: interest = 6% × 274,356 = <b>16,461<\/b>; repayment 133,183; end balance 141,173.<br>Year 3: interest 8,470; repayment 141,173; end 0.","th":["loan"],"case":null,"model":null,"pts":1,"src":"cv5","msrc":"official","srcl":"Canvas · 5. Practice quiz Ch 5 Interest rates"},"cv6_1":{"id":"cv6_1","ch":"Ch 6","type":"num","q":"The German government issued a bond with a face value of €1000, annual coupon rate of 6% and 20 years maturity. At issuance, the bond’s yield to maturity was 5%.<br>What is the price of this bond at issuance? Round your answer to whole dollars.","blanks":[{"l":"Price","a":1125,"tol":1,"u":""}],"steps":"Coupon = 60. P = 60/0.05 × (1 − 1.05<sup>−20<\/sup>) + 1000/1.05<sup>20<\/sup> = 747.73 + 376.89 = <b>1,124.62 ≈ 1,125<\/b>. Premium bond (coupon 6% &gt; YTM 5%).","th":["ytm"],"case":null,"model":null,"pts":1,"src":"cv6","msrc":"official","srcl":"Canvas · 6. Practice quiz Ch 6 Bonds"},"cv6_2":{"id":"cv6_2","ch":"Ch 6","type":"mc","q":"Consider the following zero-coupon yields on default-free securities. A 2-year default-free security with a face value of $1000 and an annual coupon rate of 4% will trade:","opts":["at a premium.","at par.","at a discount.","There is insufficient information provided to answer this question."],"ans":2,"why":["Coupon below yields → below face.","Only if coupon = yield.","Correct.","The yields are enough to price it."],"steps":"Coupon 4% is below both yields (5.8%, 5.5%), so the YTM (a weighted average of them) exceeds the coupon rate → price below face. Check: 40/1.058 + 1040/1.055² = 37.81 + 934.40 = 972.2 &lt; 1000.","th":["ytm","yieldcurve"],"case":"cv6yc","keep":true,"model":null,"src":"cv6","msrc":"official","pts":1,"srcl":"Canvas · 6. Practice quiz Ch 6 Bonds"},"cv6_3":{"id":"cv6_3","ch":"Ch 6","type":"mc","q":"Which of the following statements is false?","opts":["The price of a discount bond is expected to rise reaching maturity.","The price of a premium bond is expected to fall reaching maturity.","A premium bond is a better bond to buy than a discount bond.","The yield of a premium bond can be higher or lower than that of a discount bond."],"ans":2,"why":["True: pulls up to par.","True: pulls down to par.","False (the answer): fairly priced bonds have NPV 0 whatever their premium.","True: yields depend on maturity and risk too."],"steps":"Both bonds are priced at the market yield, so buying either has NPV 0: neither is 'better'.","th":["ytm"],"case":null,"keep":false,"model":null,"src":"cv6","msrc":"official","pts":1,"srcl":"Canvas · 6. Practice quiz Ch 6 Bonds"},"cv6_4":{"id":"cv6_4","ch":"Ch 6","type":"mc","q":"Consider a zero-coupon bond with a $1000 face value and 4 years left until maturity that currently trades at $684. What is the yield to maturity on this bond closest to?","opts":["7.51%","8.41%.","9.96%","10.4%"],"ans":2,"why":["Too low.","Too low.","Correct.","Too high."],"steps":"YTM = (1000/684)<sup>1/4<\/sup> − 1 = 1.4620<sup>0.25<\/sup> − 1 = <b>9.96%<\/b>.","th":["ytm"],"case":null,"keep":false,"model":null,"src":"cv6","msrc":"official","pts":1,"srcl":"Canvas · 6. Practice quiz Ch 6 Bonds"},"cv6_5":{"id":"cv6_5","ch":"Ch 6","type":"mc","q":"What can be said about the prices of a 2-year zero-coupon bond and a 30-year zero-coupon bond if interest rates increase?","opts":["The price of the 2-year zero-coupon bond will go up by the same amount as the 30-year zero-coupon bond.","The law of one price predicts that both bond prices will not change.","The 2-year zero-coupon has a lower duration and hence its price will increase more than the price of the 30-year zero-coupon bond.","The 30 year zero-coupon bond has a higher duration so its price will drop more than the price of the 2-year zero-coupon bond."],"ans":3,"why":["Prices fall, not rise.","Prices respond to rates.","Prices fall; the long bond falls more.","Correct."],"steps":"Rates up → prices down; longer maturity = higher duration = bigger drop.","th":["ratechange"],"case":null,"keep":false,"model":null,"src":"cv6","msrc":"official","pts":1,"srcl":"Canvas · 6. Practice quiz Ch 6 Bonds"},"cv6_6":{"id":"cv6_6","ch":"Ch 6","type":"mc","q":"Consider the following two statements.<br>1. The yield of a B rated bond is lower than that of an A rated bond.<br>2. The cash flows of a two year risk-free coupon bond can be replicated by a combination of one year and two year risk-free zero coupon bonds.","opts":["Both statements are correct.","Both statements are incorrect.","First statement is correct, while the second one is incorrect.","First statement is incorrect, while the second one is correct."],"ans":3,"why":["1 is false.","2 is true.","Reversed.","Correct."],"steps":"1: lower rating → more default risk → higher yield. 2: a coupon bond = portfolio of zeros.","th":["credit","bondarb"],"case":null,"keep":true,"model":null,"src":"cv6","msrc":"official","pts":1,"srcl":"Canvas · 6. Practice quiz Ch 6 Bonds"},"cv7_1":{"id":"cv7_1","ch":"Ch 7","type":"mc","q":"A firm is considering the three projects below. Which projects should the firm accept according to the payback period rule if the firm uses a cutoff period of 3 years plus 1 day?","opts":["A and B","A and C","Only C","Only A"],"ans":1,"why":["B recovers only 210 by year 3.","Correct.","A also pays back (210 ≥ 200 by year 3).","C also pays back within 2 years."],"steps":"Cumulative: A 100, 150, 210 → back in year 3 ✓. B 210, 210, 210 → not back by year 3 ✗. C 80, 280 → back in year 2 ✓. Accept <b>A and C<\/b>.","th":["payback"],"case":"cv7pb","keep":false,"model":null,"src":"cv7","msrc":"official","pts":1,"srcl":"Canvas · 7. Practice quiz Ch 7 Investment decision rules"},"cv7_2":{"id":"cv7_2","ch":"Ch 7","type":"mc","q":"Is the following statement true or false?<br>If the IRR of a project is larger than the discount rate, the NPV of the project is positive.","opts":["True","False"],"ans":1,"why":null,"steps":"Only for standard cash flows (negative first). For delayed investments or multiple IRRs the conclusion can fail.","th":["irrrule"],"case":null,"keep":true,"model":null,"src":"cv7","msrc":"official","pts":1,"srcl":"Canvas · 7. Practice quiz Ch 7 Investment decision rules"},"cv7_3":{"id":"cv7_3","ch":"Ch 7","type":"num","q":"Calculate the NPV for each project. What is the NPV of the project with the highest NPV? Round your answer to two decimals.","blanks":[{"l":"Highest NPV ($)","a":387.5,"tol":0.5,"u":""}],"steps":"A: −300 + 100/1.04 + 100/1.04² + 100/1.04³ = −22.49.<br>B: −500 + 70/(0.06 − 0.02) × (1 − (1.02/1.06)<sup>10<\/sup>) = 58.81.<br>C: −900 + 25 + 25 × 1.01/(0.03 − 0.01) = <b>387.50<\/b> (first CF at t = 0).<br>D: −300 + 125/0.05 × (1 − 1.05<sup>−6<\/sup>)/1.05 = 304.25.","th":["perpetuity","timing","annuity"],"case":"cv7four","model":null,"pts":1,"src":"cv7","msrc":"official","srcl":"Canvas · 7. Practice quiz Ch 7 Investment decision rules"},"cv7_4":{"id":"cv7_4","ch":"Ch 7","type":"mc","q":"Richard evaluated a capital budgeting project (a new machine needed to manufacture inventory) using his firm’s required rate of return and found that the project’s net present value (NPV) is negative. Based on this information, which of the following must be correct?","opts":["The project’s internal rate of return is also negative.","The project’s payback period is longer than the economic life of the machine.","The project’s payback period is longer than the maximum payback period (cutoff period) that the firm has established.","None of the above is correct."],"ans":3,"why":["IRR can be positive but below r.","Undiscounted cash flows may still recover the cost.","Payback ignores discounting; no link.","Correct."],"steps":"NPV &lt; 0 only says the IRR (if standard) is below r; nothing forces a negative IRR or a long payback.","th":["npvrule","payback"],"case":null,"keep":true,"model":null,"src":"cv7","msrc":"official","pts":1,"srcl":"Canvas · 7. Practice quiz Ch 7 Investment decision rules"},"cv7_5":{"id":"cv7_5","ch":"Ch 7","type":"mc","q":"Which tool is most accurate when deciding which of multiple projects to invest in given resource constraints?","opts":["Profitability index","NPV","IRR","Profit"],"ans":1,"why":["PI is a fast heuristic that can fail with indivisible projects or several constraints.","Correct per the official key: checking combinations by total NPV is always right.","IRR ignores scale.","Profit ignores timing and risk."],"steps":"Official key: NPV. Rationale: the PI ranking is a shortcut; the exact answer is the combination with the highest total NPV.","th":["pi","npvrule"],"case":null,"keep":true,"model":null,"note":"Official answer is NPV. Lecture 3b presents PI as the practical tool for a single constraint, but the quiz key treats total NPV of combinations as the most accurate.","src":"cv7","msrc":"official","pts":1,"srcl":"Canvas · 7. Practice quiz Ch 7 Investment decision rules"},"cv8_1":{"id":"cv8_1","ch":"Ch 8","type":"num","q":"CATCH Inc. currently sells 10,000 products per year with a unit price of $129. It is considering lowering its price to $99 to increase annual sales to 12,000. The cost of goods sold per unit are $44. In addition the firm has $25,000 in annual depreciation and its administrative costs are $8,000 per year.<br>What is the incremental impact of this price drop on the firm's EBIT closest to? Round your answer to whole dollars.","blanks":[{"l":"Incremental EBIT ($)","a":-190000,"tol":0,"u":""}],"steps":"Without cut: 1,290,000 − 440,000 − 25,000 − 8,000 = 817,000. With cut: 1,188,000 − 528,000 − 25,000 − 8,000 = 627,000. Incremental = <b>−$190,000<\/b>. (Depreciation and admin are unchanged: they cancel.)","th":["incremental"],"case":null,"model":null,"pts":1,"src":"cv8","msrc":"official","srcl":"Canvas · 8. Practice quiz Ch 8 Capital budgeting"},"cv8_2":{"id":"cv8_2","ch":"Ch 8","type":"mc","q":"Conundrum Mining is expected to generate the following free cash flows over the next four years.<br>Year 1: $12 million<br>Year 2: $18 million<br>Year 3: $22 million<br>Year 4: $26 million<br>After year 4 the free cash flows are expected to grow at a rate of 5% per year forever. The weighted average cost of capital for Conundrum is 12% and the firm has cash of $80 million, debt of $60 million, and 30 million shares outstanding. What is the current share price of Conundrum mining?","opts":["$10.84","$13.72","$16.16","$16.25"],"ans":0,"why":["Correct.","Terminal value timing or cash/debt error.","Terminal value not discounted correctly.","Other timing error."],"steps":"TV<sub>4<\/sub> = 26 × 1.05/(0.12 − 0.05) = 390. PV = 12/1.12 + 18/1.12² + 22/1.12³ + (26 + 390)/1.12⁴ = 10.71 + 14.35 + 15.66 + 264.38 = 305.1. Equity = 305.1 + 80 − 60 = 325.1 → /30 = <b>$10.84<\/b>.","th":["terminal","ev"],"case":null,"keep":false,"model":null,"src":"cv8","msrc":"official","pts":1,"srcl":"Canvas · 8. Practice quiz Ch 8 Capital budgeting"},"cv8_3":{"id":"cv8_3","ch":"Ch 8","type":"num","q":"Calculate the free cash flows of this project in each year. What is the free cash flow of this project in year 2? Give your answer in whole dollars.","blanks":[{"l":"FCF year 2 ($)","a":9500,"tol":0,"u":""}],"steps":"Year 2: UNI = 18 × 0.75 = 13.5; FCF = 13.5 + 20 − 2 − 22 = 9.5 (thousand) = <b>$9,500<\/b>. (Year 1: 7.5 + 20 − 4 − 15 = 8.5.) Sales are not needed since EBIT is given.","th":["fcf","uni"],"case":"cv8x","model":null,"pts":1,"src":"cv8","msrc":"official","srcl":"Canvas · 8. Practice quiz Ch 8 Capital budgeting"},"cv8_4":{"id":"cv8_4","ch":"Ch 8","type":"mc","q":"Consider the following two statements:<br>Statement I: The unlevered net income of a project is always lower than the free cash flow used in capital budgeting.<br>Statement II: If for a project a firm uses a warehouse that it already owns, then the maintenance costs of this warehouse should not be included in the calculation of free cash flows.","opts":["Both statements are correct.","Both statements are incorrect.","First statement is correct, while the second one is incorrect.","First statement is incorrect, while the second one is correct."],"ans":3,"why":["I is false.","II is true per the key.","Reversed.","Correct."],"steps":"I: FCF = UNI + Dep − CapEx − ΔNWC; with large CapEx or NWC increases FCF is below UNI. II: the warehouse is maintained anyway, so the maintenance is not incremental.","th":["fcf","incremental"],"case":null,"keep":true,"model":null,"src":"cv8","msrc":"official","pts":1,"srcl":"Canvas · 8. Practice quiz Ch 8 Capital budgeting"},"cv8_5":{"id":"cv8_5","ch":"Ch 8","type":"mc","q":"A firm is considering investing in a project with initial investment $200 which generates an EBIT of $25 at the end of each year forever. The project has no depreciation, no capital expenditures (other than the initial investment) and requires no investments in working capital. The firm uses a discount rate of 8%. The firm currently faces a profit tax rate of 21% but is worried the tax rate will increase and make the project unattractive.<br>What is the NPV break-even level of profit tax rate for this project?","opts":["36%","25%","21%","19%"],"ans":0,"why":["Correct.","Too low: NPV still positive.","Current rate, NPV &gt; 0.","Below current rate."],"steps":"NPV = −200 + 25(1 − t)/0.08 = 0 → 25(1 − t) = 16 → 1 − t = 0.64 → t = <b>36%<\/b>.","th":["breakeven"],"case":null,"keep":false,"model":null,"src":"cv8","msrc":"official","pts":1,"srcl":"Canvas · 8. Practice quiz Ch 8 Capital budgeting"},"cvm_1":{"id":"cvm_1","ch":"Ch 1","type":"mc","q":"Consider the following two statements:<br>In case of bankruptcy, shareholders’ claims are subordinate to creditors’ claims.<br>Shares of public corporations are generally more liquid than shares of private corporations.","opts":["Only statement 1 is true.","Only statement 2 is true.","Both statements are true.","Both statements are false."],"ans":2,"why":["2 is also true.","1 is also true.","Correct.","Both hold."],"steps":"1: residual claimants come last. 2: listed shares trade on an exchange → more liquid.","th":["firmtypes"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_2":{"id":"cvm_2","ch":"Ch 2","type":"num","q":"In 2021, Eiffel Corp. had a book value of equity of $215 billion, 10.5 billion shares outstanding, and a market price of $39.90 per share. Eiffel also had cash of $20 billion and total debt of $145 billion of which $132 billion was interest-bearing. Eiffel's book value of debt was equal to its market value of debt.<br>What was Eiffel’s Enterprise Value in 2021 closest to?<br>Enter your answer in billions of dollars rounded to two decimals and without the dollar sign. So if your answer is $10.352 billion, then enter 10.35.","blanks":[{"l":"EV ($ bn)","a":530.95,"tol":1,"u":""}],"steps":"Market cap = 10.5 × 39.90 = 418.95. EV = 418.95 + 132 (interest-bearing only) − 20 = <b>530.95<\/b>. Book equity (215) is a distractor; 145 would be wrong.","th":["ev"],"case":null,"model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_3":{"id":"cvm_3","ch":"Ch 2","type":"mc","q":"Consider the following two statements regarding 2016.<br>1. Tesla's MTB ratio was less than 6.<br>2. Tesla's price-earnings ratio was more than 20.","opts":["Only statement 1 is true.","Only statement 2 is true.","Both statements are true.","Both statements are false."],"ans":1,"why":["MTB = 6.97 > 6.","Correct.","1 is false.","2 is true (41.4)."],"steps":"Market cap = 155 × 213.69 = 33,122. MTB = 33,122/4,753 = 6.97 (not &lt; 6). P/E = 33,122/800 = 41.4 (&gt; 20).","th":["bookmarket","ratios"],"case":"tesla16","keep":true,"model":null,"note":"The source table's totals do not add up (22,664 vs 21,879): it is an excerpt; use stockholders' equity 4,753.","src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_4":{"id":"cvm_4","ch":"Ch 3","type":"mc","q":"Assume the current risk-free interest rate is 10%. Consider a risk-free security that pays cash flows of $50 in one year, $75 in two years, and $300 in three years and that has a current market price of $333.<br>What should an arbitrageur do as part of their strategy?","opts":["Buy this security as it is relatively cheap.","There is no point in trading this security as the price is fair.","Short-sell this security as it is relatively expensive.","Buy and short-sell this security to make a profit."],"ans":2,"why":["It is expensive, not cheap.","333 > 332.83.","Correct.","You do one side, hedged with the risk-free asset."],"steps":"PV = 50/1.1 + 75/1.21 + 300/1.331 = 45.45 + 61.98 + 225.39 = 332.83 &lt; 333 → overpriced → short-sell it (and invest the proceeds risk-free).","th":["arbitrage"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_5":{"id":"cvm_5","ch":"Ch 3","type":"mc","q":"Consider the following two statements<br>1. An arbitrage opportunity has a positive NPV.<br>2. Selling a security that you do not own but borrow from another individual is called a long sale.","opts":["Only statement 1 is true.","Only statement 2 is true.","Both statements are true.","Both statements are false."],"ans":0,"why":["Correct.","It is a short sale.","2 is false.","1 is true."],"steps":"2 describes a short sale.","th":["arbitrage"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_6":{"id":"cvm_6","ch":"Ch 4","type":"num","q":"A consumer wants to buy a new car which costs $150,000 if paid upfront. The dealer offers a promotion deal where the consumer pays $50,000 today, $50,000 next year, and $50,000 in two years. Suppose the current risk-free interest rate is 5% per year and that this promotion deal has no risk.<br>What is the amount of money that this consumer saves if they take the promotion deal, expressed in dollars today?<br>Round your answer to whole dollars and enter it without the dollar sign.","blanks":[{"l":"Savings ($)","a":7029,"tol":1,"u":""}],"steps":"PV deal = 50,000 + 50,000/1.05 + 50,000/1.05² = 142,971. Savings = 150,000 − 142,971 = <b>$7,029<\/b>.","th":["valuation"],"case":null,"model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_7":{"id":"cvm_7","ch":"Ch 4","type":"mc","q":"Consider the following two statements:<br>1. In the present value of a perpetuity formula PV = C/(r-g) the yearly cash flow needs to be the same in all years.<br>2. The present value of €100 received in one year becomes lower when the risk of this cash flow increases.","opts":["Only statement 1 is true.","Only statement 2 is true.","Both statements are true.","Both statements are false."],"ans":1,"why":["1 is false: it grows at g.","Correct.","1 is false.","2 is true."],"steps":"1: the growing perpetuity has cash flows growing at g. 2: higher risk → higher discount rate → lower PV.","th":["perpetuity","riskaverse"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_8":{"id":"cvm_8","ch":"Ch 4","type":"num","q":"A security generates a yearly cash flow lasting forever. The first cash flow is €5,000 and occurs today after which the yearly cash flow is growing at 1% per year. Assume the discount rate is equal to 4% per year.<br>What is the current value of this security?<br>Round your answer to whole euro's and enter it without the euro sign.","blanks":[{"l":"Value (€)","a":173333,"tol":10,"u":""}],"steps":"First CF today is not discounted. Next CF (t = 1) = 5,000 × 1.01. Value = 5,000 + 5,050/(0.04 − 0.01) = <b>€173,333<\/b> (= 5,000/0.03 × 1.04).","th":["perpetuity","timing"],"case":null,"model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_9":{"id":"cvm_9","ch":"Ch 4","type":"mc","q":"Suppose you want to buy a house 7 years from now. You know that the price at that time will be equal to €200,000. You plan on opening a savings account for this purpose, into which you deposit a fixed number of euros at the end of each year, including the year you buy the house. The annual interest rate is 3%.<br>How much is the yearly deposit into the savings account?<br>Round your answer to whole euro's and enter it without the euro sign.","opts":["€26,101","€28,571","€162,618","€31,772"],"ans":0,"why":["Correct.","200,000/7: ignores interest.","PV of the house (200,000/1.03⁷).","PV-annuity formula on 200,000 (loan payment, not savings)."],"steps":"FV annuity: 200,000 = C × (1.03⁷ − 1)/0.03 = C × 7.6625 → C = <b>€26,101<\/b>.","th":["fv_annuity"],"case":null,"keep":false,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_10":{"id":"cvm_10","ch":"Ch 5","type":"mc","q":"Consider the following statements.<br>1. The present value of €100 received in one year is lower with daily compounding of interest than with monthly compounding, when using the same APR.<br>2. The yield curve indicates the discount rate for cash flows of different risk levels.","opts":["Only statement 1 is true.","Only statement 2 is true.","Both statements are true","Both statements are false"],"ans":0,"why":["Correct.","2 is false.","2 is false.","1 is true."],"steps":"1: same APR, daily → higher EAR → lower PV. 2: the yield curve is about maturities (risk-free), not risk levels.","th":["apr_ear","yieldcurve"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_11":{"id":"cvm_11","ch":"Ch 5","type":"mc","q":"Royal Dutch Shell can choose 3 different investments:<br>Investment A has an APR of 5.75% and uses annual compounding.<br>Investment B has an APR of 6% and uses daily compounding with 360 days per year.<br>Investment C has an APR of 6.125% and uses quarterly compounding.<br>What are the effective annual interest rates of these investments?","opts":["Investment A: 5.75%, investment B: 6% and investment C: 6.125%","Investment A: 5.75%, investment B: 6.125% and investment C: 6.267%","Investment A: 5.75%, investment B: 6.125% and investment C: 6.183%","Investment A: 5.75%, investment B: 6.183% and investment C: 6.267%"],"ans":3,"why":["These are the APRs.","B wrong.","B and C wrong.","Correct."],"steps":"B: (1 + 0.06/360)<sup>360<\/sup> − 1 = 6.183%. C: (1 + 0.06125/4)<sup>4<\/sup> − 1 = 6.267%.","th":["apr_ear"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_12":{"id":"cvm_12","ch":"Ch 6","type":"mc","q":"Which of the following statements is false?","opts":["Credit risk is incorporated in the expected return of a bond.","In absence of credit risk, the yield to maturity equals the expected return of a bond.","The yield to maturity of a bond is the return that investors expect on the bond.","The credit spread refers to the difference between the yield on corporate bonds and the yield on Treasury bonds."],"ans":2,"why":["True.","True.","False (the answer) when there is default risk.","True."],"steps":"YTM uses promised cash flows; with default risk expected return &lt; YTM.","th":["credit"],"case":null,"keep":false,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_13":{"id":"cvm_13","ch":"Ch 6","type":"num","q":"Assume zero-coupon yields on default-free securities are as summarized in the table below. Consider a three-year, default-free bond with annual coupon payments and a face value of $1000 that is currently trading at $950.<br>What is the coupon rate (%) of this bond?<br>Enter your answer as a percentage with 2 decimal places using a decimal point. So if your answer is 22.143% then enter 22.14.","blanks":[{"l":"Coupon rate (%)","a":2.67,"tol":0.02,"u":""}],"steps":"950 = CPN × (1/1.04 + 1/1.043² + 1/1.045³) + 1000/1.045³ = CPN × 2.757 + 876.30 → CPN = 26.73 → coupon rate = <b>2.67%<\/b>.","th":["ytm","yieldcurve"],"case":"ytm5","model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_14":{"id":"cvm_14","ch":"Ch 7","type":"mc","q":"Ricky calculates the IRR for a project and finds that it is larger than the cost of capital. What conclusion about the project can be drawn?","opts":["The NPV is positive","The NPV is negative","The NPV slopes downward for higher costs of capital","Not enough information to conclude any of the above"],"ans":3,"why":["Only for standard cash flows.","Possible for delayed investments, not certain.","Depends on the cash flow pattern.","Correct."],"steps":"Without the cash flow pattern you cannot tell whether the IRR rule applies.","th":["irrrule"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_15":{"id":"cvm_15","ch":"Ch 7","type":"num","q":"The expected cash flows of project Y in years are as follows:<br>T=0: -100<br>T=1: 80<br>T=2: Unknown<br>The IRR of project Y is 38% and the discount rate is 10%.<br>What is the expected cash flow in year 2 for project Y closest to?<br>Enter the number using two decimal places with a decimal point as separator.","blanks":[{"l":"CF year 2","a":80.04,"tol":0.1,"u":""}],"steps":"At the IRR NPV = 0: −100 + 80/1.38 + X/1.38² = 0 → X = (100 − 57.97) × 1.9044 = <b>80.04<\/b>. The 10% is a distractor.","th":["irr"],"case":null,"model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_16":{"id":"cvm_16","ch":"Ch 7","type":"mc","q":"What is the appropriate discount rate used in the NPV method when valuing a risky project?","opts":["Opportunity cost of capital","Internal rate of return","Risk-free rate","None of the above"],"ans":0,"why":["Correct.","IRR is an output.","Only for risk-free projects.","A is correct."],"steps":"Discount at the expected return on alternatives of the same risk.","th":["oppcost","npvrule"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_17":{"id":"cvm_17","ch":"Ch 7","type":"mc","q":"The Seattle Corporation has been presented with an investment opportunity that will yield the following end of year cash flows:<br>$30,000 per year in years 1 and 2<br>$50,000 per year in years 3 and 4.<br>This investment today for this project is $150,000.<br>The firm uses a cost of capital of 10% per year and requires projects to pay back within 5 years.<br>Which of the following statements is true.<br>1. The project will be accepted according to the NPV rule.<br>2. The project will be accepted according to the payback period rule.","opts":["Only statement 1 is true.","Only statement 2 is true.","Both statements are true.","Both statements are false."],"ans":1,"why":["NPV is negative.","Correct.","NPV rejects.","Payback accepts."],"steps":"NPV = −150,000 + 30,000/1.1 + 30,000/1.21 + 50,000/1.331 + 50,000/1.4641 = −26,217 &lt; 0. Cumulative: 30, 60, 110, 160 ≥ 150 by year 4 ≤ 5 → payback accepts.","th":["payback","npvrule"],"case":null,"keep":true,"model":null,"src":"cvmock","msrc":"official","pts":1,"srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_18":{"id":"cvm_18","ch":"Ch 8","type":"num","q":"For the most recent fiscal year Nikola Corporation reported an EBIT of $580 million taxed at a tax rate of 50%. The firm had depreciation expenses of $160 million and capital expenditures of $110 million. Although they had no interest expense, the firm did have an increase in net working capital of $20 million.<br>What is Nikola’s free cash flow for the most recent fiscal year in millions of dollars?<br>Give your answer in millions of dollars and round to whole millions and enter it without the dollar sign. So if you calculated $123.456 million then enter 123.","blanks":[{"l":"FCF ($ m)","a":320,"tol":1,"u":""}],"steps":"UNI = 580 × 0.5 = 290. FCF = 290 + 160 − 110 − 20 = <b>320<\/b>.","th":["fcf"],"case":null,"model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"cvm_19":{"id":"cvm_19","ch":"Ch 8","type":"num","q":"You expect Amazon Inc. to generate the following free cash flows over the next five years. After year five you estimate that Amazon's free cash flows will grow at 5% per year forever. The appropriate discount rate is 13%.<br>What is the present value of the free cash flows of Amazon?<br>Give your answer in millions of dollars and round to whole millions and enter it without the dollar sign. So if you calculated $123.456 million then enter 123.","blanks":[{"l":"PV ($ m)","a":396,"tol":2,"u":""}],"steps":"Perpetuity starting with the year-5 CF: 40/(0.13 − 0.05) = 500, valued at t = 4. PV = 25/1.13 + 28/1.13² + 32/1.13³ + 37/1.13⁴ + 500/1.13⁴ = 22.12 + 21.93 + 22.18 + 22.69 + 306.65 = <b>395.58 ≈ 396<\/b>.","th":["terminal","timing"],"case":"amazon","model":null,"pts":1,"src":"cvmock","msrc":"official","srcl":"Canvas · Mock Midterm Finance 1 (official)"},"ir1_1":{"id":"ir1_1","ch":"Ch 5","type":"num","q":"Formula: 1 + EAR = (1 + APR/k)<sup>k<\/sup>. If a loan has an APR with semi-annual compounding, what k is used in this formula?","blanks":[{"l":"k","a":2,"tol":0,"u":""}],"steps":"Two semi-annual periods per year.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest rates"},"ir1_2":{"id":"ir1_2","ch":"Ch 5","type":"num","q":"Formula: 1 + EAR = (1 + APR/k)<sup>k<\/sup>. If a loan has an APR with monthly compounding, what k is used in this formula?","blanks":[{"l":"k","a":12,"tol":0,"u":""}],"steps":"Twelve months per year.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest rates"},"ir1_3":{"id":"ir1_3","ch":"Ch 5","type":"num","q":"Formula: 1 + EAR = (1 + APR/k)<sup>k<\/sup>. A loan has an APR of 6.5% with weekly compounding. What is the effective interest rate per week? Enter the percentage as a fraction with four decimals so for 6.12% you would enter 0.0612. Note: you do not need to calculate the EAR.","blanks":[{"l":"Weekly rate (fraction)","a":0.0013,"tol":0.0001,"u":""}],"steps":"k = 52: 6.5%/52 = 0.125% = <b>0.00125 → 0.0013<\/b>.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest rates"},"ir1_4":{"id":"ir1_4","ch":"Ch 5","type":"num","q":"A loan has an APR of 8.2% with monthly compounding. What is the effective interest rate per month? Enter the percentage as a fraction with four decimals so for 6.12% you would enter 0.0612.","blanks":[{"l":"Monthly rate (fraction)","a":0.0068,"tol":0.0001,"u":""}],"steps":"8.2%/12 = 0.6833% = <b>0.0068<\/b>.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest rates"},"ir1_5":{"id":"ir1_5","ch":"Ch 5","type":"num","q":"Formula: 1 + EAR = (1 + APR/k)<sup>k<\/sup>. A loan has an APR of 3% with quarterly compounding. What is the effective annual rate of this loan? Enter the percentage as a fraction with four decimals.","blanks":[{"l":"EAR (fraction)","a":0.0303,"tol":0.0001,"u":""}],"steps":"(1 + 0.03/4)⁴ − 1 = <b>0.0303<\/b>.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest rates"},"ir1_6":{"id":"ir1_6","ch":"Ch 5","type":"num","q":"Formula: 1 + EAR = (1 + APR/k)<sup>k<\/sup>. A loan has an APR of 8.2% with monthly compounding. What is the effective annual rate of this loan? Enter the percentage as a fraction.","blanks":[{"l":"EAR (fraction)","a":0.0852,"tol":0.0002,"u":""}],"steps":"(1 + 0.082/12)<sup>12<\/sup> − 1 = 1.006833<sup>12<\/sup> − 1 = <b>0.0852<\/b>.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest rates"},"ir1_7":{"id":"ir1_7","ch":"Ch 5","type":"mc","q":"Formula: 1 + EAR = (1 + APR/k)<sup>k<\/sup>. If a loan has an APR with annual compounding its EAR is equal to its APR.","opts":["True","False"],"ans":0,"why":null,"steps":"k = 1 → EAR = APR.","th":["apr_ear"],"case":null,"keep":true,"model":null,"src":"cvir","msrc":"official","pts":1,"srcl":"Canvas · Mastery path: Interest rates"},"ir2_1":{"id":"ir2_1","ch":"Ch 5","type":"num","q":"If the effective interest rate is 2% per month, what is the equivalent effective annual rate? Enter the percentage as a fraction with four decimals.","blanks":[{"l":"EAR (fraction)","a":0.2682,"tol":0.001,"u":""}],"steps":"1.02<sup>12<\/sup> − 1 = <b>0.2682<\/b>.","th":["apr_ear"],"case":null,"model":null,"pts":1,"src":"cvir","msrc":"official","srcl":"Canvas · Mastery path: Interest ra e life.","Advantages: Limited liability, liquidity, separation of ownership and control.","Advantages: Limited liability, liquidity, infinite life."],"ans":[0,3],"why":["Correct: both are drawbacks (tax twice; agency problems).","Infinite life is an advantage.","Separation of ownership and control is a drawback (agency).","Correct."],"steps":"Advantages: limited liability, liquidity (tradable shares), infinite life. Disadvantages: double taxation, separation of ownership and control.","th":["firmtypes","doubletax","agency"],"case":null,"keep":true,"src":"pe1","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_2":{"id":"pe1_2","ch":"Ch 1","type":"multi","q":"Corporate managers work for the owners of the corporation. Consequently, they should make decisions that are in the interests of the owners, rather than their own. What strategies are available to shareholders to help ensure that managers are motivated to act this way? Shareholders can do the following: (Select all the choices that apply.)","opts":["Ensure that employees are paid a percentage of the company's net income.","Write contracts that ensure that the interests of the managers and shareholders are closely aligned.","Ensure that employees are paid with company stock and/or stock options.","Mount hostile takeovers.","Ensure that underperforming managers are fired."],"ans":[1,2,3,4],"why":["Not in the key: pay tied to profit (not value) can reward short-termism.","Correct.","Correct.","Correct.","Correct."],"steps":"Mechanisms: contracts aligning interests, equity-based pay, takeover threat, firing underperformers.","th":["agency"],"case":null,"keep":true,"src":"pe1","msrc":"official","pts":1,"srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_3":{"id":"pe1_3","ch":"Ch 1","type":"num","q":"Explain why the bid-ask spread is a transaction cost. Fill in: Investors always buy at the [1] and sell at the [2]. Since [3] prices always exceed [4] prices, investors \"lose\" this difference. (Enter 1 for ask, 2 for bid.)","blanks":[{"l":"[1] (1 = ask, 2 = bid)","a":1,"tol":0,"u":""},{"l":"[2]","a":2,"tol":0,"u":""},{"l":"[3]","a":1,"tol":0,"u":""},{"l":"[4]","a":2,"tol":0,"u":""}],"steps":"Buy at the <b>ask<\/b>, sell at the <b>bid<\/b>; ask &gt; bid, so a round trip loses the spread, which market makers earn.","th":["bidask"],"case":null,"model":null,"pts":1,"note":"Original is a drop-down question; coded here as 1 = ask, 2 = bid. You got 0.4/1 (swapped ask and bid).","src":"pe1","msrc":"official","srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_4":{"id":"pe1_4","ch":"Ch 1","type":"num","q":"The following quote on Tesla stock appeared on June 29, 2022, on Barchart.com [quote image: bid $674.62, ask $674.99]. If you wanted to buy Tesla, what price would you pay? How much would you receive if you wanted to sell Tesla?","blanks":[{"l":"Buy at ($)","a":674.99,"tol":0.001,"u":""},{"l":"Sell for ($)","a":674.62,"tol":0.001,"u":""}],"steps":"Buy at the ask (674.99), sell at the bid (674.62).","th":["bidask"],"case":null,"model":null,"pts":2,"note":"[The original quote image was not captured; bid/ask filled in from the official answer.]","src":"pe1","msrc":"official","srcl":"Pearson MyLab · Assignment 1 – Week 1 (Ch 1, 2, 3) PRACTICE"},"pe1_5":{"id":"pe1_5","ch":"Ch 2","type":"num","q":"Suppose Mydeco had purchased additional equipment for $12.6 million at the end of 2020, and this equipment was depreciated by $4.2 million per year in 2021, 2022, and 2023. Given Mydeco's tax rate of 35%, what impact would this additional purchase have had on Mydeco's net income in years 2020–2023? Enter the new net income for 2020, 2021, 2022 and 2023 ($ millions, one decimal).","blanks":[{"l":"2020","a":4.2,"tol":0.05,"u":""},{"l":"2021","a":2.4,"tol":0.05,"u":""},{"l":"2022","a":8.5,"tol":0.05,"u":""},{"l":"2023","a":20.0,"tol":0.05,"u":""}],"steps":"Extra depreciation 4.2 → tax saving 35% × 4.2 = 1.47 ≈
