{ch:"Ch 4",t:"mc",q:"You can choose between three payouts. The discount rate is 6% per year. (1) €100,000 today. (2) €6,500 per year forever, first payment in one year. (3) €12,000 per year for 12 years, first payment in one year. Which payout is worth the most today?",o:["Payout 1","Payout 3","All three are worth about the same","Payout 2"],a:3,e:"PV(2) = 6,500/0.06 = €108,333. PV(3) = 12,000/0.06 × (1 − 1.06⁻¹²) = €100,606. PV(1) = €100,000. Payout 2 is worth the most. Payout 3 has the largest undiscounted total (€144,000) but that ignores discounting, and the perpetuity’s small payments add up because they never stop."},
{ch:"Ch 5",t:"mc",q:"A bank quotes an <b>EAR</b> of 7% on a €15,000 car loan, repaid in 36 equal monthly payments at the end of each month. What is the monthly payment closest to?",o:["€463.16","€416.67","€510.31","€461.68"],a:3,e:"First convert the EAR to a monthly rate: 1.07^(1/12) − 1 = 0.5654%. Payment = 15,000 × 0.005654/(1 − 1.005654⁻³⁶) = €461.68. €463.16 divides 7% by 12, which treats the EAR as an APR (that would give an EAR of 7.23%). €416.67 ignores interest (15,000/36). €510.31 compounds the loan for 3 years and divides by 36."},
{ch:"Ch 5",t:"mc",q:"Which of the following statements is FALSE?",o:["An inverted yield curve means that long-term interest rates are below short-term interest rates","Expectations that interest rates will fall in the future tend to make the yield curve slope downward","With an upward-sloping yield curve, every cash flow of a 10-year project is discounted at the 10-year rate","A risk-free cash flow received in year 3 should be discounted at the 3-year rate from the yield curve"],a:2,e:"Each cash flow should be discounted at the rate that matches <b>its own</b> maturity. Using the 10-year rate for every cash flow of a 10-year project is only right if the curve is flat; with an upward-sloping curve it would undervalue the early cash flows. The other statements are true: inverted means short above long, expected rate cuts pull long rates down, and a year-3 cash flow uses the 3-year rate."},
{ch:"Ch 6",t:"mc",q:"You buy a 10-year bond with an 8% annual coupon and face value €1,000 at a yield of 6%. One year later, right after the first coupon, you sell it. Its yield is still 6%. What is your return over the year closest to?",o:["8.0%","7.0%","6.0%","5.0%"],a:2,e:"Price now: 80 × annuity(6%, 10) + 1,000/1.06¹⁰ = €1,147.20. Price in one year (9 years left): €1,136.03. Return = (80 + 1,136.03 − 1,147.20)/1,147.20 = 6.0%. If the yield does not change, your return equals the YTM. 8.0% is the coupon rate and ignores the price drop of a premium bond towards par. 7.0% is the current yield (80/1,147.20 = 6.97%), which also ignores that drop."},
{ch:"Ch 6",t:"mc",q:"A 5-year bond with face value €1,000 and a 4% coupon paid semi-annually trades at €955. What is its yield to maturity (APR with semi-annual compounding) closest to?",o:["4.00%","4.19%","2.51%","5.03%"],a:3,e:"Solve 955 = 20/y × (1 − (1+y)⁻¹⁰) + 1,000/(1+y)¹⁰ for the semi-annual yield y: y ≈ 2.51%, so the APR is 2 × 2.51% = 5.03%. The bond trades below par, so the yield must exceed the 4% coupon rate. 2.51% is the per-period yield before annualizing. 4.19% is the current yield (40/955)."},
{ch:"Ch 6",t:"mc",q:"A 4-year zero-coupon corporate bond has face value €1,000. The 4-year Treasury yield is 3.0% and the bond’s credit spread is 2.5%. What is the bond’s price closest to?",o:["€807.22","€888.49","€819.67","€905.95"],a:0,e:"The corporate yield = Treasury yield + spread = 3.0% + 2.5% = 5.5%. Price = 1,000/1.055⁴ = €807.22. €888.49 ignores the spread (Treasury only). €905.95 discounts at the spread alone. €819.67 uses simple interest (1,000/(1 + 4 × 5.5%))."},
{ch:"Ch 7",t:"mc",q:"Two mutually exclusive projects each cost €100 today. Project X pays €60 in year 1 and €60 in year 2 (IRR 13.1%). Project Y pays €20 in year 1 and €105 in year 2 (IRR 13.0%). For which costs of capital should the firm choose Y?",o:["Never, because X has the higher IRR","For costs of capital below 12.5%","For costs of capital above 12.5%","For costs of capital below 13.0%"],a:1,e:"The NPV profiles cross where the NPVs are equal. The difference Y − X is (0, −40, +45): 40/(1+r) = 45/(1+r)² → 1 + r = 45/40 → r = 12.5%. Below 12.5% Y has the higher NPV (at 0%: Y 25, X 20), because its cash flows come later and benefit more from a low rate. Above 12.5% X wins. Choosing by IRR (X) is wrong for mutually exclusive projects; 13.0% is Y’s own IRR, not the crossover rate."},
{ch:"Ch 7",t:"mc",q:"According to Graham (2022), which statement about how firms make investment decisions is TRUE?",o:["Firms typically set their hurdle rates equal to their cost of capital and adjust them often","Payback has almost disappeared in practice because of its well-known shortcomings","Large firms mostly use NPV and IRR, while payback remains popular, especially at small firms","Most firms accept every project whose expected return exceeds their stated hurdle rate"],a:2,e:"Graham’s CFO surveys: NPV and IRR are the most popular methods at large firms, but payback is still widely used, and at small firms it is more prevalent than NPV or IRR. Hurdle rates are set well above the cost of capital (a buffer of about 6% on average) and are very sticky. Only about 20% of firms say they accept all projects that beat the hurdle rate."},
{ch:"Ch 7",t:"mc",q:"A firm has 1,000 m² of warehouse space. It can choose from four independent projects; money is not a constraint (amounts in €000).<div class='scroll'><table><tr><th>Project</th><th>Space needed</th><th>NPV</th></tr><tr><td>K</td><td>600 m²</td><td>120</td></tr><tr><td>L</td><td>300 m²</td><td>90</td></tr><tr><td>M</td><td>400 m²</td><td>80</td></tr><tr><td>N</td><td>300 m²</td><td>66</td></tr></table></div>Which projects should it undertake?",o:["K and L","L, M and N","K and M","K and N"],a:1,e:"With a non-money constraint, the profitability index is NPV per unit of the <b>scarce resource</b>: L 0.30, N 0.22, K 0.20, M 0.20 per m². Take L (300 m²) and N (300 m²), then K (600 m²) no longer fits but M (400 m²) does: 1,000 m², NPV 90 + 66 + 80 = 236. K and L (210) picks the largest NPV first; K and M (200) and K and N (186) use space less efficiently."},
{ch:"Ch 8",t:"mc",q:"A 3-year project requires a machine of €240,000 today, depreciated straight-line to zero over 3 years. At the end of year 3 the machine is sold for €30,000. Revenues are €300,000 and costs €150,000 per year (excluding depreciation). The project needs €20,000 of net working capital today, which is fully recovered at the end of year 3. The tax rate is 25% and the cost of capital is 10%. What is the project’s NPV closest to (in €000)?",o:["106.4","107.1","101.4","86.4"],a:2,e:"Depreciation = 80. EBIT = 300 − 150 − 80 = 70, UNI = 52.5. FCF years 1–2 = 52.5 + 80 = 132.5. Year 3 also includes the after-tax sale (30 × 0.75 = 22.5, book value is 0) and the NWC recovery (+20): 175. Year 0: −240 − 20 = −260. NPV = −260 + 132.5/1.1 + 132.5/1.1² + 175/1.1³ = 101.4. 106.4 ignores NWC entirely (its timing still costs value). 107.1 forgets the tax on the sale. 86.4 invests in NWC but never recovers it."},
{ch:"Ch 8",t:"mc",q:"A firm evaluates a new product line. Which of the following should NOT be included in the project’s incremental free cash flows?",o:["Rent the firm forgoes on a building it owns and would use for the project","Lost sales of an existing product that customers will replace with the new one","The increase in inventory needed to support the new product line","A €50,000 consulting study on the product, paid last year"],a:3,e:"The consulting study is a <b>sunk cost</b>: it has been paid whatever the firm decides now, so it is not incremental. Forgone rent is an opportunity cost, lost sales of existing products (cannibalization) are an incremental loss, and extra inventory is an increase in NWC: all three must be included."}]}];

document.querySelectorAll(".hc .pill[data-x]").forEach(b=>b.onclick=()=>{S.exam=b.dataset.x;S.home=false;S.qz=null;draw();scrollTo(0,0)});

const fbq=(q,v)=>{const r=ok(q,v);return`<div class="fb ${r?"ok":"no"}"><b>${r?"Correct.":"Not quite."}</b> ${r?"":"Answer: "+(q.t==="mc"?q.o[q.a]:q.a+" "+(q.u||""))+". "}${q.e}</div>`};
const ok=(q,v)=>q.t==="mc"?v===q.a:v!=null&&v!==""&&Math.abs(parseFloat(String(v).replace(",","."))-q.a)<=q.tol;
function quiz(w){const Q=w.quiz||[],z=S.qz,B=$("#body");
if(!Q.length){B.innerHTML='<div class="empty">No quiz for this week yet.</div>';return}
const chs=[...new Set(Q.map(q=>q.ch))];
if(!z){const b=P["z"+w.n];B.innerHTML=`<div class="q"><h3 style="margin-top:0">${w.exam?w.title:"Week "+w.n+" quiz"}</h3><p>${w.exam?Q.length+" questions. Use Check answer after each question to see straight away whether you are right and why, or work through the whole paper first as in the real exam. Have your formula sheet and calculator ready (about 6 minutes per question).":Q.length+" exam-style questions, "+Q.length/chs.length+" per chapter ("+chs.join(", ")+"). Multiple choice and fill-in-the-number. You see the answers only after you finish, like in the exam. Have your formula sheet and calculator ready."}</p>${b!=null?`<p class="lead">Best score: ${b}/${Q.length}</p>`:""}<button class="btn" id="go">Start quiz</button></div>`;$("#go").onclick=()=>{S.qz={i:0,a:{},fin:false};draw()};return}

const HWQ=[
{n:1,t:"Chapter 1: The Corporation",note:"Read chapter 1 from the book (see Canvas week 1 page for which sections or topics in the chapter are not part of the material), read the relevant week 1 lecture slides (when available), watch the week 1 videos and then answer question 1 below.",intro:"Consider the following questions about what the corporation is trying to achieve.",p:[
{q:"What is the objective of the firm (according to the book)? [PREPARE]<br>Hint: this is not maximizing profit.",o:["Maximize shareholder value (the value of the firm’s shares)","Maximize revenue and market share","Maximize employee welfare and job security"],e:["Right: the book’s objective is decisions that increase the value of the firm’s shares.","Wrong: revenue and market share can grow while destroying value.","Wrong: employees are stakeholders, but the objective in the book is shareholder value."]},
{q:"Name two advantages and two disadvantages of using this objective. [PREPARE]",o:["Advantages: clear and measurable (share price), aligned with the owners. Disadvantages: ignores externalities such as pollution, and managers’ own goals (agency problems) get in the way","Advantages: protects all stakeholders equally and removes agency problems. Disadvantages: too hard to measure","Advantages: guarantees ethical behaviour, so no regulation is needed. Disadvantages: the share price is too stable"],e:["Right: this matches the slides (‘a good start’, but externalities and agency problems limit it).","Wrong: the objective does not protect all stakeholders and does not remove agency problems; the share price is easy to measure.","Wrong: it does not guarantee ethics, and the slides say regulation is needed."]},
{q:"What mechanisms exist that push managers to act in the interests of shareholders? Describe at least 2 mechanisms. [IN CLASS]",o:["A board overseeing the CEO, pay tied to firm performance, competition in product markets, and the threat of a hostile takeover after a falling share price","Fixed salaries, secrecy about results, and a weaker board","Higher dividends only, and avoiding a stock-market listing"],e:["Right: these are the corporate governance mechanisms in the lecture.","Wrong: fixed pay and less oversight remove the link to shareholder interests.","Wrong: dividends alone don’t control managers, and avoiding a listing removes market discipline."]}]},
{n:2,t:"Chapter 2: Financial Statement Analysis",note:"Read chapter 2 of the book and the available lecture slides and watch the week 2 videos. Then answer question 2 below.",intro:"At the beginning of 2017, Coca-Cola (ticker KO) had a book value of equity of $23.1 billion, 4.345 billion shares outstanding, and a market price of $41.74 per share. KO also had cash of $8.6 billion, and total (interest bearing) debt of $64.2 billion. One year later, at the beginning of 2018, KO had a book value of equity of $17.1 billion, 4.261 billion shares outstanding at a market price of $46.07 per share, cash of $6.0 billion, and total (interest bearing) debt of $70.8 billion.",p:[
{q:"Show that the change in KO’s market capitalization was $14.94 billion. [SOLVE YOURSELF]<br>If you cannot solve this question, check the answer at the end of this document.",o:["46.07 × 4.261 − 41.74 × 4.345 = 196.30 − 181.36 = 14.94","17.1 − 23.1 = −6.0","(46.07 − 41.74) = 4.33"],e:["Right: market cap = share price × shares, computed for both years.","Wrong: that is the change in book equity, not market value.","Wrong: that is the change in price per share, and the share count also changed."]},
{q:"Show that KO’s market-to-book ratio went from 7.85 in 2017 to 11.48 in 2018. [PREPARE]",o:["Market cap ÷ book equity: 181.36/23.1 = 7.85 and 196.30/17.1 = 11.48","Price ÷ shares: 46.07/4.261 = 10.81","Net debt ÷ book equity: 55.6/23.1 = 2.41 and 64.8/17.1 = 3.79"],e:["Right: M/B = market value of equity ÷ book value of equity.","Wrong: dividing a price by a share count has no meaning here.","Wrong: that is a leverage measure, not market-to-book."]},
{q:"Look up the most recent market-to-book ratio (Price/Book) of KO at finance.yahoo.com (under statistics). Did the ratio increase or decrease compared to 2017 or 2018? How can this change be interpreted? [PREPARE]",o:["Compare the Yahoo number with 7.85 and 11.48. A higher ratio means investors value the equity more relative to book value (strong expected prospects); a lower ratio means weaker expectations","A higher ratio means the firm has more debt","The ratio cannot change, because book value fixes market value"],e:["Right: you must look up the current ratio yourself, and the interpretation is about expectations.","Wrong: debt does not drive M/B directly.","Wrong: market value moves with investors’ expectations; book value is historical."]},
{q:"Show that the change in KO’s enterprise value from 2017 to 2018 was $24.1 billion. What does the enterprise value represent? [PREPARE]",o:["EV = market cap + debt − cash: 2017 = 181.36 + 64.2 − 8.6 = 236.96; 2018 = 196.30 + 70.8 − 6.0 = 261.10; change 24.1. It is the market value of the operating assets","EV = market cap − debt + cash: 125.76 in 2017 and 131.50 in 2018","EV = book equity + debt: 87.3 in 2017 and 87.9 in 2018"],e:["Right: EV is market cap plus net debt, the value of the underlying business.","Wrong: the signs are reversed, and the change would only be 5.7.","Wrong: that uses book values; the change would be only 0.6."]},
{q:"Name a ratio that can be used to analyze the liquidity position of a firm. [IN CLASS]",o:["The current ratio (current assets ÷ current liabilities)","Return on equity","The price-earnings ratio"],e:["Right: it measures whether short-term assets cover short-term liabilities.","Wrong: ROE measures profitability.","Wrong: P/E is a valuation ratio."]},
{q:"If the EBITDA to interest expense ratio of a firm is 1.3, what does this tell us about the performance of this firm?  [IN CLASS]",o:["Operating cash earnings only just cover interest: a small buffer and a higher risk of financial distress","The firm earns a 1.3% return on equity","The firm is very safe, because the ratio is above 1"],e:["Right: the usual norm for coverage is well above this (about 3 to 5 for EBIT coverage).","Wrong: it is a coverage ratio, not a return.","Wrong: above 1 only means interest is just paid; there is almost no margin for error."]},
{q:"What do you think gives a more accurate assessment of a firm’s net worth: the market value or book value of equity? Explain why. [IN CLASS]",o:["Market value: it is forward-looking and reflects expected cash flows and risk (though sentiment and bubbles can distort it)","Book value: it includes all future prospects and intangibles","They are always equal"],e:["Right: this is the lecture’s contrast between market and book value.","Wrong: book value is backward-looking (historical cost) and misses much of future value.","Wrong: KO’s market-to-book of 7.85 and 11.48 shows they differ a lot."]}]},
{n:3,t:"Chapter 3: Financial Decision Making",note:"Read the relevant sections from chapter 3 of the book and the available lecture slides. Watch the week 1 Time value of money videos on Canvas. Then answer question 3 below.",intro:"Your firm has identified four potential investment projects as listed in the table below. Suppose all cash flows are certain and the risk-free interest rate is 2% per year.",img:1,p:[
{q:"Show that the NPV of project A is €47.06. [SOLVE YOURSELF]<br>Show that the NPV of project B is €2.94. [PREPARE]<br>What are the NPVs of projects C and D? [PREPARE]",o:["A = −100 + 150/1.02 = 47.06; B = 150 − 150/1.02 = 2.94; C = 100 − 102/1.02 = 0; D = −50 + 50/1.02 = −0.98","A = 150 − 100 = 50; B = 0; C = −2; D = 0 (no discounting)","A = −100 + 150 × 1.02 = 53; B = −3; C = −4.04; D = 1 (multiplying instead of discounting)"],e:["Right: discount the year-1 cash flow by 1.02 and add the cash flow today.","Wrong: ignores the time value of money.","Wrong: a future cash flow is discounted (divided), not compounded."]},
{q:"If the projects are mutually exclusive, which project should the firm accept? [PREPARE]",o:["Project A, the highest NPV (47.06)","Projects A and B","Project B, because it pays cash today"],e:["Right: pick the alternative with the highest NPV.","Wrong: that is the answer if the firm may take as many as it likes.","Wrong: B’s NPV is only 2.94, and cash timing is not the rule."]},
{q:"If the firm can choose as many projects as desired, which should it choose? [PREPARE]",o:["A and B (positive NPV); C is indifferent at 0 and D is rejected","Only A","All four"],e:["Right: accept every project with a positive NPV.","Wrong: B also adds value (2.94).","Wrong: D destroys value (−0.98), and C adds nothing."]},
{q:"Show that the NPV of project A would decrease if the interest rate increases. What would happen to the NPVs of the other projects if the interest rate increases?<br>Note: not all project NPVs move in the same direction. [IN CLASS]",o:["A falls because its €150 is discounted more; D falls too; B and C rise, because they receive cash now and pay later","All four NPVs fall","All four NPVs rise"],e:["Right: projects with a later inflow lose value; projects with a later outflow gain.","Wrong: B and C have the outflow in year 1, so a higher rate makes the payment cheaper.","Wrong: A and D have the inflow in year 1, so they lose value."]},
{q:"Show that the NPV of project B would increase if we postpone the payment in one year to a payment in two years. What would happen to the NPVs of the other projects if we also postpone their year one cash flow? [IN CLASS]",o:["B = 150 − 150/1.02² = 5.83 (up from 2.94) and C = 1.97 rise; A = 44.18 and D = −1.46 fall","All NPVs rise, because the money is held longer","Nothing changes: NPV does not depend on timing"],e:["Right: a later payment has a smaller present value, and a later receipt is worth less.","Wrong: A and D receive money later, so they lose value.","Wrong: timing is the whole point of discounting."]}]},
{n:4,t:"Chapter 3: Financial Decision Making",note:"Read the relevant sections from chapter 3 of the book and watch the week 1 Bond arbitrage video on Canvas. Then answer question 4 below.",intro:"Consider two securities that pay risk-free cash flows over the next two years and that have the current market prices shown here:",img:2,p:[
{q:"Show that the no-arbitrage price of a risk-free security (S3) that pays both a cash flow of €60 in one year and a cash flow of €60 in two years is €95. [PREPARE]<br>Hint: all securities have the same risk so you only need to compare the cash flows.<br>Challenge question: show that the following two methods lead to the same result of €95. Method 1: compare cash flows and prices. Method 2: use cash flows and prices to find the yield per year and then discount the cash flows of S3 using these yields.",o:["Method 1: S3 = S1 + S2 = 50 + 45 = 95. Method 2: yields are 20% (60/50) and 15.47% ((60/45)^½ − 1), so 60/1.2 + 60/1.1547² = 50 + 45 = 95","S3 = 60 + 60 = 120 (adding cash flows)","S3 = 60/1.1 + 60/1.1² ≈ 104.13 (guessing a 10% rate)"],e:["Right: the two methods give the same price, as the law of one price requires.","Wrong: that ignores discounting.","Wrong: the rate must come from the prices of S1 and S2, not a guess."]},
{q:"Suppose a risk-free security (S4) with cash flows of €120 in one year and €180 in two years is trading at a price of €245.<br>What is the no-arbitrage price of S4? [IN CLASS]<br>What arbitrage opportunity is available? [IN CLASS]<br>How can investors profit from this opportunity? [IN CLASS]",o:["No-arbitrage price = 2×S1 + 3×S2 = 100 + 135 = 235. S4 is overpriced: sell S4, buy 2 S1 and 3 S2, and keep €10 today with no later cash flows","No-arbitrage price = 245: the market price is always right","No-arbitrage price = 300 (120 + 180), so buying at 245 earns €55"],e:["Right: replicate S4’s cash flows with S1 and S2 and compare prices.","Wrong: if the price differs from the replicating portfolio’s cost there is arbitrage.","Wrong: that adds undiscounted cash flows."]},
{q:"What does the no-arbitrage condition imply for financial markets? [IN CLASS]",o:["Equivalent assets trade at the same price (law of one price), so prices equal PV of cash flows, giving value additivity and the separation principle","All securities must have the same return whatever their risk","Investors can expect to profit regularly from arbitrage"],e:["Right: this is why a normal market has security-trade NPVs of 0.","Wrong: only assets with the same cash flows and risk must have one price.","Wrong: arbitrage is rare and disappears as soon as it is exploited."]}]}];

const HWQ2=[
{n:1,t:"Chapter 4: Time Value of Money",note:"Tutorial 2, question 1. Try each part yourself, then check.",intro:"You smoke 200 packs of cigarettes per year and a pack costs €8.06. You pay at the end of each year. The discount rate is 2% per year. How much do you save (in monetary terms calculated today) when you quit smoking in the following cases?",p:[
{q:"You are 20 now and die at 70. [SOLVE YOURSELF]",o:["C = 200 × 8.06 = 1,612 for N = 50 years: PV = 1,612/0.02 × (1 − 1/1.02^50) = €50,654.85","Perpetuity: 1,612/0.02 = €80,600","1,612 × 50/1.02 ≈ €79,020 (adds up the payments and discounts once)"],e:["Right: a stream of equal payments for a limited time is an annuity.","Wrong: you do not live forever, so this is not a perpetuity.","Wrong: each payment must be discounted for its own number of years."]},
{q:"You are 20 now and will live forever.",o:["Perpetuity: PV = C/r = 1,612/0.02 = €80,600 (the same at 25, since it never ends)","Annuity with N = 70: about €60,450","1,612 × 1.02^50 ≈ €4,339"],e:["Right: payments without an end date use the perpetuity formula.","Wrong: there is no final year to build an annuity on.","Wrong: that compounds one payment forward and is not a present value."]},
{q:"You are 25 now and will live forever.",o:["Still a perpetuity: PV = 1,612/0.02 = €80,600, the same as at 20, because the payments start next year and never end","Lower, because of 5 fewer years: 1,612/0.02 × (1 − 1/1.02^45) ≈ €47,540","€80,600 − 5 × 1,612 = €72,540 (subtracts five years of payments)"],e:["Right: a perpetuity’s value does not depend on your age.","Wrong: you live forever, so there is no end year to build an annuity on.","Wrong: the savings do not shrink by five payments, they just keep coming."]},
{q:"Explain in words how present values of cash flows (like the ones calculated above) can be used to calculate market prices. [IN CLASS]",o:["In a competitive market, a security’s price equals the PV of the cash flows it generates, discounted at the market rate (law of one price). Example: P = FV/(1+YTM)^n","The price equals the sum of the undiscounted cash flows","The price is set by the firm’s book value, not by its cash flows"],e:["Right: otherwise there would be an arbitrage opportunity, so price = PV of cash flows.","Wrong: that ignores the time value of money.","Wrong: market prices are forward-looking and follow expected cash flows."]},
{q:"You turn 20, stop smoking and invest the money in the stock market at 8% (ignore the 2% discount rate). How much will you have at 30?",o:["FV of an annuity: 1,612/0.08 × (1 − 1/1.08^10) × 1.08^10 = €23,352.34","1,612/0.02 × (1 − 1/1.02^10) = about €14,480 (wrong rate, and a PV)","1,612 × 10 = €16,120 (no interest)"],e:["Right: take the PV of the annuity at 8% and move it forward 10 years.","Wrong: the stock market earns 8%, and the question asks for a future value.","Wrong: invested money earns interest on interest."]}]},
{n:2,t:"Chapter 5: Interest Rates",note:"Tutorial 2, question 2. Try each part yourself, then check.",intro:"The current one-year interest rate is 2%. You expect that in year 2 the economy slows and the rate falls to 1%. From year 3 you expect a recession and the ECB cuts the rate to 0% for years 3 and 4. All rates are 1-year rates.<div class=\"scroll\"><table><tr><th>Year</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>One-year rate</td><td>2%</td><td>1%</td><td>0%</td><td>0%</td></tr></table></div>",p:[
{q:"Show that the current two-year (annualized) rate consistent with these expectations is 1.499%. [SOLVE YOURSELF]",o:["(1 + r)² = 1.02 × 1.01 = 1.0302, so r = 1.0302^(1/2) − 1 = 1.499%","(2% + 1%)/2 = 1.5% exactly","1.02 × 1.01 − 1 = 3.02%"],e:["Right: find the single annual rate equivalent to the two different rates, then take the square root.","Wrong: a simple average ignores compounding (1.499% is not 1.5%).","Wrong: that is the return over two years, not an annual rate."]},
{q:"Which term structure (EARs for 1 to 4 years) is consistent with these expectations? What shape is the yield curve?",o:["2%, 1.499%, 0.997%, 0.75%: downward sloping (inverted)","2%, 1%, 0%, 0%: the one-year rates themselves","2%, 3.02%, 3.02%, 3.02%: the cumulative returns"],e:["Right: the yield for n years is (product of the 1-year factors)^(1/n) − 1. The yield curve only uses EARs.","Wrong: those are one-year rates for each year, not annualized rates for each term.","Wrong: those are not annualized."]},
{q:"Which interest rate should you use to discount a cash flow that occurs in year 3?",o:["The 3-year rate from the term structure, 0.997%","The one-year rate for year 3, 0%","The current one-year rate, 2%"],e:["Right: the rate must match the term of the cash flow.","Wrong: that is only the rate for the third year, not the rate for 3 years.","Wrong: that ignores the expected rate cuts."]},
{q:"Show that the PV of $10 received at the end of year 3, discounted at that rate, equals the PV discounted at each yearly rate. [IN CLASS]",o:["Use the 3-year rate 0.997%: 10/1.00997³ = $9.71, same as 10/(1.02 × 1.01 × 1.00)","Use the 1-year rate: 10/1.02³ = $9.42","Use the year-3 one-year rate 0%: PV = $10"],e:["Right: match the term of the rate to the term of the cash flow.","Wrong: that ignores the lower expected rates in years 2 and 3.","Wrong: you must also discount through years 1 and 2."]}]},
{n:3,t:"Chapter 6: Bonds",note:"Tutorial 2, question 3. Watch the Canvas bond videos first.",intro:"A 5-year corporate bond has a 6% annual coupon rate with semi-annual coupons and a face value of $1,000. It trades at a yield-to-maturity of 3% (APR with semi-annual compounding).",p:[
{q:"What are the cash flows of this bond? [SOLVE YOURSELF]",o:["10 coupons of 3% × 1,000 = $30 every 6 months, plus $1,000 after 5 years (period 10)","5 coupons of $60 plus $1,000 at year 5","10 coupons of $60 plus $1,000 at period 10"],e:["Right: the annual coupon rate is split over two payments per year.","Wrong: the coupons are semi-annual, so there are 10 of them.","Wrong: $60 is the whole year’s coupon, so each half-year payment is $30."]},
{q:"Show that today’s price is $1,138.33. Is this a discount, par or premium bond?",o:["P = 30/0.015 × (1 − 1/1.015^10) + 1,000/1.015^10 = 1,138.33 > 1,000: premium bond","Discounting at 3% per period gives exactly $1,000: par bond","Price = 10 × 30 + 1,000 = 1,300: premium bond"],e:["Right: the 3% APR is 1.5% per six months, and the coupon (3%) exceeds that yield.","Wrong: 3% is an APR, per half-year it is 1.5%.","Wrong: that adds the cash flows without discounting."]},
{q:"Now suppose the bond trades at $1,200. Write down the equation to find the YTM and say what the YTM is. [SOLVE YOURSELF]",o:["1,200 = 30/y × (1 − 1/(1+y)^10) + 1,000/(1+y)^10, solved by trial and error: y = 0.90% per half-year, so YTM = 1.80% APR","1,200 = 60/y × (1 − 1/(1+y)^5) + 1,000/(1+y)^5, so YTM is 3%","YTM = 60/1,200 = 5% (coupon divided by price)"],e:["Right: a higher price means a lower yield, below the 1.5% per half-year of the $1,138.33 price.","Wrong: the coupons are semi-annual, so 10 periods of $30.","Wrong: that is a current yield, not the YTM."]},
{q:"If the yield to maturity increases, what happens to the bond price today?",o:["The price falls (at 3.5% APR, so 1.75% per half-year, it is $1,113.77)","The price rises, because the coupons stay fixed","The price stays the same, because the coupons and face value are fixed"],e:["Right: the same cash flows are discounted at a higher rate.","Wrong: fixed cash flows discounted at a higher rate are worth less.","Wrong: the cash flows are fixed but their present value is not."]},
{q:"Define interest rate risk for a bond. For which kind of bonds is it highest? [IN CLASS]",o:["The risk that a change in interest rates (YTM) changes the bond’s price; highest for bonds with a long time to maturity (high duration)","The risk that the issuer does not pay; highest for junk bonds","The risk that the coupon rate changes; highest for zero-coupon bonds"],e:["Right: the longer the contract, the bigger the price effect.","Wrong: that is default (credit) risk.","Wrong: the coupon rate is fixed in the contract."]},
{q:"Do you think buying a bond at a price equal to the PV of its cash flows has a positive NPV? Explain. [IN CLASS]",o:["No, NPV = 0: you pay the PV and receive the PV. At a positive NPV everybody would buy, pushing the price up; at a negative NPV nobody would, pushing it down, until NPV = 0","Yes, because the bond pays more than it costs","Yes, because the coupon rate is above zero"],e:["Right: in a competitive market bonds trade at NPV = 0.","Wrong: the PV of the payments already equals the price.","Wrong: the coupon rate does not make the NPV positive."]},
{q:"If there is default risk, is the expected return of a corporate bond lower than, equal to or higher than its YTM? Explain. [IN CLASS]",o:["Lower: the YTM is the return if all promised payments are made, but with default risk you do not expect all of them","Equal: the YTM always equals the expected return","Higher: risky bonds pay a premium over their YTM"],e:["Right: YTM is based on promised cash flows, expected return on expected ones.","Wrong: they are only equal without default risk.","Wrong: expected cash flows can only be lower than promised ones."]}]}];

const HWQ3=[
{n:1,t:"Chapter 7: Investment Decision Rules",note:"Homework 3, question 1 (Lance Armstrong’s book deal). Type numbers or choose, then read the explanation.",intro:"Lance Armstrong was paid $10 million to write a book, received immediately after signing. Writing takes two years. In that time he could instead earn $6 million per year (paid at the end of each year) appearing at cycling events. His opportunity cost of capital is 10% per year.",p:[
{t:"num",q:"Show that the NPV of agreeing to write the book (ignoring royalties) is −$0.41 million. [SOLVE YOURSELF]",a:-0.41,tol:.01,u:"$ million",e:"NPV = +10 − 6/1.10 − 6/1.10² = 10 − 5.455 − 4.959 = −0.413. The $6 million per year he gives up are the costs (opportunity cost)."},
{q:"Should Lance accept the book deal (no royalties)?",o:["No: NPV = −0.41 &lt; 0","Yes: he receives $10 million upfront","Yes: the IRR (about 13%) is above 10%"],e:["Right: reject when NPV &lt; 0.","Wrong: the money must be compared with the $12 million of income given up, in present value terms.","Wrong: this is a delayed investment (benefit first, costs later), so the IRR rule gives the wrong answer; NPV decides."]},
{t:"num",q:"Royalties: $0.8 million in the first year after the book is finished (paid at year end), decreasing 50% per year in perpetuity. NPV of the deal with royalties? [PREPARE]<br>Hint: the first royalty is at time 3.",a:.688,tol:.012,u:"$ million",e:"Growing perpetuity with g = −50%, first payment 0.8 at t = 3, so its value at t = 2 is 0.8/(0.10 + 0.50) = 1.333. Discount two years: 1.333/1.21 = 1.102. NPV = −0.413 + 1.102 = 0.688."},
{q:"Should Lance accept the deal with royalties?",o:["Yes: NPV = +0.69 &gt; 0","No: NPV is negative as in part a","No: royalties shrink 50% per year, so they are worth little"],e:["Right: the royalties turn the NPV positive.","Wrong: the royalties add +1.10 to the −0.41.","Wrong: they are small, but their PV (1.10) is larger than the 0.41 deficit."]},
{t:"num",q:"Determine whether the deal with royalties has an IRR between 2% and 5%. Equation: 0 = 10 − 6/(1+IRR) − 6/(1+IRR)² + 0.8/(IRR + 0.5)/(1+IRR)². What is the IRR? [IN CLASS]",a:3.52,tol:.05,u:"%",e:"Trial and error: NPV(2%) = −0.171, NPV(3%) = −0.058, NPV(4%) = +0.053. The sign changes between 3% and 4%, so IRR ≈ 3.52%, which is inside 2% to 5%."},
{q:"Does the IRR found above correctly indicate whether the book deal with royalties is attractive? [IN CLASS]",o:["No: IRR ≈ 3.5% &lt; 10% says reject, but NPV at 10% is +0.69. Benefits come first, so NPV rises with r","Yes: IRR is positive, so accept","Yes: the IRR rule works for any deal with positive royalties"],e:["Right: a delayed investment makes NPV an increasing function of r, so the rule is reversed.","Wrong: a positive IRR alone is not the test; it must be compared with the cost of capital, and here the rule breaks down.","Wrong: royalties do not repair the cash flow pattern (money in first, costs later)."]}]},
{n:2,t:"Chapter 7: Investment Decision Rules",note:"Homework 3, question 2 (mutually exclusive projects X and Y, then project Z).",intro:"Two mutually exclusive projects:<div class=\"scroll\"><table><tr><th>Project</th><th>Today</th><th>In one year</th><th>In two years</th></tr><tr><td>X</td><td>−$50</td><td>$25</td><td>$30</td></tr><tr><td>Y</td><td>−$30</td><td>$0</td><td>$35</td></tr></table></div>Later, project Z (today −$50, in one year $40, in two years $15) is added and the projects are no longer mutually exclusive, but only $100 can be spent today.",p:[
{q:"Show that project Y is more attractive if the cost of capital is 5%. [SOLVE YOURSELF]",o:["NPV(X) = −50 + 25/1.05 + 30/1.05² = 1.02; NPV(Y) = −30 + 35/1.05² = 1.75; Y is higher","Both sum to $5 of undiscounted profit, so they are equally attractive","X is better because it pays $25 already in year 1"],e:["Right: discount each cash flow and compare NPVs.","Wrong: that ignores discounting and project size.","Wrong: early cash flows help, but the NPVs show Y is still higher."]},
{q:"Which project should be undertaken if the cost of capital is 7%? [PREPARE]",o:["Y only: NPV(Y) = +0.57, NPV(X) = −0.43","X only","Both X and Y"],e:["Right: they are mutually exclusive and only Y has a positive NPV (highest NPV).","Wrong: X has a negative NPV at 7%.","Wrong: the projects are mutually exclusive."]},
{t:"num",q:"What is the NPV of project X when the discount rate is 6.39%? [PREPARE]",a:0,tol:.01,u:"$",e:"NPV = −50 + 25/1.0639 + 30/1.0639² = −50 + 23.50 + 26.50 ≈ 0. 6.39% is the rate at which NPV = 0."},
{q:"What is this discount rate called? [PREPARE]",o:["The internal rate of return (IRR) of X","The opportunity cost of capital","The profitability index"],e:["Right: IRR = the discount rate that makes NPV = 0.","Wrong: the cost of capital is the market return, not a property of X.","Wrong: PI is NPV divided by the resource consumed."]},
{t:"num",q:"Compute the IRR of project Y. [PREPARE]<br>Note: do it with a calculator, without Excel.",a:8.01,tol:.02,u:"%",e:"0 = −30 + 35/(1+IRR)², so (1+IRR)² = 35/30 = 1.1667 and IRR = 1.1667^½ − 1 = 8.01%."},
{q:"Should you accept project Y according to its IRR if the cost of capital is 7%? [PREPARE]",o:["Yes: IRR 8.01% &gt; 7%, consistent with its positive NPV","No: Y has no cash flow in year 1, so no IRR exists","No: IRR 8.01% is less than 10%"],e:["Right: Y is a normal project (outflow first, then inflow), so the IRR rule works.","Wrong: a zero in year 1 does not stop the IRR from existing.","Wrong: the benchmark is the project’s cost of capital (7%), not 10%."]},
{q:"Plot NPV (y-axis) against the discount rate (x-axis) for both projects. What should the sketch show? [PREPARE]",o:["Two downward-sloping curves: X crosses zero at 6.39%, Y at 8.01%; Y lies above X for every positive rate (they meet at r = 0, where both are $5)","Two upward-sloping curves crossing at 5%","Two flat lines at NPV = 5"],e:["Right: both are normal projects, so NPV falls as r rises, and the IRRs are the intercepts.","Wrong: upward slopes occur for delayed investments, not here.","Wrong: NPV depends on r."]},
{q:"With only $100 to spend and r = 5%, which project(s) should be undertaken? Use total NPV and the profitability index. [PREPARE]<br>Hint: NPV(Z) = 1.70 and PI = 0.034.",o:["Y and Z: NPV 1.75 + 1.70 = 3.45, the highest total; PI (Y 0.058, Z 0.034, X 0.020) agrees","X and Z (spends exactly $100)","X, Y and Z"],e:["Right: X+Y gives 2.77, X+Z 2.72, Y+Z 3.45. PI ranks Y, Z, X and X no longer fits.","Wrong: total NPV is only 2.72.","Wrong: that costs $130, above the $100 budget."]},
{q:"Does the profitability index always lead to the combination with the highest total NPV? [IN CLASS]",o:["No: it is a shortcut; indivisible projects, unused budget or several constraints can make it miss the best combination","Yes, always","Yes, as long as all NPVs are positive"],e:["Right: e.g. budget 20: PI picks A+B+C (31.3) but A+B+D gives 34.","Wrong: PI is fast but not always reliable.","Wrong: positive NPVs do not remove the indivisibility problem."]},
{q:"Would the firm accept Z under the payback rule if projects must pay back within one year or less? [IN CLASS]",o:["No: payback = 1 + 10/15 = 1.67 years","Yes: 40 of the 50 comes back in year 1","Yes: Z has a positive NPV"],e:["Right: after year 1 still 10 of 50 is unrecovered; 10/15 of year 2 is needed.","Wrong: 40 is less than 50, so it has not paid back.","Wrong: payback does not look at NPV."]},
{q:"Rank X, Y and Z by payback period (rounded to whole years). Does this help maximize firm value? [IN CLASS]",o:["All round to 2 years (X 1.83, Y 1.86, Z 1.67), so payback cannot separate them; it ignores discounting and later cash flows","Z first, then X, then Y, which maximizes value","Y first because it has the highest IRR"],e:["Right: the ranking is uninformative; use NPV or PI.","Wrong: unrounded Z is shortest, but the rounded ranking is a tie and payback does not maximize value.","Wrong: that is not a payback ranking."]}]},
{n:3,t:"Chapter 8: Capital Budgeting",note:"Homework 3, question 3 (Eat Your Veggies!).",intro:"Eat Your Veggies! considers a four-year expansion: initial investment in fixed assets €1.67 million, straight-line depreciation to zero over four years, sold at the end for €435,000 (market value; book value is 0). Working capital at t = 1: inventory +€148,000, receivables +€128,000, payables +€78,000, constant and recovered at t = 4. Sales €1,850,000 per year, cost of goods sold €1,038,000 per year, tax rate 21%, required return 16.4%.",p:[
{t:"num",q:"Show that unlevered net income in year 1 is €311,655. [SOLVE YOURSELF]",a:311655,tol:1,u:"€",e:"Depreciation = 1,670,000/4 = 417,500. UNI = (1,850,000 − 1,038,000 − 417,500) × (1 − 0.21) = 394,500 × 0.79 = 311,655."},
{t:"num",q:"Show that the free cash flow in year 1 is €531,155. [SOLVE YOURSELF]",a:531155,tol:1,u:"€",e:"NWC investment = 148,000 + 128,000 − 78,000 = 198,000. FCF = UNI + depreciation − CapEx − ΔNWC = 311,655 + 417,500 − 0 − 198,000 = 531,155 (the €1.67 million CapEx is at t = 0)."},
{t:"num",q:"Free cash flow in years 2 and 3? [PREPARE]",a:729155,tol:1,u:"€",e:"UNI is the same, 311,655; there is no CapEx and NWC does not change. FCF = 311,655 + 417,500 = 729,155."},
{t:"num",q:"Free cash flow in year 4 (UNI in year 4 = €655,305)? [PREPARE]",a:1270805,tol:1,u:"€",e:"UNI is higher by the after-tax sale: 435,000 × 0.79 = 343,650 (book value 0, so the whole price is taxable gain): 311,655 + 343,650 = 655,305. FCF = 655,305 + 417,500 + 198,000 (NWC recovered) = 1,270,805."},
{t:"num",q:"Show that the project’s NPV is €479,078. [PREPARE]",a:479078,tol:5,u:"€",e:"NPV = −1,670,000 + 531,155/1.164 + 729,155/1.164² + 729,155/1.164³ + 1,270,805/1.164⁴ = −1,670,000 + 456,319 + 538,163 + 462,339 + 692,256 = 479,078."},
{q:"Should the company proceed with the expansion? [PREPARE]",o:["Yes: NPV = +€479,078 &gt; 0","No: the NPV is below the €1.67 million investment","No: sales are lower than costs plus depreciation in year 1"],e:["Right: accept when NPV &gt; 0.","Wrong: NPV already subtracts the investment.","Wrong: year-1 sales (1.85m) exceed costs plus depreciation (1.4555m)."]},
{q:"Is the project’s IRR greater or less than the required 16.4%? Explain briefly. [IN CLASS]",o:["Greater: NPV &gt; 0 at 16.4%, and this is a normal project (outflow first, inflows later), so NPV falls with r and reaches 0 at a higher rate (about 28%)","Less: the IRR is always lower than the cost of capital","Cannot be said without Excel"],e:["Right: NPV positive at 16.4% means NPV = 0 only at a higher rate.","Wrong: that would imply a negative NPV.","Wrong: sign of NPV and the cash flow pattern already tell you."]},
{q:"The firm also had a technical evaluation costing $1 million. Does that change the NPV? [IN CLASS]",o:["No: it is a sunk cost, paid whether or not the expansion goes ahead","Yes: NPV falls by $1 million","Yes: NPV falls by $1 million × (1 − 0.21)"],e:["Right: sunk costs are not incremental.","Wrong: that would only be right if the money were still to be spent because of the project.","Wrong: even after tax it would not matter; it is already spent."]}]},
{n:4,t:"Chapter 8: Capital Budgeting",note:"Homework 3, question 4 (which costs to consider).",intro:"Which of the following costs should be considered when making a capital budgeting decision? Explain and give an example of each type.",p:[
{q:"Sunk costs [SOLVE YOURSELF]",o:["No: paid regardless of the decision, not incremental. Example: a technical inspection that has already taken place","Yes: all costs of the project count","Yes, but only after tax"],e:["Right: ignore them; only incremental costs and benefits going forward matter.","Wrong: only incremental items count.","Wrong: tax does not make a sunk cost relevant."]},
{q:"Opportunity costs [PREPARE]",o:["Yes: the value a resource would have earned in its best alternative use. Example: using an owned office that could be rented out, so lost rent counts","No: nothing is paid in cash","No: they are financing costs"],e:["Right: using a resource has a cost even if no cash is paid out.","Wrong: forgone cash flows are incremental.","Wrong: they are operating decisions, not financing."]},
{q:"Interest expenses [PREPARE]",o:["No: financing is judged separately (separation principle); use unlevered income and FCF. Example: interest on a loan for the project","Yes: interest is a cost of the project","Yes: but only the tax-deductible part"],e:["Right: the project is judged on its own; financing is in the discount rate.","Wrong: counting it would double-count the cost of capital.","Wrong: the tax effect also sits in the discount rate, not the cash flows."]},
{q:"Fixed overhead costs [IN CLASS]",o:["Only if they change because of the project. Example: allocated headquarters rent does not change, so ignore it; a new manager hired for the project counts","Yes: always, as a share of the total","No: never, they are sunk"],e:["Right: only incremental overhead matters.","Wrong: unchanged overhead is the same with and without the project.","Wrong: new overhead caused by the project is incremental."]}]}];

S.hq=1;S.hv={};
function hw2(){const H=S.w===3?HWQ3:S.w===2?HWQ2:HWQ,pf=S.w===3?"w3h":S.w===2?"w2h":"h",q=H[S.hq-1],cnt=n=>H[n-1].p.filter((_,i)=>P[pf+n+"_"+i]!=null).length;
let h=`<div class="row">${H.map(x=>`<button class="pill ${S.hq===x.n?"on":""}" data-q="${x.n}">Question ${x.n} · ${cnt(x.n)}/${x.p.length}</button>`).join("")}</div><h3 style="margin-top:4px">${q.t}</h3><p class="lead">${q.note}</p><div class="q"><p style="margin-top:0">${q.intro}</p>${q.img?`<img class="tbl" alt="Table for question ${q.n}" src="${HWIMG[q.img]}">`:""}</div><h3>Question ${q.n}</h3>`;
q.p.forEach((p,i)=>{const k=pf+q.n+"_"+i,c=P[k],d=c!=null,ord=[0,1,2].map(x=>(x+(q.n+i)%3)%3);
if(p.t==="num"){h+=`<div class="q hp"><span class="tag">${"abcdefghijkl"[i]}</span> <span class="tag">Fill in the number</span><p class="t">${p.q}</p><div class="row"><input type="text" id="hn${i}" inputmode="decimal" placeholder="Your answer" value="${S.hv[k]??""}" ${d?"disabled":""}> <span>${p.u||""}</span><button class="btn hnb" data-i="${i}" ${d?"disabled":""}>Check</button></div>${d?`<div class="fb ${c===0?"ok":"no"}"><b>${c===0?"Correct.":"Not quite."}</b> ${c===0?"":"Answer: "+p.a+" "+(p.u||"")+". "}${p.e}</div>`:""}</div>`;return}
h+=`<div class="q hp"><span class="tag">${"abcdefghijkl"[i]}</span><p class="t">${p.q}</p>`+ord.map((oi,j)=>`<button class="opt ${d?(oi===0?"ok":oi===c?"no":""):""}" data-k="${k}" data-o="${oi}" ${d?"disabled":""}><b>${"ABC"[j]}</b><span>${p.o[oi]}</span></button>`).join("")+(d?`<div class="fb ${c===0?"ok":"no"}"><b>${c===0?"Correct.":"Incorrect."}</b>${ord.map((oi,j)=>`<p>${oi===0?"✓":"✗"} <b>${"ABC"[j]}</b>: ${p.e[oi]}</p>`).join("")}</div>`:"")+"</div>"});
h+=`<button class="btn s" id="rh">Retry question ${q.n}</button>`;$("#body").innerHTML=h;
document.querySelectorAll(".hnb").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,p=q.p[i],k=pf+q.n+"_"+i,v=parseFloat($("#hn"+i).value.replace(",","."));if(isNaN(v))return;S.hv[k]=$("#hn"+i).value;P[k]=Math.abs(v-p.a)<=p.tol?0:1;save();const y=scrollY;draw();scrollTo(0,y)});
document.querySelectorAll("[id^=hn]").forEach(x=>x.onkeydown=e=>{if(e.key==="Enter")x.parentElement.querySelector(".hnb").click()});
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.hq=+b.dataset.q;draw();scrollTo(0,0)});
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const y=scrollY;P[b.dataset.k]=+b.dataset.o;save();draw();scrollTo(0,y)});
$("#rh").onclick=()=>{q.p.forEach((_,i)=>{delete P[pf+q.n+"_"+i];delete S.hv[pf+q.n+"_"+i]});save();draw();scrollTo(0,0)}}
